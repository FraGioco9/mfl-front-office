name: Maintenance / refactor
description: Track technical work that improves reliability, performance, or maintainability
title: "[Maintenance] "
body:
  - type: dropdown
    id: kind
    attributes:
      label: Work type
      options:
        - Refactor
        - Performance
        - CI / Workflow
        - Dependency
        - Database builder / Data pipeline
        - Documentation
        - Cleanup
        - Other
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Which files, runtime owners, pages, or workflows are affected?
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Current problem or technical debt
    validations:
      required: true

  - type: textarea
    id: target
    attributes:
      label: Target state
      description: Describe the desired architecture or behavior without relying on overrides.
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Validation / completion criteria
      placeholder: |
        - Existing behavior remains unchanged where not in scope
        - Relevant validators pass
        - No duplicate runtime owner is introduced
    validations:
      required: true


  - type: textarea
    id: stack
    attributes:
      label: PR stack / dependencies
      description: List expected PR slices, hard dependencies, and which item (if any) is intended to close the issue.
      placeholder: |
        - PR A: validator / no dependencies
        - PR B: runtime fix / after A
        - Final PR: docs + release, uses Closes #...
    validations:
      required: false

  - type: input
    id: release
    attributes:
      label: Milestone / release impact
      description: Target milestone and whether release.json/changelog work is expected.
      placeholder: v1.129.0 — no version bump until final release PR
    validations:
      required: false

  - type: textarea
    id: rollback
    attributes:
      label: Rollback / live-operation boundary
      description: State the rollback unit and whether deploys, database refreshes, provider changes, or other live operations are explicitly out of scope.
      placeholder: |
        Rollback: revert the squash commit.
        Live operations: none; no deploy or database refresh.
    validations:
      required: false

name: Temporary center saved Evaluation share icon

on:
  push:
    branches:
      - fix/saved-evaluation-share-icon-centering

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/saved-evaluation-share-icon-centering
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Center share glyph at source
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('site/modules/app-core.js')
          source = path.read_text()
          old = 'shareButton.innerHTML = \'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="M8.6 10.8 15.4 6.2"></path><path d="M8.6 13.2 15.4 17.8"></path></svg>\';'
          new = 'shareButton.innerHTML = \'<svg viewBox="1.8 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="M8.6 10.8 15.4 6.2"></path><path d="M8.6 13.2 15.4 17.8"></path></svg>\';'
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one saved-Evaluation share SVG, found {count}')
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Build generated application core
        working-directory: site
        run: |
          npm install --no-package-lock
          npm run build:core
      - name: Commit source and generated runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/modules/app-core.js site/modules/app-core*-runtime.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: center saved evaluation share icon"
          git push origin HEAD:fix/saved-evaluation-share-icon-centering

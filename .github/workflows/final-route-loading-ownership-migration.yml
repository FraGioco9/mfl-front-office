name: Final route loading ownership migration

on:
  push:
    branches:
      - refactor/remove-blanket-route-data-loading

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/remove-blanket-route-data-loading
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove blanket route-data loading ownership
        run: node site/migrate-final-route-loading-ownership.mjs
      - name: Remove temporary migration files
        shell: bash
        run: |
          rm -f site/migrate-final-route-loading-ownership.mjs
          rm -f .github/workflows/final-route-loading-ownership-migration.yml
      - name: Persist final Step 3 cleanup
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove blanket route-data loading ownership"
          git push origin HEAD:refactor/remove-blanket-route-data-loading

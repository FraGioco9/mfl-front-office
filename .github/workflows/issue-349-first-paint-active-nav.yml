name: Issue 349 first-paint active navigation

on:
  push:
    branches:
      - fix/loading-navigation-supersession
    paths:
      - .github/workflows/issue-349-first-paint-active-nav.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/loading-navigation-supersession

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply canonical first-paint ownership fix
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Missing expected block in {path}: {old[:120]!r}")
              if text.count(old) != 1:
                  raise SystemExit(f"Expected one block in {path}, found {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "site/bootstrap-core.js",
              '    function beginLatest(reason = "navigation") {\n      const normalizedReason = String(reason || "navigation");\n      document.documentElement.classList.add("mflInitialRouteSuperseded");\n      const token = `${normalizedReason}-${++sequence}`;',
              '    function beginLatest(reason = "navigation") {\n      const normalizedReason = String(reason || "navigation");\n      const token = `${normalizedReason}-${++sequence}`;',
          )

          replace_once(
              "site/modules/app-core.js",
              '    const transition = {\n      ...commitPageTransition(pageName, updateHash, options),\n      kind: "page",\n      sequence,\n    };\n    loadingToken = loadingController?.beginRouteTransition?.(pageName, options) || "";',
              '    const transition = {\n      ...commitPageTransition(pageName, updateHash, options),\n      kind: "page",\n      sequence,\n    };\n    document.documentElement.classList.add("mflInitialRouteSuperseded");\n    loadingToken = loadingController?.beginRouteTransition?.(pageName, options) || "";',
          )
          replace_once(
              "site/modules/app-core.js",
              '    const transition = stageViewTransition(pageName, viewName, options);\n    if (!transition) return null;\n    loadingToken = loadingController?.beginRouteTransition?.(pageName, {',
              '    const transition = stageViewTransition(pageName, viewName, options);\n    if (!transition) return null;\n    document.documentElement.classList.add("mflInitialRouteSuperseded");\n    loadingToken = loadingController?.beginRouteTransition?.(pageName, {',
          )

          replace_once(
              "site/validate-generated-view-transition.mjs",
              'const pageRunnerLoading = pageRunner.indexOf("loadingController?.beginRouteTransition?.(pageName, options)", pageRunnerCommit);\nconst pageRunnerPaint = pageRunner.indexOf("await waitForViewTransitionPaint();", pageRunnerLoading);',
              'const pageRunnerSupersede = pageRunner.indexOf(\'document.documentElement.classList.add("mflInitialRouteSuperseded");\', pageRunnerCommit);\nconst pageRunnerLoading = pageRunner.indexOf("loadingController?.beginRouteTransition?.(pageName, options)", pageRunnerSupersede);\nconst pageRunnerPaint = pageRunner.indexOf("await waitForViewTransitionPaint();", pageRunnerLoading);',
          )
          replace_once(
              "site/validate-generated-view-transition.mjs",
              '    && pageRunnerCommit > pageRunnerCancel\n    && pageRunnerLoading > pageRunnerCommit\n    && pageRunnerPaint > pageRunnerLoading',
              '    && pageRunnerCommit > pageRunnerCancel\n    && pageRunnerSupersede > pageRunnerCommit\n    && pageRunnerLoading > pageRunnerSupersede\n    && pageRunnerPaint > pageRunnerLoading',
          )
          replace_once(
              "site/validate-generated-view-transition.mjs",
              'const viewRunnerLoading = viewRunner.indexOf("loadingController?.beginRouteTransition?.(pageName", viewRunnerStage);\nconst viewRunnerPaint = viewRunner.indexOf("await waitForViewTransitionPaint();", viewRunnerLoading);',
              'const viewRunnerSupersede = viewRunner.indexOf(\'document.documentElement.classList.add("mflInitialRouteSuperseded");\', viewRunnerStage);\nconst viewRunnerLoading = viewRunner.indexOf("loadingController?.beginRouteTransition?.(pageName", viewRunnerSupersede);\nconst viewRunnerPaint = viewRunner.indexOf("await waitForViewTransitionPaint();", viewRunnerLoading);',
          )
          replace_once(
              "site/validate-generated-view-transition.mjs",
              '    && viewRunnerStage > viewRunnerCancel\n    && viewRunnerLoading > viewRunnerStage\n    && viewRunnerPaint > viewRunnerLoading',
              '    && viewRunnerStage > viewRunnerCancel\n    && viewRunnerSupersede > viewRunnerStage\n    && viewRunnerLoading > viewRunnerSupersede\n    && viewRunnerPaint > viewRunnerLoading',
          )

          replace_once(
              "site/validate-loading-ownership.mjs",
              'invariant(\n  !bootstrapCore.includes("window.__mflWithInteractionBusy")\n    && !bootstrapCore.includes("function routeLoadingOwnerReusable() {")\n    && !bootstrapCore.includes("function wrapRoutePageGlobal() {")\n    && bootstrapCore.includes(\'function beginLatest(reason = "navigation") {\')',
              'const beginLatestStart = bootstrapCore.indexOf(\'function beginLatest(reason = "navigation") {\');\nconst beginLatestEnd = bootstrapCore.indexOf("function beginIntent", beginLatestStart);\nconst beginLatestSection = bootstrapCore.slice(beginLatestStart, beginLatestEnd);\ninvariant(\n  beginLatestStart >= 0\n    && !beginLatestSection.includes(\'classList.add("mflInitialRouteSuperseded")\'),\n  "Navigation intent must not retire refresh first-paint ownership before the live page/view commit has applied its active controls.",\n);\n\ninvariant(\n  !bootstrapCore.includes("window.__mflWithInteractionBusy")\n    && !bootstrapCore.includes("function routeLoadingOwnerReusable() {")\n    && !bootstrapCore.includes("function wrapRoutePageGlobal() {")\n    && bootstrapCore.includes(\'function beginLatest(reason = "navigation") {\')',
          )

          replace_once(
              "site/validate-bootstrap-ownership.mjs",
              'includes(\n  bootstrapCore,\n  \'document.documentElement.classList.add("mflInitialRouteSuperseded");\',\n  "The first live page/view navigation must permanently retire refresh-only route chrome before committing the new destination.",\n);',
              'includes(\n  appCoreSource,\n  \'document.documentElement.classList.add("mflInitialRouteSuperseded");\',\n  "The live page/view transition must retire refresh-only route chrome only after committing the new destination.",\n);',
          )
          PY

      - name: Build canonical application core
        working-directory: site
        run: node build-app-core.mjs

      - name: Focused validation
        working-directory: site
        run: |
          node validate-loading-ownership.mjs
          node validate-generated-view-transition.mjs
          node validate-static-route-ui.mjs
          node validate-bootstrap-ownership.mjs

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/bootstrap-core.js site/modules/app-core.js site/modules/app-core-runtime.js site/modules/app-core-route-chunks.js site/validate-generated-view-transition.mjs site/validate-loading-ownership.mjs site/validate-bootstrap-ownership.mjs
          git diff --cached --quiet && exit 1
          git commit -m "Keep active page styled through refresh handoff"
          git push origin HEAD:fix/loading-navigation-supersession
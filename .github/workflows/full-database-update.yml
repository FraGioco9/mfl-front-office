name: Full database update

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-source-cleanup
  cancel-in-progress: false

jobs:
  cleanup-site-source:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[site-cleanup]')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Materialize and clean application source
        run: python cleanup_app_once.py

      - name: Commit cleaned application source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: remove legacy loading source"
          git push

name: Full database update

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  audit-cleaned-site:
    if: contains(github.event.head_commit.message, '[site-audit]')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run site audit
        shell: bash
        run: |
          set +e
          python audit_site.py > audit.log 2>&1
          STATUS=$?
          cat audit.log
          if [ "$STATUS" -ne 0 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f audit.log
            git commit -m "chore: capture site audit output"
            git push
            exit "$STATUS"
          fi

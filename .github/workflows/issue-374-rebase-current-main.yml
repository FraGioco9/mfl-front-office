name: Issue 374 rebase current main

on:
  push:
    branches:
      - fix/table-refresh-loading-flicker
    paths:
      - .github/workflows/issue-374-rebase-current-main.yml

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/table-refresh-loading-flicker

      - name: Rebase onto current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
          git push --force-with-lease origin HEAD:fix/table-refresh-loading-flicker

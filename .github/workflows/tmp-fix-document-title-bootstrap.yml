name: Temporary document title bootstrap wiring

on:
  push:
    branches:
      - feat/browser-page-titles
    paths:
      - .github/workflows/tmp-fix-document-title-bootstrap.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/browser-page-titles
          fetch-depth: 0
      - name: Move document-title runtime to guaranteed bootstrap path
        run: |
          python - <<'PY'
          from pathlib import Path

          app_entry = Path('site/modules/app-entry.js')
          source = app_entry.read_text()
          source = source.replace('  "/document-title-runtime.js",\n', '', 1)
          app_entry.write_text(source)

          bootstrap = Path('site/bootstrap.js')
          source = bootstrap.read_text()
          before = '      await Promise.all([\n        loadRuntime("/route-core-loader-runtime.js"),\n        loadRuntime("/dropdowns-runtime.js"),\n        loadRuntime("/bootstrap-core.js"),\n      ]);'
          after = '      await Promise.all([\n        loadRuntime("/route-core-loader-runtime.js"),\n        loadRuntime("/dropdowns-runtime.js"),\n        loadRuntime("/bootstrap-core.js"),\n        loadRuntime("/document-title-runtime.js"),\n      ]);'
          if before not in source and after not in source:
              raise SystemExit('Could not locate bootstrap runtime group')
          if after not in source:
              source = source.replace(before, after, 1)
          bootstrap.write_text(source)

          validator = Path('site/validate-document-title-runtime.mjs')
          source = validator.read_text()
          source = source.replace('const [indexHtml, appEntry, runtime] = await Promise.all([\n  read("./index.html"),\n  read("./modules/app-entry.js"),\n  read("./document-title-runtime.js"),\n]);', 'const [indexHtml, bootstrap, appEntry, runtime] = await Promise.all([\n  read("./index.html"),\n  read("./bootstrap.js"),\n  read("./modules/app-entry.js"),\n  read("./document-title-runtime.js"),\n]);')
          source = source.replace('includes(appEntry, \'"/document-title-runtime.js",\', "Document-title ownership must load on every application route.");', 'includes(bootstrap, \'loadRuntime("/document-title-runtime.js")\', "Document-title ownership must load from the guaranteed bootstrap runtime group.");\nexcludes(appEntry, \'"/document-title-runtime.js",\', "Document-title ownership must not also load from the later application-entry runtime group.");')
          validator.write_text(source)
          PY
      - name: Commit bootstrap ownership
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/bootstrap.js site/modules/app-entry.js site/validate-document-title-runtime.mjs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Load browser titles from bootstrap"
          git push origin HEAD:feat/browser-page-titles

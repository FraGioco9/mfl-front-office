name: Issue 594 runtime ownership refactor

on:
  push:
    branches:
      - refactor/594-global-runtime-ownership
    paths:
      - site/refactor-594-runtime-ownership.mjs
      - site/fix-594-refactor-helper.mjs
      - site/migrate-594-retired-validator-reads.mjs
      - site/validate-evaluation-search-clear-selection.mjs
      - site/validate-stats-mobile-scaling.mjs
      - site/validate-listing-column.mjs
      - .github/workflows/issue594-runtime-ownership-refactor.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: refactor/594-global-runtime-ownership
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Fix refactor helper quoting
        run: node site/fix-594-refactor-helper.mjs
      - name: Apply runtime ownership refactor
        run: node site/refactor-594-runtime-ownership.mjs
      - name: Restore current Global Search validator
        run: git checkout origin/main -- site/validate-global-search-results.mjs
      - name: Migrate validators off retired authoring sources
        run: node site/migrate-594-retired-validator-reads.mjs
      - name: Generate source-owned artifacts
        working-directory: site
        run: node build-app-core.mjs
      - name: Commit refactor locally
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site
          git commit -m "Unify runtime resource and route dependency ownership"
      - name: Install dependencies
        working-directory: site
        run: npm ci --no-audit --no-fund
      - name: Verify runtime ownership refactor
        working-directory: site
        run: npm run check
      - name: Remove helpers and push
        run: |
          git rm site/refactor-594-runtime-ownership.mjs site/fix-594-refactor-helper.mjs site/migrate-594-retired-validator-reads.mjs .github/workflows/issue594-runtime-ownership-refactor.yml
          git commit -m "Remove issue 594 runtime ownership helpers"
          git push origin HEAD:refactor/594-global-runtime-ownership

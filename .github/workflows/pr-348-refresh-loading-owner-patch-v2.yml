name: PR 348 refresh loading ownership patch v2

on:
  push:
    branches:
      - fix/refresh-navigation-authority
    paths:
      - .github/workflows/pr-348-refresh-loading-owner-patch-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/refresh-navigation-authority
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply refresh loading ownership patch
        run: |
          node .github/scripts/pr348-refresh-loading-patch.mjs
          node site/build-app-core.mjs
          node --check site/bootstrap-core.js
          node --check site/modules/app-core.js
          node --check site/modules/app-core-runtime.js
          node site/validate-loading-ownership.mjs
          node site/validate-bootstrap-ownership.mjs
          node site/validate-generated-view-transition.mjs
          node site/validate-app-core-startup-handshake.mjs
          git diff --check

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/bootstrap-core.js site/modules/app-core.js site/modules/app-core-runtime.js site/modules/app-core-*-runtime.js site/modules/app-core-route-chunks.js site/validate-loading-ownership.mjs site/validate-bootstrap-ownership.mjs site/validate-generated-view-transition.mjs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: keep refresh navigation loading destination-owned"
          git push origin HEAD:fix/refresh-navigation-authority

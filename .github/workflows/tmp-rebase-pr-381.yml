name: Temporary rebase PR 381

on:
  push:
    branches:
      - fix/table-refresh-loading-flicker
    paths:
      - .github/workflows/tmp-rebase-pr-381.yml

permissions:
  contents: write

concurrency:
  group: tmp-rebase-pr-381
  cancel-in-progress: false

jobs:
  rebase:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/table-refresh-loading-flicker

      - name: Rebase onto latest main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
          git push --force-with-lease origin HEAD:fix/table-refresh-loading-flicker

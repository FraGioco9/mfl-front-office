name: Apply app core validator migration

on:
  push:
    branches:
      - chore/app-core-normalizer-optimization

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/app-core-normalizer-optimization
          fetch-depth: 0
      - name: Apply canonical ownership validator migration
        shell: bash
        run: |
          set -euo pipefail
          node .github/migrate-validator-1.mjs
          node .github/migrate-validator-2.mjs
          node .github/migrate-validator-3.mjs
          rm -f \
            .github/migrate-validator-1.mjs \
            .github/migrate-validator-2.mjs \
            .github/migrate-validator-3.mjs \
            .github/workflows/app-core-validator-migration.yml
          git config user.name "FraGioco9"
          git config user.email "giocolifrancesco@gmail.com"
          git add -- \
            .vercelignore \
            site/validate-app-core-startup-handshake.mjs \
            site/validate-bootstrap-ownership.mjs \
            site/validate-club-route-core.mjs \
            site/validate-control-style-ownership.mjs \
            site/validate-database-stats-lazy-runtime.mjs \
            site/validate-eval-ownership.mjs \
            site/validate-player-route-core.mjs \
            site/validate-production-core-sources.mjs \
            site/validate-route-core-startup-routing.mjs \
            site/validate-route-runtime.mjs \
            site/validate-settings-route-core.mjs \
            site/validate-static-route-ui.mjs \
            site/validate-table-column-layout.mjs \
            site/validate-table-route-core.mjs \
            site/validate-watchlist-route-core.mjs \
            site/validate.mjs \
            .github/migrate-validator-1.mjs \
            .github/migrate-validator-2.mjs \
            .github/migrate-validator-3.mjs \
            .github/workflows/app-core-validator-migration.yml
          git diff --cached --check
          git commit -m "Update validators for canonical app-core ownership"
          git push origin HEAD:chore/app-core-normalizer-optimization

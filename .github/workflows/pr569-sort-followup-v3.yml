name: PR 569 sorting follow-up v3

on:
  push:
    branches:
      - fix/page-scoped-default-sorting
    paths:
      - .github/workflows/pr569-sort-followup-v3.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/page-scoped-default-sorting
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Patch sorting and loading header lifecycle
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f"Missing patch target: {label}")
              path.write_text(text.replace(old, new, 1))

          core_path = Path('site/modules/app-core.js')
          core = core_path.read_text()

          old = '''function tableSortStateForView(
            viewName = state.view,
            pageName = tablePageKey() || state.currentPage || "progression",
            fallbackSortState = null,
          ) {
            const normalizedPageName = pageName === "mflstats" ? "mfl" : String(pageName || "");
            const normalizedView = normalizeViewForPage(viewName, normalizedPageName || "progression");
            return normalizedViewSortState(
              state.tableSortSessionSortState || fallbackSortState,
              normalizedView,
              normalizedPageName,
            );
          }
          '''
          new = '''function tableSortStateForView(
            viewName = state.view,
            pageName = tablePageKey() || state.currentPage || "progression",
            fallbackSortState = null,
          ) {
            const normalizedPageName = pageName === "mflstats" ? "mfl" : String(pageName || "");
            const normalizedView = normalizeViewForPage(viewName, normalizedPageName || "progression");
            const sourceSortState = state.tableSortSessionSortState || fallbackSortState;
            const sourceSortSupported = sortKeySupportedByView(sourceSortState?.sortKey, normalizedView, normalizedPageName);
            const resolvedSortState = normalizedViewSortState(
              sourceSortState,
              normalizedView,
              normalizedPageName,
            );
            if (!sourceSortSupported && state.tableSortSessionKey) {
              state.tableSortSessionSortState = resolvedSortState;
            }
            return resolvedSortState;
          }
          '''
          if old not in core:
              raise SystemExit('Missing tableSortStateForView target')
          core = core.replace(old, new, 1)

          old = '''  if (state.view === "next" && statColumns.includes(state.sortKey)) {
            if (state.sortKey === "overall") {
              return comparePrimitiveValues(
                tableNextOverallPreciseValue(a),
                tableNextOverallPreciseValue(b),
                direction,
                true,
              );
            }
            return compareNextOverallRows(a, b, state.sortKey, direction);
          }
          '''
          new = '''  if (state.view === "next" && statColumns.includes(state.sortKey)) {
            return compareNextOverallRows(a, b, state.sortKey, direction);
          }
          '''
          if old not in core:
              raise SystemExit('Missing Next Overall comparator target')
          core = core.replace(old, new, 1)

          old = '''  if (state.view === "next" && statColumns.includes(column)) {
            return column === "overall"
              ? tableNextOverallPreciseValue(row)
              : tableNextOverallSortValue(row, column);
          }
          '''
          new = '''  if (state.view === "next" && statColumns.includes(column)) {
            return tableNextOverallSortValue(row, column);
          }
          '''
          if old not in core:
              raise SystemExit('Missing Next Overall sortableValue target')
          core = core.replace(old, new, 1)

          old = '''    const staticRoutePending = staticHeader
              && staticPage
              && staticView
              && (currentPage !== staticPage || currentView !== staticView);
            if (staticRoutePending) return true;
            if (staticHeader && staticSignature && staticSignature !== signature) return true;
          '''
          new = '''    const initialRouteSuperseded = document.documentElement.classList.contains("mflInitialRouteSuperseded");
            const staticRoutePending = staticHeader
              && !initialRouteSuperseded
              && staticPage
              && staticView
              && (currentPage !== staticPage || currentView !== staticView);
            if (staticRoutePending) return true;
            if (staticHeader && !initialRouteSuperseded && staticSignature && staticSignature !== signature) return true;
          '''
          if old not in core:
              raise SystemExit('Missing canonical header static guard target')
          core = core.replace(old, new, 1)

          old = '''        const staticRoutePending = staticHeader
                  && staticPage
                  && staticView
                  && (currentPage !== staticPage || currentView !== staticView);
                if (staticRoutePending) return undefined;
                if (staticHeader && staticSignature && staticSignature !== signature) return undefined;
          '''
          new = '''        const initialRouteSuperseded = document.documentElement.classList.contains("mflInitialRouteSuperseded");
                const staticRoutePending = staticHeader
                  && !initialRouteSuperseded
                  && staticPage
                  && staticView
                  && (currentPage !== staticPage || currentView !== staticView);
                if (staticRoutePending) return undefined;
                if (staticHeader && !initialRouteSuperseded && staticSignature && staticSignature !== signature) return undefined;
          '''
          if old not in core:
              raise SystemExit('Missing stable buildHeader static guard target')
          core = core.replace(old, new, 1)

          old = '''    window.__mflCancelIncrementalRouteRequest?.();
            const transition = stageViewTransition(pageName, viewName, options);
            if (!transition) return null;
            document.documentElement.classList.add("mflInitialRouteSuperseded");
          '''
          new = '''    window.__mflCancelIncrementalRouteRequest?.();
            document.documentElement.classList.add("mflInitialRouteSuperseded");
            const transition = stageViewTransition(pageName, viewName, options);
            if (!transition) return null;
          '''
          if old not in core:
              raise SystemExit('Missing view transition first-paint handoff target')
          core = core.replace(old, new, 1)

          core_path.write_text(core)

          api_path = Path('site/api/_data-page.js')
          api = api_path.read_text()
          old = '''  if (["current", "all"].includes(view) && STAT_COLUMNS.has(key)) {
            const derived = `${key}_${view === "current" ? "prog_current_season" : "prog_all"}`;
            return `${quoteIdentifier(derived)} IS NULL, ${quoteIdentifier(derived)} ${direction}, overall ${direction}, player_id DESC`;
          }
          '''
          new = '''  if (["current", "all"].includes(view) && STAT_COLUMNS.has(key)) {
            const derived = `${key}_${view === "current" ? "prog_current_season" : "prog_all"}`;
            return `${quoteIdentifier(derived)} IS NULL, ${quoteIdentifier(derived)} ${direction}, overall DESC, player_id DESC`;
          }
          '''
          if old not in api:
              raise SystemExit('Missing progression API ordering target')
          api_path.write_text(api.replace(old, new, 1))

          validator = Path('site/validate-table-sort-session.mjs')
          text = validator.read_text()
          text = text.replace(
              'const entry = fs.readFileSync(new URL("./modules/app-entry.js", import.meta.url), "utf8");\n',
              'const entry = fs.readFileSync(new URL("./modules/app-entry.js", import.meta.url), "utf8");\nconst dataPage = fs.readFileSync(new URL("./api/_data-page.js", import.meta.url), "utf8");\n',
              1,
          )
          old = '''const standardViewSource = sourceBetween(core, "async function setView(viewName)", "function mflChunkFromPublicData");
          assert.doesNotMatch(standardViewSource, /rememberTableSortState/u, "View switching must not rewrite the page-level sort intent.");
          assert.match(standardViewSource, /tableSortStateForView\\([\\s\\S]*viewName/u, "Standard view switches must resolve the existing page sort against the destination view.");
          '''
          new = '''const sortResolverSource = sourceBetween(core, "function tableSortStateForView", "function rememberTableSortState");
          assert.match(sortResolverSource, /sourceSortSupported = sortKeySupportedByView/u, "View sorting must explicitly detect whether the destination supports the active sort column.");
          assert.match(sortResolverSource, /if \\(!sourceSortSupported && state\\.tableSortSessionKey\\) \\{\\s*state\\.tableSortSessionSortState = resolvedSortState;/u, "An unsupported destination view must reset the page session itself to that view's canonical default.");

          const standardViewSource = sourceBetween(core, "async function setView(viewName)", "function mflChunkFromPublicData");
          assert.doesNotMatch(standardViewSource, /rememberTableSortState/u, "View switching must not restore an older per-view sort.");
          assert.match(standardViewSource, /tableSortStateForView\\([\\s\\S]*viewName/u, "Standard view switches must resolve sorting against the destination view.");
          '''
          if old not in text:
              raise SystemExit('Missing validator standard view target')
          text = text.replace(old, new, 1)

          old = '''assert.match(core, /state\\.view === "next"[\\s\\S]{0,180}column === "overall"[\\s\\S]{0,120}tableNextOverallPreciseValue\\(row\\)/u, "Next Overall sortable values must use the displayed precise Overall value.");
          assert.match(core, /state\\.sortKey === "overall"[\\s\\S]{0,220}tableNextOverallPreciseValue\\(a\\)[\\s\\S]{0,120}tableNextOverallPreciseValue\\(b\\)/u, "Next Overall comparisons must sort the displayed Overall value instead of the needed gain.");
          '''
          new = '''assert.match(core, /state\\.view === "next" && statColumns\\.includes\\(column\\)[\\s\\S]{0,100}return tableNextOverallSortValue\\(row, column\\);/u, "Next Overall must sort every Overall/stat column by its gap to the next Overall +1 target.");
          assert.match(core, /state\\.view === "next" && statColumns\\.includes\\(state\\.sortKey\\)[\\s\\S]{0,100}compareNextOverallRows\\(a, b, state\\.sortKey, direction\\)/u, "Next Overall comparisons must use the gap comparator for Overall and every stat.");
          assert.match(dataPage, /view === "next" && STAT_COLUMNS\\.has\\(key\\)[\\s\\S]{0,160}key === "overall" \\? "next_overall_gap" : `\\$\\{key\\}_to_next_overall`/u, "Incremental Next Overall sorting must use next_overall_gap for Overall and *_to_next_overall for stats.");
          '''
          if old not in text:
              raise SystemExit('Missing validator Next Overall target')
          text = text.replace(old, new, 1)

          marker = 'assert.match(core, /comparisonDirection = state\\.currentPage === "progression" && index > 0 \\? -1 : direction/u, "Progression tie-breaks must keep higher Overall first after equal progression.");\n'
          addition = marker + 'assert.match(dataPage, /\\["current", "all"\\]\\.includes\\(view\\)[\\s\\S]{0,260}overall DESC, player_id DESC/u, "Incremental Progression sorting must use progression first and Overall descending as the tie-break in both directions.");\n'
          if marker not in text:
              raise SystemExit('Missing validator progression marker')
          text = text.replace(marker, addition, 1)

          marker = 'assert.match(commitViewSource, /buildHeader\\(\\);/u, "View transitions must rebuild the sorted header before their runtime paint.");\n'
          addition = marker + '''const runViewTransitionSource = sourceBetween(core, "async function runViewTransition", "function tableLoadingTitle");
          assert.ok(runViewTransitionSource.indexOf('classList.add("mflInitialRouteSuperseded")') < runViewTransitionSource.indexOf("stageViewTransition(pageName, viewName, options)"), "A view transition must release bootstrap-header ownership before committing the destination header.");
          const canonicalHeaderSource = sourceBetween(core, "function ensureCanonicalTableHeader", "function installTableLoadingOwners");
          assert.match(canonicalHeaderSource, /initialRouteSuperseded[\\s\\S]{0,260}!initialRouteSuperseded[\\s\\S]{0,220}buildHeader\\(\\)/u, "The loading header must be rebuildable after the initial route is superseded, including Club view switches.");
          '''
          if marker not in text:
              raise SystemExit('Missing validator header marker')
          text = text.replace(marker, addition, 1)
          validator.write_text(text)
          PY
      - name: Install site dependencies
        working-directory: site
        run: npm ci
      - name: Rebuild generated runtime chunks
        working-directory: site
        run: npm run build:core
      - name: Run dedicated sorting regression
        working-directory: site
        run: node validate-table-sort-session.mjs
      - name: Stage generated contract
        run: git add site/modules/app-core.js site/modules/app-core-runtime.js site/modules/app-core-table-runtime.js site/api/_data-page.js site/validate-table-sort-session.mjs
      - name: Run full site checks
        working-directory: site
        run: npm run check
      - name: Commit fix and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/pr569-sort-followup-v3.yml
          git add -A
          git commit -m "Fix sorting semantics and loading arrows"
          git push origin HEAD:fix/page-scoped-default-sorting

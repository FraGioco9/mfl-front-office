name: PR 569 sort follow-up v3

on:
  push:
    branches:
      - fix/page-scoped-default-sorting
    paths:
      - .github/workflows/pr569-sort-followup-v3.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/page-scoped-default-sorting
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Apply the validated follow-up patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/pr569-sort-followup-v2.yml').read_text().splitlines()
          start = workflow.index('      - name: Patch canonical sort lifecycle')
          run_index = next(i for i in range(start, len(workflow)) if workflow[i] == '        run: |')
          end = next(i for i in range(run_index + 1, len(workflow)) if workflow[i].startswith('      - name:'))
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in workflow[run_index + 1:end]) + '\n'
          Path('/tmp/pr569-patch.sh').write_text(textwrap.dedent(script))
          PY
          bash /tmp/pr569-patch.sh

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Rebuild generated runtime chunks
        working-directory: site
        run: npm run build:core

      - name: Validate sort behavior
        working-directory: site
        run: node validate-table-sort-session.mjs

      - name: Stage generated contract
        run: git add site/modules/app-core.js site/modules/app-core-runtime.js site/modules/app-core-table-runtime.js site/validate-table-sort-session.mjs

      - name: Run site checks
        working-directory: site
        run: npm run check

      - name: Commit fix and remove temporary workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr569-sort-followup.yml .github/workflows/pr569-sort-followup-v2.yml .github/workflows/pr569-sort-followup-v3.yml
          git add site/modules/app-core.js site/modules/app-core-runtime.js site/modules/app-core-table-runtime.js site/validate-table-sort-session.mjs
          git commit -m "Preserve table sorting across view switches"
          git push origin HEAD:fix/page-scoped-default-sorting

name: Performance paired #969

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Download repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Save candidate checkout
        shell: bash
        run: echo "candidate_sha=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download latest validated runtime database
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LATEST_RUN_ID=""
          LATEST_ARTIFACT_ID=""
          LATEST_CREATED_AT=""
          while IFS=$'\t' read -r CREATED_AT ARTIFACT_ID RUN_ID; do
            [ -n "$ARTIFACT_ID" ] || continue
            [ -n "$RUN_ID" ] || continue
            rm -f mfl_database.db
            if ! gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name mfl_database --dir .; then
              continue
            fi
            if python -m scripts.database.prepare_runtime_database mfl_database.db --validate-only; then
              LATEST_RUN_ID="$RUN_ID"
              LATEST_ARTIFACT_ID="$ARTIFACT_ID"
              LATEST_CREATED_AT="$CREATED_AT"
              break
            fi
            rm -f mfl_database.db
          done < <(
            gh api --paginate               "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=mfl_database&per_page=100"               --jq '.artifacts[] | select(.name == "mfl_database" and .expired == false) | [.created_at, (.id | tostring), (.workflow_run.id | tostring)] | @tsv'               | sort -r
          )
          test -n "$LATEST_RUN_ID"
          mkdir -p api/data-files
          mv mfl_database.db api/data-files/mfl_database.db
          python -m scripts.database.prepare_runtime_database api/data-files/mfl_database.db --validate-only
          DATASET_GENERATED_AT="$(python - <<'PY'
          import sqlite3
          value = sqlite3.connect("api/data-files/mfl_database.db").execute(
              "SELECT value FROM runtime_metadata WHERE key = 'generated_at' LIMIT 1"
          ).fetchone()
          print(str(value[0] if value else "").strip())
          PY
          )"
          {
            echo "database_artifact_id=$LATEST_ARTIFACT_ID"
            echo "database_run_id=$LATEST_RUN_ID"
            echo "dataset_generated_at=$DATASET_GENERATED_AT"
          } >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Capture paired Database baselines
        shell: bash
        run: |
          set -euo pipefail

          capture_ref() {
            local ref="$1"
            local label="$2"
            local output="$3"
            local log="$4"
            local server_log="$5"

            git checkout --force "$ref"
            npm run build:legacy
            npm run build:public
            npx next build --webpack

            npx next start -p 4000 > "$server_log" 2>&1 &
            local pid=$!
            cleanup_server() {
              kill "$pid" >/dev/null 2>&1 || true
              wait "$pid" >/dev/null 2>&1 || true
            }
            trap cleanup_server RETURN

            for attempt in $(seq 1 80); do
              if curl --fail --silent --show-error "http://127.0.0.1:4000/api/data?mode=summary" >/tmp/mfl-paired-summary.json; then
                break
              fi
              if ! kill -0 "$pid" >/dev/null 2>&1; then
                cat "$server_log" >&2
                return 1
              fi
              sleep 0.5
            done

            MFL_BASE_URL=http://127.0.0.1:4000             MFL_BASELINE_OUTPUT="$output"             MFL_BASELINE_LABEL="$label"             MFL_BASELINE_SOURCE_REF="$ref"             MFL_BASELINE_ACCESS_CONTEXT=guest/public-database             MFL_BASELINE_RUNS=5             MFL_BASELINE_PROFILES=desktop,mobile-slow             MFL_BASELINE_JOURNEYS=database             npm run performance:baseline 2>&1 | tee "$log"

            jq -e '.metadata.complete == true' "$output" >/dev/null
            jq -e '.metadata.targetContext.datasetGeneratedAt == env.dataset_generated_at' "$output" >/dev/null
            cleanup_server
            trap - RETURN
          }

          capture_ref "37d1992e9a101155ff4d9a527b58815650e04fe0"             "paired-982-base"             "performance-982-base.json"             "performance-982-base.log"             "performance-982-next.log"

          capture_ref "$candidate_sha"             "paired-983-candidate"             "performance-983-candidate.json"             "performance-983-candidate.log"             "performance-983-next.log"

      - name: Compare paired captures
        shell: bash
        run: |
          python - <<'PY'
          import json

          with open("performance-982-base.json") as stream:
              base = json.load(stream)
          with open("performance-983-candidate.json") as stream:
              candidate = json.load(stream)

          print("Paired #982 -> #983 Database comparison")
          print("| Profile | Phase | Metric | #982 | #983 | Delta |")
          print("| --- | --- | --- | ---: | ---: | ---: |")
          metrics = [
              ("usefulContentMs", "Useful ms"),
              ("settledMs", "Settled ms"),
              ("longTaskMs", "Long-task ms"),
              ("cls", "CLS"),
          ]
          for profile in ("desktop", "mobile-slow"):
              for phase in ("cold", "refresh", "cached"):
                  b = base["summary"][profile]["database"][phase]
                  c = candidate["summary"][profile]["database"][phase]
                  for key, label in metrics:
                      bv = b[key]["median"]
                      cv = c[key]["median"]
                      if key == "cls":
                          delta = cv - bv
                          print(f"| {profile} | {phase} | {label} | {bv:.4f} | {cv:.4f} | {delta:+.4f} |")
                      else:
                          delta = (cv - bv) / bv * 100 if bv else 0
                          print(f"| {profile} | {phase} | {label} | {bv:.1f} | {cv:.1f} | {delta:+.1f}% |")
          PY

      - name: Upload paired evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-paired-969-${{ github.run_id }}
          path: |
            performance-982-base.json
            performance-982-base.log
            performance-982-next.log
            performance-983-candidate.json
            performance-983-candidate.log
            performance-983-next.log
          if-no-files-found: warn
          retention-days: 90

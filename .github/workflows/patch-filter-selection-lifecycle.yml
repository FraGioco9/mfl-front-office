name: Patch filter and selection lifecycle

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/reset-filters-and-selection'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Apply canonical filter and selection lifecycle
        shell: python
        run: |
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def replace_once(path, old, new, label):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: {label}: expected one match, found {count}")
              write(path, text.replace(old, new, 1))

          def replace_section(path, start, end, replacement, label):
              text = read(path)
              start_index = text.find(start)
              end_index = text.find(end, start_index + len(start)) if start_index >= 0 else -1
              if start_index < 0 or end_index < 0:
                  raise SystemExit(f"{path}: could not locate {label}")
              write(path, text[:start_index] + replacement + text[end_index:])

          # Route chrome owns immediate page/view identity. Different pages reset
          # filters; same-page view changes retain filters but clear selection.
          replace_once(
              "site/static-ui-runtime.js",
              '  const SPECIALIZED_TOOLTIP_SELECTOR = [',
              '  const FILTERED_TABLE_PAGES = new Set(["database", "mfl", "progression", "watchlist", "agents", "myplayers"]);\n  const SPECIALIZED_TOOLTIP_SELECTOR = [',
              "filtered table page set",
          )
          replace_once(
              "site/static-ui-runtime.js",
              '  let lastPrimedRouteIdentity = "";',
              '  let lastPrimedRouteIdentity = "";\n  let lastRoutePage = "";\n  let lastRouteView = "";',
              "route identity state",
          )
          replace_section(
              "site/static-ui-runtime.js",
              "  function syncDestinationTableChrome(state) {",
              "  function routeIdentity(state) {",
              '''  function syncDestinationTableChrome(state, options = {}) {
            const prime = Reflect.get(window, "__mflPrimeTableChrome");
            if (typeof prime === "function") prime(state.page, state.url || window.location.href, options);
            syncDestinationTableHeader(state);
          }

''',
              "destination table chrome",
          )
          replace_section(
              "site/static-ui-runtime.js",
              "  function showRouteShell(state) {",
              "  function syncRouteChrome(urlLike = window.location.href) {",
              '''  function showRouteShell(state, options = {}) {
            const target = shellForRoute(state);
            if (!(target instanceof HTMLElement)) return;
            if (target.id === "progressionPage") syncDestinationTableChrome(state, options);
            primeDestinationRouteShell(state, target);

            document.querySelectorAll("main > .pageView").forEach((page) => {
              if (page instanceof HTMLElement) page.hidden = page !== target;
            });
          }

''',
              "route shell",
          )
          replace_section(
              "site/static-ui-runtime.js",
              "  function syncRouteChrome(urlLike = window.location.href) {",
              "  function tooltipTargetFrom(target) {",
              '''  function syncRouteChrome(urlLike = window.location.href) {
            const state = routeState(urlLike);
            const previousPage = lastRoutePage;
            const previousView = lastRouteView;
            const pageChanged = Boolean(previousPage && previousPage !== state.page);
            const viewChanged = Boolean(previousPage && !pageChanged && previousView !== state.view);
            const resetFilters = pageChanged && FILTERED_TABLE_PAGES.has(state.page);
            lastRoutePage = state.page;
            lastRouteView = state.view;

            if (resetFilters) {
              document.documentElement.dataset.mflResetTableFilters = state.page;
            } else if (pageChanged) {
              delete document.documentElement.dataset.mflResetTableFilters;
            }
            if (pageChanged || viewChanged) {
              window.__mflSelectionStackRuntime?.clearForRouteTransition?.();
            }

            syncFooter();
            setActiveNavigation(state.page);
            syncTableViews(state.page, state.view);
            showRouteShell(state, { resetFilters });
            return state;
          }

''',
              "route chrome sync",
          )

          # Bootstrap paints destination defaults before the page is revealed.
          bootstrap_path = "site/bootstrap.js"
          bootstrap = read(bootstrap_path)
          start = bootstrap.find('  function primeTableChrome(page, urlLike = window.location.href) {')
          end = bootstrap.find('  Reflect.set(window, "__mflPrimeTableChrome", primeTableChrome);', start)
          if start < 0 or end < 0:
              raise SystemExit("site/bootstrap.js: could not locate primeTableChrome")
          section = bootstrap[start:end]
          section = section.replace(
              '  function primeTableChrome(page, urlLike = window.location.href) {',
              '  function primeTableChrome(page, urlLike = window.location.href, options = {}) {',
              1,
          )
          saved_marker = '    const savedState = storedTablePageState(normalizedPage) || {};'
          if saved_marker not in section:
              raise SystemExit("site/bootstrap.js: saved table state marker missing")
          section = section.replace(
              saved_marker,
              '    const resetFilters = Boolean(options.resetFilters);\n    const savedState = resetFilters ? {} : storedTablePageState(normalizedPage) || {};',
              1,
          )
          pager_marker = '    const pager = document.querySelector("#progressionPage nav.pager");'
          if pager_marker not in section:
              raise SystemExit("site/bootstrap.js: pager marker missing")
          section = section.replace(
              pager_marker,
              '''    if (resetFilters) {
                const filterRules = document.getElementById("filterRules");
                if (filterRules instanceof HTMLElement) filterRules.replaceChildren();
                const filterSummary = document.getElementById("filterSummary");
                if (filterSummary instanceof HTMLElement) filterSummary.textContent = "0 active";
              }

          ''' + pager_marker,
              1,
          )
          write(bootstrap_path, bootstrap[:start] + section + bootstrap[end:])

          # Existing selection-stack runtime is the single selection lifecycle owner.
          replace_once(
              "site/selection-stack-runtime.js",
              "  function rebind() {",
              '''  function clearForRouteTransition() {
            if (destroyed || applicationSelectionCount() <= 0) return false;
            clearApplicationSelection(null);
            schedule();
            return true;
          }

          function rebind() {''',
              "route transition selection clear",
          )
          replace_once(
              "site/selection-stack-runtime.js",
              "  window.__mflSelectionStackRuntime = Object.freeze({",
              "  window.__mflSelectionStackRuntime = Object.freeze({\n    clearForRouteTransition,",
              "selection runtime export",
          )

          # Table route state resets only filter fields on a new page. Page-specific
          # view/sort/page-size state stays intact. Applied filter changes clear
          # selection, while unchanged filters during sorting do not.
          app_path = "site/modules/app-core.js"
          app = read(app_path)

          restore_start = app.find('function restoreSavedTableState(pageName = tablePageKey() || "progression", options = {}) {')
          restore_end = app.find('function syncRestoredTableControls(', restore_start)
          if restore_start < 0 or restore_end < 0:
              raise SystemExit("site/modules/app-core.js: could not locate saved table restore owner")
          restore_section = app[restore_start:restore_end]
          state_tail = restore_section.find("  state.view =")
          if state_tail < 0:
              raise SystemExit("site/modules/app-core.js: saved table restore state tail missing")
          restore_replacement = '''function tableStateWithoutPageFilters(pageName, savedState) {
            const defaults = defaultTablePageState(pageName);
            return {
              ...savedState,
              hideRetired: defaults.hideRetired,
              hideRetiring: defaults.hideRetiring,
              hideMflPlayers: defaults.hideMflPlayers,
              mflPackable: defaults.mflPackable,
              newMints: defaults.newMints,
              rules: [],
              selectedPlayerIds: [],
            };
          }

          function restoreSavedTableState(pageName = tablePageKey() || "progression", options = {}) {
            const storedState = state.tablePageStates?.[pageName]
              || defaultTablePageState(pageName);
            const resetFilters = document.documentElement.dataset.mflResetTableFilters === pageName;
            const savedState = resetFilters ? tableStateWithoutPageFilters(pageName, storedState) : storedState;
            if (resetFilters) state.tablePageStates[pageName] = savedState;

          ''' + restore_section[state_tail:]
          app = app[:restore_start] + restore_replacement + app[restore_end:]

          sync_start = app.find('function syncRestoredTableControls(')
          sync_end = app.find('function readFilterDraftRules()', sync_start)
          if sync_start < 0 or sync_end < 0:
              raise SystemExit("site/modules/app-core.js: could not locate restored controls owner")
          sync_section = app[sync_start:sync_end]
          pending_marker = "  state.pendingTableControlRestore = null;"
          if pending_marker not in sync_section:
              raise SystemExit("site/modules/app-core.js: pending control restore marker missing")
          sync_section = sync_section.replace(
              pending_marker,
              '''  if (document.documentElement.dataset.mflResetTableFilters === pageName) {
              delete document.documentElement.dataset.mflResetTableFilters;
            }
            state.pendingTableControlRestore = null;''',
              1,
          )
          app = app[:sync_start] + sync_section + app[sync_end:]

          apply_start = app.find("function applyFilters(options = {}) {")
          apply_end = app.find("function currentPageRows() {", apply_start)
          if apply_start < 0 or apply_end < 0:
              raise SystemExit("site/modules/app-core.js: could not locate filter apply owner")
          apply_section = app[apply_start:apply_end]
          rules_marker = "  const rules = readFilterRules();"
          if rules_marker not in apply_section:
              raise SystemExit("site/modules/app-core.js: filter rules marker missing")
          apply_section = apply_section.replace(
              rules_marker,
              '''  const rules = readFilterRules();
            const filterSignature = appliedTableFilterSignature(rules);
            if (lastAppliedTableFilterSignature && filterSignature !== lastAppliedTableFilterSignature) {
              state.selectedPlayerIds.clear();
              state.selectionAnchorPlayerId = null;
            }
            lastAppliedTableFilterSignature = filterSignature;''',
              1,
          )
          apply_replacement = '''let lastAppliedTableFilterSignature = "";

          function appliedTableFilterSignature(rules) {
            return JSON.stringify([
              state.currentPage,
              Boolean(hideRetiredInput?.checked),
              Boolean(hideRetiringInput?.checked),
              Boolean(hideMflPlayersInput?.checked),
              Boolean(packablePlayersInput?.checked),
              Boolean(newMintsInput?.checked),
              rules,
            ]);
          }

          ''' + apply_section
          app = app[:apply_start] + apply_replacement + app[apply_end:]
          write(app_path, app)

          validator = Path("site/validate-table-filter-selection-lifecycle.mjs")
          validator.write_text('''import { readFile } from "node:fs/promises";
          import { normalizeBuiltApplicationCoreArtifacts } from "./modules/app-core-build-normalizer.js";

          const read = async (path) => String(await readFile(new URL(path, import.meta.url), "utf8")).replace(/\\r\\n?/g, "\\n");
          const invariant = (condition, message) => { if (!condition) throw new Error(message); };

          const [staticUi, bootstrap, selectionStack, appCore] = await Promise.all([
            read("./static-ui-runtime.js"),
            read("./bootstrap.js"),
            read("./selection-stack-runtime.js"),
            read("./modules/app-core.js"),
          ]);
          const artifacts = normalizeBuiltApplicationCoreArtifacts(appCore);
          const generated = [String(artifacts.core || ""), ...Object.values(artifacts.routeChunks || {}).map(String)].join("\\n");

          invariant(
            staticUi.includes('const pageChanged = Boolean(previousPage && previousPage !== state.page);')
              && staticUi.includes('const viewChanged = Boolean(previousPage && !pageChanged && previousView !== state.view);')
              && staticUi.includes('document.documentElement.dataset.mflResetTableFilters = state.page;')
              && staticUi.includes('showRouteShell(state, { resetFilters });'),
            "Page transitions must mark destination filter reset before first paint while same-page view transitions remain filter-neutral.",
          );
          invariant(
            staticUi.includes('window.__mflSelectionStackRuntime?.clearForRouteTransition?.();')
              && selectionStack.includes('function clearForRouteTransition() {')
              && selectionStack.includes('clearApplicationSelection(null);'),
            "Page and view transitions must clear player selection through the canonical selection lifecycle owner.",
          );
          invariant(
            bootstrap.includes('function primeTableChrome(page, urlLike = window.location.href, options = {}) {')
              && bootstrap.includes('const savedState = resetFilters ? {} : storedTablePageState(normalizedPage) || {};')
              && bootstrap.includes('filterRules.replaceChildren();')
              && bootstrap.includes('filterSummary.textContent = "0 active";'),
            "Destination table first paint must show default controls and zero advanced filters on a page switch.",
          );
          invariant(
            appCore.includes('function tableStateWithoutPageFilters(pageName, savedState) {')
              && appCore.includes('rules: [],\\n    selectedPlayerIds: [],')
              && appCore.includes('const resetFilters = document.documentElement.dataset.mflResetTableFilters === pageName;')
              && appCore.includes('delete document.documentElement.dataset.mflResetTableFilters;'),
            "Table restore must clear only destination filter/selection state and consume the page-reset marker after controls synchronize.",
          );
          invariant(
            appCore.includes('function appliedTableFilterSignature(rules) {')
              && appCore.includes('if (lastAppliedTableFilterSignature && filterSignature !== lastAppliedTableFilterSignature) {\\n    state.selectedPlayerIds.clear();\\n    state.selectionAnchorPlayerId = null;')
              && generated.includes('function appliedTableFilterSignature(rules) {'),
            "Applied filter changes must clear player selection in the canonical generated table owner.",
          );
          invariant(
            appCore.includes('buildHeader();\\n      applyFilters();'),
            "Sorting must continue to reapply unchanged filters without an unconditional selection reset.",
          );

          console.log("Page filter isolation and view/filter selection reset validation passed.");
          ''', encoding="utf-8")

          replace_once(
              "site/validate-all.mjs",
              '  "validate-table-loading-state.mjs",',
              '  "validate-table-loading-state.mjs",\n  "validate-table-filter-selection-lifecycle.mjs",',
              "validator registration",
          )

      - name: Commit canonical lifecycle fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-filter-selection-lifecycle.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- site/static-ui-runtime.js site/bootstrap.js site/selection-stack-runtime.js site/modules/app-core.js site/validate-all.mjs site/validate-table-filter-selection-lifecycle.mjs
          git add -u -- .github/workflows/patch-filter-selection-lifecycle.yml
          git commit -m "Reset filters and selection across table transitions"
          git push origin "HEAD:${{ github.head_ref }}"

name: Patch issue 603 footer creator

on:
  push:
    branches:
      - fix/603-footer-redesign
    paths:
      - site/patch-603-footer-creator.mjs
      - .github/workflows/patch-603-footer-creator.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Apply footer creator changes
        run: node site/patch-603-footer-creator.mjs
      - name: Commit footer creator sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html site/responsive.css
          if ! git diff --cached --quiet; then
            git commit -m "Refine footer creator details"
            git push
          fi

name: Issue 383 single Evaluation recent prime

on:
  push:
    branches:
      - fix/evaluation-discount-rate-fallback
    paths:
      - .github/workflows/issue-383-single-evaluation-recent-prime.yml
      - .github/scripts/issue-383-single-evaluation-recent-prime.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/evaluation-discount-rate-fallback

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply single-prime Evaluation loading fix
        run: python .github/scripts/issue-383-single-evaluation-recent-prime.py

      - name: Install site dependencies
        working-directory: site
        run: npm install --no-audit --no-fund

      - name: Build canonical application core
        working-directory: site
        run: npm run build:core

      - name: Validate Evaluation search lifecycle
        working-directory: site
        run: node validate-evaluation-search-lifecycle.mjs

      - name: Typecheck
        working-directory: site
        run: npm run typecheck

      - name: Commit Evaluation loading fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/evaluation-search-state-runtime.js site/modules/app-core.js site/modules/app-core-runtime.js site/modules/app-core-evaluation-runtime.js site/modules/app-core-evaluation-chunk.js site/validate-evaluation-search-lifecycle.mjs
          git diff --cached --quiet && exit 1
          git commit -m "Use one Evaluation recent loading prime"
          git push origin HEAD:fix/evaluation-discount-rate-fallback

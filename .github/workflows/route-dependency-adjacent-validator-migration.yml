name: Route dependency adjacent validator migration

on:
  push:
    branches:
      - refactor/canonical-route-dependency-plan
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/canonical-route-dependency-plan
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update adjacent route dependency validators
        run: node site/migrate-route-dependency-adjacent-validators.mjs
      - name: Remove temporary migration scaffolding
        shell: bash
        run: |
          rm -f site/migrate-route-dependency-adjacent-validators.mjs
          rm -f .github/workflows/route-dependency-adjacent-validator-migration.yml
      - name: Persist validator migration
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "Adjacent route dependency validators are already canonical."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update adjacent route dependency validators"
          git push origin HEAD:refactor/canonical-route-dependency-plan

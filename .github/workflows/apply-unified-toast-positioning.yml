name: Apply unified toast positioning

on:
  push:
    branches:
      - fix/unified-toast-positioning
    paths:
      - .github/workflows/apply-unified-toast-positioning.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/unified-toast-positioning
      - name: Apply guarded source patch
        run: python .github/scripts/apply-unified-toast-positioning.py
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/modules/core-sources/shared-layout-center.js site/selection-stack-runtime.js
          git commit -m "Unify toast horizontal positioning"
          git push origin HEAD:fix/unified-toast-positioning

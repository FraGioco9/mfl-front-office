name: One-time club atomic views fix

on:
  push:
    branches:
      - main
    paths:
      - .github/club-page-fix-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch current app.js only
        run: python .github/scripts/patch_club_atomic_views.py

      - name: Validate JavaScript
        run: node --check site/app.js

      - name: Commit club page fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Load club views atomically and align table widths"
          git push origin main

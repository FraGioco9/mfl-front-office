name: Issue 203 listing alias fix

on:
  push:
    branches:
      - fix/issue-203-player-listing-column
    paths:
      - ".github/workflows/issue-203-listing-alias-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-203-player-listing-column

      - name: Fix virtual Listing SQL alias
        shell: python
        run: |
          from pathlib import Path

          data_path = Path("site/api/_data-page.js")
          data = data_path.read_text(encoding="utf-8")
          old = '? `${LISTING_PRICE_SQL} AS ${quoteIdentifier(LISTING_COLUMN)}`\n      : quoteIdentifier(column))'
          new = '? `${LISTING_PRICE_SQL} AS "${LISTING_COLUMN}"`\n      : quoteIdentifier(column))'
          if data.count(old) != 1:
              raise SystemExit(f"Expected one virtual Listing alias expression, found {data.count(old)}")
          data_path.write_text(data.replace(old, new, 1), encoding="utf-8")

          validator_path = Path("site/validate-listing-column.mjs")
          validator = validator_path.read_text(encoding="utf-8")
          anchor = 'assert.match(dataPage, /const LISTING_COLUMN = "listing_price"/);\n'
          addition = anchor + 'assert.match(dataPage, /AS \\"\\$\\{LISTING_COLUMN\\}\\"/);\nassert.doesNotMatch(dataPage, /quoteIdentifier\\(LISTING_COLUMN\\)/);\n'
          if anchor not in validator:
              raise SystemExit("Listing data-page validator insertion point was not found.")
          if 'assert.doesNotMatch(dataPage, /quoteIdentifier\\(LISTING_COLUMN\\)/);' not in validator:
              validator = validator.replace(anchor, addition, 1)
              validator_path.write_text(validator, encoding="utf-8")

      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/api/_data-page.js site/validate-listing-column.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Treat Listing as virtual SQL column"
          git push origin HEAD:fix/issue-203-player-listing-column

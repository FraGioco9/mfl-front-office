name: Cleanup unused branches

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-unused-branches.yml
  workflow_dispatch:

# Maintenance trigger: v1.127.5
permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Delete unused remote branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t open_heads < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" --jq '.[].head.ref'
          )
          mapfile -t remote_branches < <(
            git ls-remote --heads origin | awk '{sub("refs/heads/", "", $2); print $2}'
          )

          deleted=()
          kept=()

          for branch in "${remote_branches[@]}"; do
            if [[ "$branch" == "main" ]]; then
              kept+=("$branch")
              continue
            fi

            if ((${#open_heads[@]} > 0)) && printf '%s\n' "${open_heads[@]}" | grep -Fxq -- "$branch"; then
              kept+=("$branch")
              continue
            fi

            git push origin --delete "$branch"
            deleted+=("$branch")
          done

          {
            echo "## Unused branch cleanup"
            echo
            echo "Deleted ${#deleted[@]} branch(es)."
            for branch in "${deleted[@]}"; do
              echo "- deleted: \`$branch\`"
            done
            for branch in "${kept[@]}"; do
              echo "- kept: \`$branch\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

name: Refine PR 616 universal table centering v2

on:
  push:
    branches:
      - fix/599-responsive-table-proportions
    paths:
      - .github/workflows/refine-pr-616-universal-table-centering-v2.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: fix/599-responsive-table-proportions
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply universal table centering fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              source = file.read_text(encoding="utf-8")
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:120]!r}")
              file.write_text(source.replace(old, new, 1), encoding="utf-8")

          base = "site/styles-base.css"
          replace_once(
              base,
              '''th,\ntd {\n  cursor: default;\n  user-select: none;\n  height: 38px;\n  border-bottom: 1px solid var(--border);\n  padding: 0 6px;\n  text-align: left;\n  white-space: nowrap;\n  line-height: 38px;''',
              '''th,\ntd {\n  cursor: default;\n  user-select: none;\n  height: 38px;\n  border-bottom: 1px solid var(--border);\n  padding: 0 6px;\n  text-align: left;\n  white-space: nowrap;\n  line-height: 1.2;\n  vertical-align: middle;''',
          )

          styles = "site/styles.css"
          replace_once(
              styles,
              '''table :is(th, td) > :is(a, span) {\n  line-height: inherit;\n  vertical-align: baseline;\n}''',
              '''table :is(th, td) > :is(a, span) {\n  line-height: inherit;\n  vertical-align: middle;\n}''',
          )
          replace_once(
              styles,
              '''#progressionPage .playerTableScroller th {\n  height: var(--mfl-table-header-height);\n  min-height: var(--mfl-table-header-height);\n  line-height: var(--mfl-table-header-height);\n}''',
              '''#progressionPage .playerTableScroller th {\n  height: var(--mfl-table-header-height);\n  min-height: var(--mfl-table-header-height);\n  line-height: 1.2;\n  vertical-align: middle;\n}\n\n#progressionPage #tableHead .tableHeaderCellContent {\n  display: flex;\n  align-items: center;\n  width: 100%;\n  height: var(--mfl-table-header-height);\n  min-height: var(--mfl-table-header-height);\n  line-height: 1.2;\n}\n\n#progressionPage #tableHead :is(.selectionCell, .rowActionsCell) .tableHeaderCellContent {\n  justify-content: center;\n}''',
          )
          replace_once(
              styles,
              '''#progressionPage .playerTableScroller td {\n  height: var(--mfl-table-row-height);\n  min-height: var(--mfl-table-row-height);\n  line-height: var(--mfl-table-row-height);\n  vertical-align: middle;\n}''',
              '''#progressionPage .playerTableScroller td {\n  height: var(--mfl-table-row-height);\n  min-height: var(--mfl-table-row-height);\n  line-height: 1.2;\n  vertical-align: middle;\n}''',
          )

          table = "site/modules/core-sources/table.js"
          source = Path(table).read_text(encoding="utf-8")
          helper_anchor = '''function tableCenterCellContents(cell) {'''
          if helper_anchor not in source:
              raise SystemExit("table centering helper anchor missing")
          header_helper = '''function tableCenterHeaderCellContents(cell) {\n  if (!(cell instanceof HTMLTableCellElement)) return cell;\n  const existingHost = cell.childNodes.length === 1\n    && cell.firstElementChild instanceof HTMLElement\n    && cell.firstElementChild.classList.contains("tableHeaderCellContent")\n    ? cell.firstElementChild\n    : null;\n  if (existingHost) return cell;\n\n  const contentHost = document.createElement("span");\n  contentHost.className = "tableHeaderCellContent";\n  while (cell.firstChild) contentHost.appendChild(cell.firstChild);\n  cell.appendChild(contentHost);\n  return cell;\n}\n\n'''
          source = source.replace(helper_anchor, header_helper + helper_anchor, 1)
          for old, new in [
              ('headerRow.appendChild(selectionHeader);', 'headerRow.appendChild(tableCenterHeaderCellContents(selectionHeader));'),
              ('headerRow.appendChild(actionsHeader);', 'headerRow.appendChild(tableCenterHeaderCellContents(actionsHeader));'),
              ('    headerRow.appendChild(cell);', '    headerRow.appendChild(tableCenterHeaderCellContents(cell));'),
          ]:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{table}: expected one match, found {count}: {old}")
              source = source.replace(old, new, 1)
          Path(table).write_text(source, encoding="utf-8")

          validator = Path("site/validate-table-row-vertical-centering.mjs")
          source = validator.read_text(encoding="utf-8")
          source = source.replace(
              'const styles = readFileSync(resolve(root, "styles.css"), "utf8");',
              'const styles = readFileSync(resolve(root, "styles.css"), "utf8");\nconst baseStyles = readFileSync(resolve(root, "styles-base.css"), "utf8");',
              1,
          )
          source = source.replace(
              'assert.match(playerCellGeometry, /vertical-align: middle;/, "Table cells must retain native middle alignment as the table-layout fallback.");',
              'assert.match(playerCellGeometry, /line-height: 1\\.2;/, "Player cells must not use full-row line-height as a vertical-positioning mechanism.");\nassert.match(playerCellGeometry, /vertical-align: middle;/, "Table cells must retain native middle alignment as the table-layout fallback.");\nassert.doesNotMatch(playerCellGeometry, /line-height: var\\(--mfl-table-row-height\\);/, "Player cells must not vertically position content with row-height line boxes.");\n\nconst baseCellGeometry = baseStyles.match(/th,\\ntd \\{([\\s\\S]*?)\\n\\}/)?.[1] || "";\nassert.match(baseCellGeometry, /line-height: 1\\.2;/, "Global table cells must use a normal text line box.");\nassert.match(baseCellGeometry, /vertical-align: middle;/, "Global table cells must vertically center their line box.");\nassert.doesNotMatch(baseCellGeometry, /line-height: 38px;/, "Global tables must not use a fixed full-row line-height for centering.");\nassert.doesNotMatch(styles, /table :is\\(th, td\\) > :is\\(a, span\\) \\{[\\s\\S]*?vertical-align: baseline;/, "Direct table links and spans must never be forced back onto the baseline.");\n\nconst playerHeaderGeometry = styles.match(/#progressionPage \\.playerTableScroller th \\{([\\s\\S]*?)\\n\\}/)?.[1] || "";\nassert.match(playerHeaderGeometry, /line-height: 1\\.2;/, "Player headers must use a normal line box.");\nassert.match(playerHeaderGeometry, /vertical-align: middle;/, "Player headers must retain native middle alignment.");\nassert.doesNotMatch(playerHeaderGeometry, /line-height: var\\(--mfl-table-header-height\\);/, "Player headers must not use header-height line boxes for centering.");\n\nconst headerContent = styles.match(/#progressionPage #tableHead \\.tableHeaderCellContent \\{([\\s\\S]*?)\\n\\}/)?.[1] || "";\nassert.match(headerContent, /display: flex;/, "Every player-table header must use a flex content host.");\nassert.match(headerContent, /align-items: center;/, "Header text, arrows, and icons must share the exact vertical midpoint.");\nassert.match(headerContent, /height: var\\(--mfl-table-header-height\\);/, "Header content host must own the full header height.");',
              1,
          )
          source = source.replace(
              'for (const source of [tableSource, generatedTable]) {',
              'for (const source of [tableSource, generatedTable]) {\n  assert.match(source, /function tableCenterHeaderCellContents\\(cell\\) \\{/, "Canonical Table ownership must define one shared header-cell centering helper.");\n  assert.match(source, /contentHost\\.className = "tableHeaderCellContent";/, "Every wrapped header must use the canonical full-height header host.");\n  assert.match(source, /headerRow\\.appendChild\\(tableCenterHeaderCellContents\\(selectionHeader\\)\\);/, "Header selection control must use the shared centering helper.");\n  assert.match(source, /headerRow\\.appendChild\\(tableCenterHeaderCellContents\\(actionsHeader\\)\\);/, "Header action cell must use the shared centering helper.");\n  assert.match(source, /headerRow\\.appendChild\\(tableCenterHeaderCellContents\\(cell\\)\\);/, "Every rendered data header must use the shared centering helper.");',
              1,
          )
          source = source.replace(
              'console.log("Every player-table row item, including player names, markers, listings, controls, and stat content, keeps viewport-independent vertical centering with a descender-safe text line box.");',
              'console.log("Every table cell uses middle alignment without full-row line-height positioning, and every player-table header/body item shares a full-height centered content host.");',
              1,
          )
          validator.write_text(source, encoding="utf-8")

          loading_validator = Path("site/validate-filter-loading-blank-rows.mjs")
          source = loading_validator.read_text(encoding="utf-8")
          old = '''    && styles.includes("#progressionPage .playerTableScroller td {\\n  height: var(--mfl-table-row-height);\\n  min-height: var(--mfl-table-row-height);\\n  line-height: var(--mfl-table-row-height);\\n  vertical-align: middle;\\n}"),'''
          new = '''    && styles.includes("#progressionPage .playerTableScroller td {\\n  height: var(--mfl-table-row-height);\\n  min-height: var(--mfl-table-row-height);\\n  line-height: 1.2;\\n  vertical-align: middle;\\n}"),'''
          if source.count(old) != 1:
              raise SystemExit("loading-row canonical td contract marker missing")
          source = source.replace(old, new, 1)
          source = source.replace(
              '"Populated and loading table rows must share the canonical tbody/tr/td height contract.",',
              '"Populated and loading table rows must share the canonical tbody/tr/td height contract independently from text line-height.",',
              1,
          )
          loading_validator.write_text(source, encoding="utf-8")
          PY

          cd site
          node build-app-core.mjs
      - name: Snapshot product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/styles-base.css site/styles.css site/modules/core-sources/table.js site/modules/app-core-table-runtime.js site/validate-table-row-vertical-centering.mjs site/validate-filter-loading-blank-rows.mjs
          git diff --cached --check
          git commit -m "Center all table content vertically"
      - name: Validate site
        shell: bash
        run: |
          set -euo pipefail
          cd site
          npm ci
          npm run check
      - name: Remove scaffolding and push
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/refine-pr-616-universal-table-centering.yml .github/workflows/refine-pr-616-universal-table-centering-v2.yml
          git commit -m "Remove PR 616 universal-centering scaffolding"
          git push origin HEAD:fix/599-responsive-table-proportions
name: One-time exact table grid

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-exact-table-grid.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply exact table grid
        run: python .github/scripts/apply_exact_table_grid.py
      - name: Commit exact table grid
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/app.js .github/scripts/apply_exact_table_grid.py .github/workflows/one-time-exact-table-grid.yml
          git commit -m "Keep shared columns identical across table views"
          git push origin main

name: Club startup source migration

on:
  push:
    branches:
      - refactor/source-owned-club-startup
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/source-owned-club-startup
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source-owned Club startup migration
        id: migrate
        shell: bash
        run: |
          set +e
          output="$(node site/migrate-source-owned-club-startup.mjs 2>&1)"
          status=$?
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            printf '%s\n' "$output" > site/club-startup-migration-error.txt
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Remove temporary migration scaffolding after success
        if: steps.migrate.outputs.failed == 'false'
        shell: bash
        run: |
          rm -f site/migrate-source-owned-club-startup.mjs
          rm -f .github/workflows/club-startup-source-migration.yml
          rm -f site/club-startup-migration-error.txt
      - name: Persist migration result
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "No Club startup migration changes to persist."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.migrate.outputs.failed }}" = "true" ]; then
            git commit -m "Capture Club startup migration mismatch"
          else
            git commit -m "Move Club startup lifecycle into source"
          fi
          git push origin HEAD:refactor/source-owned-club-startup

name: Build app.js only
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/app-js-only-once.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consolidate scripts
        run: |
          cat site/app-core.js site/app-fixes.js > site/app.js.tmp
          mv site/app.js.tmp site/app.js
          python - <<'PY'
          from pathlib import Path
          p = Path('site/app.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('  if (isClubRoute()) {\n    document.body.classList.add("clubAtomicInitial");\n  }\n\n', '')
          s = s.replace('    body.clubAtomicInitial #loadingScreen { display: flex !important; visibility: visible !important; opacity: 1 !important; }\n', '')
          s = s.replace('    body.clubAtomicInitial #progressionPage,\n    body.clubAtomicSwitch #progressionPage .tableShell', '    body.clubAtomicSwitch #progressionPage .tableShell')
          s = s.replace('    body.clubAtomicInitial #progressionPage *,\n    body.clubAtomicSwitch #progressionPage .tableShell *', '    body.clubAtomicSwitch #progressionPage .tableShell *')
          p.write_text(s, encoding='utf-8')
          PY
          rm site/app-core.js site/app-fixes.js
          node --check site/app.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/app.js
          git add -u site/app-core.js site/app-fixes.js
          git commit -m "Use app.js as the only application script"
          git push

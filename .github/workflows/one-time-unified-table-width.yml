name: One-time unified table width

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-unified-table-width.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply unified table width
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('site/app.js')
          source = path.read_text(encoding='utf-8')
          marker = '/* Unified full-width player tables */'
          if marker in source:
              source = source.split(marker, 1)[0].rstrip()

          source += r'''

/* Unified full-width player tables */
(() => {
  const COLUMN_WIDTHS = {
    "col-select": 3,
    "col-id": 3,
    "col-flag": 3,
    "col-name": 13,
    "col-nationality": 7,
    "col-age": 4,
    "col-positions": 8,
    "col-seasons": 5,
    "col-stat": 6,
    "col-contract-revenue": 8,
    "col-contract-club": 19,
    "col-contract-division": 9,
    "col-agent": 9,
    "col-joined-agency": 9,
    "col-owned-since": 9,
    "col-link": 3,
  };

  function sharedTableWidth() {
    const page = document.querySelector('#progressionPage');
    const shell = page?.querySelector('.tableShell');
    const parent = shell?.parentElement || page;
    const width = parent?.getBoundingClientRect().width || shell?.getBoundingClientRect().width || 0;
    return Math.max(0, Math.floor(width));
  }

  function applyUnifiedTableWidth() {
    const width = sharedTableWidth();
    if (!width) return false;

    document.querySelectorAll('#progressionPage .tableShell, #progressionPage .tableScroller').forEach((element) => {
      element.style.setProperty('width', '100%', 'important');
      element.style.setProperty('min-width', '100%', 'important');
      element.style.setProperty('max-width', '100%', 'important');
      element.style.setProperty('box-sizing', 'border-box', 'important');
      element.style.setProperty('overflow', 'visible', 'important');
    });

    document.querySelectorAll('#progressionPage .tableScroller table').forEach((table) => {
      const tableWidth = `${width}px`;
      table.style.setProperty('table-layout', 'fixed', 'important');
      table.style.setProperty('width', tableWidth, 'important');
      table.style.setProperty('min-width', tableWidth, 'important');
      table.style.setProperty('max-width', tableWidth, 'important');
      table.style.setProperty('box-sizing', 'border-box', 'important');

      const colGroup = table.querySelector('colgroup');
      if (!colGroup) return;
      Array.from(colGroup.children).forEach((column) => {
        const className = Object.keys(COLUMN_WIDTHS).find((name) => column.classList.contains(name));
        if (!className) return;
        const pixels = `${(width * COLUMN_WIDTHS[className]) / 100}px`;
        column.style.setProperty('width', pixels, 'important');
        column.style.setProperty('min-width', pixels, 'important');
        column.style.setProperty('max-width', pixels, 'important');
      });
    });

    return true;
  }

  if (typeof buildTableColGroup === 'function') {
    const originalBuildTableColGroup = buildTableColGroup;
    buildTableColGroup = function buildTableColGroupWithUnifiedWidth() {
      const result = originalBuildTableColGroup.apply(this, arguments);
      applyUnifiedTableWidth();
      return result;
    };
  }

  if (typeof buildHeader === 'function') {
    const originalBuildHeader = buildHeader;
    buildHeader = function buildHeaderWithUnifiedWidth() {
      const result = originalBuildHeader.apply(this, arguments);
      applyUnifiedTableWidth();
      return result;
    };
  }

  if (typeof renderTable === 'function') {
    const originalRenderTable = renderTable;
    renderTable = function renderTableWithUnifiedWidth() {
      const result = originalRenderTable.apply(this, arguments);
      applyUnifiedTableWidth();
      return result;
    };
  }

  const style = document.createElement('style');
  style.textContent = `
    #progressionPage .tableShell,
    #progressionPage .tableScroller {
      width: 100% !important;
      min-width: 100% !important;
      max-width: 100% !important;
      box-sizing: border-box !important;
      overflow: visible !important;
    }
    #progressionPage .tableScroller table {
      table-layout: fixed !important;
      box-sizing: border-box !important;
    }
  `;
  document.head.appendChild(style);

  applyUnifiedTableWidth();
  window.addEventListener('resize', applyUnifiedTableWidth, { passive: true });
})();
'''
          path.write_text(source, encoding='utf-8')
          Path('.github/workflows/one-time-unified-table-width.yml').unlink()
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/app.js .github/workflows/one-time-unified-table-width.yml
          git commit -m "Make all player tables the same full width"
          git push origin main

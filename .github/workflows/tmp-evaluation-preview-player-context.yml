name: Temporary Evaluation preview player context patch

on:
  push:
    branches:
      - ui/evaluation-preview-player-context

permissions:
  contents: write

jobs:
  patch-preview:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/evaluation-preview-player-context
      - name: Update Evaluation preview context
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, expected=1):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrences of {old!r}, found {count}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          share = "site/api/_evaluation-share-preview.js"
          replace(
              share,
              'const {\n  evaluationPresentValueTotalFromSharePayload,\n  formatEvaluationPreviewCurrency,\n} = require("./_evaluation-preview-value");',
              'const { evaluationPresentValueTotalFromSharePayload } = require("./_evaluation-preview-value");',
          )
          replace(
              share,
              '  position: "",\n  age: null,\n  presentValue: null,',
              '  position: "",\n  positions: "",\n  nationality: "",\n  age: null,\n  presentValue: null,',
          )
          replace(
              share,
              '''function normalizedPosition(value) {
            return String(value || "").trim().replace(/[^a-zA-Z0-9 -]/g, "").slice(0, 12);
          }
          ''',
              '''function normalizedPosition(value) {
            return String(value || "").trim().replace(/[^a-zA-Z0-9 -]/g, "").slice(0, 12);
          }

          function normalizedPositions(value) {
            return String(value || "")
              .trim()
              .toUpperCase()
              .replace(/\\s*,\\s*/g, ", ")
              .replace(/\\s+/g, " ")
              .replace(/[^A-Z0-9, /-]/g, "")
              .slice(0, 48);
          }

          function normalizedNationality(value) {
            return String(value || "")
              .trim()
              .replace(/[_\\s]+/g, " ")
              .split(" ")
              .filter(Boolean)
              .map((word) => word.charAt(0).toUpperCase() + word.slice(1).toLowerCase())
              .join(" ")
              .slice(0, 64);
          }
          ''',
          )
          replace(
              share,
              'return { playerId: "", playerName: "", age: null, retirementYears: null };',
              'return { playerId: "", playerName: "", positions: "", nationality: "", age: null, retirementYears: null };',
              expected=2,
          )
          replace(
              share,
              '"SELECT name, age, retirement_years FROM players WHERE player_id = ? LIMIT 1",',
              '"SELECT name, age, retirement_years, nationality, positions FROM players WHERE player_id = ? LIMIT 1",',
          )
          replace(
              share,
              '''      playerName: normalizedPlayerName(row?.name),
                age: roundedMetric(row?.age),
                retirementYears: roundedMetric(row?.retirement_years),''',
              '''      playerName: normalizedPlayerName(row?.name),
                positions: normalizedPositions(row?.positions),
                nationality: normalizedNationality(row?.nationality),
                age: roundedMetric(row?.age),
                retirementYears: roundedMetric(row?.retirement_years),''',
          )
          replace(
              share,
              '''  const playerName = normalizedPlayerName(publicPlayer.playerName) || payloadPlayerName;
            const position = normalizedPosition(payload.summaryPosition || payload.summary_position);''',
              '''  const playerName = normalizedPlayerName(publicPlayer.playerName) || payloadPlayerName;
            const positions = normalizedPositions(publicPlayer.positions);
            const nationality = normalizedNationality(publicPlayer.nationality);
            const position = normalizedPosition(payload.summaryPosition || payload.summary_position);''',
          )
          replace(
              share,
              '''  const details = [];
            if (overall !== null) details.push(`Overall ${overall}`);
            if (position) details.push(`Position ${position}`);
            if (age !== null) details.push(`Age ${age}`);
            if (presentValue !== null) details.push(`Value ${formatEvaluationPreviewCurrency(presentValue)}`);

            return {
              title: `${subject} Evaluation - MFL Front Office`,
              description: `Shared MFL Front Office Evaluation for ${subject}${playerName ? ` (#${playerId})` : ""}${details.length ? ` - ${details.join(" · ")}` : ""}.`,''',
              '''  const identitySuffix = playerName ? ` (#${playerId})` : "";
            const descriptionDetails = [];
            if (age !== null) descriptionDetails.push(`${age} yo`);
            if (overall !== null) descriptionDetails.push(`${overall} rated`);
            if (positions || position) descriptionDetails.push(positions || position);
            if (nationality) descriptionDetails.push(`from ${nationality}`);

            return {
              title: `${subject} Evaluation - MFL Front Office`,
              description: `MFL Front Office Evaluation for ${subject}${identitySuffix}${descriptionDetails.length ? ` - ${descriptionDetails.join(" ")}` : ""}`,''',
          )
          replace(
              share,
              '    position,\n    age,\n    presentValue,',
              '    position,\n    positions,\n    nationality,\n    age,\n    presentValue,',
          )

          card = "site/api/_evaluation-preview-card.js"
          replace(
              card,
              'const { PassThrough } = require("node:stream");',
              'const { PassThrough, Readable } = require("node:stream");',
          )
          replace(
              card,
              '''const COLORS = Object.freeze({
            pageBg: "#101418",
            surface: "#171d22",
            surfaceMuted: "#1d252c",
            border: "#303b44",
            borderStrong: "#46535e",
            text: "#e8eef3",
            muted: "#a9b4bd",
            soft: "#8f9ba5",
            primary: "#4aa3df",
          });''',
              '''const COLORS = Object.freeze({
            pageBg: "#101418",
            surface: "#171d22",
            surfaceMuted: "#1d252c",
            border: "#303b44",
            borderStrong: "#46535e",
            text: "#e8eef3",
            muted: "#a9b4bd",
            soft: "#8f9ba5",
            primary: "#4aa3df",
          });

          const FLAG_CODE_BY_NATIONALITY = Object.freeze({
            ALBANIA: "AL", ALGERIA: "DZ", ARGENTINA: "AR", AUSTRALIA: "AU", AUSTRIA: "AT",
            BELGIUM: "BE", BOSNIA_AND_HERZEGOVINA: "BA", BRAZIL: "BR", CAMEROON: "CM",
            CANADA: "CA", CAPE_VERDE_ISLANDS: "CV", CHILE: "CL", COLOMBIA: "CO", CONGO_DR: "CD",
            COSTA_RICA: "CR", COTE_D_IVOIRE: "CI", CROATIA: "HR", CURACAO: "CW", CZECH_REPUBLIC: "CZ",
            CZECHIA: "CZ", DENMARK: "DK", ECUADOR: "EC", EGYPT: "EG",
            ENGLAND: "1f3f4-e0067-e0062-e0065-e006e-e0067-e007f", FINLAND: "FI", FRANCE: "FR",
            GEORGIA: "GE", GERMANY: "DE", GHANA: "GH", HAITI: "HT", HUNGARY: "HU", IRAN: "IR",
            IRAQ: "IQ", ITALY: "IT", IVORY_COAST: "CI", JAPAN: "JP", JORDAN: "JO",
            KOREA_REPUBLIC: "KR", MEXICO: "MX", MOROCCO: "MA", NETHERLANDS: "NL", NEW_ZEALAND: "NZ",
            NIGERIA: "NG", NORWAY: "NO", PANAMA: "PA", PARAGUAY: "PY", PERU: "PE", POLAND: "PL",
            PORTUGAL: "PT", QATAR: "QA", REPUBLIC_OF_IRELAND: "IE", ROMANIA: "RO", RUSSIA: "RU",
            SAUDI_ARABIA: "SA", SCOTLAND: "1f3f4-e0067-e0062-e0073-e0063-e0074-e007f", SENEGAL: "SN",
            SERBIA: "RS", SLOVAKIA: "SK", SLOVENIA: "SI", SOUTH_AFRICA: "ZA", SOUTH_KOREA: "KR",
            SPAIN: "ES", SWEDEN: "SE", SWITZERLAND: "CH", TUNISIA: "TN", TURKEY: "TR", UKRAINE: "UA",
            UNITED_KINGDOM: "GB", UNITED_STATES: "US", UNITED_STATES_OF_AMERICA: "US", URUGUAY: "UY",
            USA: "US", UZBEKISTAN: "UZ", WALES: "1f3f4-e0067-e0062-e0077-e006c-e0073-e007f",
          });''',
          )
          replace(
              card,
              '''function cardText(value) {
            return String(value ?? "")
              .replace(/[\\u0000-\\u001f\\u007f]/g, "")
              .replace(/\\s+/g, " ")
              .trim();
          }
          ''',
              '''function cardText(value) {
            return String(value ?? "")
              .replace(/[\\u0000-\\u001f\\u007f]/g, "")
              .replace(/\\s+/g, " ")
              .trim();
          }

          function twemojiCodepointsForNationality(nationality) {
            const key = cardText(nationality)
              .toUpperCase()
              .replace(/[^A-Z0-9]+/g, "_")
              .replace(/^_+|_+$/g, "");
            const code = FLAG_CODE_BY_NATIONALITY[key] || "";
            if (!code) return "";
            return code.includes("-")
              ? code
              : code
                .toUpperCase()
                .split("")
                .map((character) => (127397 + character.charCodeAt(0)).toString(16))
                .join("-");
          }

          async function loadNationalityFlag(nationality) {
            const codepoints = twemojiCodepointsForNationality(nationality);
            if (!codepoints) return null;
            try {
              const response = await fetch(
                `https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/72x72/${codepoints}.png`,
                { headers: { Accept: "image/png" } },
              );
              if (!response.ok) return null;
              const bytes = Buffer.from(await response.arrayBuffer());
              return await PImage.decodePNGFromStream(Readable.from([bytes]));
            } catch {
              return null;
            }
          }
          ''',
          )
          replace(
              card,
              '''  drawMetric(context, x, columnWidths[0], "Overall", metadata.overall);
            drawMetric(context, x + columnWidths[0], columnWidths[1], "Position", metadata.position || "-");''',
              '''  drawMetric(context, x, columnWidths[0], "Position", metadata.position || "-");
            drawMetric(context, x + columnWidths[0], columnWidths[1], "Overall", metadata.overall);''',
          )
          replace(
              card,
              '''async function imageToPngBuffer(image) {''',
              '''async function drawNationalityLine(context, metadata) {
            const nationality = cardText(metadata.nationality);
            if (!nationality) return;
            const y = 276;
            const flag = await loadNationalityFlag(nationality);
            if (flag) {
              context.drawImage(flag, px(72), px(y), px(30), px(30));
              drawText(context, `- ${nationality}`, 111, y + 1, 400, 26, COLORS.soft);
              return;
            }
            drawText(context, nationality, 72, y + 1, 400, 26, COLORS.soft);
          }

          async function imageToPngBuffer(image) {''',
          )
          replace(
              card,
              '''    drawText(context, playerLabel, 70, 145, 700, playerSize, COLORS.text);
                drawText(context, `Player #${cardText(metadata.playerId)}`, 72, 246, 400, 29, COLORS.soft);
                drawSummaryStrip(context, metadata);''',
              '''    drawText(context, playerLabel, 70, 130, 700, playerSize, COLORS.text);
                drawText(context, `Player #${cardText(metadata.playerId)}`, 72, 224, 400, 29, COLORS.soft);
                await drawNationalityLine(context, metadata);
                drawSummaryStrip(context, metadata);''',
          )

          validator = "site/validate-evaluation-share-preview.mjs"
          replace(
              validator,
              'previewOwner.includes("SELECT name, age, retirement_years FROM players WHERE player_id = ? LIMIT 1")',
              'previewOwner.includes("SELECT name, age, retirement_years, nationality, positions FROM players WHERE player_id = ? LIMIT 1")',
          )
          replace(
              validator,
              '''  previewOwner.includes("evaluationPresentValueTotalFromSharePayload(payload, {")
                && previewOwner.includes("Value"),
              "Shared preview metadata must expose the same Value represented by the Evaluation summary table.",''',
              '''  previewOwner.includes("evaluationPresentValueTotalFromSharePayload(payload, {")
                && previewOwner.includes("positions")
                && previewOwner.includes("nationality"),
              "Shared preview metadata must retain canonical Value while adding public positions and nationality context.",''',
          )
          replace(
              validator,
              '''assert(previewOwner.includes("`Value ${formatEvaluationPreviewCurrency(presentValue)}`"), "Shared-link metadata must label the metric as Value.");
          assert(!previewOwner.includes("`Present Value ${formatEvaluationPreviewCurrency(presentValue)}`"), "Shared-link metadata must not expose the old Present Value label.");''',
              '''assert(
            previewOwner.includes("MFL Front Office Evaluation for ${subject}${identitySuffix}")
              && previewOwner.includes("`${age} yo`")
              && previewOwner.includes("`${overall} rated`")
              && previewOwner.includes("`from ${nationality}`"),
            "Shared-link metadata must use the concise player-context description.",
          );
          assert(!previewOwner.includes("Shared MFL Front Office Evaluation for"), "Shared-link metadata must not retain the old description format.");''',
          )
          replace(
              validator,
              '''assert(previewCard.includes("Player #${"), "Dynamic Evaluation preview card must retain the player identifier as secondary context.");
          for (const field of ["Overall", "Position", "Age", "Value"]) {
            assert(previewCard.includes(`"${field}"`), `Dynamic Evaluation preview card must render ${field}.`);
          }''',
              '''assert(previewCard.includes("Player #${"), "Dynamic Evaluation preview card must retain the player identifier as secondary context.");
          assert(
            previewCard.includes('drawMetric(context, x, columnWidths[0], "Position", metadata.position || "-");')
              && previewCard.includes('drawMetric(context, x + columnWidths[0], columnWidths[1], "Overall", metadata.overall);'),
            "Dynamic Evaluation preview card must render Position before Overall.",
          );
          assert(
            previewCard.includes("drawNationalityLine")
              && previewCard.includes("metadata.nationality")
              && previewCard.includes("twemoji@14.0.2/assets/72x72"),
            "Dynamic Evaluation preview card must render nationality with the canonical Twemoji flag style.",
          );
          for (const field of ["Overall", "Position", "Age", "Value"]) {
            assert(previewCard.includes(`"${field}"`), `Dynamic Evaluation preview card must render ${field}.`);
          }''',
          )
          replace(
              validator,
              '''  playerName: "Mario Rossi",
            age: 34,
            retirementYears: 0,
          });''',
              '''  playerName: "Mario Rossi",
            positions: "CB, RB",
            nationality: "ITALY",
            age: 34,
            retirementYears: 0,
          });''',
          )
          replace(
              validator,
              '''assert(contextualPreview.playerName === "Mario Rossi", "Shared preview metadata must use the current public player name.");
          assert(contextualPreview.age === 34, "Shared preview metadata must use the current public player age instead of a projected payload age.");
          assert(contextualPreview.presentValue === summaryPresentValue, "Shared preview metadata Present Value must equal the Evaluation summary-table Present Value.");
          assert(contextualPreview.title === "Mario Rossi Evaluation - MFL Front Office", "Shared preview title must identify the player by name.");
          assert(
            contextualPreview.description.includes("Age 34")
              && contextualPreview.description.includes("Value $24.00")
              && !contextualPreview.description.includes("Age 99"),
            "Shared preview description must expose current age and canonical Value only.",
          );''',
              '''assert(contextualPreview.playerName === "Mario Rossi", "Shared preview metadata must use the current public player name.");
          assert(contextualPreview.positions === "CB, RB", "Shared preview metadata must use the current public player positions.");
          assert(contextualPreview.nationality === "Italy", "Shared preview metadata must format the current public player nationality.");
          assert(contextualPreview.age === 34, "Shared preview metadata must use the current public player age instead of a projected payload age.");
          assert(contextualPreview.presentValue === summaryPresentValue, "Shared preview metadata Present Value must equal the Evaluation summary-table Present Value.");
          assert(contextualPreview.title === "Mario Rossi Evaluation - MFL Front Office", "Shared preview title must identify the player by name.");
          assert(
            contextualPreview.description === "MFL Front Office Evaluation for Mario Rossi (#80000) - 34 yo 82 rated CB, RB from Italy",
            "Shared preview description must expose current age, overall, positions, and nationality in the canonical sentence.",
          );''',
          )
      - name: Commit preview changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/api/_evaluation-share-preview.js site/api/_evaluation-preview-card.js site/validate-evaluation-share-preview.mjs
          git commit -m "Refine Evaluation link preview context"
          git push origin HEAD:ui/evaluation-preview-player-context

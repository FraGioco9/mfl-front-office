name: Shared core ownership profile

on:
  push:
    branches:
      - chore/shared-core-route-ownership
  pull_request:

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/shared-core-route-ownership
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Profile shared application core
        working-directory: site
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          import { normalizeBuiltApplicationCoreArtifacts } from "./modules/app-core-build-normalizer.js";

          const source = await readFile("./modules/app-core.js", "utf8");
          const artifacts = normalizeBuiltApplicationCoreArtifacts(source);
          const chunks = artifacts.routeChunks || {};
          const shared = String(artifacts.core || "");
          const count = (text, name) => (text.match(new RegExp(`\\b${name.replace(/[$]/g, "\\$")}\\b`, "g")) || []).length;
          const section = (label, text, startMarker, endMarker) => {
            const start = text.indexOf(startMarker);
            const end = start >= 0 ? text.indexOf(endMarker, start + startMarker.length) : -1;
            const value = start >= 0 && end > start ? text.slice(start, end) : "";
            console.log(`SECTION ${label} bytes=${value ? Buffer.byteLength(value) : -1}`);
            if (value) {
              const declarations = [...value.matchAll(/(?:^|\n)(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(/g)].map((match) => match[1]);
              console.log(`FUNCTIONS ${label} ${declarations.join(",")}`);
              for (const name of declarations) {
                const sharedRefs = count(shared, name);
                const owners = Object.entries(chunks).filter(([, chunk]) => count(String(chunk || ""), name) > 0).map(([chunkName]) => chunkName);
                console.log(`OWNERSHIP ${label} ${name} sharedRefs=${sharedRefs} chunks=${owners.join(",")}`);
              }
            }
            console.log(`END_SECTION ${label}`);
          };

          console.log(`SHARED_BYTES ${Buffer.byteLength(shared)}`);
          for (const [name, chunk] of Object.entries(chunks)) console.log(`CHUNK_BYTES ${name} ${Buffer.byteLength(String(chunk || ""))}`);

          section("settings-email-edit", source, "function setSettingsEmailAddressDraft(", "function updateSettingsEmailDraftActions(");
          section("watchlist-modal-helpers", source, "function openRenameWatchlistModal(", "function renderWatchlistSwitcher(");
          section("player-note-prefix", source, "function showPlayerNoteTooltip(", "function playerTrainingKey(");
          section("player-view-prefix", source, "function normalizePlayerAttributeView(", "function applyPlayerPageScrollTop(");
          section("evaluation-invalid-link", source, "function resetInvalidEvaluationLinkToPlainEvaluation(", "function evaluationDiscountRateFromUrl(");
          NODE

name: Issue 349 lazy table readiness fix

on:
  push:
    branches:
      - fix/loading-navigation-supersession
    paths:
      - .github/workflows/issue-349-lazy-table-readiness.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/loading-navigation-supersession

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Normalize lazy destination readiness source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('site/bootstrap-core.js')
          source = path.read_text()
          start_marker = '    function routeDestinationReady(pageName, options = {}) {'
          end_marker = '    function routeLoadingActive() {'
          start = source.find(start_marker)
          end = source.find(end_marker, start)
          if start < 0 or end <= start:
              raise SystemExit('routeDestinationReady function range missing')
          replacement = "\n".join([
              '    function routeDestinationReady(pageName, options = {}) {',
              '      const normalizedOptions = options && typeof options === "object" && !Array.isArray(options) ? options : {};',
              '      const coreReady = window.__mflIsRouteCoreReady?.(pageName, normalizedOptions) === true;',
              '      const runtimeReady = window.__mflIsRouteRuntimeReady?.(pageName, normalizedOptions) === true;',
              '      if (!coreReady || !runtimeReady) return false;',
              '      return window.__mflRouteDataCache?.isReady?.(pageName, normalizedOptions) === true;',
              '    }',
              '',
          ])
          path.write_text(source[:start] + replacement + source[end:])
          PY

      - name: Install site dependencies
        working-directory: site
        run: npm install --no-audit --no-fund

      - name: Validate source
        working-directory: site
        run: |
          node validate-loading-ownership.mjs
          npm run lint
          npm run typecheck

      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/bootstrap-core.js
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Normalize lazy route readiness formatting"
          git push origin HEAD:fix/loading-navigation-supersession

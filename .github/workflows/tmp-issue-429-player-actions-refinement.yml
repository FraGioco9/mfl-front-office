name: Temporary issue 429 Player action refinement

on:
  push:
    branches:
      - feat/issue-429-player-table-actions
    paths:
      - .github/workflows/tmp-issue-429-player-actions-refinement.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/issue-429-player-table-actions
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Refine canonical Player table actions
        working-directory: site
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          core_path = Path("modules/app-core.js")
          core = core_path.read_text()
          core = replace_once(
              core,
              '  evaluate: \'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h11"></path><path d="m13 8 4 4-4 4"></path></svg>\',',
              '  evaluate: \'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18"></path><path d="M17 7.5c-.8-1.4-2.4-2.2-5-2.2-3 0-5 1.3-5 3.4 0 2.4 2.4 3.1 5 3.4 3 .4 5 1.1 5 3.4 0 2.1-2 3.4-5 3.4-2.7 0-4.4-.9-5.3-2.5"></path></svg>\',',
              "exact Player-page Evaluate icon",
          )
          core = replace_once(
              core,
              '  watchlist: \'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.7l2.55 5.17 5.7.83-4.13 4.02.98 5.68L12 16.72 6.9 19.4l.98-5.68L3.65 9.7l5.8-.83L12 3.7z"></path></svg>\',\n  copy:',
              '  watchlist: \'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.7l2.55 5.17 5.7.83-4.13 4.02.98 5.68L12 16.72 6.9 19.4l.98-5.68L3.65 9.7l5.8-.83L12 3.7z"></path></svg>\',\n  watchlistFilled: \'<svg data-filled="true" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.7l2.55 5.17 5.7.83-4.13 4.02.98 5.68L12 16.72 6.9 19.4l.98-5.68L3.65 9.7l5.8-.83L12 3.7z"></path></svg>\',\n  copy:',
              "filled watchlist icon variant",
          )
          core = replace_once(
              core,
              '  if (hasWalletOptIn()) {\n    const watchlistLabel = playerIsInAnyWatchlist(key) ? "Remove from watchlist" : "Add to watchlist";\n    items.push(createPlayerTableActionItem("watchlist", watchlistLabel, "watchlist"));\n  }',
              '  if (hasWalletOptIn()) {\n    const watchlistIsActive = playerIsInAnyWatchlist(key);\n    const watchlistLabel = watchlistIsActive ? "Remove from watchlist" : "Add to watchlist";\n    items.push(createPlayerTableActionItem("watchlist", watchlistLabel, watchlistIsActive ? "watchlistFilled" : "watchlist"));\n  }',
              "filled star for Remove from watchlist",
          )
          core_path.write_text(core)

          dropdowns_path = Path("dropdowns.css")
          dropdowns = dropdowns_path.read_text()
          dropdowns = replace_once(
              dropdowns,
              '  border: 1px solid var(--border-strong);\n  border-radius: 5px;\n  background: var(--surface);\n  color: #ffffff;',
              '  border: 1px solid var(--primary);\n  border-radius: 5px;\n  background: var(--primary);\n  color: #ffffff;',
              "active-view trigger styling",
          )
          dropdowns = replace_once(
              dropdowns,
              '  border-color: var(--primary-hover);\n  background: var(--row-hover);\n  color: #ffffff;',
              '  border-color: var(--primary);\n  background: var(--primary);\n  color: #ffffff;',
              "active-view trigger interactive styling",
          )
          dropdowns = replace_once(
              dropdowns,
              '  width: 210px;\n  min-width: 210px;',
              '  width: 250px;\n  min-width: 250px;',
              "wider Player action menu",
          )
          dropdowns = replace_once(
              dropdowns,
              '.playerTableActionIcon svg {\n  display: block;\n  width: 16px;\n  height: 16px;\n  fill: none;\n  stroke: currentColor;\n  stroke-width: 1.8;\n  stroke-linecap: round;\n  stroke-linejoin: round;\n}',
              '.playerTableActionIcon svg {\n  display: block;\n  width: 16px;\n  height: 16px;\n  fill: none;\n  stroke: currentColor;\n  stroke-width: 1.8;\n  stroke-linecap: round;\n  stroke-linejoin: round;\n}\n\n.playerTableActionIcon svg[data-filled="true"] {\n  fill: currentColor;\n}',
              "filled remove-watchlist star styling",
          )
          dropdowns_path.write_text(dropdowns)

          validator_path = Path("validate-player-table-actions.mjs")
          validator = validator_path.read_text()
          validator = replace_once(
              validator,
              '      && code.includes(\'"Remove from watchlist" : "Add to watchlist"\')',
              '      && code.includes(\'watchlistIsActive ? "Remove from watchlist" : "Add to watchlist"\')\n      && code.includes(\'watchlistIsActive ? "watchlistFilled" : "watchlist"\')',
              "watchlist label/icon state validation",
          )
          validator = replace_once(
              validator,
              "      && code.includes('watchlist:')\n      && code.includes('copy:'),",
              "      && code.includes('watchlist:')\n      && code.includes('watchlistFilled:')\n      && code.includes('copy:'),",
              "filled watchlist icon validation",
          )
          validator = replace_once(
              validator,
              "    code.includes('M5 12h11')\n      && code.includes('m13 8 4 4-4 4')\n      && code.includes('let left = triggerRect.left;'),\n    \"Table Evaluate must use the Player-page arrow icon and the menu must anchor to the trigger left edge.\",",
              "    code.includes('M12 3v18')\n      && code.includes('M17 7.5c-.8-1.4-2.4-2.2-5-2.2-3 0-5 1.3-5 3.4 0 2.4 2.4 3.1 5 3.4 3 .4 5 1.1 5 3.4 0 2.1-2 3.4-5 3.4-2.7 0-4.4-.9-5.3-2.5')\n      && code.includes('let left = triggerRect.left;'),\n    \"Table Evaluate must use the exact Player-page valuation icon and the menu must anchor to the trigger left edge.\",",
              "exact Evaluate icon validation",
          )
          validator = replace_once(
              validator,
              '    && dropdowns.includes("border: 1px solid var(--border-strong);")\n    && dropdowns.includes("background: var(--surface);")\n    && dropdowns.includes(`.playerTableActionsButton[aria-expanded="true"] {\\n  outline: 0;\\n  border-color: var(--primary-hover);\\n  background: var(--row-hover);\\n  color: #ffffff;`)',
              '    && dropdowns.includes("border: 1px solid var(--primary);")\n    && dropdowns.includes("background: var(--primary);")\n    && dropdowns.includes(`.playerTableActionsButton[aria-expanded="true"] {\\n  outline: 0;\\n  border-color: var(--primary);\\n  background: var(--primary);\\n  color: #ffffff;`)\n    && dropdowns.includes("width: 250px;")\n    && dropdowns.includes("min-width: 250px;")\n    && dropdowns.includes(\'.playerTableActionIcon svg[data-filled="true"]\')\n    && dropdowns.includes("fill: currentColor;")',
              "trigger/menu/fill validation",
          )
          validator = replace_once(
              validator,
              '  "Player table actions must keep the boxed trigger white through hover/open states, keep menu icons centered and white, reuse row-selector hover, preserve left-edge motion, and retain canonical timing.",',
              '  "Player table actions must match active-view trigger styling, keep icons centered/white, fill the remove-watchlist star, keep the wider menu, reuse row-selector hover, preserve left-edge motion, and retain canonical timing.",',
              "validator message",
          )
          validator_path.write_text(validator)
          PY
      - name: Install dependencies
        working-directory: site
        run: npm install --no-audit --no-fund
      - name: Build canonical application core
        working-directory: site
        run: npm run build:core
      - name: Lint
        working-directory: site
        run: npm run lint
      - name: Typecheck
        working-directory: site
        run: npm run typecheck
      - name: Validate repository
        working-directory: site
        run: npm run validate
      - name: Commit refinements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/modules/app-core.js site/modules/app-core*-runtime.js site/dropdowns.css site/validate-player-table-actions.mjs
          git commit -m "refine Player table action menu visuals"
          git push origin HEAD:feat/issue-429-player-table-actions

name: Apply site-root validator patch

on:
  push:
    branches: [fix/vercel-site-project-root]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vercel-site-project-root
          fetch-depth: 0
      - name: Patch validator and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/patch_validate_site_root.py
          rm .github/scripts/patch_validate_site_root.py
          rm .github/workflows/temp-patch-validate-site-root.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- site/validate.mjs .github/scripts/patch_validate_site_root.py .github/workflows/temp-patch-validate-site-root.yml
          git commit -m "Align deployment validator with site root"
          git push origin HEAD:fix/vercel-site-project-root

name: Temporary Filters validator update

on:
  push:
    branches:
      - fix/view-button-refresh-text-flicker

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/view-button-refresh-text-flicker
          fetch-depth: 0
      - name: Update Filters route-state assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('site/validate-filter-popup-interactions.mjs')
          text = p.read_text()
          old = '  \'body[data-page="club"] #progressionPage .filtersViewButton\','
          new = '  \'html[data-route-table-page="club"] #progressionPage .filtersViewButton\','
          if old not in text:
              raise SystemExit('missing old Filters Club selector assertion')
          p.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/validate-filter-popup-interactions.mjs
          git commit -m "Validate continuous Club Filters route state"
          git push origin HEAD:fix/view-button-refresh-text-flicker

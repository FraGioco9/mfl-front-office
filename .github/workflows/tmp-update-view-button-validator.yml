name: Temporary view-button validator update

on:
  push:
    branches:
      - fix/view-button-refresh-text-flicker

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/view-button-refresh-text-flicker
          fetch-depth: 0
      - name: Update bootstrap view-button contract
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path("site/validate-bootstrap-ownership.mjs")
          text = path.read_text()
          old = '''includes(\n  bootstrap,\n  "container.insertBefore(button, switcher instanceof HTMLElement ? switcher : null);",\n  "View order must be represented by DOM order instead of CSS order overrides.",\n);\nincludes(\n  bootstrap,\n  'candidate.textContent = page === "club" ? "Squad" : "Attributes";',\n  "Club Squad must use real button text instead of generated pseudo-content.",\n);'''
          new = '''includes(\n  bootstrap,\n  "candidate.style.order = String(orderIndex + 1);",\n  "First-paint view order must use flex order without detaching any button node.",\n);\nincludes(\n  bootstrap,\n  'switcher.style.order = "100";',\n  "The Watchlist switcher must remain after the stable first-paint view buttons.",\n);\nexcludes(\n  bootstrap,\n  "container.insertBefore(",\n  "First-paint view buttons must never be detached and reinserted to change order.",\n);\nexcludes(\n  bootstrap,\n  "candidate.textContent",\n  "First-paint view-button labels must never be replaced during bootstrap.",\n);'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected one bootstrap validator block, found {count}")
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/validate-bootstrap-ownership.mjs
          git commit -m "Validate stable first-paint view buttons [skip ci]"
          git push origin HEAD:fix/view-button-refresh-text-flicker

name: Issue 203 marker placement

on:
  push:
    branches:
      - fix/issue-203-player-listing-column

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-203-player-listing-column

      - name: Move NEW marker and blank unlisted cells
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "site/modules/app-core.js",
              '        appendNameMarker(markerWrap, newMintMarker(row), "newMintMarker");\n',
              '',
          )

          replace_once(
              "site/modules/app-core.js",
              '        appendNameMarker(ageContent, retirementMarker(row), "retirementMarker");\n',
              '''        const retirement = retirementMarker(row);\n        appendNameMarker(\n          ageContent,\n          retirement || newMintMarker(row),\n          retirement ? "retirementMarker" : "newMintMarker",\n        );\n''',
          )

          replace_once(
              "site/modules/app-core.js",
              '''        } else {\n          listingContent.classList.add("listingCellUnlisted");\n          listingContent.textContent = "—";\n          listingContent.setAttribute("aria-label", "Not For Sale");\n        }\n''',
              '''        } else {\n          listingContent.classList.add("listingCellUnlisted");\n          listingContent.setAttribute("aria-label", "Not For Sale");\n        }\n''',
          )

          route_validator = Path("site/validate-table-route-core.mjs")
          text = route_validator.read_text(encoding="utf-8")
          text = text.replace(
              '  \'appendNameMarker(ageContent, retirementMarker(row), "retirementMarker");\',\n',
              '  \'const retirement = retirementMarker(row);\',\n  \'retirement || newMintMarker(row),\',\n  \'retirement ? "retirementMarker" : "newMintMarker",\',\n',
              1,
          )
          anchor = 'excludes(buildNormalizerSource, "normalizeTableControlCellAlignment", "Build normalization must not rewrite Table control-cell alignment.");\n'
          addition = '''excludes(coreSource, 'appendNameMarker(markerWrap, newMintMarker(row), "newMintMarker");', "NEW must not remain in the Name-cell marker slot.");\nexcludes(tableCore, 'appendNameMarker(markerWrap, newMintMarker(row), "newMintMarker");', "Generated Table core must keep NEW out of the Name-cell marker slot.");\n'''
          if anchor not in text:
              raise SystemExit("validate-table-route-core.mjs: insertion anchor missing")
          text = text.replace(anchor, addition + anchor, 1)
          route_validator.write_text(text, encoding="utf-8")

          listing_validator = Path("site/validate-listing-column.mjs")
          text = listing_validator.read_text(encoding="utf-8")
          anchor = 'assert.match(core, /maximumFractionDigits: 0/);\n'
          addition = '''assert.doesNotMatch(core, /listingContent\\.textContent = "—"/);\nassert.match(core, /listingContent\\.classList\\.add\\("listingCellUnlisted"\\);[\\s\\S]*listingContent\\.setAttribute\\("aria-label", "Not For Sale"\\);/);\n'''
          if anchor not in text:
              raise SystemExit("validate-listing-column.mjs: insertion anchor missing")
          text = text.replace(anchor, anchor + addition, 1)
          listing_validator.write_text(text, encoding="utf-8")

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: site
        run: npm install --no-audit --no-fund

      - name: Build and validate
        working-directory: site
        run: |
          npm run build:core
          npm run lint
          npm run typecheck
          npm run validate

      - name: Commit canonical and generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/modules/app-core.js site/modules/app-core-runtime.js site/modules/app-core-table-runtime.js site/validate-table-route-core.mjs site/validate-listing-column.mjs
          git commit -m "Align NEW marker with retirement status"

      - name: Verify generated artifacts
        working-directory: site
        run: npm run verify:generated

      - name: Push changes
        run: git push origin HEAD:fix/issue-203-player-listing-column

name: Temporary issue 351 discount-derived loading patch

on:
  push:
    branches:
      - fix/evaluation-discount-derived-loading-blank
    paths:
      - .github/workflows/tmp-issue-351-discount-derived-loading.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/evaluation-discount-derived-loading-blank
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source fix
        working-directory: site
        run: node patch-issue-351-discount-derived-loading.mjs
      - name: Install dependencies
        working-directory: site
        run: npm install --no-audit --no-fund
      - name: Build canonical application core
        working-directory: site
        run: npm run build:core
      - name: Lint
        working-directory: site
        run: npm run lint
      - name: Typecheck
        working-directory: site
        run: npm run typecheck
      - name: Validate repository
        working-directory: site
        run: npm run validate
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/modules/app-core.js site/modules/app-core-runtime.js site/modules/app-core-evaluation-runtime.js site/evaluation-discount-rate-runtime.js site/validate-domain-evaluation.mjs site/validate-evaluation-discount-derived-loading.mjs
          git commit -m "fix: blank discount-derived values while rate recalculates"
          git push origin HEAD:fix/evaluation-discount-derived-loading-blank

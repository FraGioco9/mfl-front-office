name: PERF-02B paired Table selectors (temporary)
on:
  push:
    branches: [audit-1034-perf02b-selector-ab]
    paths: [.github/workflows/perf02b-paired-ab.yml]
permissions:
  contents: read
  actions: read
jobs:
  paired:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CONTROL_SHA: 22b2e24905af976c40fa86037c32465d9d1f2c50
      DB_RUN_ID: "37038069396"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install and pin one dataset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          gh run download "$DB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name mfl_database --dir .
          python -m scripts.database.prepare_runtime_database mfl_database.db --validate-only
          mkdir -p api/data-files perf02-paired
          mv mfl_database.db api/data-files/mfl_database.db
          git worktree add --detach "$RUNNER_TEMP/perf02-control" "$CONTROL_SHA"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/perf02-control/node_modules"
          mkdir -p "$RUNNER_TEMP/perf02-control/api/data-files"
          ln -s "$GITHUB_WORKSPACE/api/data-files/mfl_database.db" "$RUNNER_TEMP/perf02-control/api/data-files/mfl_database.db"
          sha256sum api/data-files/mfl_database.db | tee perf02-paired/database-sha256.txt
      - name: Build both applications from same dependencies
        shell: bash
        run: |
          set -euo pipefail
          for app in "$RUNNER_TEMP/perf02-control" "$GITHUB_WORKSPACE"; do
            ( cd "$app"; npm run build:legacy; npm run build:public; npx next build --webpack; )
          done
      - name: Start local production servers
        shell: bash
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP/perf02-control" && npx next start -p 4001) > perf02-paired/control-server.log 2>&1 &
          echo "control_pid=$!" >> "$GITHUB_ENV"
          (cd "$GITHUB_WORKSPACE" && npx next start -p 4000) > perf02-paired/candidate-server.log 2>&1 &
          echo "candidate_pid=$!" >> "$GITHUB_ENV"
          for port in 4000 4001; do
            ready=no
            for i in $(seq 1 120); do
              if curl -fsS "http://127.0.0.1:$port/api/data?mode=summary" > /dev/null; then ready=yes; break; fi
              sleep 0.5
            done
            if [ "$ready" != yes ]; then cat perf02-paired/*-server.log; exit 1; fi
          done
      - name: Alternating A/B capture - five identical pairs
        shell: bash
        run: |
          set -euo pipefail
          for pair in 1 2 3 4 5; do
            if [ "$((pair % 2))" -eq 1 ]; then order="control candidate"; else order="candidate control"; fi
            for which in $order; do
              if [ "$which" = control ]; then app="$RUNNER_TEMP/perf02-control"; port=4001; sha="$CONTROL_SHA"; else app="$GITHUB_WORKSPACE"; port=4000; sha="$GITHUB_SHA"; fi
              echo "PERF02B-PAIR $pair $which"
              (cd "$app" &&
                MFL_BASE_URL="http://127.0.0.1:$port" MFL_BASELINE_OUTPUT="$GITHUB_WORKSPACE/perf02-paired/$which-$pair.json" MFL_BASELINE_RUNS=1 MFL_BASELINE_PROFILES=mobile-slow MFL_BASELINE_JOURNEYS=database-100 MFL_BASELINE_LABEL=perf02b-paired MFL_BASELINE_SOURCE_COMMIT="$sha" npm run performance:baseline
              ) > "perf02-paired/$which-$pair.log" 2>&1 || { tail -120 "perf02-paired/$which-$pair.log"; exit 1; }
            done
          done
      - name: Validate and summarize paired evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, statistics
          from pathlib import Path
          p=Path('perf02-paired')
          result={}
          contexts=[]
          for phase in ('cold','refresh','cached'):
            result[phase]={}
            for metric in ('usefulContentMs','settledMs','longTaskMs','cls'):
              vals={}
              for who in ('control','candidate'):
                vals[who]=[]
                for i in range(1,6):
                  j=json.loads((p/f'{who}-{i}.json').read_text())
                  m=j['metadata']
                  assert m['complete'] and m['completedRuns']==1 and m['profiles']==['mobile-slow']
                  assert [x['id'] for x in m['journeys']]==['database-100']
                  assert m['targetContext']['sourceCommit']==os.environ['CONTROL_SHA' if who=='control' else 'GITHUB_SHA']
                  contexts.append({k:m['targetContext'][k] for k in ('datasetGeneratedAt','datasetRowCount','datasetWalletCount','browserVersion','nodeVersion')})
                  snap=j['summary']['mobile-slow']['database-100']
                  assert snap['cached']['tableDiagnostics']['renderedRows']['median']==100
                  assert snap['cached']['tableDiagnostics']['renderedCells']['median']==1600
                  assert snap['cached']['tableDiagnostics']['tableWidth']['median']>0
                  vals[who].append(snap[phase][metric]['median'])
              diffs=[b-a for a,b in zip(vals['control'],vals['candidate'])]
              result[phase][metric]={'control':vals['control'],'candidate':vals['candidate'],'pairedDiff':diffs,'medianControl':statistics.median(vals['control']),'medianCandidate':statistics.median(vals['candidate']),'medianDiff':statistics.median(diffs)}
          assert all(x==contexts[0] for x in contexts), 'Inconsistent dataset/browser/node provenance'
          report={'control':os.environ['CONTROL_SHA'],'candidate':os.environ['GITHUB_SHA'],'context':contexts[0],'metrics':result}
          (p/'paired-summary.json').write_text(json.dumps(report,indent=2)+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
            f.write('### PERF-02B paired mobile Table CSS (five alternating pairs)\n\n| Phase | Metric | Control median | Candidate median | Median paired change |\n|---|---|---:|---:|---:|\n')
            for phase,mapping in result.items():
              for metric,values in mapping.items():
                f.write(f"| {phase} | {metric} | {values['medianControl']:.2f} | {values['medianCandidate']:.2f} | {values['medianDiff']:.2f} |\n")
          PY
      - name: Upload original and paired results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf02b-paired-${{ github.run_id }}
          path: perf02-paired/
          if-no-files-found: warn
          retention-days: 90
      - name: Stop local servers
        if: always()
        shell: bash
        run: |
          kill "${control_pid:-}" "${candidate_pid:-}" 2>/dev/null || true

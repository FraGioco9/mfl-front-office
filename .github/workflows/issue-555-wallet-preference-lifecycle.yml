# Temporary self-removing implementation workflow for issue #555.
name: Issue 555 wallet preference lifecycle

on:
  push:
    branches:
      - fix/555-wallet-preference-lifecycle
    paths:
      - site/migrate-555-wallet-preference-lifecycle.py
      - .github/workflows/issue-555-wallet-preference-lifecycle.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: fix/555-wallet-preference-lifecycle
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Normalize migration for split Settings runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("site/migrate-555-wallet-preference-lifecycle.py")
          text = path.read_text(encoding="utf-8")
          old = '''    if end_index < 0:\n        raise RuntimeError(f"{label}: end marker not found")'''
          new = '''    if end_index < 0:\n        if label == "saveSettingsPreferencesAfterChange":\n            return text\n        raise RuntimeError(f"{label}: end marker not found")'''
          if old not in text:
              raise SystemExit("migration end-marker guard not found")
          text = text.replace(old, new, 1)
          old_wrapper = '''function saveWalletPreferencesNow(options = {}) {\\n  const run = () => performWalletPreferencesSave(options);'''
          new_wrapper = '''async function saveWalletPreferencesNow(options = {}) {\\n  const run = () => performWalletPreferencesSave(options);'''
          if old_wrapper not in text:
              raise SystemExit("wallet save wrapper template not found")
          path.write_text(text.replace(old_wrapper, new_wrapper, 1), encoding="utf-8")
          PY
      - name: Apply canonical migration
        run: python site/migrate-555-wallet-preference-lifecycle.py
      - name: Align Settings persistence regression
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("site/validate-settings-route-core.mjs")
          text = path.read_text(encoding="utf-8")
          old = 'includes(settingsCore, "await saveWalletPreferencesNow();", "Explicit Settings Save must write through the existing wallet-preferences/Supabase owner.");'
          new = 'includes(settingsCore, \'await saveWalletPreferencesNow({ domains: ["settings"], includeSettings: true });\', "Explicit Settings Save must write only the Settings domain through the wallet-preferences/Supabase owner.");'
          if old not in text:
              raise SystemExit("Settings persistence assertion not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Align Supabase partial-domain persistence regression
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("site/validate-supabase-persistence.mjs")
          text = path.read_text(encoding="utf-8")
          old = '''includes(
            preferences,
            "table_state: tableState || {},",
            "Supabase writes must use the canonical tableState rather than the compatibility response shape.",
          );'''
          new = '''includes(
            preferences,
            'if (hasDomain("tableState")) {',
            "Supabase table-state writes must be explicitly scoped to the tableState preference domain.",
          );
          includes(
            preferences,
            "patch.table_state = mergeTableState(incoming.tableState, currentTableState) || {};",
            "Supabase table-state PATCHes must merge and store the canonical tableState rather than the compatibility response shape.",
          );
          includes(
            preferences,
            'method: "PATCH",',
            "Existing wallet preference rows must use partial PATCH updates so unrelated domains cannot be overwritten.",
          );'''
          if old not in text:
              raise SystemExit("Supabase canonical table-state assertion not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Align Evaluation single-hydration regression
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("site/validate-eval-ownership.mjs")
          text = path.read_text(encoding="utf-8")
          old = '''invariant(
            sharedCore.includes("let evaluationRecentStateHydrated = false;")
              && sharedCore.includes("evaluationRecentStateHydrated = true;")
              && sharedCore.includes("async function ensureEvaluationRecentStateHydrated()")
              && sharedCore.includes("await loadWalletPreferences({ force: true });")
              && sharedCore.includes("window.__mflWalletPreferencesStartupPromise = ensureEvaluationRecentStateHydrated();")
              && sharedCore.includes("    ensureEvaluationRecentStateHydrated,"),
            "Generated shared core must keep late Evaluation Supabase hydration inside the canonical lexical owner, including the one corrective fresh preference read for a late-installed owner, and publish it through the existing readiness promise.",
          );'''
          new = '''invariant(
            sharedCore.includes("let evaluationRecentStateHydrated = false;")
              && sharedCore.includes("evaluationRecentStateHydrated = true;")
              && sharedCore.includes("async function ensureEvaluationRecentStateHydrated()")
              && sharedCore.includes("const pendingStartup = window.__mflWalletPreferencesStartupPromise;")
              && sharedCore.includes("await Promise.resolve(pendingStartup).catch(() => undefined);")
              && sharedCore.includes("await loadWalletPreferences();")
              && !sharedCore.includes("await loadWalletPreferences({ force: true });")
              && !sharedCore.includes("window.__mflWalletPreferencesStartupPromise = ensureEvaluationRecentStateHydrated();")
              && sharedCore.includes("    ensureEvaluationRecentStateHydrated,"),
            "Generated shared core must keep late Evaluation Supabase hydration inside the canonical lexical owner while awaiting and reusing the one startup wallet-preference hydration instead of forcing a duplicate read.",
          );'''
          if old not in text:
              raise SystemExit("Evaluation corrective-refresh assertion not found")
          text = text.replace(old, new, 1)
          old_log = 'console.log("Direct core ownership validation passed without table, search, Evaluation, app-entry, or global-function eval bridges, with authoritative late Evaluation Supabase hydration and its corrective refresh retained in shared-core ownership.");'
          new_log = 'console.log("Direct core ownership validation passed without table, search, Evaluation, app-entry, or global-function eval bridges, with authoritative late Evaluation Supabase hydration reusing the canonical startup preference lifecycle.");'
          if old_log not in text:
              raise SystemExit("Evaluation ownership validation summary not found")
          path.write_text(text.replace(old_log, new_log, 1), encoding="utf-8")
          PY
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install site dependencies
        working-directory: site
        run: npm install --no-audit --no-fund
      - name: Lint
        working-directory: site
        run: npm run lint
      - name: Typecheck
        working-directory: site
        run: npm run typecheck
      - name: Build canonical application core
        working-directory: site
        run: npm run build:core
      - name: Stage generated application artifacts
        working-directory: site
        run: git add modules/app-core*-runtime.js table-width-runtime.js
      - name: Verify generated application artifacts
        working-directory: site
        run: npm run verify:generated
      - name: Repository validation
        working-directory: site
        run: npm run validate
      - name: Commit clean implementation
        run: |
          git rm site/migrate-555-wallet-preference-lifecycle.py .github/workflows/issue-555-wallet-preference-lifecycle.yml
          git add -A
          git commit -m "Fix wallet preference hydration and persistence"
          git push origin HEAD:fix/555-wallet-preference-lifecycle

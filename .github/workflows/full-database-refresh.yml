name: Full database refresh

run-name: >-
  ${{ inputs.occurrence_key != '' && format('Full database refresh [{0}] via {1}', inputs.occurrence_key, inputs.trigger_source) || 'Full database refresh' }}

on:
  workflow_dispatch:
    inputs:
      trigger_source:
        description: Trigger source used by timing telemetry.
        required: false
        default: manual
        type: string
      intended_at:
        description: Intended occurrence as an offset-aware ISO 8601 timestamp.
        required: false
        default: ""
        type: string
      occurrence_key:
        description: Stable occurrence key, for example 20260827-1903.
        required: false
        default: ""
        type: string
      triggered_at:
        description: External trigger timestamp as an ISO 8601 UTC timestamp.
        required: false
        default: ""
        type: string
      fetch_wallets:
        description: Fetch leaderboard wallets; disable to reuse previous published wallet rows.
        required: false
        default: true
        type: boolean
      fetch_players:
        description: Fetch current player data; disable to reuse previous published player rows.
        required: false
        default: true
        type: boolean
      fetch_clubs:
        description: Fetch Flow clubs and rosters; disable to reuse previous clubs and reconcile local relationships.
        required: false
        default: true
        type: boolean
      fetch_live_competitions:
        description: Fetch and reconcile LIVE competition data; disable to reuse stored history only.
        required: false
        default: true
        type: boolean
      backfill_historical_competitions:
        description: Backfill missing historical competitions from Season 1; intended for manual maintenance.
        required: false
        default: false
        type: boolean
      fetch_player_seasons:
        description: Resolve missing player seasons from Flow/MFL history; disable only when all rows are already resolved.
        required: false
        default: true
        type: boolean
      fetch_progressions:
        description: Fetch player progression data; disable to reuse previous values.
        required: false
        default: true
        type: boolean
      send_progression_emails:
        description: Send progression notification emails after the player-data checkpoint.
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  # Database and site deployments must never overlap. Duplicate external dispatches
  # wait for the active run, then the gate below skips them after a success marker exists.
  group: database-and-vercel-site
  cancel-in-progress: false

jobs:
  resolve-refresh-trigger:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.resolve.outputs.should_run }}
      occurrence_key: ${{ steps.resolve.outputs.occurrence_key }}
      intended_at: ${{ steps.resolve.outputs.intended_at }}
      trigger_source: ${{ steps.resolve.outputs.trigger_source }}
      triggered_at: ${{ steps.resolve.outputs.triggered_at }}
    steps:
      - name: Resolve refresh occurrence
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TRIGGER_SOURCE: ${{ inputs.trigger_source }}
          INPUT_INTENDED_AT: ${{ inputs.intended_at }}
          INPUT_OCCURRENCE_KEY: ${{ inputs.occurrence_key }}
          INPUT_TRIGGERED_AT: ${{ inputs.triggered_at }}
        run: |
          set -euo pipefail

          RUN_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
          CREATED_AT="$(jq -r '.created_at // empty' <<< "$RUN_JSON")"
          if [ -z "$CREATED_AT" ]; then
            CREATED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          fi

          TRIGGER_SOURCE="${INPUT_TRIGGER_SOURCE:-manual}"
          INTENDED_AT="${INPUT_INTENDED_AT:-}"
          OCCURRENCE_KEY="${INPUT_OCCURRENCE_KEY:-}"
          TRIGGERED_AT="${INPUT_TRIGGERED_AT:-$CREATED_AT}"

          if [ "$TRIGGER_SOURCE" = "supabase-cron" ]; then
            if [ -z "$INTENDED_AT" ] || [ -z "$OCCURRENCE_KEY" ] || [ -z "$INPUT_TRIGGERED_AT" ]; then
              echo "Supabase scheduler dispatch requires intended_at, occurrence_key, and triggered_at." >&2
              exit 1
            fi
            date -d "$INTENDED_AT" >/dev/null
            date -d "$TRIGGERED_AT" >/dev/null
            if [[ ! "$OCCURRENCE_KEY" =~ ^[0-9]{8}-[0-9]{4}$ ]]; then
              echo "Invalid occurrence_key: $OCCURRENCE_KEY" >&2
              exit 1
            fi
            EXPECTED_KEY="$(TZ=Europe/Rome date -d "$INTENDED_AT" +'%Y%m%d-%H%M')"
            if [ "$EXPECTED_KEY" != "$OCCURRENCE_KEY" ]; then
              echo "occurrence_key $OCCURRENCE_KEY does not match intended_at $INTENDED_AT." >&2
              exit 1
            fi
            case "${OCCURRENCE_KEY:9:4}" in
              1020|1903|2303) ;;
              *)
                echo "Unsupported scheduled occurrence: $OCCURRENCE_KEY" >&2
                exit 1
                ;;
            esac
          elif [ -n "$INTENDED_AT" ]; then
            date -d "$INTENDED_AT" >/dev/null
          fi

          SHOULD_RUN=true
          if [ -n "$OCCURRENCE_KEY" ]; then
            ARTIFACT_NAME="full-database-refresh-occurrence-$OCCURRENCE_KEY"
            COMPLETED_COUNT="$(
              gh api --paginate \
                "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=100" \
                --jq '[.artifacts[] | select(.expired == false)] | length' \
                | awk '{ total += $1 } END { print total + 0 }'
            )"
            if [ "$COMPLETED_COUNT" -gt 0 ]; then
              SHOULD_RUN=false
            fi
          fi

          {
            echo "should_run=$SHOULD_RUN"
            echo "occurrence_key=$OCCURRENCE_KEY"
            echo "intended_at=$INTENDED_AT"
            echo "trigger_source=$TRIGGER_SOURCE"
            echo "triggered_at=$TRIGGERED_AT"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Full database refresh trigger"
            echo
            echo "| Metric | Value |"
            echo "| --- | --- |"
            echo "| Trigger source | \`$TRIGGER_SOURCE\` |"
            echo "| Occurrence | \`${OCCURRENCE_KEY:-manual}\` |"
            echo "| Intended Rome time | \`${INTENDED_AT:-n/a}\` |"
            echo "| Triggered at | \`$TRIGGERED_AT\` |"
            echo "| Run database refresh | \`$SHOULD_RUN\` |"
            if [ "$SHOULD_RUN" = false ]; then
              echo
              echo "A successful completion marker already exists for this occurrence, so this duplicate dispatch is skipped."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  update-database-and-production-data:
    needs: resolve-refresh-trigger
    if: needs.resolve-refresh-trigger.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Record refresh trigger timing
        if: needs.resolve-refresh-trigger.outputs.intended_at != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_SOURCE: ${{ needs.resolve-refresh-trigger.outputs.trigger_source }}
          TRIGGERED_AT: ${{ needs.resolve-refresh-trigger.outputs.triggered_at }}
          INTENDED_AT: ${{ needs.resolve-refresh-trigger.outputs.intended_at }}
        run: bash "$GITHUB_WORKSPACE/builder/scripts/workflows/full-database-refresh-record-trigger-timing.sh"

      - name: Download current database builder
        uses: actions/checkout@v7
        with:
          path: builder

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Restore previous database
        working-directory: builder
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash "$GITHUB_WORKSPACE/builder/scripts/workflows/full-database-refresh-restore-previous-database-for-email-comparison.sh"

      - name: Resolve last published site source
        id: production_site
        working-directory: builder
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash "$GITHUB_WORKSPACE/builder/scripts/workflows/full-database-refresh-resolve-last-published-site-source.sh"

      - name: Download last published site source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.production_site.outputs.sha }}
          path: production-site

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Rebuild database — core
        working-directory: builder
        env:
          MFL_API_TOKEN: ${{ secrets.MFL_API_TOKEN }}
          MFL_REBUILD_STAGE: core
          MFL_FETCH_WALLETS: ${{ inputs.fetch_wallets }}
          MFL_FETCH_PLAYERS: ${{ inputs.fetch_players }}
          MFL_FETCH_CLUBS: ${{ inputs.fetch_clubs }}
          MFL_FETCH_PLAYER_SEASONS: ${{ inputs.fetch_player_seasons }}
          MFL_FETCH_PROGRESSIONS: ${{ inputs.fetch_progressions }}
          MFL_FETCH_LIVE_COMPETITIONS: ${{ inputs.fetch_live_competitions }}
          MFL_BACKFILL_HISTORICAL_COMPETITIONS: ${{ inputs.backfill_historical_competitions }}
        run: python -m scripts.database.rebuild_database_runner

      - name: Materialize core checkpoint
        if: ${{ hashFiles('builder/previous-database/mfl_database.db') != '' }}
        working-directory: builder
        run: |
          python -m scripts.database.checkpoint_database \
            --stage core \
            --source mfl_database.db \
            --previous previous-database/mfl_database.db \
            --output checkpoints/core/mfl_database.db
          python -m scripts.database.prepare_runtime_database checkpoints/core/mfl_database.db

      - name: Publish core checkpoint
        if: ${{ hashFiles('builder/previous-database/mfl_database.db') != '' }}
        env:
          PUBLISHED_SITE_SHA: ${{ steps.production_site.outputs.sha }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PRODUCTION_DATABASE_URL: https://mfl-front-office.vercel.app/api/data?mode=summary
        run: bash builder/scripts/workflows/full-database-refresh-publish-checkpoint.sh core builder/checkpoints/core/mfl_database.db

      - name: Save core checkpoint for retries
        if: ${{ hashFiles('builder/previous-database/mfl_database.db') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: mfl_database
          path: builder/checkpoints/core/mfl_database.db
          overwrite: true
          if-no-files-found: error

      - name: Rebuild database — player seasons
        working-directory: builder
        env:
          MFL_API_TOKEN: ${{ secrets.MFL_API_TOKEN }}
          MFL_REBUILD_STAGE: player_seasons
          MFL_FETCH_WALLETS: ${{ inputs.fetch_wallets }}
          MFL_FETCH_PLAYERS: ${{ inputs.fetch_players }}
          MFL_FETCH_CLUBS: ${{ inputs.fetch_clubs }}
          MFL_FETCH_PLAYER_SEASONS: ${{ inputs.fetch_player_seasons }}
          MFL_FETCH_PROGRESSIONS: ${{ inputs.fetch_progressions }}
          MFL_FETCH_LIVE_COMPETITIONS: ${{ inputs.fetch_live_competitions }}
          MFL_BACKFILL_HISTORICAL_COMPETITIONS: ${{ inputs.backfill_historical_competitions }}
        run: python -m scripts.database.rebuild_database_runner

      - name: Materialize player-seasons checkpoint
        if: ${{ hashFiles('builder/previous-database/mfl_database.db') != '' }}
        working-directory: builder
        run: |
          python -m scripts.database.checkpoint_database \
            --stage player_seasons \
            --source mfl_database.db \
            --previous previous-database/mfl_database.db \
            --output checkpoints/player-seasons/mfl_database.db
          python -m scripts.database.prepare_runtime_database checkpoints/player-seasons/mfl_database.db

      - name: Publish player-seasons checkpoint
        if: ${{ hashFiles('builder/previous-database/mfl_database.db') != '' }}
        env:
          PUBLISHED_SITE_SHA: ${{ steps.production_site.outputs.sha }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PRODUCTION_DATABASE_URL: https://mfl-front-office.vercel.app/api/data?mode=summary
        run: bash builder/scripts/workflows/full-database-refresh-publish-checkpoint.sh player-seasons builder/checkpoints/player-seasons/mfl_database.db

      - name: Save player-seasons checkpoint for retries
        if: ${{ hashFiles('builder/previous-database/mfl_database.db') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: mfl_database
          path: builder/checkpoints/player-seasons/mfl_database.db
          overwrite: true
          if-no-files-found: error

      - name: Rebuild database — player data
        working-directory: builder
        env:
          MFL_API_TOKEN: ${{ secrets.MFL_API_TOKEN }}
          MFL_REBUILD_STAGE: player_data
          MFL_FETCH_WALLETS: ${{ inputs.fetch_wallets }}
          MFL_FETCH_PLAYERS: ${{ inputs.fetch_players }}
          MFL_FETCH_CLUBS: ${{ inputs.fetch_clubs }}
          MFL_FETCH_PLAYER_SEASONS: ${{ inputs.fetch_player_seasons }}
          MFL_FETCH_PROGRESSIONS: ${{ inputs.fetch_progressions }}
          MFL_FETCH_LIVE_COMPETITIONS: ${{ inputs.fetch_live_competitions }}
          MFL_BACKFILL_HISTORICAL_COMPETITIONS: ${{ inputs.backfill_historical_competitions }}
        run: python -m scripts.database.rebuild_database_runner

      - name: Materialize player-data checkpoint
        if: ${{ hashFiles('builder/previous-database/mfl_database.db') != '' }}
        working-directory: builder
        run: |
          python -m scripts.database.checkpoint_database \
            --stage player_data \
            --source mfl_database.db \
            --previous previous-database/mfl_database.db \
            --output checkpoints/player-data/mfl_database.db
          python -m scripts.database.prepare_runtime_database checkpoints/player-data/mfl_database.db

      - name: Publish player-data checkpoint
        if: ${{ hashFiles('builder/previous-database/mfl_database.db') != '' }}
        env:
          PUBLISHED_SITE_SHA: ${{ steps.production_site.outputs.sha }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PRODUCTION_DATABASE_URL: https://mfl-front-office.vercel.app/api/data?mode=summary
        run: bash builder/scripts/workflows/full-database-refresh-publish-checkpoint.sh player-data builder/checkpoints/player-data/mfl_database.db

      - name: Save player-data checkpoint for retries
        if: ${{ hashFiles('builder/previous-database/mfl_database.db') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: mfl_database
          path: builder/checkpoints/player-data/mfl_database.db
          overwrite: true
          if-no-files-found: error

      - name: Send progression emails
        if: ${{ inputs.send_progression_emails && inputs.fetch_progressions && hashFiles('builder/previous-database/mfl_database.db') != '' }}
        working-directory: builder
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_REPLY_TO: ${{ secrets.EMAIL_REPLY_TO }}
          EMAIL_BASE_URL: https://mfl-front-office.vercel.app
        run: python -m scripts.email.send_progression_emails --previous-db previous-database/mfl_database.db --current-db mfl_database.db

      - name: Rebuild database — competitions
        working-directory: builder
        env:
          MFL_API_TOKEN: ${{ secrets.MFL_API_TOKEN }}
          MFL_REBUILD_STAGE: competitions
          MFL_FETCH_WALLETS: ${{ inputs.fetch_wallets }}
          MFL_FETCH_PLAYERS: ${{ inputs.fetch_players }}
          MFL_FETCH_CLUBS: ${{ inputs.fetch_clubs }}
          MFL_FETCH_PLAYER_SEASONS: ${{ inputs.fetch_player_seasons }}
          MFL_FETCH_PROGRESSIONS: ${{ inputs.fetch_progressions }}
          MFL_FETCH_LIVE_COMPETITIONS: ${{ inputs.fetch_live_competitions }}
          MFL_BACKFILL_HISTORICAL_COMPETITIONS: ${{ inputs.backfill_historical_competitions }}
        run: python -m scripts.database.rebuild_database_runner

      - name: Materialize final checkpoint
        working-directory: builder
        run: |
          python -m scripts.database.checkpoint_database \
            --stage final \
            --source mfl_database.db \
            --output checkpoints/final/mfl_database.db
          python -m scripts.database.prepare_runtime_database checkpoints/final/mfl_database.db

      - name: Publish final checkpoint
        env:
          PUBLISHED_SITE_SHA: ${{ steps.production_site.outputs.sha }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PRODUCTION_DATABASE_URL: https://mfl-front-office.vercel.app/api/data?mode=summary
        run: bash builder/scripts/workflows/full-database-refresh-publish-checkpoint.sh final builder/checkpoints/final/mfl_database.db

      - name: Upload final database
        uses: actions/upload-artifact@v7
        with:
          name: mfl_database
          path: builder/checkpoints/final/mfl_database.db
          overwrite: true
          if-no-files-found: error

      - name: Record completed refresh occurrence
        if: success() && needs.resolve-refresh-trigger.outputs.occurrence_key != ''
        shell: bash
        env:
          OCCURRENCE_KEY: ${{ needs.resolve-refresh-trigger.outputs.occurrence_key }}
          INTENDED_AT: ${{ needs.resolve-refresh-trigger.outputs.intended_at }}
          TRIGGER_SOURCE: ${{ needs.resolve-refresh-trigger.outputs.trigger_source }}
        run: bash "$GITHUB_WORKSPACE/builder/scripts/workflows/full-database-refresh-record-completed-refresh-occurrence.sh"

      - name: Upload completed refresh occurrence
        if: success() && needs.resolve-refresh-trigger.outputs.occurrence_key != ''
        uses: actions/upload-artifact@v7
        with:
          name: full-database-refresh-occurrence-${{ needs.resolve-refresh-trigger.outputs.occurrence_key }}
          path: ${{ runner.temp }}/full-database-refresh-occurrence.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload checkpoint telemetry
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-database-refresh-checkpoints-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/full-database-refresh-checkpoint-*.json
          if-no-files-found: warn
          retention-days: 90

      - name: Upload refresh trigger timing telemetry
        if: always() && needs.resolve-refresh-trigger.outputs.intended_at != ''
        uses: actions/upload-artifact@v7
        with:
          name: full-database-refresh-trigger-${{ github.run_id }}
          path: ${{ runner.temp }}/full-database-refresh-trigger-telemetry.json
          if-no-files-found: warn
          retention-days: 90

name: Full database refresh

on:
  schedule:
    # GitHub cron is UTC. Separate CET/CEST candidates are gated against the intended Rome clock time.
    - cron: "20 8 * * *"
    - cron: "20 9 * * *"
    - cron: "15 17 * * *"
    - cron: "15 18 * * *"
    - cron: "15 21 * * *"
    - cron: "15 22 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: database-and-vercel-site
  cancel-in-progress: false

jobs:
  update-database-and-production-data:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Download current database builder
        uses: actions/checkout@v4
        with:
          path: builder

      - name: Check Rome schedule time
        id: schedule_gate
        if: github.event_name == 'schedule'
        shell: bash
        env:
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          parts = os.environ.get("SCHEDULE_CRON", "").split()
          should_run = False
          if len(parts) >= 2:
              minute, hour = int(parts[0]), int(parts[1])
              now = datetime.now(timezone.utc).replace(
                  hour=hour,
                  minute=minute,
                  second=0,
                  microsecond=0,
              )
              rome = now.astimezone(ZoneInfo("Europe/Rome"))
              should_run = (rome.hour, rome.minute) in {
                  (10, 20),
                  (19, 15),
                  (23, 15),
              }
          print(f"should_run={'true' if should_run else 'false'}")
          PY

      - name: Set up Python
        if: github.event_name != 'schedule' || steps.schedule_gate.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        if: github.event_name != 'schedule' || steps.schedule_gate.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore previous database for email comparison
        if: github.event_name != 'schedule' || steps.schedule_gate.outputs.should_run == 'true'
        working-directory: builder
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p previous-database

          PREVIOUS_RUN_ID=""
          PREVIOUS_ARTIFACT_ID=""
          PREVIOUS_CREATED_AT=""

          while IFS=$'\t' read -r CREATED_AT ARTIFACT_ID RUN_ID; do
            [ -n "$ARTIFACT_ID" ] || continue
            [ -n "$RUN_ID" ] || continue

            rm -rf previous-database/*
            echo "Checking mfl_database artifact $ARTIFACT_ID from run $RUN_ID ($CREATED_AT)."

            if ! gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name mfl_database --dir previous-database; then
              echo "Artifact $ARTIFACT_ID could not be downloaded; trying the next candidate."
              continue
            fi

            if python prepare_runtime_database.py previous-database/mfl_database.db --validate-only; then
              PREVIOUS_RUN_ID="$RUN_ID"
              PREVIOUS_ARTIFACT_ID="$ARTIFACT_ID"
              PREVIOUS_CREATED_AT="$CREATED_AT"
              break
            fi

            echo "Artifact $ARTIFACT_ID does not contain a valid prepared mfl_database.db; trying the next candidate."
          done < <(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=mfl_database&per_page=100" \
              --jq '.artifacts[] | select(.name == "mfl_database" and .expired == false) | [.created_at, (.id | tostring), (.workflow_run.id | tostring)] | @tsv' \
              | sort -r
          )

          if [ -n "$PREVIOUS_RUN_ID" ]; then
            echo "Using previous database artifact $PREVIOUS_ARTIFACT_ID from run $PREVIOUS_RUN_ID ($PREVIOUS_CREATED_AT)."
          else
            rm -rf previous-database/*
            echo "No valid previous database artifact found; progression emails will be skipped."
          fi

      - name: Rebuild database
        if: github.event_name != 'schedule' || steps.schedule_gate.outputs.should_run == 'true'
        working-directory: builder
        env:
          MFL_API_TOKEN: ${{ secrets.MFL_API_TOKEN }}
        run: python rebuild_database_runner.py

      - name: Send progression emails
        if: (github.event_name != 'schedule' || steps.schedule_gate.outputs.should_run == 'true') && hashFiles('builder/previous-database/mfl_database.db') != ''
        working-directory: builder
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_REPLY_TO: ${{ secrets.EMAIL_REPLY_TO }}
          EMAIL_BASE_URL: https://mfl-front-office.vercel.app
        run: python send_progression_emails.py --previous-db previous-database/mfl_database.db --current-db mfl_database.db

      - name: Prepare runtime SQLite database
        if: github.event_name != 'schedule' || steps.schedule_gate.outputs.should_run == 'true'
        working-directory: builder
        run: python prepare_runtime_database.py mfl_database.db

      - name: Upload database
        if: github.event_name != 'schedule' || steps.schedule_gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mfl_database
          path: builder/mfl_database.db
          if-no-files-found: error

      - name: Resolve last published site source
        id: production_site
        if: github.event_name != 'schedule' || steps.schedule_gate.outputs.should_run == 'true'
        working-directory: builder
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          SITE_SHA="$(
            gh run list \
              --workflow vercel-site-update.yml \
              --status success \
              --limit 50 \
              --json headSha,createdAt \
              --jq 'sort_by(.createdAt) | reverse | map(select(.headSha != null and .headSha != "")) | .[0].headSha // ""'
          )"

          if [ -z "$SITE_SHA" ]; then
            echo "No successful Vercel site update run was found." >&2
            echo "Publish the site once with the Vercel site update workflow before running database-only production refreshes." >&2
            exit 1
          fi
          echo "Using last published site source commit $SITE_SHA."
          echo "sha=$SITE_SHA" >> "$GITHUB_OUTPUT"

      - name: Download last published site source
        if: github.event_name != 'schedule' || steps.schedule_gate.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.production_site.outputs.sha }}
          path: production-site

      - name: Install fresh database in published site source
        if: github.event_name != 'schedule' || steps.schedule_gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f production-site/site/api/_database.js ]; then
            echo "The last published site source does not support the SQLite runtime." >&2
            echo "Publish a SQLite-capable site version once before using database-only production refreshes." >&2
            exit 1
          fi

          PUBLISHED_ADAPTER_BLOB="$(git -C production-site rev-parse HEAD:site/api/_database.js)"

          rm -rf production-site/site/api/data-files
          mkdir -p production-site/site/api/data-files
          cp builder/mfl_database.db production-site/site/api/data-files/mfl_database.db
          test -s production-site/site/api/data-files/mfl_database.db

          CURRENT_ADAPTER_BLOB="$(git -C production-site hash-object site/api/_database.js)"
          if [ "$CURRENT_ADAPTER_BLOB" != "$PUBLISHED_ADAPTER_BLOB" ]; then
            echo "Database-only refresh changed the published SQLite adapter; refusing to deploy mixed site versions." >&2
            exit 1
          fi

          if find production-site/site/api/data-files -maxdepth 1 -type f -name '*.json' | grep -q .; then
            echo "Generated JSON data files are not allowed." >&2
            exit 1
          fi

      - name: Build published application core
        if: github.event_name != 'schedule' || steps.schedule_gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node production-site/site/build-app-core.mjs
          test -s production-site/site/modules/app-core-runtime.js

      - name: Validate database with published site adapter
        if: github.event_name != 'schedule' || steps.schedule_gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const path = require("node:path");

          const publishedDatabase = require(path.resolve("production-site/site/api/_database.js"));
          const database = publishedDatabase.getDatabase();
          const playerCount = Number(database.prepare("SELECT count(*) AS count FROM players").get()?.count ?? -1);
          const walletCount = Number(database.prepare("SELECT count(*) AS count FROM wallets").get()?.count ?? -1);
          const generatedAt = String(
            database.prepare("SELECT value FROM runtime_metadata WHERE key = 'generated_at' LIMIT 1").get()?.value || "",
          ).trim();

          if (!Number.isFinite(playerCount) || playerCount <= 0) {
            throw new Error(`Published adapter could not read a valid player count: ${playerCount}`);
          }
          if (!Number.isFinite(walletCount) || walletCount <= 0) {
            throw new Error(`Published adapter could not read a valid wallet count: ${walletCount}`);
          }
          if (!generatedAt || Number.isNaN(Date.parse(generatedAt))) {
            throw new Error(`Published adapter could not read a valid generated_at value: ${generatedAt}`);
          }

          console.log(
            `Published site adapter accepted fresh database: ${playerCount} players, ${walletCount} wallets, generatedAt ${generatedAt}.`,
          );
          NODE

      - name: Record expected database summary
        if: github.event_name != 'schedule' || steps.schedule_gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sqlite3
          from pathlib import Path

          database_path = Path("production-site/site/api/data-files/mfl_database.db")
          with sqlite3.connect(database_path) as connection:
              player_count = int(connection.execute("SELECT count(*) FROM players").fetchone()[0])
              wallet_count = int(connection.execute("SELECT count(*) FROM wallets").fetchone()[0])
              generated_at_row = connection.execute(
                  "SELECT value FROM runtime_metadata WHERE key = 'generated_at' LIMIT 1"
              ).fetchone()

          if not generated_at_row or not str(generated_at_row[0]).strip():
              raise SystemExit("Runtime database is missing runtime_metadata generated_at.")

          generated_at = str(generated_at_row[0]).strip()
          expected = {
              "playerCount": player_count,
              "walletCount": wallet_count,
              "generatedAt": generated_at,
          }
          output_path = Path(os.environ["RUNNER_TEMP"]) / "mfl-database-expected.json"
          output_path.write_text(json.dumps(expected), encoding="utf-8")
          print(
              "Expected live database: "
              f"{player_count} players, {wallet_count} wallets, "
              f"generatedAt {generated_at}."
          )
          PY

      - name: Verify published site version is unchanged
        if: github.event_name != 'schedule' || steps.schedule_gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git -C production-site rev-parse HEAD)"
          EXPECTED_SHA="${{ steps.production_site.outputs.sha }}"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

          PUBLISHED_ADAPTER_BLOB="$(git -C production-site rev-parse HEAD:site/api/_database.js)"
          CURRENT_ADAPTER_BLOB="$(git -C production-site hash-object site/api/_database.js)"
          test "$CURRENT_ADAPTER_BLOB" = "$PUBLISHED_ADAPTER_BLOB"

          UNEXPECTED_TRACKED_CHANGES="$(
            git -C production-site diff --name-only -- . \
              ':(exclude)site/api/data-files/**' \
              ':(exclude)site/modules/app-core-runtime.js' \
              ':(exclude)site/modules/app-core-*-runtime.js'
          )"
          if [ -n "$UNEXPECTED_TRACKED_CHANGES" ]; then
            echo "Database-only refresh changed published site source files:" >&2
            printf '%s\n' "$UNEXPECTED_TRACKED_CHANGES" >&2
            exit 1
          fi

          python - <<'PY'
          import json
          import re
          from pathlib import Path

          release_path = Path("production-site/site/release.json")
          app_path = Path("production-site/site/bootstrap.js")
          version = ""

          if release_path.exists():
              release = json.loads(release_path.read_text(encoding="utf-8"))
              candidate = str(release.get("version", "")).strip()
              if re.fullmatch(r"\d+\.\d+\.\d+", candidate):
                  version = candidate
          elif app_path.exists():
              source = app_path.read_text(encoding="utf-8")
              match = re.search(
                  r'const\s+(?:STATIC_RELEASE_VERSION|RELEASE_VERSION|VERSION)\s*=\s*["\'](\d+\.\d+\.\d+)["\']',
                  source,
              )
              if match:
                  version = match.group(1)

          if version:
              print(
                  f"Deploying fresh SQLite data with the exact published MFL Front Office "
                  f"v{version} site runtime."
              )
          else:
              print(
                  "Deploying fresh SQLite data with the exact site runtime from the last "
                  "successful Vercel site update."
              )
          PY

      - name: Install Vercel CLI
        if: github.event_name != 'schedule' || steps.schedule_gate.outputs.should_run == 'true'
        run: npm install --global vercel@latest

      - name: Connect Vercel project
        if: github.event_name != 'schedule' || steps.schedule_gate.outputs.should_run == 'true'
        working-directory: production-site
        shell: bash
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Deploy database with unchanged published site
        if: github.event_name != 'schedule' || steps.schedule_gate.outputs.should_run == 'true'
        working-directory: production-site
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prod --yes --force --local-config site/vercel.production.json --build-env ALLOW_VERCEL_ACTION_DEPLOY=1 --token "$VERCEL_TOKEN"

      - name: Verify live production database
        if: github.event_name != 'schedule' || steps.schedule_gate.outputs.should_run == 'true'
        shell: bash
        env:
          PRODUCTION_DATABASE_URL: https://mfl-front-office.vercel.app/api/data?mode=summary
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          expected_path = Path(os.environ["RUNNER_TEMP"]) / "mfl-database-expected.json"
          expected = json.loads(expected_path.read_text(encoding="utf-8"))
          base_url = os.environ["PRODUCTION_DATABASE_URL"]
          run_id = os.environ.get("GITHUB_RUN_ID", "run")
          last_error = "No response received."

          for attempt in range(1, 13):
              separator = "&" if "?" in base_url else "?"
              verify_token = urllib.parse.quote(f"{run_id}-{attempt}-{time.time_ns()}")
              request = urllib.request.Request(
                  f"{base_url}{separator}verify={verify_token}",
                  headers={
                      "Accept": "application/json",
                      "Cache-Control": "no-cache, no-store",
                      "Pragma": "no-cache",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      live = json.loads(response.read().decode("utf-8"))

                  matches = (
                      int(live.get("playerCount", -1)) == int(expected["playerCount"])
                      and int(live.get("walletCount", -1)) == int(expected["walletCount"])
                      and str(live.get("generatedAt", "")).strip() == str(expected["generatedAt"])
                  )
                  if matches:
                      print(
                          "Live production database verified: "
                          f"{live['playerCount']} players, {live['walletCount']} wallets, "
                          f"generatedAt {live['generatedAt']}."
                      )
                      raise SystemExit(0)

                  last_error = (
                      f"attempt {attempt}: expected {expected['playerCount']} players, "
                      f"{expected['walletCount']} wallets, generatedAt {expected['generatedAt']}; "
                      f"received {live!r}"
                  )
              except Exception as error:
                  last_error = f"attempt {attempt}: {error}"

              print(f"Live database verification not ready ({last_error}); retrying.")
              time.sleep(5)

          raise SystemExit(
              "Production deployment completed, but the live SQLite database could not be verified. "
              + last_error
          )
          PY

name: Refine PR 616 universal table centering v3

on:
  push:
    branches:
      - fix/599-responsive-table-proportions
    paths:
      - .github/workflows/refine-pr-616-universal-table-centering-v3.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: fix/599-responsive-table-proportions
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply universal centering and update dependent contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/refine-pr-616-universal-table-centering-v2.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, 'centering-v2-apply.py', 'exec'), {})

          column_validator = Path('site/validate-table-column-layout.mjs')
          source = column_validator.read_text(encoding='utf-8')
          old = '''    && styles.includes("#progressionPage .playerTableScroller td {\\n  height: var(--mfl-table-row-height);\\n  min-height: var(--mfl-table-row-height);\\n  line-height: var(--mfl-table-row-height);")'''
          new = '''    && styles.includes("#progressionPage .playerTableScroller td {\\n  height: var(--mfl-table-row-height);\\n  min-height: var(--mfl-table-row-height);\\n  line-height: 1.2;")'''
          if source.count(old) != 1:
              raise SystemExit('table-column loaded/loading row contract marker missing')
          source = source.replace(old, new, 1)
          source = source.replace(
              '"Loaded and blank player rows must share the existing 39px outer row height while cell content remains compact at 34px.",',
              '"Loaded and blank player rows must share the existing 39px outer row height and 34px cell height independently from text line-height.",',
              1,
          )
          column_validator.write_text(source, encoding='utf-8')

          header_validator = Path('site/validate-mobile-header-first-paint-metrics.mjs')
          source = header_validator.read_text(encoding='utf-8')
          old = '''assert.match(\n  stylesSource,\n  /#progressionPage \\.playerTableScroller th \\{\\s*height: var\\(--mfl-table-header-height\\);\\s*min-height: var\\(--mfl-table-header-height\\);\\s*line-height: var\\(--mfl-table-header-height\\);\\s*\\}/,\n  "Canonical table CSS must own header height, minimum height, and line height for both first paint and hydration.",\n);'''
          new = '''assert.match(\n  stylesSource,\n  /#progressionPage \\.playerTableScroller th \\{\\s*height: var\\(--mfl-table-header-height\\);\\s*min-height: var\\(--mfl-table-header-height\\);\\s*line-height: 1\\.2;\\s*vertical-align: middle;\\s*\\}/,\n  "Canonical table CSS must own header height and native middle alignment without using the full header height as text line-height.",\n);\nassert.match(\n  stylesSource,\n  /#progressionPage #tableHead \\.tableHeaderCellContent \\{[\\s\\S]*?display: flex;[\\s\\S]*?align-items: center;[\\s\\S]*?height: var\\(--mfl-table-header-height\\);/,\n  "Header labels, arrows, and controls must share one full-height flex centering host.",\n);'''
          if source.count(old) != 1:
              raise SystemExit('mobile header canonical geometry marker missing')
          source = source.replace(old, new, 1)
          header_validator.write_text(source, encoding='utf-8')
          PY

          cd site
          node build-app-core.mjs
      - name: Snapshot product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/styles-base.css site/styles.css site/modules/core-sources/table.js site/modules/app-core-table-runtime.js site/validate-table-row-vertical-centering.mjs site/validate-filter-loading-blank-rows.mjs site/validate-table-column-layout.mjs site/validate-mobile-header-first-paint-metrics.mjs
          git diff --cached --check
          git commit -m "Center all table content vertically"
      - name: Validate site
        shell: bash
        run: |
          set -euo pipefail
          cd site
          npm ci
          npm run check
      - name: Remove scaffolding and push
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/refine-pr-616-universal-table-centering.yml .github/workflows/refine-pr-616-universal-table-centering-v2.yml .github/workflows/refine-pr-616-universal-table-centering-v3.yml
          git commit -m "Remove PR 616 universal-centering scaffolding"
          git push origin HEAD:fix/599-responsive-table-proportions
name: Runtime style optimization snapshot

on:
  push:
    branches:
      - chore/runtime-style-ownership

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-style-optimization-snapshot
          path: .
          include-hidden-files: true
          retention-days: 1

name: Apply runtime style optimization

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'chore/runtime-style-ownership'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/runtime-style-ownership
          fetch-depth: 0
      - name: Apply tested runtime style patch
        env:
          PATCH_GZ_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_GZ_B64" | base64 -d | gzip -d > /tmp/runtime-style.patch
          git apply --check /tmp/runtime-style.patch
          git apply /tmp/runtime-style.patch
          git rm .github/workflows/runtime-style-snapshot.yml
          git add -- site/controls.css site/dropdowns.css site/loading.css site/modules/app-core-normalizer.js site/modules/app-core-route-chunks.js site/modules/app-core-route-runtime-normalizer.js site/modules/app-core.js site/selection-stack-runtime.js site/selection-startup-reset-runtime.js site/shared-table-ui-runtime.js site/styles-base.css site/validate-all.mjs site/validate-eval-ownership.mjs site/validate-runtime-style-ownership.mjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove runtime style priority ownership'
          git push origin HEAD:chore/runtime-style-ownership

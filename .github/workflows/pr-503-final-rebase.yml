name: PR 503 final rebase

on:
  push:
    branches:
      - feat/502-site-styled-checkboxes
    paths:
      - .github/workflows/pr-503-final-rebase.yml

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: feat/502-site-styled-checkboxes
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Rebase onto main
        run: |
          git fetch origin main
          git rebase origin/main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install site dependencies
        working-directory: site
        run: npm install --no-audit --no-fund
      - name: Validate rebased branch
        working-directory: site
        run: npm run check
      - name: Remove temporary workflow and force-push
        run: |
          git rm .github/workflows/pr-503-final-rebase.yml
          git commit -m "Remove temporary PR 503 rebase workflow"
          git push --force-with-lease origin HEAD:feat/502-site-styled-checkboxes

name: Evaluation cache shared boundary migration

on:
  push:
    branches:
      - refactor/source-owned-evaluation-recent-readiness
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/source-owned-evaluation-recent-readiness
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Move Evaluation cache owner before Table split boundary
        run: node site/migrate-evaluation-cache-shared-boundary.mjs
      - name: Remove temporary migration scaffolding
        shell: bash
        run: |
          rm -f site/migrate-evaluation-cache-shared-boundary.mjs
          rm -f .github/workflows/evaluation-cache-shared-boundary-migration.yml
      - name: Persist source placement migration
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "Evaluation cache source placement is already correct."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Keep Evaluation cache state in shared core"
          git push origin HEAD:refactor/source-owned-evaluation-recent-readiness

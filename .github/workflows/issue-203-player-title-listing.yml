name: Issue 203 player title listing

on:
  push:
    branches:
      - fix/issue-203-player-listing-column

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-203-player-listing-column

      - name: Add shared player title listing badge
        run: python .github/issue-203-player-title-listing.py

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: site
        run: npm install --no-audit --no-fund

      - name: Build and validate
        working-directory: site
        run: |
          npm run build:core
          npm run lint
          npm run typecheck
          npm run validate

      - name: Commit canonical and generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/modules/app-core.js site/modules/app-core-runtime.js site/modules/app-core-table-runtime.js site/modules/app-core-player-runtime.js site/styles.css site/validate-shared-core-route-ownership.mjs site/validate-listing-column.mjs
          git commit -m "Show listing price beside player title"

      - name: Verify generated artifacts
        working-directory: site
        run: npm run verify:generated

      - name: Push changes
        run: git push origin HEAD:fix/issue-203-player-listing-column

name: Preserve Player action menu rerenders

on:
  push:
    branches:
      - fix/evaluation-stale-completion-dropdown-461

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/evaluation-stale-completion-dropdown-461
          fetch-depth: 0

      - name: Apply patch
        run: python .github/tmp_patch_player_action_menu_461.py

      - name: Remove temporary patch files
        run: |
          rm .github/tmp_patch_player_action_menu_461.py
          rm .github/workflows/tmp-preserve-player-action-menu-461.yml

      - name: Commit fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/modules/app-core.js site/validate-player-table-actions.mjs .github/tmp_patch_player_action_menu_461.py .github/workflows/tmp-preserve-player-action-menu-461.yml
          git commit -m "Preserve Player action menu across passive table rerenders"
          git push origin HEAD:fix/evaluation-stale-completion-dropdown-461

name: One-time exact table widths

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-exact-table-widths.yml
      - .github/scripts/exact_table_widths.py

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch app.js
        run: python .github/scripts/exact_table_widths.py
      - name: Commit exact widths
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/app.js .github/workflows/one-time-exact-table-widths.yml .github/scripts/exact_table_widths.py
          git commit -m "Align table headers and enforce exact column widths"
          git push origin main

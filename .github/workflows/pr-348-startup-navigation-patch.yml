name: PR 348 startup navigation patch

on:
  push:
    branches:
      - fix/refresh-navigation-authority
    paths:
      - .github/workflows/pr-348-startup-navigation-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/refresh-navigation-authority
          fetch-depth: 0

      - name: Patch startup navigation ownership
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'site/modules/app-core.js';
          let source = fs.readFileSync(path, 'utf8');

          const oldSeed = '  const initialTarget = pageTargetFromPath(`${location.pathname}${location.search}`);\n  const earlyGlobalSearch = primeGlobalSearchIndexes();';
          const newSeed = '  const initialTarget = pageTargetFromPath(`${location.pathname}${location.search}`);\n  commitPageTransition(initialTarget.pageName, false, initialTarget.options);\n  const startupNavigationSequence = navigationTransitionSequence;\n  const earlyGlobalSearch = primeGlobalSearchIndexes();';
          if (!source.includes(oldSeed)) throw new Error('Could not find the startup route seed insertion point.');
          source = source.replace(oldSeed, newSeed);

          const oldRender = '  const authoritativeTarget = pageTargetFromPath(`${location.pathname}${location.search}`);\n  await showHomeShell(authoritativeTarget.pageName, false, authoritativeTarget.options);';
          const newRender = '  if (navigationTransitionSequence === startupNavigationSequence) {\n    const authoritativeTarget = pageTargetFromPath(`${location.pathname}${location.search}`);\n    await showHomeShell(authoritativeTarget.pageName, false, {\n      ...authoritativeTarget.options,\n      skipNavigationTransition: true,\n    });\n  }';
          if (!source.includes(oldRender)) throw new Error('Could not find the startup authoritative render block.');
          source = source.replace(oldRender, newRender);

          fs.writeFileSync(path, source, 'utf8');
          NODE

          node site/build-app-core.mjs
          git diff --check
          node --check site/modules/app-core.js
          node --check site/modules/app-core-runtime.js

          node <<'NODE'
          const fs = require('node:fs');
          for (const path of ['site/modules/app-core.js', 'site/modules/app-core-runtime.js']) {
            const source = fs.readFileSync(path, 'utf8');
            const required = [
              'commitPageTransition(initialTarget.pageName, false, initialTarget.options);',
              'const startupNavigationSequence = navigationTransitionSequence;',
              'if (navigationTransitionSequence === startupNavigationSequence) {',
              'skipNavigationTransition: true',
            ];
            for (const snippet of required) {
              if (!source.includes(snippet)) throw new Error(`${path} is missing: ${snippet}`);
            }
            if (source.includes('await showHomeShell(authoritativeTarget.pageName, false, authoritativeTarget.options);')) {
              throw new Error(`${path} still contains the unguarded startup render.`);
            }
          }
          NODE

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/modules/app-core.js site/modules/app-core-runtime.js
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: preserve refresh-time navigation ownership"
          git push origin HEAD:fix/refresh-navigation-authority

name: Finalize responsive table proportions

on:
  push:
    branches:
      - fix/599-responsive-table-proportions
    paths:
      - .github/workflows/refine-issue-599-v11.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-issue-599
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: fix/599-responsive-table-proportions

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Finalize responsive table implementation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              source = file.read_text(encoding="utf-8")
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              file.write_text(source.replace(old, new), encoding="utf-8")

          shared = "site/shared-table-ui-runtime.js"
          replace_once(
              shared,
              '''  #progressionPage {
              --mfl-table-header-height: 18.72596153846154px;
              --mfl-table-row-height: 16.754807692307693px;
              --mfl-table-row-outer-height: 19.21875px;
            }''',
              '''  #progressionPage {
              --mfl-table-header-height: max(18.72596153846154px, calc(2.2836538461538463vw - 0.5480769230769231px));
              --mfl-table-row-height: max(16.754807692307693px, calc(2.043269230769231vw - 0.49038461538461536px));
              --mfl-table-row-outer-height: max(19.21875px, calc(2.34375vw - 0.5625px));
            }''',
          )
          replace_once(
              shared,
              '''  function syncMobileColumnWidths() {
              const page = document.getElementById("progressionPage");
              if (!(page instanceof HTMLElement)) return;
              page.style.removeProperty("--mfl-table-col-listing");
              page.style.removeProperty("--mfl-table-col-name");
              page.style.removeProperty("--mfl-table-col-contract-render-name");
              page.style.removeProperty("--mfl-table-col-positions");
              if (!MOBILE_TABLE_MEDIA.matches) return;

              const baseStyle = getComputedStyle(page);
              const baseListing = Number.parseFloat(baseStyle.getPropertyValue("--mfl-table-col-listing")) || 6.3904569176696135;
              const basePositions = Number.parseFloat(baseStyle.getPropertyValue("--mfl-table-col-positions")) || 7.508786878261796;
              const targetListing = TINY_TABLE_MEDIA.matches ? 3.6 : PHONE_TABLE_MEDIA.matches ? 3.8 : 4.2;
              const reclaimed = Math.max(0, baseListing - targetListing);
              page.style.setProperty("--mfl-table-col-listing", `${targetListing}%`);
              page.style.setProperty("--mfl-table-col-positions", `${basePositions + reclaimed}%`);
            }''',
              '''  function syncMobileColumnWidths() {
              const page = document.getElementById("progressionPage");
              if (!(page instanceof HTMLElement)) return;
              page.style.removeProperty("--mfl-table-col-listing");
              page.style.removeProperty("--mfl-table-col-name");
              page.style.removeProperty("--mfl-table-col-contract-render-name");
              page.style.removeProperty("--mfl-table-col-positions");
            }''',
          )

          projection = "site/sync-release-projections.mjs"
          replace_once(
              projection,
              '    "  #progressionPage { --mfl-table-header-height: 18.72596153846154px; --mfl-table-row-height: 16.754807692307693px; --mfl-table-row-outer-height: 19.21875px; }",',
              '    "  #progressionPage { --mfl-table-header-height: max(18.72596153846154px, calc(2.2836538461538463vw - 0.5480769230769231px)); --mfl-table-row-height: max(16.754807692307693px, calc(2.043269230769231vw - 0.49038461538461536px)); --mfl-table-row-outer-height: max(19.21875px, calc(2.34375vw - 0.5625px)); }",',
          )

          compact = "site/validate-mobile-table-compact-contract.mjs"
          replace_once(
              compact,
              '''assert.match(
            sharedTableUiSource,
            /@media \\(max-width: 900px\\) \\{[\\s\\S]*--mfl-table-header-height: 18.72596153846154px;[\\s\\S]*--mfl-table-row-height: 16.754807692307693px;[\\s\\S]*--mfl-table-row-outer-height: 19.21875px;/,
            "Mobile table headers must match the visible 32px row height while preserving the 28px cell content height.",
          );''',
              '''assert.match(
            sharedTableUiSource,
            /@media \\(max-width: 900px\\) \\{[\\s\\S]*--mfl-table-header-height: max\\(18\\.72596153846154px, calc\\(2\\.2836538461538463vw - 0\\.5480769230769231px\\)\\);[\\s\\S]*--mfl-table-row-height: max\\(16\\.754807692307693px, calc\\(2\\.043269230769231vw - 0\\.49038461538461536px\\)\\);[\\s\\S]*--mfl-table-row-outer-height: max\\(19\\.21875px, calc\\(2\\.34375vw - 0\\.5625px\\)\\);/,
            "Tablet table geometry must scale with the rendered table width while retaining the 820px minimum geometry.",
          );''',
          )
          replace_once(
              compact,
              '''assert.match(projectionSource, /@media \\(max-width: 900px\\)[\\s\\S]*--mfl-table-header-height: 18.72596153846154px; --mfl-table-row-height: 16.754807692307693px; --mfl-table-row-outer-height: 19.21875px;/, "First-paint mobile header height must already match the visible row height.");''',
              '''assert.match(projectionSource, /@media \\(max-width: 900px\\)[\\s\\S]*--mfl-table-header-height: max\\(18\\.72596153846154px, calc\\(2\\.2836538461538463vw - 0\\.5480769230769231px\\)\\); --mfl-table-row-height: max\\(16\\.754807692307693px, calc\\(2\\.043269230769231vw - 0\\.49038461538461536px\\)\\); --mfl-table-row-outer-height: max\\(19\\.21875px, calc\\(2\\.34375vw - 0\\.5625px\\)\\);/, "First-paint tablet geometry must already track the rendered table width.");''',
          )

          retry = "site/validate-mobile-table-retry.mjs"
          replace_once(
              retry,
              '''includes(sharedUi, "--mfl-table-header-height: 18.72596153846154px;", "Mobile header height must stay canonical.");
          includes(sharedUi, "--mfl-table-row-height: 16.754807692307693px;", "Mobile row content height must stay canonical.");''',
              '''includes(sharedUi, "--mfl-table-header-height: max(18.72596153846154px, calc(2.2836538461538463vw - 0.5480769230769231px));", "Tablet header height must track rendered table width.");
          includes(sharedUi, "--mfl-table-row-height: max(16.754807692307693px, calc(2.043269230769231vw - 0.49038461538461536px));", "Tablet row content height must track rendered table width.");''',
          )
          replace_once(
              retry,
              '''excludes(sharedUi, "MutationObserver", "Mobile table presentation must remain render/resize driven.");''',
              '''excludes(sharedUi, "MutationObserver", "Mobile table presentation must remain render/resize driven.");
          excludes(sharedUi, 'style.setProperty("--mfl-table-col-listing"', "Hydration must not rebalance the canonical Listing column.");
          excludes(sharedUi, 'style.setProperty("--mfl-table-col-positions"', "Hydration must not rebalance the canonical Positions column.");''',
          )

          responsive = Path("site/validate-responsive-table-proportions.mjs")
          responsive.write_text(r'''import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import { dirname, resolve } from "node:path";
          import { fileURLToPath } from "node:url";

          const root = dirname(fileURLToPath(import.meta.url));
          const read = (name) => readFileSync(resolve(root, name), "utf8");
          const styles = read("styles.css");
          const shared = read("shared-table-ui-runtime.js");
          const projection = read("sync-release-projections.mjs");
          const index = read("index.html");
          const desktop = Object.freeze({ width: 1664, header: 38, row: 34, outer: 39 });
          const tablet = Object.freeze({
            breakpoint: 900,
            minWidth: 820,
            horizontalInset: 24,
            minHeader: 18.72596153846154,
            minRow: 16.754807692307693,
            minOuter: 19.21875,
            headerVw: 2.2836538461538463,
            rowVw: 2.043269230769231,
            outerVw: 2.34375,
            headerInset: 0.5480769230769231,
            rowInset: 0.49038461538461536,
            outerInset: 0.5625,
            control: 16,
          });
          const fixed = Object.freeze([
            Object.freeze({ breakpoint: 520, width: 680, header: 15.528846153846153, row: 13.89423076923077, outer: 15.9375, control: 13 }),
            Object.freeze({ breakpoint: 380, width: 600, header: 13.701923076923077, row: 12.259615384615385, outer: 14.0625, control: 12 }),
          ]);
          const close = (actual, expected, tolerance = 1e-12) => Math.abs(actual - expected) <= tolerance;
          const sources = Object.freeze([["hydrated", shared], ["first-paint generator", projection], ["generated first-paint", index]]);

          assert.match(styles, /--mfl-table-header-height: 38px;/);
          assert.match(styles, /--mfl-table-row-height: 34px;/);
          assert.match(styles, /--mfl-table-row-outer-height: 39px;/);
          assert.match(styles, /--mfl-table-col-listing: 6\.3904569176696135%;/);
          assert.match(styles, /--mfl-table-col-positions: 7\.508786878261796%;/);

          const tabletMinScale = tablet.minWidth / desktop.width;
          assert.ok(close(tablet.minHeader / desktop.header, tabletMinScale));
          assert.ok(close(tablet.minRow / desktop.row, tabletMinScale));
          assert.ok(close(tablet.minOuter / desktop.outer, tabletMinScale));
          assert.ok(close(tablet.headerVw, 100 * desktop.header / desktop.width));
          assert.ok(close(tablet.rowVw, 100 * desktop.row / desktop.width));
          assert.ok(close(tablet.outerVw, 100 * desktop.outer / desktop.width));
          assert.ok(close(tablet.headerInset, tablet.horizontalInset * desktop.header / desktop.width));
          assert.ok(close(tablet.rowInset, tablet.horizontalInset * desktop.row / desktop.width));
          assert.ok(close(tablet.outerInset, tablet.horizontalInset * desktop.outer / desktop.width));
          assert.ok(tablet.control <= tablet.minRow);

          const widestTabletViewport = tablet.breakpoint;
          const widestTabletTable = Math.max(tablet.minWidth, widestTabletViewport - tablet.horizontalInset);
          const widestTabletScale = widestTabletTable / desktop.width;
          assert.ok(close(tablet.headerVw * widestTabletViewport / 100 - tablet.headerInset, desktop.header * widestTabletScale));
          assert.ok(close(tablet.rowVw * widestTabletViewport / 100 - tablet.rowInset, desktop.row * widestTabletScale));
          assert.ok(close(tablet.outerVw * widestTabletViewport / 100 - tablet.outerInset, desktop.outer * widestTabletScale));

          const tabletDeclarations = [
            "--mfl-table-header-height: max(18.72596153846154px, calc(2.2836538461538463vw - 0.5480769230769231px));",
            "--mfl-table-row-height: max(16.754807692307693px, calc(2.043269230769231vw - 0.49038461538461536px));",
            "--mfl-table-row-outer-height: max(19.21875px, calc(2.34375vw - 0.5625px));",
          ];
          for (const [name, source] of sources) {
            for (const declaration of tabletDeclarations) {
              assert.ok(source.includes(declaration), `${name} missing width-aware <=900px geometry: ${declaration}`);
            }
            assert.ok(source.includes(`min-width: ${tablet.minWidth}px;`), `${name} missing <=900px table minimum width.`);
          }

          for (const geometry of fixed) {
            const scale = geometry.width / desktop.width;
            assert.ok(close(geometry.header / desktop.header, scale), `<=${geometry.breakpoint}px header/table scale mismatch.`);
            assert.ok(close(geometry.row / desktop.row, scale), `<=${geometry.breakpoint}px cell/table scale mismatch.`);
            assert.ok(close(geometry.outer / desktop.outer, scale), `<=${geometry.breakpoint}px outer-row/table scale mismatch.`);
            assert.ok(geometry.control <= geometry.row, `<=${geometry.breakpoint}px fixed controls must fit within row content.`);
            for (const [name, source] of sources) {
              assert.ok(source.includes(`--mfl-table-header-height: ${geometry.header}px;`), `${name} missing <=${geometry.breakpoint}px header.`);
              assert.ok(source.includes(`--mfl-table-row-height: ${geometry.row}px;`), `${name} missing <=${geometry.breakpoint}px row.`);
              assert.ok(source.includes(`--mfl-table-row-outer-height: ${geometry.outer}px;`), `${name} missing <=${geometry.breakpoint}px outer row.`);
              assert.ok(source.includes(`min-width: ${geometry.width}px;`), `${name} missing <=${geometry.breakpoint}px table width.`);
            }
          }

          assert.doesNotMatch(shared, /--mfl-table-col-(?:listing|positions)\s*:/, "Hydrated mobile CSS must not alter desktop column percentages.");
          assert.doesNotMatch(shared, /style\.setProperty\("--mfl-table-col-(?:listing|positions)"/, "Hydration must not alter canonical Listing or Positions percentages.");
          assert.doesNotMatch(projection, /--mfl-table-col-(?:listing|positions)\s*:/, "First-paint projection must not alter desktop column percentages.");
          assert.doesNotMatch(index, /--mfl-table-col-listing:\s*(?:4\.2|3\.8|3\.6)%|--mfl-table-col-positions:\s*(?:9\.699243795931409|10\.099243795931411|10\.29924379593141)%/);
          assert.match(shared, /overflow-x: auto;\n {4}overflow-y: hidden;/);
          assert.match(styles, /#progressionPage \.playerTableScroller col\.col-name \{ width: var\(--mfl-table-col-name\); \}/);
          assert.match(styles, /#progressionPage \.playerTableScroller th \{\n {2}height: var\(--mfl-table-header-height\);/);
          assert.match(styles, /#progressionPage \.playerTableScroller td \{\n {2}height: var\(--mfl-table-row-height\);/);
          assert.doesNotMatch(shared, /!important/);
          console.log("Responsive player-table dimensions preserve desktop proportions across first paint and hydration.");
          ''').replace("          ", "").lstrip(), encoding="utf-8")
          PY

          node site/sync-release-projections.mjs

      - name: Install and validate site
        working-directory: site
        run: |
          npm install --no-audit --no-fund
          npm run check

      - name: Remove refinement scaffolding and push final commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/refine-issue-599*.yml
          git diff --check
          git add -A -- .github/workflows site/shared-table-ui-runtime.js site/sync-release-projections.mjs site/index.html site/validate-responsive-table-proportions.mjs site/validate-mobile-table-compact-contract.mjs site/validate-mobile-table-retry.mjs
          if git diff --cached --quiet; then
            echo "Nothing to finalize."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Finalize responsive table proportions"
          git push origin HEAD:fix/599-responsive-table-proportions

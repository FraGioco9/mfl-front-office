name: One-time identical table columns

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/one-time-identical-table-columns.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Patch app.js
        run: python -c "import base64;exec(base64.b64decode('').decode())"
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/app.js .github/workflows/one-time-identical-table-columns.yml
          git commit -m "Keep shared table columns identical across views"
          git push

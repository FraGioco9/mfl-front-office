name: Issue 374 table refresh loading flicker

on:
  push:
    branches:
      - fix/table-refresh-loading-flicker
    paths:
      - .github/workflows/issue-374-table-refresh-loading-flicker.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/table-refresh-loading-flicker

      - name: Preserve one refresh loading surface
        run: python .github/scripts/issue-374-table-refresh-loading-flicker.py

      - name: Build generated core
        working-directory: site
        run: npm run build:core

      - name: Run focused loading validation
        working-directory: site
        run: |
          node validate-table-loading-state.mjs
          node validate-loading-ownership.mjs
          node validate-bootstrap-ownership.mjs

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/table-loading-runtime.js site/modules/app-core.js site/modules/app-core*-runtime.js site/validate-table-loading-state.mjs
          git diff --cached --quiet && exit 1
          git commit -m "Stabilize table refresh loading surface"
          git push origin HEAD:fix/table-refresh-loading-flicker

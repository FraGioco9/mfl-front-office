name: Apply opted-out first-paint parity fix

on:
  push:
    branches: [fix/opted-out-footer-distance]
    paths: [.github/workflows/apply-opted-out-first-paint-parity.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/opted-out-footer-distance
      - name: Apply first-paint parity fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          locked_prefix_old = 'html:not(.mflInitialRouteResolved):not([data-initial-entity-route="player"])'
          locked_prefix_new = 'html:not(.mflInitialRouteResolved):not([data-initial-entity-route="player"]):not([data-stored-wallet-opt-in="false"][data-initial-locked-page])'

          footer_path = Path('site/footer.css')
          footer = footer_path.read_text(encoding='utf-8')
          count = footer.count(locked_prefix_old)
          if count != 3:
              raise SystemExit(f'Expected 3 unresolved footer fallback selectors; found {count}')
          footer = footer.replace(locked_prefix_old, locked_prefix_new)
          footer = footer.replace(
              ' * Player is deliberately excluded: its pre-footer static shell is measurable from\n * parser time, so normal flex flow must place the footer after its real bottom edge.\n',
              ' * Player and opted-out protected routes are deliberately excluded: their pre-footer\n * static shells are measurable from parser time, so normal flex flow must own first paint too.\n',
          )
          footer_path.write_text(footer, encoding='utf-8')

          first_paint_path = Path('site/html-sources/first-paint.html')
          first_paint = first_paint_path.read_text(encoding='utf-8')
          old_hide = '''      html[data-stored-wallet-opt-in="false"]:not(.mflInitialRouteResolved):is(
        [data-initial-page^="my-players"],
        [data-initial-page^="watchlist"],
        [data-initial-page="settings"]
      ) #homePage {
        display: none;
      }
'''
          new_hide = '''      html[data-stored-wallet-opt-in="false"]:not(.mflInitialRouteResolved):not(.mflInitialRouteSuperseded):is(
        [data-initial-page^="my-players"],
        [data-initial-page^="watchlist"],
        [data-initial-page="settings"]
      ) main > .pageView:not(#myPlayersLockedPage) {
        display: none;
      }
'''
          old_show = '''      html[data-stored-wallet-opt-in="false"]:not(.mflInitialRouteResolved):is(
        [data-initial-page^="my-players"],
        [data-initial-page^="watchlist"],
        [data-initial-page="settings"]
      ) #myPlayersLockedPage {
        display: grid;
        place-items: center;
      }
'''
          new_show = '''      html[data-stored-wallet-opt-in="false"]:not(.mflInitialRouteResolved):not(.mflInitialRouteSuperseded):is(
        [data-initial-page^="my-players"],
        [data-initial-page^="watchlist"],
        [data-initial-page="settings"]
      ) #myPlayersLockedPage {
        display: grid;
        place-items: center;
      }
'''
          if first_paint.count(old_hide) != 1 or first_paint.count(old_show) != 1:
              raise SystemExit('Expected opted-out first-paint visibility blocks were not found exactly once')
          first_paint = first_paint.replace(old_hide, new_hide, 1).replace(old_show, new_show, 1)
          first_paint_path.write_text(first_paint, encoding='utf-8')

          validator_path = Path('site/validate-footer-route-coverage.mjs')
          validator = validator_path.read_text(encoding='utf-8')
          old_flow = '''const firstPaintFlow = `html:not(.mflInitialRouteResolved):not([data-initial-entity-route="player"]) body > #appShell > main {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: minmax(var(--mfl-footer-page-floor), max-content) max-content;
  align-content: start;
}`;
const firstPaintFooterFlow = `html:not(.mflInitialRouteResolved):not([data-initial-entity-route="player"]) body > #appShell > main > .siteFooterDetails {
  grid-column: 1;
  grid-row: 2;
}`;
'''
          new_flow = '''const firstPaintFallbackOwner = 'html:not(.mflInitialRouteResolved):not([data-initial-entity-route="player"]):not([data-stored-wallet-opt-in="false"][data-initial-locked-page])';
const firstPaintFlow = `${firstPaintFallbackOwner} body > #appShell > main {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: minmax(var(--mfl-footer-page-floor), max-content) max-content;
  align-content: start;
}`;
const firstPaintFooterFlow = `${firstPaintFallbackOwner} body > #appShell > main > .siteFooterDetails {
  grid-column: 1;
  grid-row: 2;
}`;
'''
          if old_flow not in validator:
              raise SystemExit('Expected footer fallback validation block not found')
          validator = validator.replace(old_flow, new_flow, 1)
          marker = 'assert.ok(pageLifecycle.includes("myPlayersLockedPage.hidden = false;"), "SPA navigation must reveal the same normal-flow locked shell for opted-out protected routes.");\n'
          addition = '''

const optedOutFirstPaintScope = 'html[data-stored-wallet-opt-in="false"]:not(.mflInitialRouteResolved):not(.mflInitialRouteSuperseded):is(';
assert.ok(html.includes(optedOutFirstPaintScope), "Opted-out protected routes must own an explicit parser-time first-paint scope.");
assert.ok(html.includes(') main > .pageView:not(#myPlayersLockedPage) {\\n        display: none;'), "Opted-out refresh must exclude every competing route shell before first paint.");
assert.ok(html.includes(') #myPlayersLockedPage {\\n        display: grid;\\n        place-items: center;'), "The locked shell must be visible and centered before bootstrap.");
assert.ok(footer.includes(':not([data-stored-wallet-opt-in="false"][data-initial-locked-page]) body > #appShell > main {'), "Opted-out protected refreshes must bypass the unresolved grid fallback and retain canonical flex flow from first paint.");
const lockedCopyIndex = html.indexOf('const copy = {');
const bootstrapScriptIndex = html.indexOf('<script src="/bootstrap.js"></script>');
assert.ok(lockedCopyIndex >= 0 && bootstrapScriptIndex > lockedCopyIndex, "Route-specific opted-out copy must be projected synchronously before bootstrap can settle the route.");
'''
          if marker not in validator:
              raise SystemExit('Expected locked-page lifecycle validation marker not found')
          validator = validator.replace(marker, marker + addition, 1)
          validator_path.write_text(validator, encoding='utf-8')
          PY

          cd site
          node build-html.mjs
          node validate-footer-route-coverage.mjs
          cd ..

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/footer.css site/html-sources/first-paint.html site/index.html site/validate-footer-route-coverage.mjs
          git commit -m "Stabilize opted-out first paint geometry"
          git push origin HEAD:fix/opted-out-footer-distance

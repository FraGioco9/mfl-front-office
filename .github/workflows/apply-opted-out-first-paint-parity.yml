name: Apply opted-out first-paint parity fix

on:
  push:
    branches:
      - fix/opted-out-footer-distance
    paths:
      - .github/workflows/apply-opted-out-first-paint-parity.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/opted-out-footer-distance
      - name: Apply guarded source patch
        run: python .github/scripts/apply-opted-out-first-paint-parity.py
      - name: Rebuild and validate
        working-directory: site
        run: |
          node build-html.mjs
          node validate-footer-route-coverage.mjs
      - name: Commit branch update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/footer.css site/html-sources/first-paint.html site/index.html site/validate-footer-route-coverage.mjs
          git commit -m "Stabilize opted-out first paint geometry"
          git push origin HEAD:fix/opted-out-footer-distance

name: Temporary rebase PR 455
on:
  push:
    branches: [feat/issue-429-player-table-actions]
    paths: [.github/workflows/tmp-rebase-pr-455.yml]
permissions:
  contents: write
jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/issue-429-player-table-actions
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Rebase onto latest main
        run: |
          START_SHA=$(git rev-parse HEAD)
          echo "START_SHA=$START_SHA" >> "$GITHUB_ENV"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main feat/issue-429-player-table-actions
          git rebase origin/main
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/tmp-rebase-pr-455.yml
      - name: Install dependencies
        working-directory: site
        run: npm install --no-audit --no-fund
      - name: Build canonical application core
        working-directory: site
        run: npm run build:core
      - name: Lint
        working-directory: site
        run: npm run lint
      - name: Typecheck
        working-directory: site
        run: npm run typecheck
      - name: Validate repository
        working-directory: site
        run: npm run validate
      - name: Commit generated or cleanup changes
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'rebase PR 455 onto latest main'
          fi
      - name: Push rebased branch
        run: |
          git push --force-with-lease=refs/heads/feat/issue-429-player-table-actions:${START_SHA} origin HEAD:feat/issue-429-player-table-actions

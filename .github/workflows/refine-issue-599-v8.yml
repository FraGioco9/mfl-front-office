name: Complete issue 599 table refinement

on:
  push:
    branches:
      - fix/599-responsive-table-proportions

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Apply and validate final responsive table refinement
        shell: bash
        run: |
          set -euo pipefail
          git show d43daffa4d1e3dc8924408fc3cc8aa31b32106ee:.github/workflows/refine-issue-599.yml \
            | sed -n "/^          python - <<'PY'$/,/^          PY$/p" \
            | sed '1d;$d;s/^          //' > /tmp/refine-599.py
          git show 273afb13ff801ba35aa664c41c0567784170812f:.github/workflows/refine-issue-599-v5.yml \
            | sed -n "/^          python - <<'PY'$/,/^          PY$/p" \
            | sed '1d;$d;s/^          //' > /tmp/finalize-599.py
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/finalize-599.py')
          lines = path.read_text().splitlines()
          start_one = next(i for i, line in enumerate(lines) if line.strip() == "'''function compactMobilePlayerName(value) {")
          lines[start_one] = lines[start_one].replace("'''", '"""', 1)
          end_one = next(i for i in range(start_one + 1, len(lines)) if lines[i].strip() == "}''',")
          lines[end_one] = lines[end_one].replace("'''", '"""', 1)
          start_two = next(i for i in range(end_one + 1, len(lines)) if lines[i].strip() == "'''const MOBILE_PLAYER_SURNAME_PARTICLES = new Set([")
          lines[start_two] = lines[start_two].replace("'''", '"""', 1)
          end_two = next(i for i in range(start_two + 1, len(lines)) if lines[i].strip() == "}''',")
          lines[end_two] = lines[end_two].replace("'''", '"""', 1)
          text = "\n".join(lines) + "\n"
          text = text.replace("start_marker = '          # Update compact-table regression expectations.\\n'", "start_marker = '# Update compact-table regression expectations.\\n'", 1)
          text = text.replace("end_marker = '          # Retry regression: geometry/font values and compact-heading policy.\\n'", "end_marker = '# Retry regression: geometry/font values and compact-heading policy.\\n'", 1)
          path.write_text(text)
          PY
          python /tmp/finalize-599.py
          git reset --hard 9e09523322294b29a160ad6fd285fe0f841703c7
          python /tmp/refine-599.py
          node site/sync-release-projections.mjs
          cd site
          npm ci
          npm run check
          cd ..
          git config user.name "FraGioco9"
          git config user.email "29951460+FraGioco9@users.noreply.github.com"
          git add site
          git commit -m "Refine small-screen table presentation"
          git push --force-with-lease origin HEAD:fix/599-responsive-table-proportions

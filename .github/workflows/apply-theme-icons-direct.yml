name: Apply direct theme icon replacement

on:
  push:
    branches:
      - feat/517-theme-mode-icons-retry

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/517-theme-mode-icons-retry
          fetch-depth: 0
      - name: Replace legacy theme icons at source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index_path = Path('site/index.html')
          markup = index_path.read_text(encoding='utf-8')
          old = '<button id="themeButton" class="themeButton" type="button" aria-label="Toggle color mode" title="Toggle color mode"><span class="themeMoonSymbol" aria-hidden="true">&#127769;</span><span class="themeSunSymbol" aria-hidden="true">&#9728;&#65039;</span></button>'
          new = '<button id="themeButton" class="themeButton" type="button" aria-label="Toggle color mode" title="Toggle color mode"><svg class="themeMoonSymbol themeModeIcon" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M18.8 17.2A8 8 0 1 1 10.2 3.8a7.1 7.1 0 0 0 8.6 13.4Z"></path></svg><svg class="themeSunSymbol themeModeIcon" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5.2"></circle><path d="M12 1.8v2.6M12 19.6v2.6M1.8 12h2.6M19.6 12h2.6M4.8 4.8l1.8 1.8M17.4 17.4l1.8 1.8M4.8 19.2l1.8-1.8M17.4 6.6l1.8-1.8"></path></svg></button>'
          if old not in markup:
              raise SystemExit('Legacy theme button markup was not found exactly once.')
          index_path.write_text(markup.replace(old, new, 1), encoding='utf-8')

          motion_path = Path('site/motion.css')
          motion = motion_path.read_text(encoding='utf-8')
          motion_path.write_text(motion.replace('@import url("/theme-icons.css");\n', ''), encoding='utf-8')

          Path('site/theme-icons.css').unlink(missing_ok=True)

          Path('site/validate-theme-icons.mjs').write_text('''import { access, readFile } from "node:fs/promises";\n\nconst markup = String(await readFile(new URL("./index.html", import.meta.url), "utf8")).replace(/\\r\\n?/g, "\\n");\nconst motion = String(await readFile(new URL("./motion.css", import.meta.url), "utf8")).replace(/\\r\\n?/g, "\\n");\nconst invariant = (condition, message) => {\n  if (!condition) throw new Error(message);\n};\n\ninvariant(!markup.includes("&#127769;") && !markup.includes("&#9728;") && !markup.includes("🌙") && !markup.includes("☀️"), "Legacy emoji theme icons must be removed from canonical markup.");\ninvariant(markup.includes('<svg class="themeMoonSymbol themeModeIcon" width="22" height="22" viewBox="0 0 24 24"') && markup.includes('d="M18.8 17.2A8 8 0 1 1 10.2 3.8a7.1 7.1 0 0 0 8.6 13.4Z"'), "Theme button must contain the recreated outlined crescent SVG directly in canonical markup.");\ninvariant(markup.includes('<svg class="themeSunSymbol themeModeIcon" width="22" height="22" viewBox="0 0 24 24"') && markup.includes('<circle cx="12" cy="12" r="5.2"></circle>') && markup.includes('d="M12 1.8v2.6M12 19.6v2.6M1.8 12h2.6M19.6 12h2.6M4.8 4.8l1.8 1.8M17.4 17.4l1.8 1.8M4.8 19.2l1.8-1.8M17.4 6.6l1.8-1.8"'), "Theme button must contain the recreated outlined sun SVG directly in canonical markup.");\ninvariant(markup.includes('stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"'), "Theme SVGs must use the shared rounded currentColor outline treatment.");\ninvariant(markup.includes('#themeButton .themeSunSymbol {\\n        display: none;\\n      }') && markup.includes('html[data-theme="dark"] #themeButton .themeMoonSymbol {\\n        display: none;\\n      }') && markup.includes('html[data-theme="dark"] #themeButton .themeSunSymbol {\\n        display: inline;\\n      }'), "Existing first-paint theme visibility ownership must remain intact.");\ninvariant(!motion.includes('theme-icons.css'), "Theme icons must not rely on a replacement stylesheet after direct inline SVG ownership.");\nlet replacementStylesheetExists = true;\ntry { await access(new URL("./theme-icons.css", import.meta.url)); } catch { replacementStylesheetExists = false; }\ninvariant(!replacementStylesheetExists, "The previous theme icon replacement stylesheet must be removed.");\n\nconsole.log("Direct inline theme icon validation passed.");\n''', encoding='utf-8')

          Path('.github/workflows/apply-theme-icons-direct.yml').unlink()
          PY
      - name: Commit direct theme icon replacement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ui): replace legacy theme icons directly"
          git push origin HEAD:feat/517-theme-mode-icons-retry

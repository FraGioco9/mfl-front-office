name: Apply app core splitter optimization

on:
  push:
    branches:
      - chore/app-core-splitter-architecture
  pull_request:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/app-core-splitter-architecture
          fetch-depth: 0
      - name: Apply tested splitter refactor
        shell: bash
        run: |
          set -euo pipefail
          cat .github/splitter-migration.part* | base64 -d > /tmp/apply-splitter.mjs
          node /tmp/apply-splitter.mjs
          rm -f .github/splitter-migration.part*
          git config user.name "FraGioco9"
          git config user.email "giocolifrancesco@gmail.com"
          git add -- \
            site/modules/app-core-splitter-utils.js \
            site/modules/app-core-player-chunk.js \
            site/modules/app-core-route-chunks.js \
            site/modules/app-core-settings-chunk.js \
            site/modules/app-core-table-chunk.js \
            site/modules/app-core-wallet-chunk.js \
            site/modules/app-core-watchlist-route-chunk.js \
            site/validate-app-core-splitter-architecture.mjs \
            site/validate-all.mjs \
            site/validate-player-route-core.mjs \
            site/validate-table-route-core.mjs \
            site/validate-wallet-core.mjs \
            site/validate-watchlist-route-core.mjs \
            .github/workflows/app-core-splitter-snapshot.yml \
            .github/workflows/app-core-splitter-apply.yml \
            .github/splitter-migration.part00 \
            .github/splitter-migration.part01 \
            .github/splitter-migration.part02 \
            .github/splitter-migration.part03 \
            .github/splitter-migration.part04 \
            .github/splitter-migration.part05
          git diff --cached --check
          git commit -m "Centralize application core splitter primitives"
          git push origin HEAD:chore/app-core-splitter-architecture

name: MFL marketplace snapshot
run-name: MFL marketplace snapshot [${{ inputs.occurrence_key || github.run_id }}]

on:
  pull_request:
    paths:
      - "scripts/workflows/mfl-marketplace-*.sh"
      - "scripts/__init__.py"
      - "scripts/marketplace/__init__.py"
      - "tests/workflow_sources.py"
      - "scripts/marketplace/mfl_marketplace_cadence.py"
      - "scripts/marketplace/mfl_marketplace_snapshot.py"
      - "scripts/marketplace/mfl_marketplace_events.py"
      - "scripts/marketplace/mfl_marketplace_runtime_state.py"
      - "tests/test_mfl_marketplace_snapshot.py"
      - "tests/test_mfl_marketplace_events.py"
      - "tests/test_mfl_marketplace_runtime_state.py"
      - "tests/test_reliable_marketplace_scheduler.py"
      - "tests/test_marketplace_scheduler.mjs"
      - "supabase/config.toml"
      - "supabase/marketplace-snapshot-scheduler.sql"
      - "supabase/functions/mfl-marketplace-dispatch/**"
      - ".github/workflows/mfl-marketplace-snapshot.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/workflows/mfl-marketplace-*.sh"
      - "scripts/__init__.py"
      - "scripts/marketplace/__init__.py"
      - "tests/workflow_sources.py"
      - "scripts/marketplace/mfl_marketplace_cadence.py"
      - "scripts/marketplace/mfl_marketplace_snapshot.py"
      - "scripts/marketplace/mfl_marketplace_events.py"
      - "scripts/marketplace/mfl_marketplace_runtime_state.py"
      - "tests/test_mfl_marketplace_snapshot.py"
      - "tests/test_mfl_marketplace_events.py"
      - "tests/test_mfl_marketplace_runtime_state.py"
      - "tests/test_reliable_marketplace_scheduler.py"
      - "tests/test_marketplace_scheduler.mjs"
      - "supabase/config.toml"
      - "supabase/marketplace-snapshot-scheduler.sql"
      - "supabase/functions/mfl-marketplace-dispatch/**"
      - ".github/workflows/mfl-marketplace-snapshot.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: Marketplace refresh mode
        required: true
        default: bootstrap
        type: choice
        options:
          - bootstrap
          - incremental
          - reconcile
      workers:
        description: Concurrent Flow wallet queries for bootstrap/reconcile
        required: false
        default: "20"
        type: string
      trigger_source:
        description: External scheduler source
        required: false
        default: ""
        type: string
      intended_at:
        description: Intended Europe/Rome occurrence timestamp
        required: false
        default: ""
        type: string
      occurrence_key:
        description: Stable Marketplace occurrence key
        required: false
        default: ""
        type: string
      triggered_at:
        description: Supabase scheduler dispatch timestamp
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: mfl-marketplace-snapshot-${{ github.event.pull_request.number || 'main-state' }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Compile marketplace process
        run: >-
          python -m py_compile
          scripts/marketplace/mfl_marketplace_cadence.py
          scripts/marketplace/mfl_marketplace_snapshot.py
          scripts/marketplace/mfl_marketplace_events.py
          scripts/marketplace/mfl_marketplace_runtime_state.py
          tests/test_mfl_marketplace_snapshot.py
          tests/test_mfl_marketplace_events.py
          tests/test_mfl_marketplace_runtime_state.py
          tests/test_reliable_marketplace_scheduler.py

      - name: Run marketplace regression tests
        run: >-
          python -m unittest -v
          tests/test_mfl_marketplace_snapshot.py
          tests/test_mfl_marketplace_events.py
          tests/test_mfl_marketplace_runtime_state.py
          tests/test_reliable_marketplace_scheduler.py

      - name: Run Marketplace scheduler time tests
        run: node --test tests/test_marketplace_scheduler.mjs

      - name: Verify Flow event API against mainnet
        run: bash "$GITHUB_WORKSPACE/scripts/workflows/mfl-marketplace-snapshot-verify-flow-event-api-against-mainnet.sh"

  snapshot:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Resolve refresh mode and previous state
        id: mode
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_MODE: ${{ inputs.mode }}
          INPUT_TRIGGER_SOURCE: ${{ inputs.trigger_source }}
          INPUT_INTENDED_AT: ${{ inputs.intended_at }}
          INPUT_OCCURRENCE_KEY: ${{ inputs.occurrence_key }}
          INPUT_TRIGGERED_AT: ${{ inputs.triggered_at }}
        run: bash "$GITHUB_WORKSPACE/scripts/workflows/mfl-marketplace-snapshot-resolve-refresh-mode-and-previous-state.sh"

      - name: Download latest successful MFL database artifact
        if: steps.mode.outputs.mode != 'incremental'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash "$GITHUB_WORKSPACE/scripts/workflows/mfl-marketplace-snapshot-download-latest-successful-mfl-database-artifact.sh"

      - name: Update marketplace state
        env:
          MARKETPLACE_WORKERS: ${{ inputs.workers }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: bash "$GITHUB_WORKSPACE/scripts/workflows/mfl-marketplace-snapshot-update-marketplace-state.sh"

      - name: Validate marketplace state
        run: bash "$GITHUB_WORKSPACE/scripts/workflows/mfl-marketplace-snapshot-validate-marketplace-state.sh"

      - name: Publish marketplace state for site runtime
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: >-
          python -m scripts.marketplace.mfl_marketplace_runtime_state
          --input marketplace-output/mfl_marketplace_listings.json

      - name: Upload marketplace state
        uses: actions/upload-artifact@v7
        with:
          name: mfl_marketplace_state
          path: marketplace-output/mfl_marketplace_listings.json
          if-no-files-found: error
          retention-days: 1

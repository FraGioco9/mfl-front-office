name: Apply Club route title fix

on:
  push:
    branches:
      - fix/club-invalid-route-title-stability

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/club-invalid-route-title-stability
      - name: Apply source patch
        run: python3 site/apply-club-route-title-fix.py
      - name: Remove temporary patch files and commit
        run: |
          rm -f site/apply-club-route-title-fix.py .github/workflows/apply-club-route-title-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix invalid Club routes and preserve Club titles"
          git push origin HEAD:fix/club-invalid-route-title-stability

name: Vercel site update

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: database-and-vercel-site
  cancel-in-progress: false

jobs:
  deploy-site:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download latest available database
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          LATEST_RUN_ID=""
          while IFS=$'\t' read -r CREATED_AT RUN_ID; do
            [ -n "$RUN_ID" ] || continue

            ARTIFACT_NAME="$(
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" \
                --jq '.artifacts[] | select(.name == "mfl_database" and .expired == false) | .name' \
                | head -n 1
            )"

            if [ "$ARTIFACT_NAME" = "mfl_database" ]; then
              LATEST_RUN_ID="$RUN_ID"
              echo "Using mfl_database from run $RUN_ID ($CREATED_AT)."
              break
            fi
          done < <(
            gh run list \
              --status success \
              --limit 100 \
              --json databaseId,createdAt \
              --jq '.[] | [.createdAt, .databaseId] | @tsv'
          )

          if [ -z "$LATEST_RUN_ID" ]; then
            echo "No non-expired mfl_database artifact was found." >&2
            exit 1
          fi

          gh run download "$LATEST_RUN_ID" --name mfl_database --dir .
          test -f mfl_database.db
          ls -lh mfl_database.db

      - name: Export website data
        shell: bash
        run: |
          set -euo pipefail
          ln -sf mfl_database.db mfl_progression.db
          python export_for_website.py

      - name: Move data behind protected API
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site/api/data-files
          mkdir -p site/api/data-files
          mv site/data/*.json site/api/data-files/
          rmdir site/data
          test -f site/api/data-files/manifest.json

      - name: Show released site commit
        shell: bash
        run: |
          set -euo pipefail
          echo "Deploying site source from commit ${GITHUB_SHA}."
          grep -m 1 -E 'RELEASE_VERSION|const VERSION' site/app.js site/bootstrap.js || true

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Connect Vercel project
        shell: bash
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Deploy protected site to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prod --yes --build-env ALLOW_VERCEL_ACTION_DEPLOY=1 --token "$VERCEL_TOKEN"

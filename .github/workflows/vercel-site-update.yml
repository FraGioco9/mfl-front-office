name: Vercel site update

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: database-and-vercel-site
  cancel-in-progress: false

jobs:
  deploy-site:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download latest available database
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          LATEST_RUN_ID=""
          while IFS=$'\t' read -r CREATED_AT RUN_ID; do
            [ -n "$RUN_ID" ] || continue

            ARTIFACT_NAME="$(
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" \
                --jq '.artifacts[] | select(.name == "mfl_database" and .expired == false) | .name' \
                | head -n 1
            )"

            if [ "$ARTIFACT_NAME" = "mfl_database" ]; then
              LATEST_RUN_ID="$RUN_ID"
              echo "Using mfl_database from run $RUN_ID ($CREATED_AT)."
              break
            fi
          done < <(
            gh run list \
              --status success \
              --limit 100 \
              --json databaseId,createdAt \
              --jq '.[] | [.createdAt, .databaseId] | @tsv'
          )

          if [ -z "$LATEST_RUN_ID" ]; then
            echo "No non-expired mfl_database artifact was found." >&2
            exit 1
          fi

          gh run download "$LATEST_RUN_ID" --name mfl_database --dir .
          test -s mfl_database.db
          ls -lh mfl_database.db

      - name: Install runtime SQLite database
        shell: bash
        run: |
          set -euo pipefail

          rm -rf site/api/data-files
          mkdir -p site/api/data-files
          mv mfl_database.db site/api/data-files/mfl_database.db
          python prepare_runtime_database.py site/api/data-files/mfl_database.db --validate-only

          test -s site/api/data-files/mfl_database.db
          test -f site/api/_database.js
          test -f site/api/data.js
          if find site/api/data-files -maxdepth 1 -type f -name '*.json' | grep -q .; then
            echo "Generated JSON data files are not allowed." >&2
            exit 1
          fi
          ls -lh site/api/data-files/mfl_database.db

      - name: Build canonical application core
        shell: bash
        run: |
          set -euo pipefail
          node site/build-app-core.mjs
          test -s site/modules/app-core-runtime.js

      - name: Show released site commit
        shell: bash
        run: |
          set -euo pipefail
          echo "Deploying site source from commit ${GITHUB_SHA}."
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          release = json.loads(Path("site/release.json").read_text(encoding="utf-8"))
          version = str(release.get("version", "")).strip()
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit("site/release.json does not contain a valid Semantic Version")
          print(f"Deploying MFL Front Office v{version}.")
          PY

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Connect Vercel project
        shell: bash
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Deploy protected site to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prod --yes --force --local-config site/vercel.production.json --build-env ALLOW_VERCEL_ACTION_DEPLOY=1 --token "$VERCEL_TOKEN"

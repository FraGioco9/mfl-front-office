name: Vercel site update

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact 40-character main commit SHA approved for production
        required: true
        type: string
      release_approval:
        description: Explicit production release approval
        required: true
        default: NO_DEPLOY
        type: choice
        options:
          - NO_DEPLOY
          - DEPLOY_PRODUCTION

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: database-and-vercel-site
  cancel-in-progress: false

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_sha: ${{ steps.gate.outputs.release_sha }}
      fingerprint: ${{ steps.gate.outputs.fingerprint }}
      check_count: ${{ steps.gate.outputs.check_count }}
      quality_check_id: ${{ steps.gate.outputs.quality_check_id }}

    steps:
      - name: Validate dispatch target and approval
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_APPROVAL: ${{ inputs.release_approval }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Production releases must be dispatched from main; got $GITHUB_REF." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "release_sha must be an exact 40-character Git commit SHA." >&2
            exit 1
          fi
          RELEASE_SHA="${RELEASE_SHA,,}"
          MAIN_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          MAIN_SHA="${MAIN_SHA,,}"

          if [ "$RELEASE_SHA" != "$MAIN_SHA" ]; then
            echo "Requested release SHA $RELEASE_SHA is not current main $MAIN_SHA." >&2
            exit 1
          fi
          if [ "$RELEASE_APPROVAL" != "DEPLOY_PRODUCTION" ]; then
            echo "Explicit DEPLOY_PRODUCTION approval is required." >&2
            exit 1
          fi

          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "main_sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"

      - name: Download pinned release source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.release_sha }}
          fetch-depth: 1

      - name: Verify exact-head release checks
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
          MAIN_SHA: ${{ steps.release.outputs.main_sha }}
          RELEASE_APPROVAL: ${{ inputs.release_approval }}
        run: |
          set -euo pipefail

          CHECKS_FILE="$RUNNER_TEMP/ops03-check-runs.json"
          gh api             -H "Accept: application/vnd.github+json"             "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_SHA}/check-runs?per_page=100"             > "$CHECKS_FILE"

          node scripts/workflows/production-release-preflight.mjs             --release-sha "$RELEASE_SHA"             --main-sha "$MAIN_SHA"             --approval "$RELEASE_APPROVAL"             --checks-file "$CHECKS_FILE"             --github-output "$GITHUB_OUTPUT"

      - name: Summarize release preflight
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.gate.outputs.release_sha }}
          PREFLIGHT_FINGERPRINT: ${{ steps.gate.outputs.fingerprint }}
          CHECK_COUNT: ${{ steps.gate.outputs.check_count }}
          QUALITY_CHECK_ID: ${{ steps.gate.outputs.quality_check_id }}
        run: |
          {
            echo "### Production release preflight"
            echo
            echo "- Release SHA: \`$RELEASE_SHA\`"
            echo "- Exact-head checks reviewed: $CHECK_COUNT"
            echo "- Required quality check id: $QUALITY_CHECK_ID"
            echo "- Preflight fingerprint: \`$PREFLIGHT_FINGERPRINT\`"
            echo "- Deployment has not started yet."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-site:
    needs: preflight
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_SHA: ${{ needs.preflight.outputs.release_sha }}
      VERCEL_CLI_VERSION: "62.5.0"

    steps:
      - name: Download pinned repository release
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.release_sha }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download latest available database
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          LATEST_RUN_ID=""
          LATEST_ARTIFACT_ID=""
          LATEST_CREATED_AT=""

          while IFS=$'\t' read -r CREATED_AT ARTIFACT_ID RUN_ID; do
            [ -n "$ARTIFACT_ID" ] || continue
            [ -n "$RUN_ID" ] || continue

            rm -f mfl_database.db
            echo "Checking mfl_database artifact $ARTIFACT_ID from run $RUN_ID ($CREATED_AT)."

            if ! gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name mfl_database --dir .; then
              echo "Artifact $ARTIFACT_ID could not be downloaded; trying the next candidate."
              continue
            fi

            if python -m scripts.database.prepare_runtime_database mfl_database.db --validate-only; then
              LATEST_RUN_ID="$RUN_ID"
              LATEST_ARTIFACT_ID="$ARTIFACT_ID"
              LATEST_CREATED_AT="$CREATED_AT"
              break
            fi

            rm -f mfl_database.db
            echo "Artifact $ARTIFACT_ID does not contain a valid prepared mfl_database.db; trying the next candidate."
          done < <(
            gh api --paginate               "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=mfl_database&per_page=100"               --jq '.artifacts[] | select(.name == "mfl_database" and .expired == false) | [.created_at, (.id | tostring), (.workflow_run.id | tostring)] | @tsv'               | sort -r
          )

          if [ -z "$LATEST_RUN_ID" ]; then
            echo "No valid non-expired mfl_database artifact was found." >&2
            exit 1
          fi

          echo "Using mfl_database artifact $LATEST_ARTIFACT_ID from run $LATEST_RUN_ID ($LATEST_CREATED_AT)."
          test -s mfl_database.db
          ls -lh mfl_database.db

      - name: Install runtime SQLite database
        shell: bash
        run: |
          set -euo pipefail

          rm -rf api/data-files
          mkdir -p api/data-files
          mv mfl_database.db api/data-files/mfl_database.db
          python -m scripts.database.prepare_runtime_database api/data-files/mfl_database.db --validate-only

          test -s api/data-files/mfl_database.db
          test -f api/_database.js
          test -f api/data.js
          if find api/data-files -maxdepth 1 -type f -name '*.json' | grep -q .; then
            echo "Generated JSON data files are not allowed." >&2
            exit 1
          fi
          ls -lh api/data-files/mfl_database.db

      - name: Record expected production identity
        shell: bash
        env:
          EXPECTED_SITE_SHA: ${{ needs.preflight.outputs.release_sha }}
        run: bash scripts/workflows/record-production-identity.sh

      - name: Record production preflight fingerprint
        shell: bash
        env:
          PREFLIGHT_FINGERPRINT: ${{ needs.preflight.outputs.fingerprint }}
          CHECK_COUNT: ${{ needs.preflight.outputs.check_count }}
          QUALITY_CHECK_ID: ${{ needs.preflight.outputs.quality_check_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "releaseSha": os.environ["RELEASE_SHA"],
              "preflightFingerprint": os.environ["PREFLIGHT_FINGERPRINT"],
              "checkCount": int(os.environ["CHECK_COUNT"]),
              "qualityCheckId": int(os.environ["QUALITY_CHECK_ID"]),
          }
          path = Path(os.environ["RUNNER_TEMP"]) / "mfl-production-preflight.json"
          path.write_text(json.dumps(payload, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          print(f"Recorded release preflight fingerprint {payload['preflightFingerprint']}.")
          PY

      - name: Install application dependencies
        run: npm ci --no-audit --no-fund

      - name: Show released site commit
        shell: bash
        run: |
          set -euo pipefail
          echo "Deploying site source from commit ${RELEASE_SHA}."
          if [ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]; then
            echo "Checked out commit does not match approved release SHA." >&2
            exit 1
          fi
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          release = json.loads(Path("release.json").read_text(encoding="utf-8"))
          version = str(release.get("version", "")).strip()
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit("release.json does not contain a valid Semantic Version")
          print(f"Deploying MFL Front Office v{version}.")
          PY

      - name: Install Vercel CLI
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      - name: Connect Vercel project
        shell: bash
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Pull production Vercel environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Normalize Vercel repository root
        run: node scripts/workflows/normalize-vercel-project-root.mjs

      - name: Bind deployment commit to prebuilt artifact
        run: node scripts/workflows/write-deployment-commit.mjs "$RELEASE_SHA"

      - name: Validate Vercel edge security headers
        run: node scripts/workflows/sync-vercel-security-headers.mjs

      - name: Build protected Next.js deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ALLOW_VERCEL_ACTION_DEPLOY: "1"
        run: vercel build --prod --yes --token "$VERCEL_TOKEN"

      - name: Verify prebuilt Vercel security header routes
        run: node scripts/workflows/verify-prebuilt-security-headers.mjs

      - name: Verify prebuilt Next.js routing package
        run: node scripts/workflows/verify-prebuilt-next-routing.mjs

      - name: Verify prebuilt deployment identity
        run: node scripts/workflows/verify-prebuilt-deployment-commit.mjs "$RELEASE_SHA"

      - name: Reconfirm release SHA still owns main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT_MAIN="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          CURRENT_MAIN="${CURRENT_MAIN,,}"
          if [ "$CURRENT_MAIN" != "$RELEASE_SHA" ]; then
            echo "main advanced from approved release SHA $RELEASE_SHA to $CURRENT_MAIN; refusing stale production deploy." >&2
            exit 1
          fi

      - name: Stage protected production deployment without domains
        id: stage
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          DEPLOYMENT_URL="$(vercel deploy --prebuilt --prod --skip-domain --yes --force --token "$VERCEL_TOKEN")"
          DEPLOYMENT_URL="$(printf '%s' "$DEPLOYMENT_URL" | tr -d '\r\n')"
          node --input-type=module - "$DEPLOYMENT_URL" <<'NODE'
          const value = process.argv[2];
          const url = new URL(value);
          if (url.protocol !== "https:" || url.origin !== value || !url.hostname.endsWith(".vercel.app")) {
            throw new Error(`Unexpected staged deployment URL: ${value}`);
          }
          NODE
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "Staged production deployment: $DEPLOYMENT_URL"

      - name: Verify staged identity, database and SSR routes
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          STAGED_DEPLOYMENT_URL: ${{ steps.stage.outputs.deployment_url }}
        run: bash scripts/workflows/verify-staged-vercel-deployment.sh

      - name: Reconfirm release SHA before production promotion
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT_MAIN="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          CURRENT_MAIN="${CURRENT_MAIN,,}"
          if [ "$CURRENT_MAIN" != "$RELEASE_SHA" ]; then
            echo "main advanced from approved release SHA $RELEASE_SHA to $CURRENT_MAIN; refusing promotion." >&2
            exit 1
          fi

      - name: Promote verified deployment to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          STAGED_DEPLOYMENT_URL: ${{ steps.stage.outputs.deployment_url }}
        run: vercel promote "$STAGED_DEPLOYMENT_URL" --yes --token "$VERCEL_TOKEN"

      - name: Verify live production identity and routes
        shell: bash
        env:
          PRODUCTION_DATABASE_URL: https://mfl-front-office.vercel.app/api/data?mode=summary
        run: bash scripts/workflows/verify-live-production-deployment.sh

      - name: Upload deployment identity
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-deployment-identity-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/mfl-production-expected.json
            ${{ runner.temp }}/mfl-production-preflight.json
          if-no-files-found: warn
          retention-days: 90

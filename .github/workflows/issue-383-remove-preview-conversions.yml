name: Issue 383 remove preview conversions

on:
  push:
    branches:
      - fix/evaluation-discount-rate-fallback
    paths:
      - .github/workflows/issue-383-remove-preview-conversions.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/evaluation-discount-rate-fallback

      - name: Remove preview conversion copy
        run: python .github/scripts/issue-383-remove-preview-conversions.py

      - name: Run focused preview validation
        working-directory: site
        run: node validate-evaluation-share-preview.mjs

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/api/_evaluation-preview-value.js site/validate-evaluation-share-preview.mjs
          git diff --cached --quiet && exit 1
          git commit -m "Remove legacy discount conversions from Evaluation preview"
          git push origin HEAD:fix/evaluation-discount-rate-fallback

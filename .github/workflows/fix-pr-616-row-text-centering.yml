name: Fix PR 616 row text centering

on:
  push:
    branches:
      - fix/599-responsive-table-proportions
    paths:
      - .github/workflows/fix-pr-616-row-text-centering.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: fix/599-responsive-table-proportions
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Center row content in actual rendered row
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              source = p.read_text(encoding="utf-8")
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:140]!r}")
              p.write_text(source.replace(old, new, 1), encoding="utf-8")

          styles = "site/styles.css"
          replace_once(
              styles,
              '''#progressionPage .playerTableScroller td {\n  height: var(--mfl-table-row-height);\n  min-height: var(--mfl-table-row-height);\n  line-height: 1.2;\n  vertical-align: middle;\n}\n''',
              '''#progressionPage .playerTableScroller td {\n  height: var(--mfl-table-row-outer-height);\n  min-height: var(--mfl-table-row-outer-height);\n  padding-block: calc((var(--mfl-table-row-outer-height) - var(--mfl-table-row-height) - 1px) / 2);\n  line-height: 1.2;\n  vertical-align: middle;\n}\n\n#progressionPage .playerTableScroller tbody > tr:last-child > td {\n  padding-block: calc((var(--mfl-table-row-outer-height) - var(--mfl-table-row-height)) / 2);\n}\n''',
          )

          validator = "site/validate-table-row-vertical-centering.mjs"
          replace_once(
              validator,
              '''assert.match(playerCellGeometry, /height: var\\(--mfl-table-row-height\\);/, "Player cells must retain the canonical row-content height.");\nassert.match(playerCellGeometry, /min-height: var\\(--mfl-table-row-height\\);/, "Player cells must retain the canonical minimum row-content height.");\nassert.match(playerCellGeometry, /line-height: 1\\.2;/, "Player cells must not use full-row line-height as a vertical-positioning mechanism.");''',
              '''assert.match(playerCellGeometry, /height: var\\(--mfl-table-row-outer-height\\);/, "Player cells must own the full rendered row height.");\nassert.match(playerCellGeometry, /min-height: var\\(--mfl-table-row-outer-height\\);/, "Player cells must retain the full rendered row height as their minimum.");\nassert.match(playerCellGeometry, /padding-block: calc\\(\\(var\\(--mfl-table-row-outer-height\\) - var\\(--mfl-table-row-height\\) - 1px\\) \\/ 2\\);/, "Bordered player rows must split the outer/content height difference equally above and below the content host.");\nassert.match(playerCellGeometry, /line-height: 1\\.2;/, "Player cells must not use full-row line-height as a vertical-positioning mechanism.");''',
          )
          replace_once(
              validator,
              '''assert.doesNotMatch(playerCellGeometry, /line-height: var\\(--mfl-table-row-height\\);/, "Player cells must not vertically position content with row-height line boxes.");\n''',
              '''assert.doesNotMatch(playerCellGeometry, /line-height: var\\(--mfl-table-row-height\\);/, "Player cells must not vertically position content with row-height line boxes.");\n\nconst lastPlayerCellGeometry = styles.match(/#progressionPage \\.playerTableScroller tbody > tr:last-child > td \\{([\\s\\S]*?)\\n\\}/)?.[1] || "";\nassert.match(lastPlayerCellGeometry, /padding-block: calc\\(\\(var\\(--mfl-table-row-outer-height\\) - var\\(--mfl-table-row-height\\)\\) \\/ 2\\);/, "The borderless last row must split the complete outer/content height difference equally above and below its content host.");\n''',
          )
          replace_once(
              validator,
              '''console.log("Every table cell uses middle alignment without full-row line-height positioning, and every player-table header/body item shares a full-height centered content host.");''',
              '''console.log("Every player-table body cell owns the actual rendered row height and symmetrically centers its compact content host, including borderless last rows and responsive row sizes.");''',
          )

          column = "site/validate-table-column-layout.mjs"
          replace_once(
              column,
              '''    && styles.includes("#progressionPage .playerTableScroller td {\\n  height: var(--mfl-table-row-height);\\n  min-height: var(--mfl-table-row-height);\\n  line-height: 1.2;")\n    && !styles.includes("#tableBody > .mflTableLoadingRow > td {\\n  height:"),\n  "Loaded and blank player rows must share the existing 39px outer row height and 34px cell height independently from text line-height.",''',
              '''    && styles.includes("#progressionPage .playerTableScroller td {\\n  height: var(--mfl-table-row-outer-height);\\n  min-height: var(--mfl-table-row-outer-height);\\n  padding-block: calc((var(--mfl-table-row-outer-height) - var(--mfl-table-row-height) - 1px) / 2);\\n  line-height: 1.2;")\n    && styles.includes("#progressionPage .playerTableScroller tbody > tr:last-child > td {\\n  padding-block: calc((var(--mfl-table-row-outer-height) - var(--mfl-table-row-height)) / 2);\\n}")\n    && !styles.includes("#tableBody > .mflTableLoadingRow > td {\\n  height:"),\n  "Loaded player cells must own the 39px rendered row while symmetrically centering the compact 34px content area; blank rows inherit the same outer geometry.",''',
          )

          loading = "site/validate-filter-loading-blank-rows.mjs"
          replace_once(
              loading,
              '''    && styles.includes("#progressionPage .playerTableScroller td {\\n  height: var(--mfl-table-row-height);\\n  min-height: var(--mfl-table-row-height);\\n  line-height: 1.2;\\n  vertical-align: middle;\\n}"),\n  "Populated and loading table rows must share the canonical tbody/tr/td height contract independently from text line-height.",''',
              '''    && styles.includes("#progressionPage .playerTableScroller td {\\n  height: var(--mfl-table-row-outer-height);\\n  min-height: var(--mfl-table-row-outer-height);\\n  padding-block: calc((var(--mfl-table-row-outer-height) - var(--mfl-table-row-height) - 1px) / 2);\\n  line-height: 1.2;\\n  vertical-align: middle;\\n}"),\n  "Populated and loading table rows must share the canonical outer-height contract while populated content is symmetrically centered inside it.",''',
          )

          responsive = "site/validate-responsive-table-proportions.mjs"
          replace_once(
              responsive,
              '''assert.match(styles, /#progressionPage \\.playerTableScroller td \\{\\n {2}height: var\\(--mfl-table-row-height\\);/);''',
              '''assert.match(styles, /#progressionPage \\.playerTableScroller td \\{\\n {2}height: var\\(--mfl-table-row-outer-height\\);/);\nassert.match(styles, /padding-block: calc\\(\\(var\\(--mfl-table-row-outer-height\\) - var\\(--mfl-table-row-height\\) - 1px\\) \\/ 2\\);/);''',
          )
          PY
      - name: Validate site
        shell: bash
        run: |
          set -euo pipefail
          cd site
          npm ci
          npm run check
      - name: Commit product fix and remove scaffolding
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/styles.css site/validate-table-row-vertical-centering.mjs site/validate-table-column-layout.mjs site/validate-filter-loading-blank-rows.mjs site/validate-responsive-table-proportions.mjs
          git diff --cached --check
          git commit -m "Center table text in rendered rows"
          git rm .github/workflows/fix-pr-616-row-text-centering.yml
          git commit -m "Remove PR 616 row-centering scaffolding"
          git push origin HEAD:fix/599-responsive-table-proportions

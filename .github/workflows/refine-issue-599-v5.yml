name: Finalize issue 599 responsive table refinement

on:
  push:
    branches:
      - fix/599-responsive-table-proportions

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Apply final responsive table refinement
        shell: bash
        run: |
          set -euo pipefail
          git show d43daffa4d1e3dc8924408fc3cc8aa31b32106ee:.github/workflows/refine-issue-599.yml \
            | sed -n "/^          python - <<'PY'$/,/^          PY$/p" \
            | sed '1d;$d;s/^          //' > /tmp/refine-599.py
          python - <<'PY'
          from pathlib import Path

          path = Path('/tmp/refine-599.py')
          text = path.read_text()

          # Make regex replacement bodies literal-safe for JS/CSS backslashes.
          old = '    next_text, count = re.subn(pattern, replacement, text, count=1, flags=flags)'
          new = '    compiled = re.compile(pattern, flags)\n    next_text, count = compiled.subn(lambda _match: replacement, text, count=1)'
          if text.count(old) != 1:
              raise SystemExit(f'expected one regex helper call, found {text.count(old)}')
          text = text.replace(old, new, 1)

          # The generator intentionally contains the same 10px line in two media blocks;
          # remove the first targeted occurrence at each loop iteration instead of requiring global uniqueness.
          old = '    replace_once(projection, line, "")'
          new = '    projection_path = Path(projection)\n    projection_text = projection_path.read_text()\n    if line not in projection_text:\n        raise SystemExit(f"{projection}: expected projection line: {line!r}")\n    projection_path.write_text(projection_text.replace(line, "", 1))'
          if text.count(old) != 1:
              raise SystemExit(f'expected one projection loop removal, found {text.count(old)}')
          text = text.replace(old, new, 1)

          # Replace the brittle compact-validator migration with the final contract directly.
          start_marker = '          # Update compact-table regression expectations.\n'
          end_marker = '          # Retry regression: geometry/font values and compact-heading policy.\n'
          start = text.find(start_marker)
          end = text.find(end_marker)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('compact validator migration markers not found')
          compact_rewrite = r'''          # Rewrite compact-table regression from the final contract.
          compact = "site/validate-mobile-table-compact-contract.mjs"
          Path(compact).write_text("""import assert from \"node:assert/strict\";
import { readFileSync } from \"node:fs\";
import { dirname, resolve } from \"node:path\";
import { fileURLToPath } from \"node:url\";

const root = dirname(fileURLToPath(import.meta.url));
const read = (path) => readFileSync(resolve(root, path), \"utf8\");
const tableSource = read(\"modules/core-sources/table.js\");
const tableRuntimeSource = read(\"modules/app-core-table-runtime.js\");
const sharedTableUiSource = read(\"shared-table-ui-runtime.js\");
const projectionSource = read(\"sync-release-projections.mjs\");
const bootstrapSource = read(\"bootstrap.js\");
const responsiveSource = read(\"responsive.css\");

assert.match(tableSource, /const mobileTable = window\\.matchMedia\\(\"\\(max-width: 900px\\)\"\\)\\.matches;/, \"Canonical Table source must retain the shared 900px mobile breakpoint.\");

const geometries = [
  { breakpoint: 900, header: \"20.598557692307694\", row: \"18.430288461538463\", outer: \"21.140625\", headerFont: \"11\", rowFont: \"13.2\" },
  { breakpoint: 520, header: \"17.08173076923077\", row: \"15.283653846153848\", outer: \"17.53125\", headerFont: \"9.121951219512194\", rowFont: \"10.946341463414634\" },
  { breakpoint: 380, header: \"15.072115384615385\", row: \"13.485576923076925\", outer: \"15.46875\", headerFont: \"8.048780487804878\", rowFont: \"9.658536585365853\" },
];
for (const geometry of geometries) {
  for (const [name, source] of [[\"hydrated\", sharedTableUiSource], [\"first-paint generator\", projectionSource]]) {
    assert.ok(source.includes(`--mfl-table-header-height: ${geometry.header}px;`), `${name} missing <=${geometry.breakpoint}px header height.`);
    assert.ok(source.includes(`--mfl-table-row-height: ${geometry.row}px;`), `${name} missing <=${geometry.breakpoint}px row height.`);
    assert.ok(source.includes(`--mfl-table-row-outer-height: ${geometry.outer}px;`), `${name} missing <=${geometry.breakpoint}px outer row height.`);
    assert.ok(source.includes(`--mfl-table-header-font-size: ${geometry.headerFont}px;`), `${name} missing <=${geometry.breakpoint}px header font.`);
    assert.ok(source.includes(`--mfl-table-row-font-size: ${geometry.rowFont}px;`), `${name} missing <=${geometry.breakpoint}px row font.`);
  }
}

assert.match(responsiveSource, /font-size: var\\(--mfl-table-header-font-size\\);/, \"Responsive headers must consume the geometry-owned font variable.\");
assert.match(responsiveSource, /font-size: var\\(--mfl-table-row-font-size\\);/, \"Responsive rows must consume the geometry-owned font variable.\");

for (const compactLabel of [\"AGT\", \"JOIN\", \"NAME\", \"AGE\", \"POS\", \"SZN\", \"OVR\", \"PAC\", \"SHO\", \"PAS\", \"DRI\", \"DEF\", \"PHY\", \"GK\", \"REV\", \"CLUB\", \"DIV\"]) {
  assert.ok(tableSource.includes(`: \"${compactLabel}\"`), `Hydrated mobile headings must include ${compactLabel}.`);
  assert.ok(bootstrapSource.includes(`: \"${compactLabel}\"`), `First-paint mobile headings must include ${compactLabel}.`);
}
assert.doesNotMatch(tableSource, /compactTableHeadings/, \"All <=900px tables must use compact headings.\");
assert.doesNotMatch(tableSource, /column === \"positions\"[\\s\\S]{0,100}\? \"POSITIONS\"/, \"Mobile Positions must use POS rather than restoring the long heading.\");
assert.doesNotMatch(projectionSource, /data-table-column=\\\\\"player_seasons\\\\\"[\\s\\S]*content: \\\\"SZN\\\\\"/, \"Compact headings must be real first-paint text rather than CSS pseudo-labels.\");

assert.match(tableSource, /selectVisibleInput\\.type = \"checkbox\";[\\s\\S]*selectVisibleInput\\.disabled = true;/, \"Every rebuilt table header must start with selection disabled.\");
assert.match(tableRuntimeSource, /selectVisibleInput\\.type = \"checkbox\";[\\s\\S]*selectVisibleInput\\.disabled = true;/, \"Generated table runtime must preserve disabled header selection.\");
assert.match(sharedTableUiSource, /#progressionPage #tableHead \\.selectionCell input:disabled \\{[\\s\\S]*opacity: 0\\.45;/, \"Disabled hydrated header checkbox must remain visually distinct.\");
assert.match(projectionSource, /#tableHead \\.selectionCell input:disabled \\{ opacity: 0\\.45; \\}/, \"First-paint disabled header checkbox must already use final appearance.\");

assert.match(tableSource, /function compactMobileJoinedAgency\\(value\\) \\{[\\s\\S]*split\\(\\/\\\\s\\+\\\\\\/, 1\\)\\[0\\]/, \"Joined Agency must retain its date-only compact formatter.\");
assert.match(tableSource, /column === joinedAgencyColumn[\\s\\S]*window\\.matchMedia\\(\"\\(max-width: 520px\\)\"\\)\\.matches[\\s\\S]*compactMobileJoinedAgency\\(joinedAgencyValue\\)/, \"Joined Agency must switch to date-only values only on phone screens.\");

const phoneStyle = sharedTableUiSource.match(/@media \\(max-width: 520px\\) \\{([\\s\\S]*?)\\n\\}\\n@media \\(max-width: 380px\\)/)?.[1] || \"\";
assert.match(phoneStyle, /#progressionPage #tableBody \\.tableOverallRarityCircle \\{[\\s\\S]*flex-basis: 5px;[\\s\\S]*width: 5px;[\\s\\S]*height: 5px;[\\s\\S]*margin-right: 3px;/, \"Overall rarity circle must remain 5px with a 3px gap on phones.\");
const tinyStyle = sharedTableUiSource.match(/@media \\(max-width: 380px\\) \\{([\\s\\S]*?)\\n\\}`;/)?.[1] || \"\";
assert.match(tinyStyle, /#progressionPage #tableBody \\.tableOverallRarityCircle \\{[\\s\\S]*flex-basis: 5px;[\\s\\S]*width: 5px;[\\s\\S]*height: 5px;[\\s\\S]*margin-right: 3px;/, \"Overall rarity circle must remain 5px with a 3px gap on tiny screens.\");

assert.doesNotMatch(tableSource, /!important/, \"Canonical mobile Table presentation must not add !important.\");
assert.doesNotMatch(sharedTableUiSource, /!important/, \"Shared mobile table presentation must not add !important.\");
const tableBanner = \"// Generated Table core from modules/core-sources/table.js. Do not edit directly.\\n\";
assert.ok(tableRuntimeSource.startsWith(tableBanner), \"Generated Table runtime must carry the canonical banner.\");
assert.equal(tableRuntimeSource.slice(tableBanner.length).replace(/\\s*$/, \"\"), tableSource.replace(/\\s*$/, \"\"), \"Generated Table runtime must exactly match canonical table.js.\");

console.log(\"Source-owned mobile compact table contract validation passed.\");
""")

'''
          text = text[:start] + compact_rewrite + text[end:]

          # Append the final header-metrics and player-name contracts after the existing retry migration.
          anchor = '          Path(retry).write_text(text)\n'
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one retry write anchor, found {text.count(anchor)}')
          additions = r'''

          # Header first-paint metrics now use geometry-owned font variables and a full-height flex host.
          Path("site/validate-mobile-header-first-paint-metrics.mjs").write_text("""import assert from \"node:assert/strict\";
import { readFileSync } from \"node:fs\";
import { dirname, resolve } from \"node:path\";
import { fileURLToPath } from \"node:url\";

const root = dirname(fileURLToPath(import.meta.url));
const read = (path) => readFileSync(resolve(root, path), \"utf8\");
const projection = read(\"sync-release-projections.mjs\");
const shared = read(\"shared-table-ui-runtime.js\");
const styles = read(\"styles.css\");

for (const [breakpoint, header, row, headerFont, rowFont] of [
  [900, \"20.598557692307694\", \"18.430288461538463\", \"11\", \"13.2\"],
  [520, \"17.08173076923077\", \"15.283653846153848\", \"9.121951219512194\", \"10.946341463414634\"],
  [380, \"15.072115384615385\", \"13.485576923076925\", \"8.048780487804878\", \"9.658536585365853\"],
]) {
  for (const [name, source] of [[\"first paint\", projection], [\"hydration\", shared]]) {
    assert.ok(source.includes(`--mfl-table-header-height: ${header}px;`), `${name} missing <=${breakpoint}px header height.`);
    assert.ok(source.includes(`--mfl-table-row-height: ${row}px;`), `${name} missing <=${breakpoint}px row height.`);
    assert.ok(source.includes(`--mfl-table-header-font-size: ${headerFont}px;`), `${name} missing <=${breakpoint}px header font.`);
    assert.ok(source.includes(`--mfl-table-row-font-size: ${rowFont}px;`), `${name} missing <=${breakpoint}px row font.`);
  }
}

const thRule = styles.match(/#progressionPage \\.playerTableScroller th \\{([\\s\\S]*?)\\n\\}/)?.[1] || \"\";
assert.match(thRule, /height: var\\(--mfl-table-header-height\\);/);
assert.match(thRule, /min-height: var\\(--mfl-table-header-height\\);/);
assert.match(thRule, /font-size: var\\(--mfl-table-header-font-size\\);/);
assert.match(thRule, /line-height: 0;/, \"Table-cell baseline metrics must not position header objects.\");

const hostRule = styles.match(/#progressionPage #tableHead \\.tableHeaderCellContent \\{([\\s\\S]*?)\\n\\}/)?.[1] || \"\";
assert.match(hostRule, /display: inline-flex;/);
assert.match(hostRule, /align-items: center;/);
assert.match(hostRule, /height: var\\(--mfl-table-header-height\\);/);
assert.match(hostRule, /min-height: var\\(--mfl-table-header-height\\);/);
assert.match(hostRule, /line-height: 1\\.2;/);
assert.doesNotMatch(projection, /#progressionPage #tableHead > tr(?: > th)? \\{[^}]*height:/, \"First paint must not add temporary header geometry.\");
assert.doesNotMatch(shared, /\\.playerTableScroller th \\{\\n\\s*font-size: \\d/, \"Hydration must not have a second numeric header-font owner.\");
console.log(\"Mobile header first-paint metric validation passed.\");
""")

          # Preserve surname particles when compacting mobile player names.
          replace_once(
              table,
              '''function compactMobilePlayerName(value) {
  const fullName = String(value || "").trim();
  const parts = fullName.split(/\\s+/).filter(Boolean);
  if (parts.length < 2) return fullName;
  const initial = Array.from(parts[0])[0] || "";
  return initial ? `${initial}. ${parts.at(-1)}` : fullName;
}''',
              '''const MOBILE_PLAYER_SURNAME_PARTICLES = new Set([
  "da", "das", "de", "dei", "del", "della", "delle", "dello", "di",
  "do", "dos", "du", "la", "le", "van", "von", "der", "den", "ter", "ten",
]);

function compactMobilePlayerName(value) {
  const fullName = String(value || "").trim();
  const parts = fullName.split(/\\s+/).filter(Boolean);
  if (parts.length < 2) return fullName;
  const initial = Array.from(parts[0])[0] || "";
  let surnameStart = parts.length - 1;
  while (surnameStart > 1 && MOBILE_PLAYER_SURNAME_PARTICLES.has(parts[surnameStart - 1].toLocaleLowerCase("en-US"))) {
    surnameStart -= 1;
  }
  const surname = parts.slice(surnameStart).join(" ");
  return initial && surname ? `${initial}. ${surname}` : fullName;
}''',
          )

          Path("site/validate-mobile-player-name-compaction.mjs").write_text("""import assert from \"node:assert/strict\";
import { readFileSync } from \"node:fs\";
import { dirname, resolve } from \"node:path\";
import { fileURLToPath } from \"node:url\";

const root = dirname(fileURLToPath(import.meta.url));
const tableSource = readFileSync(resolve(root, \"modules/core-sources/table.js\"), \"utf8\");
const runtimeSource = readFileSync(resolve(root, \"modules/app-core-table-runtime.js\"), \"utf8\");
const block = tableSource.match(/const MOBILE_PLAYER_SURNAME_PARTICLES = new Set\\(\\[[\\s\\S]*?function compactMobilePlayerName\\(value\\) \\{[\\s\\S]*?\\n\\}/)?.[0] || \"\";
assert.ok(block, \"Canonical Table source must define mobile surname-particle compaction.\");
const compactMobilePlayerName = Function(`${block}; return compactMobilePlayerName;`)();
for (const [fullName, expected] of [
  [\"Pierluigi di Palma\", \"P. di Palma\"],
  [\"Leonardo da Vinci\", \"L. da Vinci\"],
  [\"Juan de la Cruz\", \"J. de la Cruz\"],
  [\"Mario Rossi\", \"M. Rossi\"],
  [\"Pelé\", \"Pelé\"],
]) {
  assert.equal(compactMobilePlayerName(fullName), expected, `${fullName} must compact to ${expected}.`);
}
assert.match(tableSource, /window\\.matchMedia\\(\"\\(max-width: 900px\\)\"\\)\\.matches[\\s\\S]*compactMobilePlayerName\\(fullPlayerName\\)/, \"Name compaction must remain scoped to small screens.\");
assert.ok(runtimeSource.includes(\"MOBILE_PLAYER_SURNAME_PARTICLES\") && runtimeSource.includes(\"compactMobilePlayerName(fullPlayerName)\"), \"Generated runtime must preserve canonical mobile name compaction.\");
console.log(\"Mobile player-name compaction preserves surname particles.\");
""")

          domain = Path("site/validate-domain-table.mjs")
          domain_text = domain.read_text()
          needle = '  "validate-mobile-table-compact-contract.mjs",\n'
          if domain_text.count(needle) != 1:
              raise SystemExit(f'expected one mobile compact validator entry, found {domain_text.count(needle)}')
          domain.write_text(domain_text.replace(needle, needle + '  "validate-mobile-player-name-compaction.mjs",\n', 1))
'''
          text = text.replace(anchor, anchor + additions, 1)
          path.write_text(text)
          PY

          git reset --hard 9e09523322294b29a160ad6fd285fe0f841703c7
          python /tmp/refine-599.py
          node site/sync-release-projections.mjs
          cd site
          npm ci
          npm run check
          cd ..
          git config user.name "FraGioco9"
          git config user.email "29951460+FraGioco9@users.noreply.github.com"
          git add site
          git commit -m "Refine small-screen table presentation"
          git push --force-with-lease origin HEAD:fix/599-responsive-table-proportions

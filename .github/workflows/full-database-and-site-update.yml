name: Full database and site update

on:
  schedule:
    # GitHub cron is UTC. Separate CET/CEST candidates are gated against the intended Rome clock time.
    - cron: "20 8 * * *"
    - cron: "20 9 * * *"
    - cron: "15 17 * * *"
    - cron: "15 18 * * *"
    - cron: "15 21 * * *"
    - cron: "15 22 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: database-and-vercel-site
  cancel-in-progress: false

jobs:
  update-database-and-production-data:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Download current database builder
        uses: actions/checkout@v4
        with:
          path: builder

      - name: Check Rome schedule time
        id: schedule_gate
        if: github.event_name == 'schedule'
        shell: bash
        env:
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          parts = os.environ.get("SCHEDULE_CRON", "").split()
          should_run = False
          if len(parts) >= 2:
              minute, hour = int(parts[0]), int(parts[1])
              now = datetime.now(timezone.utc).replace(
                  hour=hour,
                  minute=minute,
                  second=0,
                  microsecond=0,
              )
              rome = now.astimezone(ZoneInfo("Europe/Rome"))
              should_run = (rome.hour, rome.minute) in {
                  (10, 20),
                  (19, 15),
                  (23, 15),
              }
          print(f"should_run={'true' if should_run else 'false'}")
          PY

      - name: Set up Python
        if: github.event_name != 'schedule' || steps.schedule_gate.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore previous database for email comparison
        if: github.event_name != 'schedule' || steps.schedule_gate.outputs.should_run == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p builder/previous-database

          PREVIOUS_RUN_ID=""
          while IFS=$'\t' read -r CREATED_AT RUN_ID; do
            [ -n "$RUN_ID" ] || continue

            ARTIFACT_NAME="$(
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" \
                --jq '.artifacts[] | select(.name == "mfl_database" and .expired == false) | .name' \
                | head -n 1
            )"

            if [ "$ARTIFACT_NAME" = "mfl_database" ]; then
              PREVIOUS_RUN_ID="$RUN_ID"
              echo "Using previous database from run $RUN_ID ($CREATED_AT)."
              break
            fi
          done < <(
            gh run list \
              --status success \
              --limit 100 \
              --json databaseId,createdAt \
              --jq '.[] | [.createdAt, .databaseId] | @tsv'
          )

          if [ -n "$PREVIOUS_RUN_ID" ]; then
            gh run download "$PREVIOUS_RUN_ID" --name mfl_database --dir builder/previous-database
          else
            echo "No previous database found; progression emails will be skipped."
          fi

      - name: Rebuild database
        if: github.event_name != 'schedule' || steps.schedule_gate.outputs.should_run == 'true'
        working-directory: builder
        env:
          MFL_API_TOKEN: ${{ secrets.MFL_API_TOKEN }}
        run: python run_authenticated_database_rebuild.py

      - name: Send progression emails
        if: (github.event_name != 'schedule' || steps.schedule_gate.outputs.should_run == 'true') && hashFiles('builder/previous-database/mfl_database.db') != ''
        working-directory: builder
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_REPLY_TO: ${{ secrets.EMAIL_REPLY_TO }}
          EMAIL_BASE_URL: https://mfl-front-office.vercel.app
        run: python send_progression_emails.py --previous-db previous-database/mfl_database.db --current-db mfl_database.db

      - name: Prepare runtime SQLite database
        if: github.event_name != 'schedule' || steps.schedule_gate.outputs.should_run == 'true'
        working-directory: builder
        run: python prepare_runtime_database.py mfl_database.db

      - name: Upload database
        if: github.event_name != 'schedule' || steps.schedule_gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mfl_database
          path: builder/mfl_database.db
          if-no-files-found: error

      - name: Resolve current production site source
        id: production_site
        if: github.event_name != 'schedule' || steps.schedule_gate.outputs.should_run == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          SITE_SHA="$(
            gh run list \
              --workflow vercel-site-update.yml \
              --status success \
              --limit 50 \
              --json headSha,createdAt \
              --jq 'sort_by(.createdAt) | reverse | map(select(.headSha != null and .headSha != "")) | .[0].headSha // ""'
          )"

          if [ -z "$SITE_SHA" ]; then
            echo "No successful Vercel site update run was found." >&2
            exit 1
          fi
          echo "Using production site source commit $SITE_SHA."
          echo "sha=$SITE_SHA" >> "$GITHUB_OUTPUT"

      - name: Download current production site source
        if: github.event_name != 'schedule' || steps.schedule_gate.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.production_site.outputs.sha }}
          path: production-site

      - name: Install fresh database in current production source
        if: github.event_name != 'schedule' || steps.schedule_gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f production-site/site/api/_database.js ]; then
            echo "The current production version still expects generated JSON files." >&2
            echo "Run Vercel site update once to release the SQLite runtime first." >&2
            exit 1
          fi

          rm -rf production-site/site/api/data-files
          mkdir -p production-site/site/api/data-files
          cp builder/mfl_database.db production-site/site/api/data-files/mfl_database.db
          test -s production-site/site/api/data-files/mfl_database.db
          if find production-site/site/api/data-files -maxdepth 1 -type f -name '*.json' | grep -q .; then
            echo "Generated JSON data files are not allowed." >&2
            exit 1
          fi

      - name: Verify production site version is unchanged
        if: github.event_name != 'schedule' || steps.schedule_gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git -C production-site rev-parse HEAD)"
          EXPECTED_SHA="${{ steps.production_site.outputs.sha }}"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "Deploying fresh SQLite data with unchanged site source $ACTUAL_SHA."
          grep -m 1 -E 'RELEASE_VERSION|const VERSION' production-site/site/app.js production-site/site/bootstrap.js || true

      - name: Install Vercel CLI
        if: github.event_name != 'schedule' || steps.schedule_gate.outputs.should_run == 'true'
        run: npm install --global vercel@latest

      - name: Connect Vercel project
        if: github.event_name != 'schedule' || steps.schedule_gate.outputs.should_run == 'true'
        working-directory: production-site
        shell: bash
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Deploy database with current production version
        if: github.event_name != 'schedule' || steps.schedule_gate.outputs.should_run == 'true'
        working-directory: production-site
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prod --yes --build-env ALLOW_VERCEL_ACTION_DEPLOY=1 --token "$VERCEL_TOKEN"

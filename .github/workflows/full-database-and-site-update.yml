name: Full database and site update

on:
  schedule:
    # GitHub cron is UTC. Separate CET/CEST candidates are gated against the intended Rome clock time.
    - cron: "20 8 * * *"
    - cron: "20 9 * * *"
    - cron: "15 17 * * *"
    - cron: "15 18 * * *"
    - cron: "15 21 * * *"
    - cron: "15 22 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: database-and-vercel-site
  cancel-in-progress: false

jobs:
  refresh-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Check Rome schedule time
        id: schedule_gate
        if: github.event_name == 'schedule'
        shell: bash
        env:
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          cron = os.environ.get("SCHEDULE_CRON", "")
          parts = cron.split()
          should_run = False
          if len(parts) >= 2:
              minute = int(parts[0])
              hour = int(parts[1])
              now_utc = datetime.now(timezone.utc)
              scheduled_utc = now_utc.replace(hour=hour, minute=minute, second=0, microsecond=0)
              scheduled_rome = scheduled_utc.astimezone(ZoneInfo("Europe/Rome"))
              should_run = (scheduled_rome.hour, scheduled_rome.minute) in {(10, 20), (19, 15), (23, 15)}
          print(f"should_run={'true' if should_run else 'false'}")
          PY

      - name: Set up Python
        if: github.event_name != 'schedule' || steps.schedule_gate.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore previous database for email comparison
        if: github.event_name != 'schedule' || steps.schedule_gate.outputs.should_run == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous-database
          {
            gh run list --workflow players-database-refresh.yml --status success --limit 30 --json databaseId,createdAt --jq '.[] | [.createdAt, .databaseId] | @tsv' || true
            gh run list --workflow seasons-database-refresh.yml --status success --limit 30 --json databaseId,createdAt --jq '.[] | [.createdAt, .databaseId] | @tsv' || true
            gh run list --workflow full-database-refresh.yml --status success --limit 30 --json databaseId,createdAt --jq '.[] | [.createdAt, .databaseId] | @tsv' || true
            gh run list --workflow full-database-and-site-update.yml --status success --limit 30 --json databaseId,createdAt --jq '.[] | [.createdAt, .databaseId] | @tsv' || true
          } | sort -r | while IFS=$'\t' read -r CREATED_AT RUN_ID; do
            [ -n "$RUN_ID" ] || continue
            HAS_DATABASE_ARTIFACT="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" --jq '.artifacts[] | select(.name == "mfl_database" and .expired == false) | .name' | head -n 1)"
            if [ -n "$HAS_DATABASE_ARTIFACT" ]; then
              echo "$RUN_ID" > previous_database_run_id.txt
              break
            fi
            echo "Skipping run $RUN_ID from $CREATED_AT because it has no usable mfl_database artifact."
          done

          if [ -f previous_database_run_id.txt ]; then
            DATABASE_RUN_ID="$(cat previous_database_run_id.txt)"
            echo "Restoring mfl_database artifact from run $DATABASE_RUN_ID."
            gh run download "$DATABASE_RUN_ID" --name mfl_database --dir previous-database
          else
            echo "No previous mfl_database artifact found; progression emails will be skipped."
          fi

      - name: Rebuild database
        if: github.event_name != 'schedule' || steps.schedule_gate.outputs.should_run == 'true'
        env:
          MFL_API_TOKEN: ${{ secrets.MFL_API_TOKEN }}
        run: python run_authenticated_database_rebuild.py

      - name: Send progression emails
        if: (github.event_name != 'schedule' || steps.schedule_gate.outputs.should_run == 'true') && hashFiles('previous-database/mfl_database.db') != ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_REPLY_TO: ${{ secrets.EMAIL_REPLY_TO }}
          EMAIL_BASE_URL: https://mfl-front-office.vercel.app
        run: python send_progression_emails.py --previous-db previous-database/mfl_database.db --current-db mfl_database.db

      - name: Export website data
        if: github.event_name != 'schedule' || steps.schedule_gate.outputs.should_run == 'true'
        shell: bash
        run: |
          ln -s mfl_database.db mfl_progression.db
          python export_for_website.py

      - name: Upload database
        if: github.event_name != 'schedule' || steps.schedule_gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mfl_database
          path: mfl_database.db
          if-no-files-found: error

      - name: Move data behind protected API
        if: github.event_name != 'schedule' || steps.schedule_gate.outputs.should_run == 'true'
        shell: bash
        run: |
          rm -rf site/api/data-files
          mkdir -p site/api/data-files
          mv site/data/*.json site/api/data-files/
          rmdir site/data
          test -f site/api/data-files/manifest.json
          ls site/api/data-files | head

      - name: Install Vercel CLI
        if: github.event_name != 'schedule' || steps.schedule_gate.outputs.should_run == 'true'
        run: npm install --global vercel@latest

      - name: Connect Vercel project
        if: github.event_name != 'schedule' || steps.schedule_gate.outputs.should_run == 'true'
        shell: bash
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Deploy protected site to Vercel
        if: github.event_name != 'schedule' || steps.schedule_gate.outputs.should_run == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prod --yes --build-env ALLOW_VERCEL_ACTION_DEPLOY=1 --token "$VERCEL_TOKEN"

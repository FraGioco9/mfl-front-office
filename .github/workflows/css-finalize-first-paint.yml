name: Finalize CSS first-paint ownership

on:
  push:
    branches:
      - chore/css-ownership-optimization

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Stage first-paint ownership cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/css-ownership-optimization
      - name: Move first-paint motion ownership out of base CSS
        shell: bash
        env:
          PATCH_B64: H4sIAAl0hmoC/42OPwvCQAzF9/sUmW3TWhSFuhw4ubmLQ6qpHtyfcpdFpN/d2kERC0qW8Hvv5QURgcpkhMskN8sJG0pcnFJSWZZBMy1pDbhcV/O8WkA2LivQWkGvYBi8irOFa+3OGzFkt9cYHO8jdxSNv8As/22p64bbEPkvK7XCEe4KASSSH142wdfgg+fNE5I3jj5Yr1DB4UxCKCFYMd3x3fgljPdf3AfhidQDRCc2kEoBAAA=
        run: |
          python - <<'PY'
          import base64, gzip, os
          from pathlib import Path
          Path('/tmp/css-finalize.patch').write_bytes(gzip.decompress(base64.b64decode(os.environ['PATCH_B64'])))
          PY
          git apply --check /tmp/css-finalize.patch
          git apply /tmp/css-finalize.patch
          git rm .github/workflows/css-finalize-first-paint.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- site/styles-base.css
          git commit -m 'Finalize first-paint CSS ownership'
          git push origin HEAD:chore/css-ownership-optimization

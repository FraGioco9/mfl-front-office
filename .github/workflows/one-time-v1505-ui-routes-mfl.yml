name: One-time v1.150.5 UI routes and MFL fixes

on:
  push:
    branches:
      - main
    paths:
      - .github/v1505-ui-routes-mfl-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply v1.150.5 fixes
        run: python .github/scripts/patch_v1505_ui_routes_mfl.py

      - name: Validate JavaScript
        run: |
          node --check site/app.js
          node --check site/api/data.js

      - name: Validate Python
        run: python -m py_compile export_for_website.py

      - name: Validate patch output
        shell: bash
        run: |
          grep -q 'const VERSION = "1.150.5"' site/app.js
          grep -q '/styles.css?v=1.150.5' site/index.html
          grep -q '/app.js?v=1.150.5' site/index.html
          grep -q 'clubViewLoading' site/app.js
          grep -q 'fetchPublicDataChunk' site/app.js
          grep -q 'recentClubKey' site/app.js
          ! grep -q 'v1.150.4 pinned content grid' site/app.js

      - name: Remove one-time patch files
        run: |
          rm -f .github/scripts/patch_v1505_ui_routes_mfl.py
          rm -f .github/workflows/one-time-v1505-ui-routes-mfl.yml
          rm -f .github/v1505-ui-routes-mfl-trigger

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix guest routes club transitions and MFL data"
          git push origin main

name: One-time branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-branch-cleanup.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete remote branches
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const defaultBranch = 'main';
            const protectedBranches = new Set([defaultBranch]);
            const deleted = [];
            const kept = [];

            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            for (const pull of openPulls) {
              if (pull.head?.repo?.full_name === `${owner}/${repo}` && pull.head?.ref) {
                protectedBranches.add(pull.head.ref);
              }
            }

            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner,
              repo,
              per_page: 100,
            });

            for (const branch of branches) {
              const name = branch.name;
              const sha = branch.commit?.sha || '';

              if (protectedBranches.has(name)) {
                kept.push({ name, reason: name === defaultBranch ? 'default branch' : 'open pull request' });
                continue;
              }

              const pulls = await github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                state: 'all',
                head: `${owner}:${name}`,
                per_page: 100,
              });
              const mergedAtCurrentTip = pulls.some((pull) => pull.merged_at && pull.head?.sha === sha);

              if (mergedAtCurrentTip) {
                await github.rest.git.deleteRef({ owner, repo, ref: `heads/${name}` });
                deleted.push({ name, reason: 'current tip belongs to a merged pull request' });
                continue;
              }

              const disposableByName = name.startsWith('tmp/')
                || /^noop\d*$/.test(name)
                || name.startsWith('dependabot/');
              if (disposableByName) {
                await github.rest.git.deleteRef({ owner, repo, ref: `heads/${name}` });
                deleted.push({ name, reason: 'inactive disposable branch with no open pull request' });
                continue;
              }

              const comparison = await github.rest.repos.compareCommitsWithBasehead({
                owner,
                repo,
                basehead: `${defaultBranch}...${name}`,
              });
              if (comparison.data.ahead_by === 0) {
                await github.rest.git.deleteRef({ owner, repo, ref: `heads/${name}` });
                deleted.push({ name, reason: 'no commits ahead of main' });
                continue;
              }

              kept.push({ name, reason: `${comparison.data.ahead_by} unique commit(s) ahead of main` });
            }

            await core.summary
              .addHeading('Remote branch cleanup')
              .addRaw(`Deleted ${deleted.length} branch(es); kept ${kept.length} branch(es).`)
              .addHeading('Deleted', 2)
              .addCodeBlock(JSON.stringify(deleted, null, 2), 'json')
              .addHeading('Kept', 2)
              .addCodeBlock(JSON.stringify(kept, null, 2), 'json')
              .write();

      - name: Remove one-time cleanup workflow
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = '.github/workflows/one-time-branch-cleanup.yml';
            const current = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
            if (Array.isArray(current.data) || !current.data?.sha) return;
            await github.rest.repos.deleteFile({
              owner,
              repo,
              path,
              branch: 'main',
              sha: current.data.sha,
              message: 'Remove one-time branch cleanup workflow',
            });

name: Apply issue 641 mobile width fix v2

on:
  push:
    branches:
      - fix/641-mobile-progression-column-widths-v2

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/641-mobile-progression-column-widths-v2
          fetch-depth: 0

      - name: Apply canonical responsive fix and regression coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          responsive_path = Path("site/responsive.css")
          responsive = responsive_path.read_text()
          progression_rule = textwrap.dedent('''

            /* Progression-bearing views need the tablet-width floor on phones so
             * Overall/stat values plus progression remain readable. */
            html:not(.mflInitialRouteResolved):not(.mflInitialRouteSuperseded):is(
              [data-initial-table-view="next"],
              [data-initial-table-view="current"],
              [data-initial-table-view="all"]
            ) #progressionPage .playerTableScroller table,
            #progressionPage:has(.viewButton[data-view="next"].active) .playerTableScroller table,
            #progressionPage:has(.viewButton[data-view="current"].active) .playerTableScroller table,
            #progressionPage:has(.viewButton[data-view="all"].active) .playerTableScroller table {
              min-width: 760px;
            }
          ''')
          phone_pattern = re.compile(r'(  #progressionPage \.playerTableScroller table \{\n    min-width: 600px;\n  \}\n)')
          responsive, replacements = phone_pattern.subn(lambda match: match.group(1) + progression_rule, responsive, count=1)
          if replacements != 1:
              raise SystemExit(f"Expected one canonical 600px phone rule, replaced {replacements}")
          responsive_path.write_text(responsive)

          validator_path = Path("site/validate-mobile-progression-view-widths.mjs")
          validator_path.write_text(textwrap.dedent(r'''\
            import assert from "node:assert/strict";
            import { readFileSync } from "node:fs";
            import { dirname, resolve } from "node:path";
            import { fileURLToPath } from "node:url";

            const root = dirname(fileURLToPath(import.meta.url));
            const responsive = readFileSync(resolve(root, "responsive.css"), "utf8").replace(/\r\n?/g, "\n");

            const phoneStart = responsive.indexOf("@media (max-width: 520px)");
            const tinyStart = responsive.indexOf("@media (max-width: 380px)", phoneStart);
            assert.ok(phoneStart >= 0 && tinyStart > phoneStart);
            const phone = responsive.slice(phoneStart, tinyStart);
            const tiny = responsive.slice(tinyStart);

            assert.match(phone, /#progressionPage \.playerTableScroller table \{\s*min-width: 600px;\s*\}/);
            assert.match(phone, /\[data-initial-table-view="next"\]/);
            assert.match(phone, /\[data-initial-table-view="current"\]/);
            assert.match(phone, /\[data-initial-table-view="all"\]/);
            assert.match(phone, /#progressionPage:has\(\.viewButton\[data-view="next"\]\.active\) \.playerTableScroller table/);
            assert.match(phone, /#progressionPage:has\(\.viewButton\[data-view="current"\]\.active\) \.playerTableScroller table/);
            assert.match(phone, /#progressionPage:has\(\.viewButton\[data-view="all"\]\.active\) \.playerTableScroller table/);
            assert.match(phone, /min-width: 760px;/);
            assert.match(tiny, /#progressionPage \.playerTableScroller table \{\s*min-width: 540px;\s*\}/);
            assert.doesNotMatch(phone, /!important/);

            console.log("Mobile Next Overall, Current Season, and All Time keep the readable 760px table floor while compact phone views retain 600px.");
          '''))

          domain_path = Path("site/validate-domain-table.mjs")
          domain = domain_path.read_text()
          anchor = '  "validate-mobile-table-retry.mjs",\n'
          addition = '  "validate-mobile-progression-view-widths.mjs",\n'
          if addition not in domain:
              if domain.count(anchor) != 1:
                  raise SystemExit("Could not locate table-domain mobile validator anchor")
              domain = domain.replace(anchor, anchor + addition, 1)
              domain_path.write_text(domain)
          PY

      - name: Remove one-time patch workflow and commit source changes
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-issue-641-v2.yml
          git add -- site/responsive.css site/validate-mobile-progression-view-widths.mjs site/validate-domain-table.mjs .github/workflows/apply-issue-641-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Widen mobile progression view columns"
          git push origin HEAD:fix/641-mobile-progression-column-widths-v2

name: Trigger PR 616 final checks

on:
  push:
    branches:
      - fix/599-responsive-table-proportions
    paths:
      - .github/workflows/trigger-pr-616-final-checks.yml

permissions:
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: fix/599-responsive-table-proportions
      - name: Remove trigger and push user-equivalent tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FraGioco9"
          git config user.email "giocolifrancesco@gmail.com"
          git rm .github/workflows/trigger-pr-616-final-checks.yml
          git commit -m "Trigger final PR validation"
          git push origin HEAD:fix/599-responsive-table-proportions

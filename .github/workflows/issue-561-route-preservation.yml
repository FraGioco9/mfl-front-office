name: Issue 561 route preservation

on:
  push:
    branches:
      - fix/561-opted-out-first-paint
    paths:
      - .github/workflows/issue-561-route-preservation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: fix/561-opted-out-first-paint
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git rebase origin/main
          fi
      - name: Fix opted-out route first paint and URL ownership
        run: |
          python - <<'PY'
          from pathlib import Path

          core = Path("site/modules/app-core.js")
          text = core.read_text(encoding="utf-8")
          signature = 'async function setPage(pageName, updateHash = true, options = {}) {'
          start = text.find(signature)
          if start < 0:
              raise SystemExit("canonical setPage function not found")

          old_url = '''  if (options.replaceUrl && `${window.location.pathname}${window.location.search}` !== options.replaceUrl) {
    window.history.replaceState({}, "", options.replaceUrl);
  }
  document.body.dataset.page = pageName;
  updatePageUrl(pageName, { ...options, updateUrl: updateHash && !options.replaceUrl });'''
          old_gate = '''  if ((pageName === "myplayers" || pageName === "watchlist" || pageName === "settings") && !hasWalletOptIn()) {'''
          url_index = text.find(old_url, start)
          gate_index = text.find(old_gate, start)
          if url_index < 0:
              raise SystemExit("setPage URL ownership marker not found")
          if gate_index < 0:
              raise SystemExit("setPage locked opt-out gate not found")

          decision = '''
  const lockedOptOutRoute = (pageName === "myplayers" || pageName === "watchlist" || pageName === "settings") && !hasWalletOptIn();'''
          text = text[:start] + text[start:].replace(signature, signature + decision, 1)
          start = text.find(signature)
          new_url = '''  if (!lockedOptOutRoute && options.replaceUrl && `${window.location.pathname}${window.location.search}` !== options.replaceUrl) {
    window.history.replaceState({}, "", options.replaceUrl);
  }
  document.body.dataset.page = pageName;
  if (!lockedOptOutRoute) {
    updatePageUrl(pageName, { ...options, updateUrl: updateHash && !options.replaceUrl });
  }'''
          url_index = text.find(old_url, start)
          gate_index = text.find(old_gate, start)
          if url_index < 0 or gate_index < 0:
              raise SystemExit("setPage markers moved unexpectedly")
          text = text[:url_index] + new_url + text[url_index + len(old_url):]
          gate_index = text.find(old_gate, start)
          if gate_index < 0:
              raise SystemExit("setPage locked gate moved unexpectedly")
          text = text[:gate_index] + '  if (lockedOptOutRoute) {' + text[gate_index + len(old_gate):]
          core.write_text(text, encoding="utf-8")

          index = Path("site/index.html")
          text = index.read_text(encoding="utf-8")
          route_anchor = '''        if (initialEntityRoute) root.dataset.initialEntityRoute = initialEntityRoute;
        const tableConfig = TABLE_VIEW_CONFIG[tablePage];'''
          route_replacement = '''        if (initialEntityRoute) root.dataset.initialEntityRoute = initialEntityRoute;
        const initialLockedPage = tablePage === "myplayers" || tablePage === "watchlist"
          ? tablePage
          : firstPart === "settings"
            ? "settings"
            : "";
        if (initialLockedPage) root.dataset.initialLockedPage = initialLockedPage;
        const tableConfig = TABLE_VIEW_CONFIG[tablePage];'''
          if route_anchor not in text:
              raise SystemExit("initial locked-route marker not found")
          text = text.replace(route_anchor, route_replacement, 1)

          locked_section = '''        <section id="myPlayersLockedPage" class="pageView myPlayersLockedPage" hidden>
          <div class="myPlayersLockedContent">
            <h2 id="optInLockedTitle">My Players</h2>
            <p id="optInLockedMessage">In order to see your players, you need to opt in.</p>
            <button id="myPlayersOptInButton" class="homeOptInButton" type="button"><svg class="homeOptInIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4h8v16h-8"></path><path d="M4 12h10"></path><path d="M11 8l4 4-4 4"></path></svg><span>Opt In</span></button>
          </div>
        </section>'''
          locked_with_copy = locked_section + '''
        <script>
          (() => {
            const copy = {
              myplayers: ["My Players", "In order to see your players, you need to opt in."],
              watchlist: ["Watchlist", "In order to use the watchlist, you need to opt in."],
              settings: ["Settings", "In order to use settings, you need to opt in."],
            }[document.documentElement.dataset.initialLockedPage || ""];
            if (!copy) return;
            const title = document.getElementById("optInLockedTitle");
            const message = document.getElementById("optInLockedMessage");
            if (title) title.textContent = copy[0];
            if (message) message.textContent = copy[1];
          })();
        </script>'''
          if locked_section not in text:
              raise SystemExit("locked page markup marker not found")
          text = text.replace(locked_section, locked_with_copy, 1)
          index.write_text(text, encoding="utf-8")

          validator = Path("site/validate-static-route-ui.mjs")
          text = validator.read_text(encoding="utf-8")
          anchor = '''excludes(indexHtml, ') #myPlayersLockedPage {\\n        display: block;', "Opted-out protected routes must never start in normal block flow before the locked-page grid takes ownership.");
'''
          addition = '''includes(indexHtml, 'root.dataset.initialLockedPage = initialLockedPage;', "Opted-out first paint must preserve the requested protected-route identity before runtime hydration.");
includes(indexHtml, 'watchlist: ["Watchlist", "In order to use the watchlist, you need to opt in."]', "Watchlist must render Watchlist-specific opt-out copy at first paint.");
includes(indexHtml, 'settings: ["Settings", "In order to use settings, you need to opt in."]', "Settings must render Settings-specific opt-out copy at first paint.");
const setPageStart = coreSource.indexOf('async function setPage(pageName, updateHash = true, options = {}) {');
invariant(setPageStart >= 0, "Canonical setPage must exist for opted-out route validation.");
const lockedRouteDecision = coreSource.indexOf('const lockedOptOutRoute = (pageName === "myplayers" || pageName === "watchlist" || pageName === "settings") && !hasWalletOptIn();', setPageStart);
const lockedRouteGuard = coreSource.indexOf('if (lockedOptOutRoute) {', lockedRouteDecision);
const guardedReplace = coreSource.indexOf('if (!lockedOptOutRoute && options.replaceUrl', lockedRouteDecision);
const guardedUpdate = coreSource.indexOf('if (!lockedOptOutRoute) {\\n    updatePageUrl(pageName', lockedRouteDecision);
invariant(lockedRouteDecision > setPageStart && lockedRouteGuard > lockedRouteDecision && guardedReplace > lockedRouteDecision && guardedUpdate > lockedRouteDecision, "Opted-out protected routes must preserve the requested refresh URL and reuse one scoped setPage lock decision.");
'''
          if anchor not in text:
              raise SystemExit("static route regression anchor not found")
          validator.write_text(text.replace(anchor, anchor + addition, 1), encoding="utf-8")
          PY
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install site dependencies
        working-directory: site
        run: npm install --no-audit --no-fund
      - name: Build canonical application core
        working-directory: site
        run: npm run build:core
      - name: Lint
        working-directory: site
        run: npm run lint
      - name: Typecheck
        working-directory: site
        run: npm run typecheck
      - name: Repository validation
        working-directory: site
        run: npm run validate
      - name: Stage generated artifacts and verify
        run: |
          git add site/index.html site/modules/app-core.js site/modules/app-core*-runtime.js site/validate-static-route-ui.mjs
          cd site
          npm run verify:generated
      - name: Commit clean implementation
        run: |
          git rm .github/workflows/issue-561-route-preservation.yml
          git commit -m "Preserve opted-out refresh routes"
          git push origin HEAD:fix/561-opted-out-first-paint

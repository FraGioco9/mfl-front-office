name: Temporary stable view-button patch

on:
  push:
    branches:
      - fix/view-button-refresh-text-flicker

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/view-button-refresh-text-flicker
          fetch-depth: 0
      - name: Apply stable view-button patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "site/index.html",
              '<button class="viewButton" type="button" data-view="attributes">Attributes</button>',
              '<button class="viewButton" type="button" data-view="attributes"><span class="defaultViewLabel">Attributes</span><span class="clubViewLabel">Squad</span></button>',
          )

          replace_once(
              "site/index.html",
              '''      html {\n        font-size-adjust: 0.500;\n      }''',
              '''      html {\n        font-size-adjust: 0.500;\n      }\n      #progressionPage .viewButton[data-view="attributes"] .clubViewLabel {\n        display: none;\n      }\n      html:not(.mflInitialRouteResolved)[data-initial-table-page="club"] #progressionPage .viewButton[data-view="attributes"] .defaultViewLabel,\n      body[data-page="club"] #progressionPage .viewButton[data-view="attributes"] .defaultViewLabel {\n        display: none;\n      }\n      html:not(.mflInitialRouteResolved)[data-initial-table-page="club"] #progressionPage .viewButton[data-view="attributes"] .clubViewLabel,\n      body[data-page="club"] #progressionPage .viewButton[data-view="attributes"] .clubViewLabel {\n        display: inline;\n      }''',
          )

          replace_once(
              "site/bootstrap.js",
              '''    const buttons = new Map();\n    container.querySelectorAll(":scope > .viewButton[data-view]").forEach((candidate) => {\n      if (!(candidate instanceof HTMLElement)) return;\n      const buttonView = String(candidate.dataset.view || "");\n      buttons.set(buttonView, candidate);\n      candidate.hidden = !config.order.includes(buttonView);\n      if (buttonView === "attributes" && candidate instanceof HTMLButtonElement) {\n        candidate.textContent = page === "club" ? "Squad" : "Attributes";\n      }\n    });\n\n    const switcher = document.getElementById("watchlistSwitcher");\n    config.order.forEach((buttonView) => {\n      const button = buttons.get(buttonView);\n      if (!(button instanceof HTMLElement)) return;\n      button.hidden = false;\n      container.insertBefore(button, switcher instanceof HTMLElement ? switcher : null);\n    });''',
              '''    container.querySelectorAll(":scope > .viewButton[data-view]").forEach((candidate) => {\n      if (!(candidate instanceof HTMLElement)) return;\n      const buttonView = String(candidate.dataset.view || "");\n      const orderIndex = config.order.indexOf(buttonView);\n      candidate.hidden = orderIndex < 0;\n      if (orderIndex >= 0) candidate.style.order = String(orderIndex + 1);\n      else candidate.style.removeProperty("order");\n    });\n\n    const switcher = document.getElementById("watchlistSwitcher");\n    if (switcher instanceof HTMLElement) switcher.style.order = "100";''',
          )

          replace_once(
              "site/static-ui-runtime.js",
              '''      if (buttonView === "attributes" && button instanceof HTMLButtonElement) {\n        const label = page === "club" ? "Squad" : "Attributes";\n        if (button.textContent !== label) button.textContent = label;\n      }\n''',
              '''''',
          )

          replace_once(
              "site/validate-static-route-ui.mjs",
              '''includes(staticUi, 'const label = page === "club" ? "Squad" : "Attributes";', "Club Squad must resolve to the canonical real button label.");\nincludes(staticUi, "if (button.textContent !== label) button.textContent = label;", "Hydrated route chrome must preserve an already-correct view-button text node instead of replacing it.");\nexcludes(staticUi, 'button.textContent = page === "club" ? "Squad" : "Attributes";', "Hydration must not unconditionally replace the shared Attributes/Squad text node.");''',
              '''includes(indexHtml, '<span class="defaultViewLabel">Attributes</span><span class="clubViewLabel">Squad</span>', "Attributes and Squad must have persistent label nodes instead of runtime text replacement.");\nincludes(indexHtml, 'body[data-page="club"] #progressionPage .viewButton[data-view="attributes"] .clubViewLabel', "Club label visibility must follow route state without replacing the button text node.");\nincludes(bootstrap, "candidate.style.order = String(orderIndex + 1);", "Bootstrap must preserve view-button DOM attachment and use flex order from first paint.");\nincludes(bootstrap, 'switcher.style.order = "100";', "Bootstrap must keep the Watchlist switcher after stable view-button nodes.");\nexcludes(bootstrap, "container.insertBefore(", "Bootstrap must never detach and reinsert view buttons during first paint.");\nexcludes(bootstrap, "candidate.textContent", "Bootstrap must never replace a view-button label during first paint.");\nexcludes(staticUi, "button.textContent", "Hydrated route chrome must never replace a view-button label.");''',
          )
          PY

          git diff --check
          git diff -- site/index.html site/bootstrap.js site/static-ui-runtime.js site/validate-static-route-ui.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html site/bootstrap.js site/static-ui-runtime.js site/validate-static-route-ui.mjs
          git commit -m "Keep all view buttons stable from first paint [skip ci]"
          git push origin HEAD:fix/view-button-refresh-text-flicker

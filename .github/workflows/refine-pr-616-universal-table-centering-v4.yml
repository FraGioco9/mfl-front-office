name: Refine PR 616 universal table centering v4

on:
  push:
    branches:
      - fix/599-responsive-table-proportions
    paths:
      - .github/workflows/refine-pr-616-universal-table-centering-v4.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: fix/599-responsive-table-proportions
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply universal centering with scoped validation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/refine-pr-616-universal-table-centering-v3.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          exec(compile(textwrap.dedent(workflow[start:end]), 'centering-v3-apply.py', 'exec'), {})

          validator = Path('site/validate-table-row-vertical-centering.mjs')
          source = validator.read_text(encoding='utf-8')
          old = '''assert.doesNotMatch(styles, /table :is\\(th, td\\) > :is\\(a, span\\) \\{[\\s\\S]*?vertical-align: baseline;/, "Direct table links and spans must never be forced back onto the baseline.");'''
          new = '''const directCellInlineGeometry = styles.match(/table :is\\(th, td\\) > :is\\(a, span\\) \\{([\\s\\S]*?)\\n\\}/)?.[1] || "";\nassert.match(directCellInlineGeometry, /vertical-align: middle;/, "Direct table links and spans must inherit middle alignment.");\nassert.doesNotMatch(directCellInlineGeometry, /vertical-align: baseline;/, "Direct table links and spans must never be forced back onto the baseline.");'''
          if source.count(old) != 1:
              raise SystemExit('broad baseline validator marker missing')
          source = source.replace(old, new, 1)
          validator.write_text(source, encoding='utf-8')
          PY

          cd site
          node build-app-core.mjs
      - name: Snapshot product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/styles-base.css site/styles.css site/modules/core-sources/table.js site/modules/app-core-table-runtime.js site/validate-table-row-vertical-centering.mjs site/validate-filter-loading-blank-rows.mjs site/validate-table-column-layout.mjs site/validate-mobile-header-first-paint-metrics.mjs
          git diff --cached --check
          git commit -m "Center all table content vertically"
      - name: Validate site
        shell: bash
        run: |
          set -euo pipefail
          cd site
          npm ci
          npm run check
      - name: Remove scaffolding and push
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/refine-pr-616-universal-table-centering.yml .github/workflows/refine-pr-616-universal-table-centering-v2.yml .github/workflows/refine-pr-616-universal-table-centering-v3.yml .github/workflows/refine-pr-616-universal-table-centering-v4.yml
          git commit -m "Remove PR 616 universal-centering scaffolding"
          git push origin HEAD:fix/599-responsive-table-proportions
name: LOAD-03 isolated search concurrency

on:
  pull_request:
    paths:
      - "validation/load03-*"
      - ".github/workflows/load03-search-isolation.yml"
      - "modules/core-sources/planner.js"
      - "modules/app-core-planner-runtime.js"
      - "global-search-runtime.js"
      - "modules/core-sources/shared-data-search.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search-races:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Isolated Planner search timing and cancelled requests
        env:
          LOAD03_EXPECT_FIXED: "1"
        run: |
          node --check validation/load03-search-race-isolation.mjs
          node validation/load03-search-race-isolation.mjs
      - name: Canonical Global Search debounce/empty/error contracts
        run: |
          node validate-global-search-results.mjs
          node validate-ux02f-home-search-recovery.mjs
          node validate-ux02-empty-states.mjs

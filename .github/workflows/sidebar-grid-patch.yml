name: Apply sidebar grid rebuild

on:
  push:
    branches:
      - fix/sidebar-grid-alignment
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sidebar-grid-alignment
      - name: Rebuild sidebar layout in canonical sources
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new, label):
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          index = Path("site/index.html")
          replace_once(
              index,
              '        <aside id="sidebar" class="sidebar">\n',
              '        <aside id="sidebar" class="sidebar">\n          <div class="sidebarGrid">\n',
              "sidebar grid wrapper start",
          )
          replace_once(
              index,
              '          <a class="navButton settingsNavButton"',
              '          </div>\n          <a class="navButton settingsNavButton"',
              "sidebar grid wrapper end",
          )

          styles = Path("site/styles-base.css")
          replace_once(
              styles,
              '''.sidebar {
  width: 162px;
  margin-top: 12px;
  min-height: calc(100vh - 188px);
  max-height: none;
  display: flex;
  flex-direction: column;
  opacity: 1;
  transform: translateX(0);
  transition: none;
}

.sidebar[hidden] {
  display: none;
}


.settingsNavButton {
  margin-top: auto;
}

.navButton {
  display: inline-flex;
  align-items: center;
  justify-content: flex-start;
  width: 100%;
  height: 40px;
  margin-bottom: 8px;
  border: 1px solid var(--border-strong);
  border-radius: 6px;
  background: var(--surface);
  color: var(--text);
  gap: 8px;
  padding: 0 14px;
  text-align: left;
  text-decoration: none;
  cursor: pointer;
  transition: background 120ms ease, border-color 120ms ease;
}
''',
              '''.sidebar {
  width: 162px;
  margin-top: 12px;
  min-height: calc(100vh - 188px);
  max-height: none;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  opacity: 1;
  transform: translateX(0);
  transition: none;
}

.sidebar[hidden] {
  display: none;
}

.sidebarGrid {
  display: grid;
  grid-auto-rows: 40px;
  gap: 8px;
  min-width: 0;
}

.settingsNavButton {
  grid-row: 3;
  align-self: end;
  margin: 0 0 8px;
}

.navButton {
  display: grid;
  grid-template-columns: 18px minmax(0, 1fr);
  align-items: center;
  justify-items: start;
  width: 100%;
  height: 40px;
  margin: 0;
  border: 1px solid var(--border-strong);
  border-radius: 6px;
  background: var(--surface);
  color: var(--text);
  column-gap: 8px;
  padding: 0 14px;
  text-align: left;
  text-decoration: none;
  cursor: pointer;
  transition: background 120ms ease, border-color 120ms ease;
}
''',
              "desktop sidebar grid",
          )
          replace_once(
              styles,
              '''.navEmoji {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 18px;
  flex: 0 0 18px;
  color: currentColor;
  font-family: "Titillium Web", Arial, Helvetica, sans-serif;
  font-size: 18px;
  line-height: 1;
  text-align: center;
  transition: none;
}
''',
              '''.navEmoji {
  display: grid;
  place-items: center;
  align-self: center;
  justify-self: center;
  width: 18px;
  height: 18px;
  color: currentColor;
  font-family: "Titillium Web", Arial, Helvetica, sans-serif;
  font-size: 18px;
  line-height: 1;
  text-align: center;
  transition: none;
}
''',
              "sidebar icon cell",
          )
          replace_once(
              styles,
              '''.navMflIcon {
  width: 18px;
  flex-basis: 18px;
  height: auto;
  fill: currentColor;
  stroke: none;
}
''',
              '''.navMflIcon {
  width: 18px;
  height: 18px;
  fill: currentColor;
  stroke: none;
}
''',
              "MFL sidebar icon geometry",
          )
          replace_once(
              styles,
              '''.navJerseyIcon {
  width: 15px;
  flex-basis: 15px;
  transform: none;
}
''',
              '''.navJerseyIcon {
  width: 15px;
  height: 18px;
  transform: none;
}
''',
              "jersey sidebar icon geometry",
          )
          replace_once(
              styles,
              '''.navText {
  display: inline-block;
  max-width: 112px;
  overflow: hidden;
  opacity: 1;
  white-space: nowrap;
  transition: none;
}
''',
              '''.navText {
  display: flex;
  align-items: center;
  align-self: center;
  height: 18px;
  max-width: 112px;
  overflow: hidden;
  opacity: 1;
  line-height: 1;
  white-space: nowrap;
  transition: none;
}
''',
              "sidebar label cell",
          )

          responsive = Path("site/responsive.css")
          replace_once(
              responsive,
              '''  .sidebar {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 6px;
    width: 100%;
    min-height: 0;
    height: 42px;
    margin: 0;
    padding: 0;
    overflow-x: auto;
    overflow-y: hidden;
    overscroll-behavior-x: contain;
  }

  .navButton {
''',
              '''  .sidebar {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 6px;
    width: 100%;
    min-height: 0;
    height: 42px;
    margin: 0;
    padding: 0;
    overflow-x: auto;
    overflow-y: hidden;
    overscroll-behavior-x: contain;
  }

  .sidebarGrid {
    display: contents;
  }

  .navButton {
''',
              "mobile sidebar wrapper flattening",
          )
          replace_once(
              responsive,
              '''  .settingsNavButton {
    margin-top: 0;
    margin-left: auto;
  }
''',
              '''  .settingsNavButton {
    align-self: center;
    margin: 0 0 0 auto;
  }
''',
              "mobile Settings alignment",
          )
      - name: Commit sidebar rebuild
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- site/index.html site/styles-base.css site/responsive.css; then
            echo "No sidebar changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- site/index.html site/styles-base.css site/responsive.css
          git commit -m "Rebuild sidebar grid alignment"
          git push origin HEAD:fix/sidebar-grid-alignment

name: Apply opted-out footer flow patch

on:
  push:
    branches: [fix/opted-out-footer-distance]
    paths: [.github/workflows/apply-opted-out-footer-flow-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/opted-out-footer-distance
      - name: Apply canonical footer-flow fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          styles_path = Path("site/styles-base.css")
          styles = styles_path.read_text(encoding="utf-8")
          pattern = re.compile(r"(?P<head>\.myPlayersLockedPage \{\n)(?P<body>.*?)(?P<tail>\n\})", re.S)
          match = pattern.search(styles)
          if not match:
              raise SystemExit(".myPlayersLockedPage rule not found")
          body = match.group("body")
          required = [
              "  position: fixed;\n",
              "  top: 102px;\n",
              "  right: 0;\n",
              "  bottom: 52px;\n",
              "  left: 0;\n",
          ]
          missing = [line.strip() for line in required if line not in body]
          if missing:
              raise SystemExit(f"Expected locked-page fixed geometry missing: {missing}")
          for line in required:
              body = body.replace(line, "", 1)
          replacement = match.group("head") + body + match.group("tail")
          styles = styles[:match.start()] + replacement + styles[match.end():]
          styles_path.write_text(styles, encoding="utf-8")

          responsive_path = Path("site/responsive-sources/chrome-tablet.css.inc")
          responsive = responsive_path.read_text(encoding="utf-8")
          obsolete_pattern = re.compile(
              r"  body\.pinnedSidebarVisible \.myPlayersLockedPage,\n"
              r"  body:not\(\.pinnedSidebarVisible\) \.myPlayersLockedPage \{\n"
              r"    left: 0;\n"
              r"    width: auto;\n"
              r"  \}\n\n"
          )
          responsive, count = obsolete_pattern.subn("", responsive, count=1)
          if count != 1:
              raise SystemExit(f"Expected exactly one obsolete locked-page responsive block; found {count}")
          responsive_path.write_text(responsive, encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/styles-base.css site/responsive-sources/chrome-tablet.css.inc
          git commit -m "Keep opted-out pages in footer flow"
          git push origin HEAD:fix/opted-out-footer-distance

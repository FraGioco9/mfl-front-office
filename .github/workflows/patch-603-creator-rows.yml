name: Patch issue 603 creator rows

on:
  push:
    branches:
      - fix/603-footer-redesign
    paths:
      - site/patch-603-creator-rows.mjs
      - .github/workflows/patch-603-creator-rows.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Apply creator row update
        run: node site/patch-603-creator-rows.mjs
      - name: Commit footer sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html site/footer.css site/responsive.css site/validate-footer-redesign.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Refine footer creator contact rows"
            git push
          fi

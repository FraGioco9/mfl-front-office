name: Saved Valuation Cache source migration

on:
  push:
    branches:
      - refactor/source-owned-evaluation-saved-valuation-cache
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/source-owned-evaluation-saved-valuation-cache
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source-owned Saved Valuation Cache migration
        run: node site/migrate-source-owned-evaluation-saved-valuation-cache.mjs
      - name: Remove temporary migration scaffolding
        shell: bash
        run: |
          rm -f site/migrate-source-owned-evaluation-saved-valuation-cache.mjs
          rm -f .github/workflows/evaluation-saved-valuation-cache-source-migration.yml
      - name: Persist source migration
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "Saved Valuation Cache behavior is already source-owned."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Move Saved Valuation Cache behavior into source"
          git push origin HEAD:refactor/source-owned-evaluation-saved-valuation-cache

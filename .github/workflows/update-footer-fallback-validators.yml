name: Update footer fallback validators

on:
  push:
    branches:
      - fix/opted-out-footer-distance
    paths:
      - .github/workflows/update-footer-fallback-validators.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/opted-out-footer-distance
      - name: Update validators
        run: python .github/scripts/update-footer-fallback-validators.py
      - name: Validate footer contracts
        working-directory: site
        run: |
          node validate-footer-route-coverage.mjs
          node validate-footer-redesign.mjs
          node validate-mobile-footer-floor.mjs
      - name: Commit branch update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/validate-footer-redesign.mjs site/validate-mobile-footer-floor.mjs
          git commit -m "Align footer fallback validators"
          git push origin HEAD:fix/opted-out-footer-distance

# Temporary workflow; removed after the guarded validator update succeeds.

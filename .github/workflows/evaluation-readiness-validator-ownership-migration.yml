name: Evaluation readiness validator ownership migration

on:
  push:
    branches:
      - refactor/source-owned-evaluation-recent-readiness
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/source-owned-evaluation-recent-readiness
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update stale ownership validators
        run: node site/migrate-evaluation-readiness-validator-ownership.mjs
      - name: Persist validator ownership migration
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "Validator ownership is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Evaluation readiness ownership validators"
          git push origin HEAD:refactor/source-owned-evaluation-recent-readiness

name: Mobile first-paint regression

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  summary-first-paint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build canonical assets
        run: npm run build

      - name: Validate mobile summary first paint
        run: node validate-mobile-summary-first-paint.mjs

  header-first-paint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build canonical assets
        run: npm run build

      - name: Validate mobile table-header first paint
        run: node validation/browser-mobile-first-paint-regression.mjs

name: Apply theme icon reference adjustment

on:
  push:
    branches:
      - feat/517-theme-mode-icons-retry

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/517-theme-mode-icons-retry
      - name: Replace moon geometry and invert theme icon mapping
        run: |
          python - <<'PY'
          from pathlib import Path

          index_path = Path("site/index.html")
          index = index_path.read_text(encoding="utf-8")

          old_moon = 'd="M18.8 17.2A8 8 0 1 1 10.2 3.8a7.1 7.1 0 0 0 8.6 13.4Z"'
          new_moon = 'd="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"'
          if old_moon in index:
              index = index.replace(old_moon, new_moon, 1)
          elif new_moon not in index:
              raise SystemExit("Expected moon SVG geometry was not found.")

          old_visibility = '      #themeButton .themeSunSymbol {\n        display: none;\n      }\n      html[data-theme="dark"] #themeButton .themeMoonSymbol {\n        display: none;\n      }\n      html[data-theme="dark"] #themeButton .themeSunSymbol {\n        display: inline;\n      }'
          new_visibility = '      #themeButton .themeMoonSymbol {\n        display: none;\n      }\n      html[data-theme="dark"] #themeButton .themeSunSymbol {\n        display: none;\n      }\n      html[data-theme="dark"] #themeButton .themeMoonSymbol {\n        display: inline;\n      }'
          if old_visibility in index:
              index = index.replace(old_visibility, new_visibility, 1)
          elif new_visibility not in index:
              raise SystemExit("Expected first-paint theme icon visibility rules were not found.")

          index_path.write_text(index, encoding="utf-8")

          validator_path = Path("site/validate-theme-icons.mjs")
          validator = validator_path.read_text(encoding="utf-8")
          validator = validator.replace(
              'd="M18.8 17.2A8 8 0 1 1 10.2 3.8a7.1 7.1 0 0 0 8.6 13.4Z"',
              'd="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"',
          )
          validator = validator.replace(
              "markup.includes('#themeButton .themeSunSymbol {\\n        display: none;\\n      }') && markup.includes('html[data-theme=\"dark\"] #themeButton .themeMoonSymbol {\\n        display: none;\\n      }') && markup.includes('html[data-theme=\"dark\"] #themeButton .themeSunSymbol {\\n        display: inline;\\n      }')",
              "markup.includes('#themeButton .themeMoonSymbol {\\n        display: none;\\n      }') && markup.includes('html[data-theme=\"dark\"] #themeButton .themeSunSymbol {\\n        display: none;\\n      }') && markup.includes('html[data-theme=\"dark\"] #themeButton .themeMoonSymbol {\\n        display: inline;\\n      }')",
          )
          validator = validator.replace(
              '"Existing first-paint theme visibility ownership must remain intact."',
              '"First paint must show sun in Light mode and moon in Dark mode."',
          )
          validator_path.write_text(validator, encoding="utf-8")
          PY
      - name: Commit canonical theme icon update
        run: |
          if git diff --quiet; then
            echo "Theme icon update already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html site/validate-theme-icons.mjs
          git commit -m "fix: match moon reference and theme state"
          git push origin HEAD:feat/517-theme-mode-icons-retry

name: Issue 561 opt-out route transition

on:
  push:
    branches:
      - fix/561-opted-out-first-paint
    paths:
      - .github/workflows/issue-561-optout-route-transition.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: fix/561-opted-out-first-paint
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main fix/561-opted-out-first-paint
          if ! git merge-base --is-ancestor origin/main HEAD; then
            git rebase origin/main
          fi
      - name: Apply opt-out route fix
        run: python site/patch-561-optout-route.py
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install site dependencies
        working-directory: site
        run: npm install --no-audit --no-fund
      - name: Build canonical application core
        working-directory: site
        run: npm run build:core
      - name: Lint
        working-directory: site
        run: npm run lint
      - name: Typecheck
        working-directory: site
        run: npm run typecheck
      - name: Repository validation
        working-directory: site
        run: npm run validate
      - name: Stage generated artifacts and verify
        run: |
          git add site/modules/app-core.js site/modules/app-core*-runtime.js site/validate-static-route-ui.mjs
          cd site
          npm run verify:generated
      - name: Commit clean implementation
        run: |
          git rm site/patch-561-optout-route.py .github/workflows/issue-561-optout-route-transition.yml
          git commit -m "Preserve route identity on opt out"
          git push --force-with-lease origin HEAD:fix/561-opted-out-first-paint

name: Next rendered shell

on:
  pull_request:
    paths:
      - ".github/workflows/next-rendered-shell.yml"
      - "index.html"
      - "next.config.mjs"
      - "vercel.json"
      - "validate-vercel-security-headers.mjs"
      - "scripts/workflows/sync-vercel-security-headers.mjs"
      - "package.json"
      - "package-lock.json"
      - "pages/**"
      - "prepare-next-runtime.mjs"
      - "legacy-public-assets.cjs"
      - "dev-legacy-watch-loader.cjs"
      - "legacy-dev-watch-token.js"
      - "next-dev-legacy-bridge.mjs"
      - "scripts/ci/create-next-sqlite-smoke-fixture.cjs"
      - "validation/next-rendered-shell-browser.mjs"
      - "validation/next-csp-script-hashes.mjs"
      - "validation/next-csp-nonce-browser.mjs"
      - "validation/next-csp-report-route.mjs"
      - "api/csp-report.js"
      - "csp-report-only-policy.mjs"
      - "proxy.js"
      - "csp-legacy-script-hashes.mjs"
      - "validation/next-mobile-table-browser.mjs"
      - "validation/next-mobile-table-route-browser.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rendered-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify Vercel edge CSP configuration matches Next.js
        run: node validate-vercel-security-headers.mjs

      - name: Start real Next development server
        shell: bash
        env:
          MFL_DATABASE_PATH: ${{ runner.temp }}/mfl-next-rendered-shell.db
          MFL_CSP_NONCE_REPORT_ONLY: "1"
        run: |
          set -euo pipefail
          node scripts/ci/create-next-sqlite-smoke-fixture.cjs "$MFL_DATABASE_PATH"
          npm run dev > /tmp/mfl-next-rendered-shell.log 2>&1 &
          echo $! > /tmp/mfl-next-rendered-shell.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://localhost:4000/ > /tmp/mfl-next-root.html; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/mfl-next-rendered-shell.log >&2
          exit 1

      - name: Verify Next owns the visible document and dev indicator
        run: node validation/next-rendered-shell-browser.mjs http://localhost:4000/

      - name: Verify CSP hashes against actual Next SSR script bytes
        run: node validation/next-csp-script-hashes.mjs http://localhost:4000/

      - name: Verify per-request nonce in live Next SSR and static-route bypass
        run: node validation/next-csp-nonce-browser.mjs http://localhost:4000/

      - name: Verify real Next development CSP reporting endpoint
        run: node validation/next-csp-report-route.mjs http://localhost:4000/

      - name: Verify Planner is a first-class Next route
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /tmp/mfl-planner-direct.html --write-out '%{http_code}' http://localhost:4000/planner)"
          test "$status" = "200"
          grep -q 'id="plannerPage"' /tmp/mfl-planner-direct.html
          grep -q 'class="navEmoji navPlannerIcon"' /tmp/mfl-planner-direct.html

      - name: Verify Planner refresh title stays stable
        run: node validation/next-rendered-shell-browser.mjs http://localhost:4000/planner

      - name: Verify real mobile table presentation in Next
        run: node validation/next-mobile-table-browser.mjs http://localhost:4000/

      - name: Verify real mobile MFL and Agent table routes in Next
        run: node validation/next-mobile-table-route-browser.mjs http://localhost:4000

      - name: Verify Document Head warnings are gone
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq "viewport meta tags should not be used in _document.js's <Head>" /tmp/mfl-next-rendered-shell.log; then
            cat /tmp/mfl-next-rendered-shell.log >&2
            echo "Unexpected _document viewport warning." >&2
            exit 1
          fi
          if grep -Fq "<title> should not be used in _document.js's <Head>" /tmp/mfl-next-rendered-shell.log; then
            cat /tmp/mfl-next-rendered-shell.log >&2
            echo "Unexpected _document title warning." >&2
            exit 1
          fi

      - name: Print development server log on failure
        if: failure()
        shell: bash
        run: cat /tmp/mfl-next-rendered-shell.log >&2 || true

      - name: Stop development server
        if: always()
        shell: bash
        run: |
          if test -f /tmp/mfl-next-rendered-shell.pid; then
            kill "$(cat /tmp/mfl-next-rendered-shell.pid)" >/dev/null 2>&1 || true
          fi

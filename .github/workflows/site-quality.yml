name: Site quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply Menu disabled opacity fix
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/sidebar-grid-alignment'
        working-directory: .
        shell: python
        run: |
          from pathlib import Path

          styles_path = Path("site/styles-base.css")
          styles = styles_path.read_text(encoding="utf-8")
          old_disabled = "button:disabled {\n  cursor: not-allowed;\n  opacity: 0.45;\n}"
          new_disabled = "button:disabled:not(.menuButton) {\n  cursor: not-allowed;\n  opacity: 0.45;\n}"
          if old_disabled in styles:
              styles = styles.replace(old_disabled, new_disabled, 1)
              styles_path.write_text(styles, encoding="utf-8")
          elif new_disabled not in styles:
              raise SystemExit("Could not find canonical disabled-button opacity rule")

          validator_path = Path("site/validate-sidebar-lifecycle-ownership.mjs")
          validator = validator_path.read_text(encoding="utf-8")
          old_message = '  "Static CSS must keep the pinned Menu label white and non-interactive before and after hydration.",\n);'
          new_message = '  "Static CSS must keep the pinned Menu label white and non-interactive before and after hydration.",\n);\ninvariant(\n  styles.includes("button:disabled:not(.menuButton) {\\n  cursor: not-allowed;\\n  opacity: 0.45;\\n}")\n    && !styles.includes("button:disabled {\\n  cursor: not-allowed;\\n  opacity: 0.45;\\n}"),\n  "The global disabled-button fade must exclude the permanently disabled pinned Menu control.",\n);'
          if old_message in validator:
              validator = validator.replace(old_message, new_message, 1)
              validator_path.write_text(validator, encoding="utf-8")
          elif "The global disabled-button fade must exclude the permanently disabled pinned Menu control." not in validator:
              raise SystemExit("Could not update Menu disabled-opacity regression validation")

      - name: Commit Menu disabled opacity fix
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/sidebar-grid-alignment'
        working-directory: .
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git checkout origin/main -- .github/workflows/site-quality.yml
          git add -- site/styles-base.css site/validate-sidebar-lifecycle-ownership.mjs .github/workflows/site-quality.yml
          if git diff --cached --quiet; then
            echo "Menu disabled opacity fix is already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Keep Menu fully opaque after hydration"
          git push origin "HEAD:$HEAD_BRANCH"

      - name: Detect relevant changes
        id: changes
        working-directory: .
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$PR_BASE_SHA"
            HEAD_SHA="$PR_HEAD_SHA"
          else
            BASE_SHA="$BEFORE_SHA"
            HEAD_SHA="$CURRENT_SHA"
          fi

          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse "${HEAD_SHA}^" 2>/dev/null || true)"
          fi

          if [ -z "$BASE_SHA" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "site=true" >> "$GITHUB_OUTPUT"
            echo "builder=true" >> "$GITHUB_OUTPUT"
            echo "workflow=true" >> "$GITHUB_OUTPUT"
            echo "quality=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          site=false
          builder=false
          workflow=false

          mapfile -t CHANGED_FILES < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          printf 'Changed files:\n'
          printf '  %s\n' "${CHANGED_FILES[@]}"

          for file in "${CHANGED_FILES[@]}"; do
            case "$file" in
              site/*|.gitattributes)
                site=true
                ;;
              *.py|requirements*.txt|pyproject.toml)
                builder=true
                ;;
              .vercelignore)
                workflow=true
                ;;
              .github/workflows/*.yml|.github/workflows/*.yaml)
                while IFS= read -r line; do
                  case "$line" in
                    +++*|---*|@@*)
                      continue
                      ;;
                    +*|-*)
                      changed_line="${line:1}"
                      if [[ "$changed_line" =~ ^name:[[:space:]] ]]; then
                        continue
                      fi
                      if [ -n "$changed_line" ]; then
                        workflow=true
                        break
                      fi
                      ;;
                  esac
                done < <(git diff --unified=0 "$BASE_SHA" "$HEAD_SHA" -- "$file")
                ;;
            esac
          done

          quality=false
          if [ "$site" = true ] || [ "$builder" = true ] || [ "$workflow" = true ]; then
            quality=true
          fi

          echo "site=$site" >> "$GITHUB_OUTPUT"
          echo "builder=$builder" >> "$GITHUB_OUTPUT"
          echo "workflow=$workflow" >> "$GITHUB_OUTPUT"
          echo "quality=$quality" >> "$GITHUB_OUTPUT"

          echo "Site changes: $site"
          echo "Database builder changes: $builder"
          echo "Substantive workflow/deployment changes: $workflow"
          echo "Run repository validation: $quality"

      - uses: actions/setup-python@v5
        if: steps.changes.outputs.builder == 'true'
        with:
          python-version: "3.12"

      - name: Database builder syntax check
        if: steps.changes.outputs.builder == 'true'
        working-directory: .
        run: python -m compileall -q *.py

      - name: Database builder import smoke test
        if: steps.changes.outputs.builder == 'true'
        working-directory: .
        run: python -c "import rebuild_database; import rebuild_database_runner"

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.quality == 'true'
        with:
          node-version: 22

      - name: Install site dependencies
        if: steps.changes.outputs.quality == 'true'
        run: npm install

      - name: Lint
        if: steps.changes.outputs.site == 'true'
        run: npm run lint

      - name: Typecheck
        if: steps.changes.outputs.site == 'true'
        run: npm run typecheck

      - name: Build canonical application core
        if: steps.changes.outputs.quality == 'true'
        run: npm run build:core

      - name: Repository validation
        if: steps.changes.outputs.quality == 'true'
        run: npm run validate

      - name: Commit generated application artifacts
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          steps.changes.outputs.quality == 'true'
        working-directory: .
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git add -- site/table-width-runtime.js site/modules/app-core-runtime.js site/modules/app-core-*-runtime.js
          if git diff --cached --quiet; then
            echo "Generated application artifacts are current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate application core"
          git push origin "HEAD:$HEAD_BRANCH"
          gh workflow run site-quality.yml --ref "$HEAD_BRANCH"

      - name: Verify generated application artifacts
        if: steps.changes.outputs.quality == 'true'
        run: npm run verify:generated

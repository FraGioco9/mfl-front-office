name: Site quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect relevant changes
        id: changes
        working-directory: .
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$PR_BASE_SHA"
            HEAD_SHA="$PR_HEAD_SHA"
          else
            BASE_SHA="$BEFORE_SHA"
            HEAD_SHA="$CURRENT_SHA"
          fi

          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse "${HEAD_SHA}^" 2>/dev/null || true)"
          fi

          if [ -z "$BASE_SHA" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "site=true" >> "$GITHUB_OUTPUT"
            echo "builder=true" >> "$GITHUB_OUTPUT"
            echo "workflow=true" >> "$GITHUB_OUTPUT"
            echo "quality=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          site=false
          builder=false
          workflow=false

          mapfile -t CHANGED_FILES < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          printf 'Changed files:\n'
          printf '  %s\n' "${CHANGED_FILES[@]}"

          for file in "${CHANGED_FILES[@]}"; do
            case "$file" in
              site/*)
                site=true
                ;;
              *.py|requirements*.txt|pyproject.toml)
                builder=true
                ;;
              .vercelignore)
                workflow=true
                ;;
              .github/workflows/*.yml|.github/workflows/*.yaml)
                while IFS= read -r line; do
                  case "$line" in
                    +++*|---*|@@*)
                      continue
                      ;;
                    +*|-*)
                      changed_line="${line:1}"
                      if [[ "$changed_line" =~ ^name:[[:space:]] ]]; then
                        continue
                      fi
                      if [ -n "$changed_line" ]; then
                        workflow=true
                        break
                      fi
                      ;;
                  esac
                done < <(git diff --unified=0 "$BASE_SHA" "$HEAD_SHA" -- "$file")
                ;;
            esac
          done

          quality=false
          if [ "$site" = true ] || [ "$builder" = true ] || [ "$workflow" = true ]; then
            quality=true
          fi

          echo "site=$site" >> "$GITHUB_OUTPUT"
          echo "builder=$builder" >> "$GITHUB_OUTPUT"
          echo "workflow=$workflow" >> "$GITHUB_OUTPUT"
          echo "quality=$quality" >> "$GITHUB_OUTPUT"

          echo "Site changes: $site"
          echo "Database builder changes: $builder"
          echo "Substantive workflow/deployment changes: $workflow"
          echo "Run repository validation: $quality"

      - name: Apply first-paint source cleanup
        id: first_paint_cleanup
        if: github.event_name == 'push'
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          bootstrap = Path("site/bootstrap.js")
          bootstrap_text = bootstrap.read_text(encoding="utf-8")
          old_height = '        cell.style.height = "38px";\n        cell.style.minHeight = "38px";'
          new_height = '        cell.style.height = "39px";\n        cell.style.minHeight = "39px";'
          if bootstrap_text.count(old_height) != 1:
              raise SystemExit(f"Expected one 38px bootstrap loading-row owner, found {bootstrap_text.count(old_height)}")
          bootstrap.write_text(bootstrap_text.replace(old_height, new_height, 1), encoding="utf-8")

          responsive = Path("site/responsive.css")
          responsive_text = responsive.read_text(encoding="utf-8")
          marker = """/* Canonical responsive layout owner.
           * Desktop geometry remains in styles.css; viewport-specific adaptations live here.
           * Keep new mobile/tablet media queries out of component and runtime files.
           */

          """
          rules = """/* First-paint table-route ownership. This stylesheet is render-blocking, so
           * these rules apply before bootstrap.js creates loading rows or resolves the
           * static HTML's default Home page. */
          html #tableBody > .staticTableBlankRow > td {
            height: 39px !important;
            min-height: 39px !important;
          }

          html:not(.mflInitialRouteResolved):is(
            [data-initial-page^="database"],
            [data-initial-page^="mfl"],
            [data-initial-page^="progression"],
            [data-initial-page^="agents"],
            [data-initial-page^="watchlist"],
            [data-initial-page^="my-players"],
            [data-initial-page^="clubs/"],
            [data-initial-page^="club/"]
          ) #homePage {
            display: none !important;
          }

          """
          if "First-paint table-route ownership" in responsive_text:
              raise SystemExit("First-paint responsive ownership already exists unexpectedly.")
          if responsive_text.count(marker) != 1:
              raise SystemExit(f"Expected one responsive header marker, found {responsive_text.count(marker)}")
          responsive.write_text(responsive_text.replace(marker, marker + rules, 1), encoding="utf-8")
          PY

          if git diff --quiet -- site/bootstrap.js site/responsive.css; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.changes.outputs.builder == 'true'
        with:
          python-version: "3.12"

      - name: Database builder import smoke test
        if: steps.changes.outputs.builder == 'true'
        working-directory: .
        run: python -c "import rebuild_database; import rebuild_database_runner"

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.quality == 'true' || steps.first_paint_cleanup.outputs.changed == 'true'
        with:
          node-version: 22

      - name: Install site dependencies
        if: steps.changes.outputs.site == 'true' || steps.first_paint_cleanup.outputs.changed == 'true'
        run: npm install

      - name: Lint
        if: steps.changes.outputs.site == 'true' || steps.first_paint_cleanup.outputs.changed == 'true'
        run: npm run lint

      - name: Typecheck
        if: steps.changes.outputs.site == 'true' || steps.first_paint_cleanup.outputs.changed == 'true'
        run: npm run typecheck

      - name: Repository validation
        if: steps.changes.outputs.quality == 'true' || steps.first_paint_cleanup.outputs.changed == 'true'
        run: npm run validate

      - name: Commit verified first-paint cleanup
        if: github.event_name == 'push' && steps.first_paint_cleanup.outputs.changed == 'true'
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git checkout HEAD^ -- .github/workflows/site-quality.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/bootstrap.js site/responsive.css .github/workflows/site-quality.yml
          git diff --cached --check
          git commit -m "Remove first-paint loading conflicts"
          git push origin HEAD:main

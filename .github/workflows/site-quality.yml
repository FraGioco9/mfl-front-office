name: Site quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  checks: write

concurrency:
  group: site-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Detect relevant changes
        id: changes
        working-directory: .
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node ci-quality-scope.mjs

      - uses: actions/setup-python@v7
        if: steps.changes.outputs.builder == 'true' || steps.changes.outputs.workflow == 'true'
        with:
          python-version: "3.12"

      - name: Database builder syntax check
        if: steps.changes.outputs.builder == 'true'
        working-directory: .
        run: python -m compileall -q scripts tests

      - name: Database builder import smoke test
        if: steps.changes.outputs.builder == 'true'
        working-directory: .
        run: python -c "import scripts.database.rebuild_database; import scripts.database.rebuild_database_runner"

      - name: Python regression tests
        if: steps.changes.outputs.builder == 'true' || steps.changes.outputs.workflow == 'true'
        working-directory: .
        run: python -m unittest discover -v -p "test_*.py"

      - name: Reliable scheduler regression tests
        if: steps.changes.outputs.workflow == 'true'
        working-directory: .
        run: node --test tests/test_database_refresh_scheduler.mjs

      - name: Install site dependencies
        if: steps.changes.outputs.quality == 'true'
        run: npm ci --no-audit --no-fund

      - name: Next development runtime smoke test
        if: steps.changes.outputs.site == 'true'
        shell: bash
        env:
          WALLET_CHALLENGE_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          WALLET_CHALLENGE_ORIGIN: http://127.0.0.1:4000
          MFL_DATABASE_PATH: ${{ runner.temp }}/mfl-next-dev-smoke.db
          MFL_CSP_NONCE_REPORT_ONLY: "1"
        run: |
          set -euo pipefail
          # The parser-time CSP snapshot must match canonical HTML before Next loads its config.
          # Generated files remain CI-owned and are committed only after full validation.
          node build-fragments.mjs html
          node validate-vercel-security-headers.mjs
          node scripts/ci/create-next-sqlite-smoke-fixture.cjs "$MFL_DATABASE_PATH"
          npm run dev > /tmp/mfl-next-dev.log 2>&1 &
          NEXT_DEV_PID=$!
          cleanup() {
            kill "$NEXT_DEV_PID" >/dev/null 2>&1 || true
            wait "$NEXT_DEV_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:4000/modules/app-entry.js > /tmp/mfl-dev-app-entry.js; then
              break
            fi
            if ! kill -0 "$NEXT_DEV_PID" >/dev/null 2>&1; then
              cat /tmp/mfl-next-dev.log >&2
              exit 1
            fi
            sleep 0.5
          done
          grep -q "PREBUILT_CORE_PATH" /tmp/mfl-dev-app-entry.js
          if ! curl --fail --silent --show-error "http://127.0.0.1:4000/api/identity" > /tmp/mfl-dev-identity.json; then
            cat /tmp/mfl-next-dev.log >&2
            exit 1
          fi
          jq -e '.runtime.version and .database.generatedAt' /tmp/mfl-dev-identity.json >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:4000/api/operational-health > /tmp/mfl-dev-operational-health.json
          jq -e '.database.freshness.status and .database.freshness.generatedAt' /tmp/mfl-dev-operational-health.json >/dev/null
          curl --fail --silent --show-error --cookie-jar /tmp/mfl-wallet-cookies.txt http://127.0.0.1:4000/api/wallet-session > /tmp/mfl-wallet-challenge.json
          CHALLENGE_TOKEN="$(jq -r '.token' /tmp/mfl-wallet-challenge.json)"
          EXCHANGE_BODY="$(jq -nc --arg token "$CHALLENGE_TOKEN" '{challengeToken:$token,proof:{}}')"
          EXCHANGE_STATUS="$(curl --silent --show-error --output /tmp/mfl-wallet-exchange.json --write-out '%{http_code}' --cookie /tmp/mfl-wallet-cookies.txt --header 'Origin: http://127.0.0.1:4000' --header 'Content-Type: application/json' --data "$EXCHANGE_BODY" http://127.0.0.1:4000/api/wallet-session)"
          test "$EXCHANGE_STATUS" = "401"
          jq -e '.error == "Invalid wallet proof."' /tmp/mfl-wallet-exchange.json >/dev/null

          # Consolidated rendered-shell/CSP/mobile route coverage.
          node validation/next-rendered-shell-browser.mjs http://127.0.0.1:4000/
          node validation/next-csp-script-hashes.mjs http://127.0.0.1:4000/
          node validation/next-csp-nonce-browser.mjs http://127.0.0.1:4000/
          node validate-csp-legacy-eval-elimination.mjs
          node validation/next-csp-report-route.mjs http://127.0.0.1:4000/
          status="$(curl --silent --show-error --output /tmp/mfl-planner-direct.html --write-out '%{http_code}' http://127.0.0.1:4000/planner)"
          test "$status" = "200"
          grep -q 'id="plannerPage"' /tmp/mfl-planner-direct.html
          grep -q 'class="navEmoji navPlannerIcon"' /tmp/mfl-planner-direct.html
          node validation/next-rendered-shell-browser.mjs http://127.0.0.1:4000/planner
          node validation/next-mobile-table-browser.mjs http://127.0.0.1:4000/
          node validation/next-mobile-table-route-browser.mjs http://127.0.0.1:4000
          ! grep -Fq "viewport meta tags should not be used in _document.js's <Head>" /tmp/mfl-next-dev.log
          ! grep -Fq "<title> should not be used in _document.js's <Head>" /tmp/mfl-next-dev.log

      - name: Build canonical site assets
        if: steps.changes.outputs.quality == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/workflows/write-deployment-commit.mjs "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          npm run build

      - name: Verify built deployment identity
        if: steps.changes.outputs.site == 'true'
        run: node scripts/workflows/verify-next-build-deployment-commit.mjs "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"

      - name: Next runtime smoke test
        if: steps.changes.outputs.site == 'true'
        shell: bash
        env:
          WALLET_CHALLENGE_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          WALLET_CHALLENGE_ORIGIN: http://127.0.0.1:4010
          MFL_CSP_NONCE_REPORT_ONLY: "1"
          MFL_DATABASE_PATH: ${{ runner.temp }}/mfl-next-http-smoke.db
        run: |
          set -euo pipefail
          node scripts/ci/create-next-sqlite-smoke-fixture.cjs "$MFL_DATABASE_PATH"
          npx next start -p 4010 > /tmp/mfl-next-start.log 2>&1 &
          NEXT_PID=$!
          cleanup() {
            kill "$NEXT_PID" >/dev/null 2>&1 || true
            wait "$NEXT_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error http://127.0.0.1:4010/ > /tmp/mfl-root.html; then
              break
            fi
            if ! kill -0 "$NEXT_PID" >/dev/null 2>&1; then
              cat /tmp/mfl-next-start.log >&2
              exit 1
            fi
            sleep 0.5
          done
          grep -q "MFL Front Office" /tmp/mfl-root.html
          curl --fail --silent --show-error http://127.0.0.1:4010/modules/app-entry.js > /tmp/mfl-app-entry.js
          grep -q "PREBUILT_CORE_PATH" /tmp/mfl-app-entry.js
          curl --fail --silent --show-error http://127.0.0.1:4010/database/attributes > /tmp/mfl-deep-route.html
          grep -q "MFL Front Office" /tmp/mfl-deep-route.html
          node validation/next-initial-page-metadata-http.mjs http://127.0.0.1:4010 || { cat /tmp/mfl-next-start.log >&2; exit 1; }
          node validation/next-evaluation-route-http.mjs http://127.0.0.1:4010 || { cat /tmp/mfl-next-start.log >&2; exit 1; }
          node validation/next-evaluation-browser.mjs http://127.0.0.1:4010 || { cat /tmp/mfl-next-start.log >&2; exit 1; }
          node validation/cache-policy-http-regression.mjs http://127.0.0.1:4010 || { cat /tmp/mfl-next-start.log >&2; exit 1; }
          curl --fail --silent --show-error http://127.0.0.1:4010/api/wallet-session > /tmp/mfl-wallet-session.json
          jq -e '.token and (.nonce | test("^[0-9a-f]{64}$"))' /tmp/mfl-wallet-session.json >/dev/null
          node validation/next-csp-nonce-browser.mjs http://127.0.0.1:4010/ --production
          node validation/next-csp-report-route.mjs http://127.0.0.1:4010/ --production

      - name: Lint
        if: steps.changes.outputs.site == 'true'
        run: npm run lint

      - name: Typecheck
        if: steps.changes.outputs.site == 'true'
        run: npm run typecheck

      - name: Repository validation
        if: steps.changes.outputs.quality == 'true'
        run: npm run validate

      - name: Isolated loading, search and feedback regressions
        if: steps.changes.outputs.site == 'true'
        shell: bash
        env:
          LOAD03_EXPECT_FIXED: "1"
          LOAD04_EXPECT_FIXED: "1"
        run: |
          set -euo pipefail
          node --check validation/request-failure-regression.mjs
          node validation/request-failure-regression.mjs
          node --check validation/incremental-network-regression.mjs
          node validation/incremental-network-regression.mjs
          node --check validation/search-concurrency-regression.mjs
          node validation/search-concurrency-regression.mjs
          node --check validation/feedback-context-regression.mjs
          node validation/feedback-context-regression.mjs

      - name: Player portrait cache regression
        if: steps.changes.outputs.site == 'true'
        run: node validation/player-portrait-cache-regression.mjs

      - name: Recovery browser matrix
        if: steps.changes.outputs.site == 'true'
        run: node validation/browser-matrix-runner.mjs recovery

      - name: Saved actions browser matrix
        if: steps.changes.outputs.site == 'true'
        run: node validation/browser-matrix-runner.mjs saved-actions

      - name: Filter state browser matrix
        if: steps.changes.outputs.site == 'true'
        run: node validation/browser-matrix-runner.mjs filter-state

      - name: Narrow CSS reflow browser matrix
        if: steps.changes.outputs.site == 'true'
        run: node validation/browser-matrix-runner.mjs narrow-reflow

      - name: Browser routing regression
        if: steps.changes.outputs.site == 'true'
        run: node validation/browser-routing-phase-runner.mjs broad

      - name: Player to Evaluation rate readiness
        if: steps.changes.outputs.site == 'true'
        run: node validation/browser-evaluation-rate-route-commit.mjs

      - name: Planner browser regression
        if: steps.changes.outputs.site == 'true'
        run: node validation/browser-routing-phase-runner.mjs planner

      - name: Consolidated accessibility and responsive regressions
        if: steps.changes.outputs.site == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm run test:a11y
          npm run test:a11y:controls
          npm run test:a11y:contrast
          npm run test:a11y:announcements
          npm run test:a11y:motion
          npm run test:a11y:landmarks
          node validate-mobile-summary-first-paint.mjs
          node validation/browser-diagnostics-runner.mjs first-paint
          node validation/browser-diagnostics-runner.mjs listing-width
          node validation/browser-responsive-contract-runner.mjs mobile-resize
          # Hostile inherited mode must not override the explicit CLI argument.
          MFL_BROWSER_RESPONSIVE_COMPAT_MODE=sticky-name-theme node validation/browser-responsive-contract-runner.mjs long-mobile-table
          MFL_BROWSER_RESPONSIVE_COMPAT_MODE=long-mobile-table node validation/browser-responsive-contract-runner.mjs sticky-name-theme
          # Invoke historical entrypoints directly, including previously ignored extra argv.
          MFL_BROWSER_RESPONSIVE_COMPAT_MODE=sticky-name-theme node validation/browser-long-mobile-table-regression.mjs --legacy-ignored-arg
          test ! -e validation/.browser-long-mobile-table-long-mobile-table.tmp.mjs
          MFL_BROWSER_RESPONSIVE_COMPAT_MODE=long-mobile-table node validation/browser-sticky-name-theme-regression.mjs --legacy-ignored-arg
          test ! -e validation/.browser-sticky-name-theme-sticky-theme.tmp.mjs
          # Negative fixture tests prove subprocess failure propagates and temp files are cleaned.
          for mode in long-mobile-table sticky-name-theme; do
            if failure_log="$(MFL_BROWSER_SCENARIOS=__qa_cli_missing_scenario__ node "validation/browser-${mode}-regression.mjs" --legacy-ignored-arg 2>&1)"; then
              echo "Expected ${mode} CLI to reject an unknown browser scenario." >&2
              exit 1
            fi
            printf '%s\n' "$failure_log" | grep -F "No browser regression scenarios matched MFL_BROWSER_SCENARIOS."
          done
          test ! -e validation/.browser-long-mobile-table-long-mobile-table.tmp.mjs
          test ! -e validation/.browser-sticky-name-theme-sticky-theme.tmp.mjs
          node validation/browser-orientation-regression.mjs
          node validation/browser-responsive-contract-runner.mjs shell-boundary
          node validation/browser-responsive-contract-runner.mjs intermediate
          node validation/browser-routing-phase-runner.mjs mobile
          node validation/browser-diagnostics-runner.mjs header-1374

      - name: Commit generated site artifacts
        id: generated
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          steps.changes.outputs.quality == 'true'
        working-directory: .
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git add -- \
            bootstrap.js \
            bootstrap-core.js \
            index.html \
            responsive.css \
            styles-runtime.css \
            table-width-runtime.js \
            modules/app-core-runtime.js \
            modules/app-core-*-runtime.js
          if git diff --cached --quiet; then
            echo "Generated site artifacts are current."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate site artifacts"
          git push origin "HEAD:$HEAD_BRANCH"
          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify generated site artifacts
        if: steps.changes.outputs.quality == 'true'
        run: npm run verify:generated

      - name: Publish exact generated-head quality check
        if: steps.generated.outputs.committed == 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          GENERATED_HEAD: ${{ steps.generated.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          DETAILS_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          jq -n \
            --arg sha "$GENERATED_HEAD" \
            --arg details "$DETAILS_URL" \
            '{
              name: "quality",
              head_sha: $sha,
              status: "completed",
              conclusion: "success",
              details_url: $details,
              output: {
                title: "Generated artifacts validated",
                summary: "Site Quality validated the source commit, regenerated tracked artifacts, verified the generated tree, and published this result on the exact generated PR head."
              }
            }' \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" --input -


  windows-next-dev-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Smoke-test exact Next dev command with native SQLite
        shell: powershell
        env:
          MFL_DATABASE_PATH: ${{ runner.temp }}\mfl-next-dev-smoke.db
          WALLET_CHALLENGE_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          WALLET_CHALLENGE_ORIGIN: http://127.0.0.1:4000
        run: |
          # Regenerate the source-owned first-paint HTML before Next checks its CSP hash inventory.
          node build-fragments.mjs html
          node scripts/ci/create-next-sqlite-smoke-fixture.cjs $env:MFL_DATABASE_PATH
          $stdout = Join-Path $env:RUNNER_TEMP "mfl-next-dev.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "mfl-next-dev.stderr.log"
          $process = Start-Process -FilePath "npm.cmd" -ArgumentList "run","dev" -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $ready = $false
            for ($attempt = 1; $attempt -le 60; $attempt++) {
              try {
                $entry = Invoke-WebRequest "http://127.0.0.1:4000/modules/app-entry.js" -UseBasicParsing
                if ($entry.StatusCode -eq 200 -and $entry.Content -match "PREBUILT_CORE_PATH") {
                  $ready = $true
                  break
                }
              } catch {}
              if ($process.HasExited) {
                Get-Content $stdout -ErrorAction SilentlyContinue
                Get-Content $stderr -ErrorAction SilentlyContinue
                throw "Next development server exited before becoming ready."
              }
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) {
              Get-Content $stdout -ErrorAction SilentlyContinue
              Get-Content $stderr -ErrorAction SilentlyContinue
              throw "Next development server did not become ready."
            }
            try {
              $identity = Invoke-RestMethod "http://127.0.0.1:4000/api/identity"
            } catch {
              Get-Content $stdout -ErrorAction SilentlyContinue
              Get-Content $stderr -ErrorAction SilentlyContinue
              throw
            }
            if (-not $identity.runtime.version -or -not $identity.database.generatedAt) {
              throw "Windows Next development identity API did not return the SQLite-backed payload."
            }
            $cookieJar = Join-Path $env:RUNNER_TEMP "mfl-wallet-cookies.txt"
            $exchangePath = Join-Path $env:RUNNER_TEMP "mfl-wallet-exchange.json"
            $challengeRaw = & curl.exe --fail --silent --show-error --cookie-jar $cookieJar "http://127.0.0.1:4000/api/wallet-session"
            if ($LASTEXITCODE -ne 0) { throw "Could not issue Windows wallet challenge." }
            $challenge = $challengeRaw | ConvertFrom-Json
            $exchangeBody = @{ challengeToken = $challenge.token; proof = @{} } | ConvertTo-Json -Compress
            $exchangeBodyPath = Join-Path $env:RUNNER_TEMP "mfl-wallet-exchange-body.json"
            [System.IO.File]::WriteAllText($exchangeBodyPath, $exchangeBody, (New-Object System.Text.UTF8Encoding($false)))
            $exchangeStatus = & curl.exe --silent --show-error --output $exchangePath --write-out "%{http_code}" --cookie $cookieJar --header "Origin: http://127.0.0.1:4000" --header "Content-Type: application/json" --data-binary "@$exchangeBodyPath" "http://127.0.0.1:4000/api/wallet-session"
            if ($LASTEXITCODE -ne 0) { throw "Could not exchange Windows wallet challenge." }
            $exchangeJson = Get-Content $exchangePath -Raw | ConvertFrom-Json
            if ($exchangeStatus.Trim() -ne "401" -or $exchangeJson.error -ne "Invalid wallet proof.") {
              throw "Windows Next development challenge exchange returned status $($exchangeStatus.Trim()) and error '$($exchangeJson.error)'."
            }
          } finally {
            if (-not $process.HasExited) {
              taskkill /PID $process.Id /T /F | Out-Null
            }
          }

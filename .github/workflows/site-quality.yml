name: Site quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply sidebar grid source migration
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/sidebar-grid-alignment'
        working-directory: .
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_text(path, old, new, label):
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          def replace_block(path, pattern, replacement, label):
              text = path.read_text(encoding="utf-8")
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              path.write_text(updated, encoding="utf-8")

          styles = Path("site/styles-base.css")
          if ".sidebarGrid {\n  display: grid;" not in styles.read_text(encoding="utf-8"):
              index = Path("site/index.html")
              replace_text(index, '        <aside id="sidebar" class="sidebar">\n', '        <aside id="sidebar" class="sidebar">\n          <div class="sidebarGrid">\n', "sidebar grid wrapper start")
              replace_text(index, '          <a class="navButton settingsNavButton"', '          </div>\n          <a class="navButton settingsNavButton"', "sidebar grid wrapper end")

              replace_block(
                  styles,
                  r"\.sidebar \{\n.*?\n\}",
                  ".sidebar {\n  width: 162px;\n  margin-top: 12px;\n  min-height: calc(100vh - 188px);\n  max-height: none;\n  display: grid;\n  grid-template-rows: auto minmax(0, 1fr) auto;\n  opacity: 1;\n  transform: translateX(0);\n  transition: none;\n}",
                  "desktop sidebar container",
              )
              replace_text(
                  styles,
                  ".sidebar[hidden] {\n  display: none;\n}\n",
                  ".sidebar[hidden] {\n  display: none;\n}\n\n.sidebarGrid {\n  display: grid;\n  grid-auto-rows: 40px;\n  gap: 8px;\n  min-width: 0;\n}\n",
                  "desktop sidebar grid",
              )
              replace_block(
                  styles,
                  r"\.settingsNavButton \{\n.*?\n\}",
                  ".settingsNavButton {\n  grid-row: 3;\n  align-self: end;\n  margin: 0 0 8px;\n}",
                  "desktop Settings placement",
              )
              replace_block(
                  styles,
                  r"\.navButton \{\n.*?\n\}",
                  ".navButton {\n  display: grid;\n  grid-template-columns: 18px minmax(0, 1fr);\n  align-items: center;\n  justify-items: start;\n  width: 100%;\n  height: 40px;\n  margin: 0;\n  border: 1px solid var(--border-strong);\n  border-radius: 6px;\n  background: var(--surface);\n  color: var(--text);\n  column-gap: 8px;\n  padding: 0 14px;\n  text-align: left;\n  text-decoration: none;\n  cursor: pointer;\n  transition: background 120ms ease, border-color 120ms ease;\n}",
                  "sidebar page box grid",
              )
              replace_block(
                  styles,
                  r"\.navEmoji \{\n.*?\n\}",
                  ".navEmoji {\n  display: grid;\n  place-items: center;\n  align-self: center;\n  justify-self: center;\n  width: 18px;\n  height: 18px;\n  color: currentColor;\n  font-family: \"Titillium Web\", Arial, Helvetica, sans-serif;\n  font-size: 18px;\n  line-height: 1;\n  text-align: center;\n  transition: none;\n}",
                  "sidebar icon cell",
              )
              replace_block(
                  styles,
                  r"\.navMflIcon \{\n.*?\n\}",
                  ".navMflIcon {\n  width: 18px;\n  height: 18px;\n  fill: currentColor;\n  stroke: none;\n}",
                  "MFL sidebar icon geometry",
              )
              replace_block(
                  styles,
                  r"\.navJerseyIcon \{\n  width: 15px;.*?\n\}",
                  ".navJerseyIcon {\n  width: 15px;\n  height: 18px;\n  transform: none;\n}",
                  "jersey sidebar icon geometry",
              )
              replace_block(
                  styles,
                  r"\.navText \{\n.*?\n\}",
                  ".navText {\n  display: flex;\n  align-items: center;\n  align-self: center;\n  height: 18px;\n  max-width: 112px;\n  overflow: hidden;\n  opacity: 1;\n  line-height: 1;\n  white-space: nowrap;\n  transition: none;\n}",
                  "sidebar label cell",
              )

              responsive = Path("site/responsive.css")
              replace_block(
                  responsive,
                  r"(  \.sidebar \{\n.*?\n  \})",
                  r"\1\n\n  .sidebarGrid {\n    display: contents;\n  }",
                  "mobile sidebar wrapper flattening",
              )
              replace_block(
                  responsive,
                  r"  \.settingsNavButton \{\n.*?\n  \}",
                  "  .settingsNavButton {\n    align-self: center;\n    margin: 0 0 0 auto;\n  }",
                  "mobile Settings alignment",
              )

      - name: Commit sidebar grid source migration
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/sidebar-grid-alignment'
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git add -- site/index.html site/styles-base.css site/responsive.css
          if git diff --cached --quiet; then
            echo "Sidebar sources are already migrated."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Rebuild sidebar grid alignment"
            git push origin "HEAD:${{ github.head_ref }}"
          fi

      - name: Detect relevant changes
        id: changes
        working-directory: .
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$PR_BASE_SHA"
            HEAD_SHA="$PR_HEAD_SHA"
          else
            BASE_SHA="$BEFORE_SHA"
            HEAD_SHA="$CURRENT_SHA"
          fi

          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse "${HEAD_SHA}^" 2>/dev/null || true)"
          fi

          if [ -z "$BASE_SHA" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "site=true" >> "$GITHUB_OUTPUT"
            echo "builder=true" >> "$GITHUB_OUTPUT"
            echo "workflow=true" >> "$GITHUB_OUTPUT"
            echo "quality=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          site=false
          builder=false
          workflow=false

          mapfile -t CHANGED_FILES < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          printf 'Changed files:\n'
          printf '  %s\n' "${CHANGED_FILES[@]}"

          for file in "${CHANGED_FILES[@]}"; do
            case "$file" in
              site/*|.gitattributes)
                site=true
                ;;
              *.py|requirements*.txt|pyproject.toml)
                builder=true
                ;;
              .vercelignore)
                workflow=true
                ;;
              .github/workflows/*.yml|.github/workflows/*.yaml)
                while IFS= read -r line; do
                  case "$line" in
                    +++*|---*|@@*)
                      continue
                      ;;
                    +*|-*)
                      changed_line="${line:1}"
                      if [[ "$changed_line" =~ ^name:[[:space:]] ]]; then
                        continue
                      fi
                      if [ -n "$changed_line" ]; then
                        workflow=true
                        break
                      fi
                      ;;
                  esac
                done < <(git diff --unified=0 "$BASE_SHA" "$HEAD_SHA" -- "$file")
                ;;
            esac
          done

          quality=false
          if [ "$site" = true ] || [ "$builder" = true ] || [ "$workflow" = true ]; then
            quality=true
          fi

          echo "site=$site" >> "$GITHUB_OUTPUT"
          echo "builder=$builder" >> "$GITHUB_OUTPUT"
          echo "workflow=$workflow" >> "$GITHUB_OUTPUT"
          echo "quality=$quality" >> "$GITHUB_OUTPUT"

          echo "Site changes: $site"
          echo "Database builder changes: $builder"
          echo "Substantive workflow/deployment changes: $workflow"
          echo "Run repository validation: $quality"

      - uses: actions/setup-python@v5
        if: steps.changes.outputs.builder == 'true'
        with:
          python-version: "3.12"

      - name: Database builder syntax check
        if: steps.changes.outputs.builder == 'true'
        working-directory: .
        run: python -m compileall -q *.py

      - name: Database builder import smoke test
        if: steps.changes.outputs.builder == 'true'
        working-directory: .
        run: python -c "import rebuild_database; import rebuild_database_runner"

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.quality == 'true'
        with:
          node-version: 22

      - name: Install site dependencies
        if: steps.changes.outputs.quality == 'true'
        run: npm install

      - name: Lint
        if: steps.changes.outputs.site == 'true'
        run: npm run lint

      - name: Typecheck
        if: steps.changes.outputs.site == 'true'
        run: npm run typecheck

      - name: Build canonical application core
        if: steps.changes.outputs.quality == 'true'
        run: npm run build:core

      - name: Repository validation
        if: steps.changes.outputs.quality == 'true'
        run: npm run validate

      - name: Commit generated application artifacts
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          steps.changes.outputs.quality == 'true'
        working-directory: .
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git add -- site/table-width-runtime.js site/modules/app-core-runtime.js site/modules/app-core-*-runtime.js
          if git diff --cached --quiet; then
            echo "Generated application artifacts are current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate application core"
          git push origin "HEAD:$HEAD_BRANCH"
          gh workflow run site-quality.yml --ref "$HEAD_BRANCH"

      - name: Verify generated application artifacts
        if: steps.changes.outputs.quality == 'true'
        run: npm run verify:generated

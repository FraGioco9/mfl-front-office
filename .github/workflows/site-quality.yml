name: Site quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply canonical sidebar lifecycle migration
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'chore/canonical-sidebar-lifecycle'
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';

          const path = 'site/modules/app-core.js';
          let source = (await readFile(path, 'utf8')).replace(/\r\n?/g, '\n');

          const replaceOnce = (from, to, label) => {
            const first = source.indexOf(from);
            const last = source.lastIndexOf(from);
            if (first < 0 || first !== last) throw new Error(`${label}: expected exactly one source match.`);
            source = source.slice(0, first) + to + source.slice(first + from.length);
          };

          replaceOnce('  menuAnimationTimer: null,\n', '', 'obsolete sidebar animation state');

          replaceOnce(
            `function updateMenuVisibility() {
  const showMenu = true;
  document.body.classList.toggle("guest", state.currentPage === "progression" && !hasProgressionAccess());
  menuRail.hidden = false;
  menuButton.hidden = false;
  sidebar.hidden = false;
  appShell.classList.toggle("menuClosed", !state.menuOpen);
  statusText.hidden = false;
  menuButton.setAttribute("aria-expanded", String(showMenu && state.menuOpen));
}`,
            `function updateMenuVisibility() {
  state.menuOpen = true;
  document.body.classList.toggle("guest", state.currentPage === "progression" && !hasProgressionAccess());
  menuRail.hidden = false;
  menuButton.hidden = false;
  sidebar.hidden = false;
  appShell.classList.remove("menuClosed");
  statusText.hidden = false;
  menuButton.disabled = true;
  menuButton.tabIndex = -1;
  menuButton.setAttribute("aria-disabled", "true");
  menuButton.setAttribute("aria-expanded", "true");
}`,
            'canonical menu visibility',
          );

          replaceOnce(
            `function toggleMenu() {
  appShell.classList.add("menuAnimating");
  window.clearTimeout(state.menuAnimationTimer);
  state.menuOpen = !state.menuOpen;
  updateMenuVisibility();
  state.menuAnimationTimer = window.setTimeout(() => {
    appShell.classList.remove("menuAnimating");
  }, 220);
  saveTableState();
}`,
            `function toggleMenu() {
  updateMenuVisibility();
}`,
            'canonical menu toggle',
          );

          replaceOnce(
            `function restoreMenuState(savedState) {
  if (typeof savedState?.menuOpen === "boolean") {
    state.menuOpen = savedState.menuOpen;
  }
}`,
            `function restoreMenuState() {
  state.menuOpen = true;
}`,
            'canonical persisted menu state',
          );

          const sidebarOwner = source.indexOf('  function keepSidebarExpanded() {');
          if (sidebarOwner < 0 || sidebarOwner !== source.lastIndexOf('  function keepSidebarExpanded() {')) {
            throw new Error('Expected exactly one late pinned-sidebar owner.');
          }
          const sidebarIifeStart = source.lastIndexOf('(() => {', sidebarOwner);
          const watchlistRouteStart = source.indexOf('  function routeViewFromPath() {', sidebarOwner);
          if (sidebarIifeStart < 0 || watchlistRouteStart < 0) {
            throw new Error('Could not isolate the sidebar/watchlist compatibility IIFE.');
          }
          source = source.slice(0, sidebarIifeStart) + '(() => {\n' + source.slice(watchlistRouteStart);

          replaceOnce('      keepSidebarExpanded();\n', '', 'setPage sidebar refresh patch');

          const routeOwnerStart = source.indexOf('  function routeViewFromPath() {', sidebarIifeStart);
          const captureStart = source.indexOf('\n\n  document.addEventListener("click", (event) => {', routeOwnerStart);
          const publicProgressionMarker = '\n})();\n\n/* Public progression table views */';
          const sidebarIifeEnd = source.indexOf(publicProgressionMarker, captureStart);
          if (captureStart < 0 || sidebarIifeEnd < 0) {
            throw new Error('Could not remove the obsolete sidebar capture/DOMContentLoaded tail.');
          }
          source = source.slice(0, captureStart) + source.slice(sidebarIifeEnd);

          for (const stale of [
            'function keepSidebarExpanded()',
            'permanentlyExpandedMenu',
            'menuAnimationTimer',
            'classList.add("menuAnimating")',
            'classList.add("menuOpen")',
            '"sidebarClosed"',
            '"sidebarCollapsed"',
            'keepSidebarExpanded();',
          ]) {
            if (source.includes(stale)) throw new Error(`Stale sidebar owner remains: ${stale}`);
          }

          await writeFile(path, source, 'utf8');
          NODE

      - name: Detect relevant changes
        id: changes
        working-directory: .
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$PR_BASE_SHA"
            HEAD_SHA="$PR_HEAD_SHA"
          else
            BASE_SHA="$BEFORE_SHA"
            HEAD_SHA="$CURRENT_SHA"
          fi

          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse "${HEAD_SHA}^" 2>/dev/null || true)"
          fi

          if [ -z "$BASE_SHA" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "site=true" >> "$GITHUB_OUTPUT"
            echo "builder=true" >> "$GITHUB_OUTPUT"
            echo "workflow=true" >> "$GITHUB_OUTPUT"
            echo "quality=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          site=false
          builder=false
          workflow=false

          mapfile -t CHANGED_FILES < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          printf 'Changed files:\n'
          printf '  %s\n' "${CHANGED_FILES[@]}"

          for file in "${CHANGED_FILES[@]}"; do
            case "$file" in
              site/*|.gitattributes)
                site=true
                ;;
              *.py|requirements*.txt|pyproject.toml)
                builder=true
                ;;
              .vercelignore)
                workflow=true
                ;;
              .github/workflows/*.yml|.github/workflows/*.yaml)
                while IFS= read -r line; do
                  case "$line" in
                    +++*|---*|@@*)
                      continue
                      ;;
                    +*|-*)
                      changed_line="${line:1}"
                      if [[ "$changed_line" =~ ^name:[[:space:]] ]]; then
                        continue
                      fi
                      if [ -n "$changed_line" ]; then
                        workflow=true
                        break
                      fi
                      ;;
                  esac
                done < <(git diff --unified=0 "$BASE_SHA" "$HEAD_SHA" -- "$file")
                ;;
            esac
          done

          quality=false
          if [ "$site" = true ] || [ "$builder" = true ] || [ "$workflow" = true ]; then
            quality=true
          fi

          echo "site=$site" >> "$GITHUB_OUTPUT"
          echo "builder=$builder" >> "$GITHUB_OUTPUT"
          echo "workflow=$workflow" >> "$GITHUB_OUTPUT"
          echo "quality=$quality" >> "$GITHUB_OUTPUT"

          echo "Site changes: $site"
          echo "Database builder changes: $builder"
          echo "Substantive workflow/deployment changes: $workflow"
          echo "Run repository validation: $quality"

      - uses: actions/setup-python@v5
        if: steps.changes.outputs.builder == 'true'
        with:
          python-version: "3.12"

      - name: Database builder syntax check
        if: steps.changes.outputs.builder == 'true'
        working-directory: .
        run: python -m compileall -q *.py

      - name: Database builder import smoke test
        if: steps.changes.outputs.builder == 'true'
        working-directory: .
        run: python -c "import rebuild_database; import rebuild_database_runner"

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.quality == 'true'
        with:
          node-version: 22

      - name: Install site dependencies
        if: steps.changes.outputs.quality == 'true'
        run: npm install

      - name: Lint
        if: steps.changes.outputs.site == 'true'
        run: npm run lint

      - name: Typecheck
        if: steps.changes.outputs.site == 'true'
        run: npm run typecheck

      - name: Build canonical application core
        if: steps.changes.outputs.quality == 'true'
        run: npm run build:core

      - name: Verify generated application artifacts
        if: steps.changes.outputs.quality == 'true'
        run: npm run verify:generated

      - name: Repository validation
        if: steps.changes.outputs.quality == 'true'
        run: npm run validate

      - name: Publish canonical sidebar migration
        if: success() && github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'chore/canonical-sidebar-lifecycle'
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- .github/workflows/site-quality.yml
          rm -f .github/workflows/canonical-sidebar-migration.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- site/modules/app-core.js .github/workflows/site-quality.yml .github/workflows/canonical-sidebar-migration.yml
          git diff --cached --exit-code && { echo 'Migration produced no changes.'; exit 1; } || true
          git commit -m "Canonicalize pinned sidebar lifecycle"
          git push origin HEAD:chore/canonical-sidebar-lifecycle

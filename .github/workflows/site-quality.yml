name: Site quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Detect relevant changes
        id: changes
        working-directory: .
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$PR_BASE_SHA"
            HEAD_SHA="$PR_HEAD_SHA"
          else
            BASE_SHA="$BEFORE_SHA"
            HEAD_SHA="$CURRENT_SHA"
          fi

          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse "${HEAD_SHA}^" 2>/dev/null || true)"
          fi

          if [ -z "$BASE_SHA" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "site=true" >> "$GITHUB_OUTPUT"
            echo "builder=true" >> "$GITHUB_OUTPUT"
            echo "workflow=true" >> "$GITHUB_OUTPUT"
            echo "quality=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          site=false
          builder=false
          workflow=false

          mapfile -t CHANGED_FILES < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          printf 'Changed files:\n'
          printf '  %s\n' "${CHANGED_FILES[@]}"

          for file in "${CHANGED_FILES[@]}"; do
            case "$file" in
              site/*)
                site=true
                ;;
              *.py|requirements*.txt|pyproject.toml)
                builder=true
                ;;
              .vercelignore)
                workflow=true
                ;;
              .github/workflows/*.yml|.github/workflows/*.yaml)
                while IFS= read -r line; do
                  case "$line" in
                    +++*|---*|@@*)
                      continue
                      ;;
                    +*|-*)
                      changed_line="${line:1}"
                      if [[ "$changed_line" =~ ^name:[[:space:]] ]]; then
                        continue
                      fi
                      if [ -n "$changed_line" ]; then
                        workflow=true
                        break
                      fi
                      ;;
                  esac
                done < <(git diff --unified=0 "$BASE_SHA" "$HEAD_SHA" -- "$file")
                ;;
            esac
          done

          quality=false
          if [ "$site" = true ] || [ "$builder" = true ] || [ "$workflow" = true ]; then
            quality=true
          fi

          echo "site=$site" >> "$GITHUB_OUTPUT"
          echo "builder=$builder" >> "$GITHUB_OUTPUT"
          echo "workflow=$workflow" >> "$GITHUB_OUTPUT"
          echo "quality=$quality" >> "$GITHUB_OUTPUT"

          echo "Site changes: $site"
          echo "Database builder changes: $builder"
          echo "Substantive workflow/deployment changes: $workflow"
          echo "Run repository validation: $quality"

      - uses: actions/setup-python@v5
        if: steps.changes.outputs.builder == 'true'
        with:
          python-version: "3.12"

      - name: Database builder import smoke test
        if: steps.changes.outputs.builder == 'true'
        working-directory: .
        run: python -c "import rebuild_database; import rebuild_database_runner"

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.quality == 'true'
        with:
          node-version: 22

      - name: Migrate canonical application-core source
        if: github.event_name == 'pull_request' && github.head_ref == 'optimization/app-core-source-migration'
        run: |
          node prep-app-core-migration.mjs
          node prep-app-core-validation.mjs
          node prep-app-core-validation-late.mjs
          node prep-app-core-validation-tail.mjs
          node prep-app-core-validation-more.mjs
          node prep-app-core-validation-routes.mjs
          node prep-app-core-validation-final.mjs
          node migrate-app-core-source.mjs

      - name: Install site dependencies
        if: steps.changes.outputs.quality == 'true'
        run: npm install

      - name: Lint
        if: steps.changes.outputs.site == 'true'
        run: npm run lint

      - name: Typecheck
        if: steps.changes.outputs.site == 'true'
        run: npm run typecheck

      - name: Build canonical application core
        if: steps.changes.outputs.quality == 'true'
        run: npm run build:core

      - name: Repository validation
        if: steps.changes.outputs.quality == 'true'
        run: npm run validate

      - name: Commit validated canonical source migration
        if: github.event_name == 'pull_request' && github.head_ref == 'optimization/app-core-source-migration'
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- .github/workflows/site-quality.yml
          rm -f site/migrate-app-core-source.mjs site/prep-app-core-migration.mjs site/prep-app-core-validation.mjs site/prep-app-core-validation-late.mjs site/prep-app-core-validation-tail.mjs site/prep-app-core-validation-more.mjs site/prep-app-core-validation-routes.mjs site/prep-app-core-validation-final.mjs
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No canonical source migration changes remain to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Make application core source canonical"
          git push origin HEAD:${GITHUB_HEAD_REF}

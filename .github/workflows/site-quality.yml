name: Site quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply sidebar grid source migration
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/sidebar-grid-alignment'
        working-directory: .
        shell: python
        run: |
          from pathlib import Path

          styles = Path("site/styles-base.css")
          if ".sidebarGrid {\n  display: grid;" not in styles.read_text(encoding="utf-8"):
              def replace_once(path, old, new, label):
                  text = path.read_text(encoding="utf-8")
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"{label}: expected exactly one match, found {count}")
                  path.write_text(text.replace(old, new, 1), encoding="utf-8")

              index = Path("site/index.html")
              replace_once(index, '        <aside id="sidebar" class="sidebar">\n', '        <aside id="sidebar" class="sidebar">\n          <div class="sidebarGrid">\n', "sidebar grid wrapper start")
              replace_once(index, '          <a class="navButton settingsNavButton"', '          </div>\n          <a class="navButton settingsNavButton"', "sidebar grid wrapper end")

              replace_once(styles, '''.sidebar {
            width: 162px;
            margin-top: 12px;
            min-height: calc(100vh - 188px);
            max-height: none;
            display: flex;
            flex-direction: column;
            opacity: 1;
            transform: translateX(0);
            transition: none;
          }

          .sidebar[hidden] {
            display: none;
          }


          .settingsNavButton {
            margin-top: auto;
          }

          .navButton {
            display: inline-flex;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            height: 40px;
            margin-bottom: 8px;
            border: 1px solid var(--border-strong);
            border-radius: 6px;
            background: var(--surface);
            color: var(--text);
            gap: 8px;
            padding: 0 14px;
            text-align: left;
            text-decoration: none;
            cursor: pointer;
            transition: background 120ms ease, border-color 120ms ease;
          }
          ''', '''.sidebar {
            width: 162px;
            margin-top: 12px;
            min-height: calc(100vh - 188px);
            max-height: none;
            display: grid;
            grid-template-rows: auto minmax(0, 1fr) auto;
            opacity: 1;
            transform: translateX(0);
            transition: none;
          }

          .sidebar[hidden] {
            display: none;
          }

          .sidebarGrid {
            display: grid;
            grid-auto-rows: 40px;
            gap: 8px;
            min-width: 0;
          }

          .settingsNavButton {
            grid-row: 3;
            align-self: end;
            margin: 0 0 8px;
          }

          .navButton {
            display: grid;
            grid-template-columns: 18px minmax(0, 1fr);
            align-items: center;
            justify-items: start;
            width: 100%;
            height: 40px;
            margin: 0;
            border: 1px solid var(--border-strong);
            border-radius: 6px;
            background: var(--surface);
            color: var(--text);
            column-gap: 8px;
            padding: 0 14px;
            text-align: left;
            text-decoration: none;
            cursor: pointer;
            transition: background 120ms ease, border-color 120ms ease;
          }
          ''', "desktop sidebar grid")

              replace_once(styles, '''.navEmoji {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            flex: 0 0 18px;
            color: currentColor;
            font-family: "Titillium Web", Arial, Helvetica, sans-serif;
            font-size: 18px;
            line-height: 1;
            text-align: center;
            transition: none;
          }
          ''', '''.navEmoji {
            display: grid;
            place-items: center;
            align-self: center;
            justify-self: center;
            width: 18px;
            height: 18px;
            color: currentColor;
            font-family: "Titillium Web", Arial, Helvetica, sans-serif;
            font-size: 18px;
            line-height: 1;
            text-align: center;
            transition: none;
          }
          ''', "sidebar icon cell")

              replace_once(styles, '''.navMflIcon {
            width: 18px;
            flex-basis: 18px;
            height: auto;
            fill: currentColor;
            stroke: none;
          }
          ''', '''.navMflIcon {
            width: 18px;
            height: 18px;
            fill: currentColor;
            stroke: none;
          }
          ''', "MFL sidebar icon geometry")

              replace_once(styles, '''.navJerseyIcon {
            width: 15px;
            flex-basis: 15px;
            transform: none;
          }
          ''', '''.navJerseyIcon {
            width: 15px;
            height: 18px;
            transform: none;
          }
          ''', "jersey sidebar icon geometry")

              replace_once(styles, '''.navText {
            display: inline-block;
            max-width: 112px;
            overflow: hidden;
            opacity: 1;
            white-space: nowrap;
            transition: none;
          }
          ''', '''.navText {
            display: flex;
            align-items: center;
            align-self: center;
            height: 18px;
            max-width: 112px;
            overflow: hidden;
            opacity: 1;
            line-height: 1;
            white-space: nowrap;
            transition: none;
          }
          ''', "sidebar label cell")

              responsive = Path("site/responsive.css")
              replace_once(responsive, '''  .sidebar {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 6px;
            width: 100%;
            min-height: 0;
            height: 42px;
            margin: 0;
            padding: 0;
            overflow-x: auto;
            overflow-y: hidden;
            overscroll-behavior-x: contain;
          }

          .navButton {
          ''', '''  .sidebar {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 6px;
            width: 100%;
            min-height: 0;
            height: 42px;
            margin: 0;
            padding: 0;
            overflow-x: auto;
            overflow-y: hidden;
            overscroll-behavior-x: contain;
          }

          .sidebarGrid {
            display: contents;
          }

          .navButton {
          ''', "mobile sidebar wrapper flattening")

              replace_once(responsive, '''  .settingsNavButton {
            margin-top: 0;
            margin-left: auto;
          }
          ''', '''  .settingsNavButton {
            align-self: center;
            margin: 0 0 0 auto;
          }
          ''', "mobile Settings alignment")

      - name: Commit sidebar grid source migration
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/sidebar-grid-alignment'
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git add -- site/index.html site/styles-base.css site/responsive.css
          if git diff --cached --quiet; then
            echo "Sidebar sources are already migrated."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Rebuild sidebar grid alignment"
            git push origin "HEAD:${{ github.head_ref }}"
          fi

      - name: Detect relevant changes
        id: changes
        working-directory: .
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$PR_BASE_SHA"
            HEAD_SHA="$PR_HEAD_SHA"
          else
            BASE_SHA="$BEFORE_SHA"
            HEAD_SHA="$CURRENT_SHA"
          fi

          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse "${HEAD_SHA}^" 2>/dev/null || true)"
          fi

          if [ -z "$BASE_SHA" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "site=true" >> "$GITHUB_OUTPUT"
            echo "builder=true" >> "$GITHUB_OUTPUT"
            echo "workflow=true" >> "$GITHUB_OUTPUT"
            echo "quality=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          site=false
          builder=false
          workflow=false

          mapfile -t CHANGED_FILES < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          printf 'Changed files:\n'
          printf '  %s\n' "${CHANGED_FILES[@]}"

          for file in "${CHANGED_FILES[@]}"; do
            case "$file" in
              site/*|.gitattributes)
                site=true
                ;;
              *.py|requirements*.txt|pyproject.toml)
                builder=true
                ;;
              .vercelignore)
                workflow=true
                ;;
              .github/workflows/*.yml|.github/workflows/*.yaml)
                while IFS= read -r line; do
                  case "$line" in
                    +++*|---*|@@*)
                      continue
                      ;;
                    +*|-*)
                      changed_line="${line:1}"
                      if [[ "$changed_line" =~ ^name:[[:space:]] ]]; then
                        continue
                      fi
                      if [ -n "$changed_line" ]; then
                        workflow=true
                        break
                      fi
                      ;;
                  esac
                done < <(git diff --unified=0 "$BASE_SHA" "$HEAD_SHA" -- "$file")
                ;;
            esac
          done

          quality=false
          if [ "$site" = true ] || [ "$builder" = true ] || [ "$workflow" = true ]; then
            quality=true
          fi

          echo "site=$site" >> "$GITHUB_OUTPUT"
          echo "builder=$builder" >> "$GITHUB_OUTPUT"
          echo "workflow=$workflow" >> "$GITHUB_OUTPUT"
          echo "quality=$quality" >> "$GITHUB_OUTPUT"

          echo "Site changes: $site"
          echo "Database builder changes: $builder"
          echo "Substantive workflow/deployment changes: $workflow"
          echo "Run repository validation: $quality"

      - uses: actions/setup-python@v5
        if: steps.changes.outputs.builder == 'true'
        with:
          python-version: "3.12"

      - name: Database builder syntax check
        if: steps.changes.outputs.builder == 'true'
        working-directory: .
        run: python -m compileall -q *.py

      - name: Database builder import smoke test
        if: steps.changes.outputs.builder == 'true'
        working-directory: .
        run: python -c "import rebuild_database; import rebuild_database_runner"

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.quality == 'true'
        with:
          node-version: 22

      - name: Install site dependencies
        if: steps.changes.outputs.quality == 'true'
        run: npm install

      - name: Lint
        if: steps.changes.outputs.site == 'true'
        run: npm run lint

      - name: Typecheck
        if: steps.changes.outputs.site == 'true'
        run: npm run typecheck

      - name: Build canonical application core
        if: steps.changes.outputs.quality == 'true'
        run: npm run build:core

      - name: Repository validation
        if: steps.changes.outputs.quality == 'true'
        run: npm run validate

      - name: Commit generated application artifacts
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          steps.changes.outputs.quality == 'true'
        working-directory: .
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git add -- site/table-width-runtime.js site/modules/app-core-runtime.js site/modules/app-core-*-runtime.js
          if git diff --cached --quiet; then
            echo "Generated application artifacts are current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate application core"
          git push origin "HEAD:$HEAD_BRANCH"
          gh workflow run site-quality.yml --ref "$HEAD_BRANCH"

      - name: Verify generated application artifacts
        if: steps.changes.outputs.quality == 'true'
        run: npm run verify:generated

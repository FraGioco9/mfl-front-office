name: Site quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply stable white Menu color
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/sidebar-grid-alignment'
        working-directory: .
        shell: python
        run: |
          from pathlib import Path
          import re

          styles_path = Path("site/styles-base.css")
          styles = styles_path.read_text(encoding="utf-8")
          styles, base_count = re.subn(
              r'(\.menuButton \{.*?\n  color: )var\(--text\);',
              r'\1#ffffff;',
              styles,
              count=1,
              flags=re.S,
          )
          styles, hover_count = re.subn(
              r'(\.menuButton:hover:not\(:disabled\) \{\n  border-color: transparent;\n  background: transparent;\n  color: )var\(--primary\);',
              r'\1#ffffff;',
              styles,
              count=1,
          )
          if base_count != 1 or hover_count != 1:
              raise SystemExit(f"Menu color migration mismatch: base={base_count}, hover={hover_count}")
          styles_path.write_text(styles, encoding="utf-8")

          validator_path = Path("site/validate-sidebar-lifecycle-ownership.mjs")
          validator = validator_path.read_text(encoding="utf-8")
          old = (
              '  styles.includes(".menuButton {")\n'
              '    && styles.includes("  pointer-events: none;")\n'
              '    && styles.includes("  cursor: default;"),\n'
              '  "Static CSS must retain non-interactive pinned-sidebar menu-button presentation.",\n'
          )
          new = (
              '  styles.includes(".menuButton {")\n'
              '    && styles.includes("  color: #ffffff;\\n  padding: 0;")\n'
              '    && styles.includes("  pointer-events: none;")\n'
              '    && styles.includes("  cursor: default;")\n'
              '    && styles.includes(".menuButton:hover:not(:disabled) {\\n  border-color: transparent;\\n  background: transparent;\\n  color: #ffffff;"),\n'
              '  "Static CSS must keep the pinned Menu label white and non-interactive before and after hydration.",\n'
          )
          if validator.count(old) != 1:
              raise SystemExit("Menu color validator migration mismatch")
          validator = validator.replace(old, new, 1)
          validator = validator.replace("\n// Trigger stable Menu color migration.\n", "\n")
          validator_path.write_text(validator, encoding="utf-8")

      - name: Commit stable white Menu color
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/sidebar-grid-alignment'
        working-directory: .
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git checkout origin/main -- .github/workflows/site-quality.yml
          git add -- site/styles-base.css site/validate-sidebar-lifecycle-ownership.mjs .github/workflows/site-quality.yml
          if git diff --cached --quiet; then
            echo "Stable white Menu color is already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Keep Menu label white after first paint"
          git push origin "HEAD:$HEAD_BRANCH"

      - name: Detect relevant changes
        id: changes
        working-directory: .
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$PR_BASE_SHA"
            HEAD_SHA="$PR_HEAD_SHA"
          else
            BASE_SHA="$BEFORE_SHA"
            HEAD_SHA="$CURRENT_SHA"
          fi

          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse "${HEAD_SHA}^" 2>/dev/null || true)"
          fi

          if [ -z "$BASE_SHA" ] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "site=true" >> "$GITHUB_OUTPUT"
            echo "builder=true" >> "$GITHUB_OUTPUT"
            echo "workflow=true" >> "$GITHUB_OUTPUT"
            echo "quality=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          site=false
          builder=false
          workflow=false

          mapfile -t CHANGED_FILES < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          printf 'Changed files:\n'
          printf '  %s\n' "${CHANGED_FILES[@]}"

          for file in "${CHANGED_FILES[@]}"; do
            case "$file" in
              site/*|.gitattributes)
                site=true
                ;;
              *.py|requirements*.txt|pyproject.toml)
                builder=true
                ;;
              .vercelignore)
                workflow=true
                ;;
              .github/workflows/*.yml|.github/workflows/*.yaml)
                while IFS= read -r line; do
                  case "$line" in
                    +++*|---*|@@*)
                      continue
                      ;;
                    +*|-*)
                      changed_line="${line:1}"
                      if [[ "$changed_line" =~ ^name:[[:space:]] ]]; then
                        continue
                      fi
                      if [ -n "$changed_line" ]; then
                        workflow=true
                        break
                      fi
                      ;;
                  esac
                done < <(git diff --unified=0 "$BASE_SHA" "$HEAD_SHA" -- "$file")
                ;;
            esac
          done

          quality=false
          if [ "$site" = true ] || [ "$builder" = true ] || [ "$workflow" = true ]; then
            quality=true
          fi

          echo "site=$site" >> "$GITHUB_OUTPUT"
          echo "builder=$builder" >> "$GITHUB_OUTPUT"
          echo "workflow=$workflow" >> "$GITHUB_OUTPUT"
          echo "quality=$quality" >> "$GITHUB_OUTPUT"

          echo "Site changes: $site"
          echo "Database builder changes: $builder"
          echo "Substantive workflow/deployment changes: $workflow"
          echo "Run repository validation: $quality"

      - uses: actions/setup-python@v5
        if: steps.changes.outputs.builder == 'true'
        with:
          python-version: "3.12"

      - name: Database builder syntax check
        if: steps.changes.outputs.builder == 'true'
        working-directory: .
        run: python -m compileall -q *.py

      - name: Database builder import smoke test
        if: steps.changes.outputs.builder == 'true'
        working-directory: .
        run: python -c "import rebuild_database; import rebuild_database_runner"

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.quality == 'true'
        with:
          node-version: 22

      - name: Install site dependencies
        if: steps.changes.outputs.quality == 'true'
        run: npm install

      - name: Lint
        if: steps.changes.outputs.site == 'true'
        run: npm run lint

      - name: Typecheck
        if: steps.changes.outputs.site == 'true'
        run: npm run typecheck

      - name: Build canonical application core
        if: steps.changes.outputs.quality == 'true'
        run: npm run build:core

      - name: Repository validation
        if: steps.changes.outputs.quality == 'true'
        run: npm run validate

      - name: Commit generated application artifacts
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          steps.changes.outputs.quality == 'true'
        working-directory: .
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git add -- site/table-width-runtime.js site/modules/app-core-runtime.js site/modules/app-core-*-runtime.js
          if git diff --cached --quiet; then
            echo "Generated application artifacts are current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "4189829+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate application core"
          git push origin "HEAD:$HEAD_BRANCH"
          gh workflow run site-quality.yml --ref "$HEAD_BRANCH"

      - name: Verify generated application artifacts
        if: steps.changes.outputs.quality == 'true'
        run: npm run verify:generated

name: Site quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  checks: write

concurrency:
  group: site-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Detect relevant changes
        id: changes
        working-directory: .
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node site/ci-quality-scope.mjs

      - uses: actions/setup-python@v7
        if: steps.changes.outputs.builder == 'true' || steps.changes.outputs.workflow == 'true'
        with:
          python-version: "3.12"

      - name: Database builder syntax check
        if: steps.changes.outputs.builder == 'true'
        working-directory: .
        run: python -m compileall -q scripts tests

      - name: Database builder import smoke test
        if: steps.changes.outputs.builder == 'true'
        working-directory: .
        run: python -c "import scripts.database.rebuild_database; import scripts.database.rebuild_database_runner"

      - name: Python regression tests
        if: steps.changes.outputs.builder == 'true' || steps.changes.outputs.workflow == 'true'
        working-directory: .
        run: python -m unittest discover -v -p "test_*.py"

      - name: Reliable scheduler regression tests
        if: steps.changes.outputs.workflow == 'true'
        working-directory: .
        run: node --test tests/test_database_refresh_scheduler.mjs

      - name: Install site dependencies
        if: steps.changes.outputs.quality == 'true'
        run: npm install --no-audit --no-fund

      - name: Build canonical site assets
        if: steps.changes.outputs.quality == 'true'
        run: npm run build

      - name: Lint
        if: steps.changes.outputs.site == 'true'
        run: npm run lint

      - name: Typecheck
        if: steps.changes.outputs.site == 'true'
        run: npm run typecheck

      - name: Repository validation
        if: steps.changes.outputs.quality == 'true'
        run: npm run validate

      - name: Commit generated site artifacts
        id: generated
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          steps.changes.outputs.quality == 'true'
        working-directory: .
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git add -- \
            site/bootstrap.js \
            site/bootstrap-core.js \
            site/index.html \
            site/responsive.css \
            site/vercel.json \
            site/vercel.production.json \
            site/styles-runtime.css \
            site/table-width-runtime.js \
            site/modules/app-core-runtime.js \
            site/modules/app-core-*-runtime.js
          if git diff --cached --quiet; then
            echo "Generated site artifacts are current."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate site artifacts"
          git push origin "HEAD:$HEAD_BRANCH"
          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify generated site artifacts
        if: steps.changes.outputs.quality == 'true'
        run: npm run verify:generated

      - name: Publish exact generated-head quality check
        if: steps.generated.outputs.committed == 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          GENERATED_HEAD: ${{ steps.generated.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          DETAILS_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          jq -n \
            --arg sha "$GENERATED_HEAD" \
            --arg details "$DETAILS_URL" \
            '{
              name: "quality",
              head_sha: $sha,
              status: "completed",
              conclusion: "success",
              details_url: $details,
              output: {
                title: "Generated artifacts validated",
                summary: "Site Quality validated the source commit, regenerated tracked artifacts, verified the generated tree, and published this result on the exact generated PR head."
              }
            }' \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" --input -

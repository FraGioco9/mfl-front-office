name: Issue 203 database smoke

on:
  push:
    branches:
      - fix/issue-203-player-listing-column
    paths:
      - ".github/workflows/issue-203-database-smoke.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-203-player-listing-column

      - name: Remove stale marketplace join sort reference
        shell: python
        run: |
          from pathlib import Path

          path = Path("site/api/_data-page.js")
          text = path.read_text(encoding="utf-8")
          old = 'return `marketplace.value IS NULL, ${LISTING_PRICE_SQL} ${direction}, player_id DESC`;'
          new = 'return `${LISTING_PRICE_SQL} IS NULL, ${LISTING_PRICE_SQL} ${direction}, player_id DESC`;'
          if text.count(old) != 1:
              raise SystemExit(f"Expected one stale Listing sort expression, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          validator_path = Path("site/validate-listing-column.mjs")
          validator = validator_path.read_text(encoding="utf-8")
          anchor = 'assert.doesNotMatch(dataPage, /json_each/);\n'
          addition = anchor + 'assert.doesNotMatch(dataPage, /marketplace\\.value/);\nassert.match(dataPage, /return `\\$\\{LISTING_PRICE_SQL\\} IS NULL, \\$\\{LISTING_PRICE_SQL\\} \\$\\{direction\\}, player_id DESC`;/);\n'
          if anchor not in validator:
              raise SystemExit("Listing validator anchor missing")
          if 'assert.doesNotMatch(dataPage, /marketplace\\.value/);' not in validator:
              validator = validator.replace(anchor, addition, 1)
          validator_path.write_text(validator, encoding="utf-8")

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Create minimal runtime database and smoke-test Database Attributes
        shell: bash
        env:
          SUPABASE_URL: ""
          SUPABASE_SERVICE_ROLE_KEY: ""
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const { DatabaseSync } = require("node:sqlite");
          const databaseModulePath = "./site/api/_database.js";
          const { PLAYER_COLUMNS } = require(databaseModulePath);

          const dataDir = path.resolve("site/api/data-files");
          const databasePath = path.join(dataDir, "mfl_database.db");
          fs.mkdirSync(dataDir, { recursive: true });
          fs.rmSync(databasePath, { force: true });

          const db = new DatabaseSync(databasePath);
          const columnSql = PLAYER_COLUMNS.map((column) => `"${column}"`).join(", ");
          db.exec(`CREATE TABLE players (${columnSql});`);
          db.exec("CREATE TABLE wallets (wallet_address TEXT);");
          db.exec("CREATE TABLE runtime_metadata (key TEXT PRIMARY KEY, value TEXT);");
          db.prepare("INSERT INTO runtime_metadata (key, value) VALUES (?, ?)")
            .run("generated_at", new Date().toISOString());

          const values = PLAYER_COLUMNS.map((column) => {
            if (column === "player_id") return 123456;
            if (column === "wallet_address") return "0x1111111111111111";
            if (column === "name") return "Smoke Player";
            if (column === "overall") return 75;
            if (column === "positions") return "CM";
            if (column === "age") return 24;
            if (column === "player_seasons") return 1;
            return null;
          });
          const placeholders = PLAYER_COLUMNS.map(() => "?").join(", ");
          db.prepare(`INSERT INTO players (${columnSql}) VALUES (${placeholders})`).run(...values);
          db.close();

          const { pagedData } = require("./site/api/_data-page.js");
          (async () => {
            const baseRequest = {
              query: {
                scope: "database",
                view: "attributes",
                page: "1",
                pageSize: "100",
                sortKey: "overall",
                sortDirection: "desc",
              },
            };
            const result = await pagedData(baseRequest, "", false, false);
            if (result.totalRows !== 1 || result.rows.length !== 1) {
              throw new Error(`Database Attributes smoke failed: totalRows=${result.totalRows}, rows=${result.rows.length}`);
            }
            const listingIndex = result.columns.indexOf("listing_price");
            if (listingIndex < 0 || result.rows[0][listingIndex] !== null) {
              throw new Error("Missing marketplace state must return a null Listing without blocking rows.");
            }

            const listingSortResult = await pagedData({
              query: { ...baseRequest.query, sortKey: "listing_price", sortDirection: "asc" },
            }, "", false, false);
            if (listingSortResult.rows.length !== 1) {
              throw new Error("Listing sort smoke failed without marketplace state.");
            }
            console.log("Database Attributes smoke passed without marketplace file or credentials.");
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Install and validate site
        working-directory: site
        run: |
          npm install --no-audit --no-fund
          npm run build:core
          npm run lint
          npm run typecheck
          npm run validate

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/api/_data-page.js site/validate-listing-column.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Fix Listing sort after marketplace runtime refactor"
          git push origin HEAD:fix/issue-203-player-listing-column

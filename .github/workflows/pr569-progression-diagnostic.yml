name: PR 569 Progression sorting fix

on:
  push:
    branches:
      - fix/page-scoped-default-sorting
    paths:
      - .github/workflows/pr569-progression-diagnostic.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/page-scoped-default-sorting
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Fix Progression sorting ownership
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Missing target: {label}")
              return text.replace(old, new, 1)

          core_path = Path("site/modules/app-core.js")
          core = core_path.read_text()
          core = replace_once(
              core,
              "      getValue(row, getProgressionColumn(column)) || 0,\n      getValue(row, column) || 0,",
              "      getValue(row, getProgressionColumn(column)),\n      getValue(row, column),",
              "preserve missing Progression values",
          )
          core = replace_once(
              core,
              "  state.filteredRows.sort(compareRows);\n  updateFilterSummary();",
              "  if (!state.incrementalApplying) {\n    state.filteredRows.sort(compareRows);\n  }\n  updateFilterSummary();",
              "keep API order while applying incremental payload",
          )
          core_path.write_text(core)

          domain_path = Path("site/validate-domain-table.mjs")
          domain = domain_path.read_text()
          domain = replace_once(
              domain,
              '  "validate-table-sort-session.mjs",\n  "validate-header-selection-loading.mjs",',
              '  "validate-table-sort-session.mjs",\n  "validate-progression-sorting.mjs",\n  "validate-header-selection-loading.mjs",',
              "register executable Progression sorting regression",
          )
          domain_path.write_text(domain)
          PY
          cat > site/validate-progression-sorting.mjs <<'EOF'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import { createRequire } from "node:module";
          import { DatabaseSync } from "node:sqlite";

          const require = createRequire(import.meta.url);
          const { orderSql } = require("./api/_data-page.js");
          const core = fs.readFileSync(new URL("./modules/app-core.js", import.meta.url), "utf8");

          assert.match(
            core,
            /if \(!state\.incrementalApplying\) \{\s*state\.filteredRows\.sort\(compareRows\);\s*\}/u,
            "Incremental payload application must preserve the API global sort order instead of sorting the page a second time.",
          );
          assert.match(
            core,
            /state\.currentPage === "progression"[\s\S]{0,220}getValue\(row, getProgressionColumn\(column\)\),[\s\S]{0,80}getValue\(row, column\),/u,
            "Progression client tuples must preserve missing values and use the matching raw Overall/stat as the tie-break.",
          );

          const db = new DatabaseSync(":memory:");
          db.exec(`
            CREATE TABLE players (
              player_id INTEGER PRIMARY KEY,
              overall REAL,
              pace REAL,
              overall_prog_current_season REAL,
              pace_prog_current_season REAL,
              overall_prog_all REAL,
              pace_prog_all REAL
            );
          `);
          const insert = db.prepare(`
            INSERT INTO players (
              player_id, overall, pace,
              overall_prog_current_season, pace_prog_current_season,
              overall_prog_all, pace_prog_all
            ) VALUES (?, ?, ?, ?, ?, ?, ?)
          `);
          [
            [1, 80, 70, 3, 5, 7, 2],
            [2, 90, 60, 3, 5, 7, 4],
            [3, 85, 95, 4, 1, 6, 4],
            [4, 95, 80, null, 6, null, null],
            [5, 70, 90, 1, null, 9, 5],
          ].forEach((row) => insert.run(...row));

          function ids(view, key, direction) {
            const order = orderSql("progression", view, key, direction);
            return db.prepare(`SELECT player_id FROM players ORDER BY ${order}`).all().map((row) => Number(row.player_id));
          }

          assert.deepEqual(ids("current", "overall", "desc"), [3, 2, 1, 5, 4]);
          assert.deepEqual(ids("current", "overall", "asc"), [5, 1, 2, 3, 4]);
          assert.deepEqual(ids("current", "pace", "desc"), [4, 1, 2, 3, 5]);
          assert.deepEqual(ids("current", "pace", "asc"), [3, 2, 1, 4, 5]);
          assert.deepEqual(ids("all", "overall", "desc"), [5, 2, 1, 3, 4]);
          assert.deepEqual(ids("all", "pace", "desc"), [5, 3, 2, 1, 4]);

          console.log("Executable Progression sorting validation passed.");
          EOF
      - name: Install dependencies
        working-directory: site
        run: npm ci
      - name: Rebuild generated runtime chunks
        working-directory: site
        run: npm run build:core
      - name: Run executable Progression sorting regression
        working-directory: site
        run: node validate-progression-sorting.mjs
      - name: Stage generated contract
        run: git add site/modules/app-core.js site/modules/app-core-runtime.js site/modules/app-core-table-runtime.js site/validate-domain-table.mjs site/validate-progression-sorting.mjs
      - name: Run full checks
        working-directory: site
        run: npm run check
      - name: Commit fix and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/pr569-progression-diagnostic.yml
          git add -A
          git commit -m "Fix Progression incremental sorting"
          git push origin HEAD:fix/page-scoped-default-sorting

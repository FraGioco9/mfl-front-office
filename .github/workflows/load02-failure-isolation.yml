name: LOAD-02 stale-error and retry regression

on:
  pull_request:
    paths:
      - "validation/load02-*"
      - "modules/core-sources/shared-incremental-navigation.js"
      - "modules/core-sources/shared-incremental-routing.js"
      - "modules/app-core-runtime.js"
      - "validate-ux02d-entity-request-errors.mjs"
      - ".github/workflows/load02-failure-isolation.yml"
      - "docs/load02-error-retry-isolation.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-failures:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run standalone deterministic fail/retry fixtures
        run: |
          node --check validation/load02-error-retry-isolation.mjs
          node validation/load02-error-retry-isolation.mjs
          node --check validation/load02-incremental-network-fixture.mjs
          node validation/load02-incremental-network-fixture.mjs
          node validate-ux02d-entity-request-errors.mjs

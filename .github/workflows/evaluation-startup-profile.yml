name: Evaluation startup ownership profile

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/evaluation-startup-profile.yml'
      - 'site/modules/**'

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Profile Evaluation startup ownership
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { normalizeBuiltApplicationCoreArtifacts } from './modules/app-core-build-normalizer.js';
          const source = await readFile('./modules/app-core.js', 'utf8');
          const artifacts = normalizeBuiltApplicationCoreArtifacts(source);
          const shared = String(artifacts.core || '');
          const evaluation = String(artifacts.routeChunks?.evaluation || '');
          const names = [
            'evaluationDiscountRateValue', 'formatEvaluationRate', 'parseEvaluationMflPerUsd',
            'formatEvaluationMflPerUsd', 'saveEvaluationMflPerUsd', 'loadEvaluationMflPerUsd',
            'parseEvaluationRewardRate', 'normalizeEvaluationLateSeasonRewardRates',
            'saveEvaluationLateSeasonRewardRates', 'loadEvaluationLateSeasonRewardRates',
            'evaluationLateSeasonRewardRatesFromPayload', 'currentEvaluationSettingsPayload',
            'applyEvaluationSettingsPayload', 'saveEvaluationSettingsLocally',
            'queueEvaluationSettingsSave', 'renderEvaluationMflPerUsdControl'
          ];
          const lines = source.split('\n');
          for (const name of names) {
            const hits = [];
            lines.forEach((line, index) => {
              if (line.includes(name)) hits.push(`${index + 1}:${line.trim()}`);
            });
            console.log(`\n## ${name} (${hits.length})`);
            hits.forEach((hit) => console.log(hit));
          }

          const countWord = (text, name) => (text.match(new RegExp(`\\b${name}\\b`, 'g')) || []).length;
          const regionStart = source.indexOf('const DEFAULT_EVALUATION_MFL_PER_USD = 400;');
          const regionEnd = source.indexOf('const agentColumn = "wallet_name";', regionStart);
          const region = source.slice(regionStart, regionEnd);
          const declarations = new Set();
          for (const match of region.matchAll(/^(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(/gm)) declarations.add(match[1]);
          for (const match of region.matchAll(/^const\s+([A-Za-z_$][\w$]*)\s*=/gm)) declarations.add(match[1]);
          console.log('\n## Evaluation-region declarations with no shared consumers');
          for (const name of [...declarations].sort()) {
            const sharedCount = countWord(shared, name);
            const evaluationCount = countWord(evaluation, name);
            if (sharedCount === 1 && evaluationCount > 0) {
              console.log(`${name} shared=${sharedCount} evaluation=${evaluationCount}`);
            }
          }

          console.log(`\nSHARED_BYTES ${Buffer.byteLength(shared)}`);
          console.log(`EVALUATION_BYTES ${Buffer.byteLength(evaluation)}`);
          NODE

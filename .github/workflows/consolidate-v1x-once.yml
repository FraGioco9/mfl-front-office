# Trigger consolidation after workflow registration
name: Consolidate v1x helpers once
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/consolidate-v1x-once.yml
permissions:
  contents: write
jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge version helpers into app-fixes
        shell: bash
        run: |
          set -euo pipefail
          files=(
            site/v14974-mfl-wallet-search-fix.js
            site/v14974-followup-fixes.js
            site/v14974-column-width-fix.js
            site/v14974-agent-views-fix.js
            site/v1500-club-pages.js
            site/v1500-club-polish.js
            site/v1500-exact-column-widths.js
          )
          for file in "${files[@]}"; do
            test -f "$file"
            printf '\n\n/* Consolidated from %s */\n' "${file#site/}" >> site/app-fixes.js
            cat "$file" >> site/app-fixes.js
          done
          cat > site/app.js <<'EOF'
          document.write('<script src="/app-core.js?v=1.150.0"><\/script><script src="/app-fixes.js?v=1.150.0-consolidated-1"><\/script>');
          EOF
          rm -f "${files[@]}"
          node --check site/app-fixes.js
      - name: Commit consolidated scripts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/app.js site/app-fixes.js
          git add -u site
          git commit -m "Consolidate versioned JavaScript helpers"
          git push

name: Club entry splitter anchor migration

on:
  push:
    branches:
      - refactor/source-owned-club-entry
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/source-owned-club-entry
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply Club splitter anchor migration
        run: node site/migrate-club-entry-splitter-anchor.mjs
      - name: Persist migrated splitter
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "Club splitter anchor is already migrated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Use stable Club splitter boundary"
          git push origin HEAD:refactor/source-owned-club-entry

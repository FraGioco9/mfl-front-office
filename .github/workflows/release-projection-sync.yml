name: Release projection sync

on:
  pull_request:
    paths:
      - site/release.json
      - site/sync-release-projections.mjs
      - site/build-app-core.mjs
      # Canonical UI metadata changes can alter generated first-paint HTML.
      - site/modules/app-config.js
      - site/bootstrap.js
      - site/bootstrap-core.js
      - site/index.html
      - .github/workflows/release-projection-sync.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-projection-sync-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Normalize release projections
        run: node site/sync-release-projections.mjs

      - name: Commit normalized projections
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          git add -- site/bootstrap.js site/bootstrap-core.js site/index.html
          if git diff --cached --quiet; then
            echo "Release projections are current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Normalize release projections"
          git push origin "HEAD:$HEAD_BRANCH"

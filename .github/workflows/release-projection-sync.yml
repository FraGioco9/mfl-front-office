name: Release projection sync

on:
  pull_request:
    paths:
      - site/release.json
      - site/sync-release-projections.mjs
      - site/build-app-core.mjs
      # Canonical UI metadata changes can alter generated first-paint HTML.
      - site/modules/app-config.js
      - site/patch-hide-pager-migration.mjs
      - site/migrate-hide-pager-during-loading.mjs
      - site/bootstrap.js
      - site/bootstrap-core.js
      - site/index.html
      - .github/workflows/release-projection-sync.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-projection-sync-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  sync:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch pager loading migration
        run: node site/patch-hide-pager-migration.mjs

      - name: Hide pager during Table loading
        run: node site/migrate-hide-pager-during-loading.mjs

      - name: Build canonical application core
        working-directory: site
        run: node build-app-core.mjs

      - name: Normalize release projections
        run: node site/sync-release-projections.mjs

      - name: Commit pager loading migration
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          git add -- \
            site/modules/app-core.js \
            site/modules/app-core-runtime.js \
            site/modules/app-core-table-runtime.js \
            site/modules/app-core-evaluation-runtime.js \
            site/modules/app-core-mfl-stats-runtime.js \
            site/table-loading-runtime.js \
            site/loading.css \
            site/validate-generated-view-transition.mjs \
            site/validate-loading-ownership.mjs \
            site/validate-static-route-ui.mjs \
            site/validate-table-background-loading-stability.mjs \
            site/validate-table-loading-state.mjs \
            site/LOADING_CONTRACT.md \
            site/bootstrap.js \
            site/bootstrap-core.js \
            site/index.html
          if git diff --cached --quiet; then
            echo "Pager loading ownership and release projections are current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Hide pager during Table loading"
          git push origin "HEAD:$HEAD_BRANCH"

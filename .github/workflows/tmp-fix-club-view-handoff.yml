name: Temporary Club view handoff patch

on:
  push:
    branches:
      - fix/view-button-refresh-text-flicker

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/view-button-refresh-text-flicker
          fetch-depth: 0
      - name: Apply continuous Club route chrome state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing expected block in {path}")
              p.write_text(text.replace(old, new, 1))

          replace(
              "site/index.html",
              '          root.dataset.initialTablePage = tablePage;\n          root.dataset.initialTableView = activeView;',
              '          root.dataset.initialTablePage = tablePage;\n          root.dataset.routeTablePage = tablePage;\n          root.dataset.initialTableView = activeView;',
          )

          replace(
              "site/index.html",
              '''      #progressionPage .viewButton[data-view="attributes"] .clubViewLabel {\n        display: none;\n      }\n      html:not(.mflInitialRouteResolved)[data-initial-table-page="club"] #progressionPage .viewButton[data-view="attributes"] .defaultViewLabel,\n      body[data-page="club"] #progressionPage .viewButton[data-view="attributes"] .defaultViewLabel {\n        display: none;\n      }\n      html:not(.mflInitialRouteResolved)[data-initial-table-page="club"] #progressionPage .viewButton[data-view="attributes"] .clubViewLabel,\n      body[data-page="club"] #progressionPage .viewButton[data-view="attributes"] .clubViewLabel {\n        display: inline;\n      }''',
              '''      #progressionPage .viewButton[data-view="attributes"] .clubViewLabel {\n        display: none;\n      }\n      html[data-route-table-page="club"] #progressionPage .viewButton[data-view="attributes"] .defaultViewLabel {\n        display: none;\n      }\n      html[data-route-table-page="club"] #progressionPage .viewButton[data-view="attributes"] .clubViewLabel {\n        display: inline;\n      }''',
          )

          replace(
              "site/controls.css",
              '''html:not(.mflInitialRouteResolved)[data-initial-table-page="club"] #progressionPage .filtersViewButton,\nhtml:not(.mflInitialRouteResolved)[data-initial-table-page="club"] #progressionPage .viewControlsSeparator,\nbody[data-page="club"] #progressionPage .filtersViewButton,\nbody[data-page="club"] #progressionPage .viewControlsSeparator {\n  display: none;\n}''',
              '''html[data-route-table-page="club"] #progressionPage .filtersViewButton,\nhtml[data-route-table-page="club"] #progressionPage .viewControlsSeparator {\n  display: none;\n}''',
          )

          replace(
              "site/loading.css",
              '''html:not(.mflInitialRouteResolved)[data-initial-table-page="club"] #progressionPage :is(.quickFilters, .controlsBar, nav.pager),\nbody[data-page="club"] #progressionPage :is(.quickFilters, .controlsBar, nav.pager) {\n  display: none;\n}''',
              '''html[data-route-table-page="club"] #progressionPage :is(.quickFilters, .controlsBar, nav.pager) {\n  display: none;\n}''',
          )

          replace(
              "site/static-ui-runtime.js",
              '''  function syncRouteChrome(urlLike = window.location.href) {\n  const state = routeState(urlLike);\n  const previousPage = lastRoutePage;''',
              '''  function syncRouteChrome(urlLike = window.location.href) {\n  const state = routeState(urlLike);\n  if (tableViewConfig()[state.page]) document.documentElement.dataset.routeTablePage = state.page;\n  else delete document.documentElement.dataset.routeTablePage;\n  const previousPage = lastRoutePage;''',
          )

          replace(
              "site/validate-static-route-ui.mjs",
              '''includes(indexHtml, 'body[data-page="club"] #progressionPage .viewButton[data-view="attributes"] .clubViewLabel', "Club label visibility must follow route state without replacing the button text node.");''',
              '''includes(indexHtml, 'root.dataset.routeTablePage = tablePage;', "First paint must publish the current table route before any Club-specific chrome can render.");\nincludes(indexHtml, 'html[data-route-table-page="club"] #progressionPage .viewButton[data-view="attributes"] .clubViewLabel', "Club label visibility must use one continuous route-table state instead of switching CSS owners after first paint.");\nincludes(staticUi, 'document.documentElement.dataset.routeTablePage = state.page;', "Runtime route chrome must keep the persistent table-route state synchronized during in-site navigation.");\nincludes(staticUi, 'delete document.documentElement.dataset.routeTablePage;', "Leaving table routes must clear persistent table-route chrome state.");''',
          )

          replace(
              "site/validate-club-title-loading.mjs",
              '''includes(\n  loadingCss,\n  'html:not(.mflInitialRouteResolved)[data-initial-table-page="club"] #progressionPage :is(.quickFilters, .controlsBar, nav.pager)',\n  "Raw Club first paint must hide generic table filter chrome before application hydration.",\n);\nincludes(\n  loadingCss,\n  'body[data-page="club"] #progressionPage :is(.quickFilters, .controlsBar, nav.pager)',\n  "Hydrated Club pages must keep generic filter chrome absent for the entire route lifetime.",\n);''',
              '''includes(\n  indexHtml,\n  'root.dataset.routeTablePage = tablePage;',\n  "Club first paint must publish one persistent route-table state before its chrome renders.",\n);\nincludes(\n  loadingCss,\n  'html[data-route-table-page="club"] #progressionPage :is(.quickFilters, .controlsBar, nav.pager)',\n  "Club generic table chrome must stay absent under one continuous route state from first paint through hydration.",\n);\nexcludes(\n  loadingCss,\n  'body[data-page="club"] #progressionPage :is(.quickFilters, .controlsBar, nav.pager)',\n  "Club chrome visibility must not switch from initial-route state to body route state during hydration.",\n);''',
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html site/controls.css site/loading.css site/static-ui-runtime.js site/validate-static-route-ui.mjs site/validate-club-title-loading.mjs
          git commit -m "Keep Club view chrome continuous through hydration"
          git push origin HEAD:fix/view-button-refresh-text-flicker

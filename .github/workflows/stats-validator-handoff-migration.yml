name: Stats validator handoff migration

on:
  push:
    branches:
      - refactor/source-owned-stats-navigation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/source-owned-stats-navigation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply validator handoff migration
        run: node site/migrate-stats-validator-handoff.mjs
      - name: Persist migrated validators
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "Stats validator handoff is already migrated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update validators for source-owned Stats navigation"
          git push origin HEAD:refactor/source-owned-stats-navigation

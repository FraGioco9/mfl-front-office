name: Watchlist cache-aware loading validator migration

on:
  push:
    branches:
      - refactor/cache-aware-route-loading
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/cache-aware-route-loading
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update Watchlist loading validator
        run: node site/migrate-watchlist-cache-aware-loading-validator.mjs
      - name: Remove temporary migration scaffolding
        shell: bash
        run: |
          rm -f site/migrate-watchlist-cache-aware-loading-validator.mjs
          rm -f .github/workflows/watchlist-cache-aware-loading-validator-migration.yml
      - name: Persist validator migration
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Watchlist cache-aware loading validator"
          git push origin HEAD:refactor/cache-aware-route-loading

# Second push ensures branch workflow registration before execution.

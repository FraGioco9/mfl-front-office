name: Temporary issue 429 Account hover parity
on:
  push:
    branches: [feat/issue-429-player-table-actions]
    paths: [.github/workflows/tmp-issue-429-account-hover.yml]
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/issue-429-player-table-actions
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply Account dropdown parity and remove wallet tooltip
        working-directory: site
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          p = Path('dropdowns.css')
          s = p.read_text()
          s = replace_once(
              s,
              '''.accountDropdownItem + .accountDropdownItem {\n  margin-top: 2px;\n}''',
              '''.accountDropdownItem {\n  box-sizing: border-box;\n  border: 1px solid transparent;\n}\n\n.accountDropdownItem + .accountDropdownItem {\n  margin-top: 2px;\n}''',
              'Account item rest border',
          )
          s = replace_once(
              s,
              '''.accountDropdown button.accountDropdownItem:hover:not(:disabled),\n.accountDropdown button.accountDropdownItem:focus-visible:not(:disabled) {\n  border: 0;\n  outline: 0;\n  background: var(--row-hover);''',
              '''.accountDropdown button.accountDropdownItem:hover:not(:disabled),\n.accountDropdown button.accountDropdownItem:focus-visible:not(:disabled) {\n  border-color: var(--border);\n  outline: 0;\n  background: var(--row-hover);''',
              'Account item hero hover',
          )
          s = replace_once(
              s,
              '''.accountDropdown .accountSettingsButton,\n.accountDropdown .accountSettingsButton:not(:disabled),\n.accountDropdown .accountSettingsButton:hover:not(:disabled),\n.accountDropdown .accountSettingsButton:focus-visible:not(:disabled) {\n  border: 0;\n  background: transparent;''',
              '''.accountDropdown .accountSettingsButton,\n.accountDropdown .accountSettingsButton:not(:disabled) {\n  border-color: transparent;\n  background: transparent;''',
              'Settings hover ownership',
          )
          p.write_text(s)

          p = Path('modules/app-core.js')
          s = p.read_text()
          s = replace_once(
              s,
              '  linkWalletButton.title = walletLinked ? "Opt out of Dapper wallet access" : "Opt in with Dapper";',
              '  linkWalletButton.removeAttribute("title");',
              'Wallet tooltip removal',
          )
          p.write_text(s)

          p = Path('validate-player-table-actions.mjs')
          s = p.read_text()
          anchor = '''invariant(\n  source.includes('menu.dataset.open = "false";')'''
          parity = '''invariant(\n  dropdowns.includes('.accountDropdownItem {\\n  box-sizing: border-box;\\n  border: 1px solid transparent;')\n    && dropdowns.includes('.accountDropdown button.accountDropdownItem:hover:not(:disabled),\\n.accountDropdown button.accountDropdownItem:focus-visible:not(:disabled) {\\n  border-color: var(--border);\\n  outline: 0;\\n  background: var(--row-hover);')\n    && dropdowns.includes('.accountDropdown .accountSettingsButton,\\n.accountDropdown .accountSettingsButton:not(:disabled) {\\n  border-color: transparent;')\n    && !dropdowns.includes('.accountDropdown .accountSettingsButton:hover:not(:disabled)')\n    && source.includes('linkWalletButton.removeAttribute("title");')\n    && !source.includes('linkWalletButton.title = walletLinked ? "Opt out of Dapper wallet access" : "Opt in with Dapper";'),\n  "Account dropdown items must match the Player hero action-menu hover contract and Opt In/Out must not expose title tooltips.",\n);\n\n'''
          if anchor not in s:
              raise SystemExit('validator Account parity insertion anchor missing')
          s = s.replace(anchor, parity + anchor, 1)
          p.write_text(s)
          PY
      - name: Install dependencies
        working-directory: site
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Build canonical application core
        working-directory: site
        run: npm run build:core
      - name: Lint
        working-directory: site
        run: npm run lint
      - name: Typecheck
        working-directory: site
        run: npm run typecheck
      - name: Validate repository
        working-directory: site
        run: npm run validate
      - name: Ensure no package lock was introduced
        run: test ! -f site/package-lock.json
      - name: Commit refinement and remove helper
        run: |
          rm .github/workflows/tmp-issue-429-account-hover.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'match Account dropdown hover and remove wallet tooltip'
          git push origin HEAD:feat/issue-429-player-table-actions

name: One-time v1.150.4 layout fixes

on:
  push:
    branches:
      - main
    paths:
      - .github/v1504-layout-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply layout patch
        run: python .github/scripts/patch_v1504_layout.py
      - name: Validate JavaScript
        run: node --check site/app.js
      - name: Validate versioned assets
        run: |
          grep -q '/styles.css?v=1.150.4' site/index.html
          grep -q '/app.js?v=1.150.4' site/index.html
          grep -q 'const VERSION = "1.150.4";' site/app.js
      - name: Remove one-time files
        run: |
          rm -f .github/scripts/patch_v1504_layout.py
          rm -f .github/workflows/one-time-v1504-layout.yml
          rm -f .github/v1504-layout-trigger
      - name: Commit layout fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix club loading and shared page layout"
          git push origin main

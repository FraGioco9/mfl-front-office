name: Capture Player/Table/Evaluation type diagnostics

on:
  push:
    branches:
      - types/969-player-table-evaluation-models

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Capture focused diagnostics
        shell: bash
        run: |
          set +e
          npx tsc -p jsconfig.core.json --noEmit --pretty false > core-types.txt 2>&1
          status=$?
          set -e
          grep -E '^modules/core-sources/(player|table|evaluation)\.js' core-types.txt || true
          echo "tsc_status=$status"

name: PERF-03 one-off JS route coverage

on:
  push:
    branches:
      - audit-1034-perf03-js-coverage
    paths:
      - .github/workflows/perf03-js-audit.yml

permissions:
  contents: read
  actions: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download pinned validated runtime database
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 37038069396 --repo "$GITHUB_REPOSITORY" --name mfl_database --dir .
          python -m scripts.database.prepare_runtime_database mfl_database.db --validate-only
          mkdir -p api/data-files
          mv mfl_database.db api/data-files/mfl_database.db
          python -m scripts.database.prepare_runtime_database api/data-files/mfl_database.db --validate-only
          DATASET_GENERATED_AT="$(python - <<'PY'
          import sqlite3
          value=sqlite3.connect("api/data-files/mfl_database.db").execute(
              "SELECT value FROM runtime_metadata WHERE key='generated_at' LIMIT 1"
          ).fetchone()
          print(value[0] if value else "")
          PY
          )"
          {
            echo "database_artifact_id=11242500512"
            echo "database_run_id=37038069396"
            echo "dataset_generated_at=$DATASET_GENERATED_AT"
          } >> "$GITHUB_ENV"
          echo "Pinned source dataset 11242500512: $DATASET_GENERATED_AT"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build current site
        shell: bash
        run: |
          set -euo pipefail
          npm run build:legacy
          npm run build:public
          npx next build --webpack

      - name: Start production Next server
        shell: bash
        run: |
          set -euo pipefail
          npx next start -p 4000 > performance-next.log 2>&1 &
          echo "next_pid=$!" >> "$GITHUB_ENV"
          for attempt in $(seq 1 80); do
            if curl --fail --silent --show-error http://127.0.0.1:4000/api/data?mode=summary >/tmp/mfl-baseline-summary.json; then
              exit 0
            fi
            if ! kill -0 "$!" >/dev/null 2>&1; then
              cat performance-next.log >&2
              exit 1
            fi
            sleep 0.5
          done
          cat performance-next.log >&2
          exit 1

      - name: Capture browser performance baseline
        shell: bash
        env:
          MFL_BASE_URL: http://127.0.0.1:4000
          MFL_BASELINE_OUTPUT: performance-baseline-current.json
          MFL_BASELINE_LABEL: github-actions-local-next-production
          MFL_BASELINE_SOURCE_REF: ${{ github.head_ref || github.ref_name }}
          MFL_BASELINE_ACCESS_CONTEXT: guest/public-database
          INPUT_RUNS: ${{ inputs.runs }}
          INPUT_PROFILES: ${{ inputs.profiles }}
          INPUT_JOURNEYS: ${{ inputs.journeys }}
        run: |
          set -euo pipefail
          export MFL_BASELINE_SOURCE_COMMIT="$(git rev-parse HEAD)"
          export MFL_BASELINE_RUNS="${INPUT_RUNS:-5}"
          export MFL_BASELINE_PROFILES="${INPUT_PROFILES:-desktop,mobile-slow}"
          export MFL_BASELINE_JOURNEYS="${INPUT_JOURNEYS:-}"
          export MFL_BASELINE_RUNS="1"
          export MFL_BASELINE_PROFILES="desktop,mobile-slow"
          export MFL_BASELINE_JOURNEYS="home,database,player,club,my-clubs,evaluation,stats"
          node --check validation/perf03-js-audit.mjs
          node --check validation/perf03-js-report.mjs
          node validation/perf03-js-audit.mjs 2>&1 | tee performance-baseline-current.log

      - name: Verify complete capture
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.metadata.complete == true' performance-baseline-current.json >/dev/null
          jq -e '.metadata.targetContext.datasetGeneratedAt == env.dataset_generated_at' performance-baseline-current.json >/dev/null
          jq -e '.metadata.targetContext.sourceCommit != ""' performance-baseline-current.json >/dev/null
          jq -e '.metadata.targetContext.browserVersion != ""' performance-baseline-current.json >/dev/null

      - name: Verify complete route coverage and CDP script timing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("performance-baseline-current.json").read_text())
          md=report["metadata"]
          assert md["complete"] and md["completedRuns"] == 14, md
          assert md["profiles"] == ["desktop","mobile-slow"]
          assert [x["id"] for x in md["journeys"]] == ["home","database","player","club","my-clubs","evaluation","stats"]
          assert md["targetContext"]["datasetRowCount"] >= 1000
          rows=[]
          for profile,journ in report["raw"].items():
            for journey,phases in journ.items():
              for phase,samples in phases.items():
                assert len(samples) == 1, (profile,journey,phase)
                audit=samples[0].get("perf03Js")
                assert audit and isinstance(audit["scripts"], list) and audit["performanceMetrics"], (profile,journey,phase)
                if phase != "cached": assert audit["scripts"], (profile,journey,phase)
                metrics=audit["performanceMetrics"]
                assert "ScriptDuration" in metrics, (profile,journey,phase,metrics.keys())
                assert "V8CompileDuration" in metrics, (profile,journey,phase,metrics.keys())
                rows.append((profile,journey,phase,round(metrics["ScriptDuration"]*1000,2),round(metrics["V8CompileDuration"]*1000,2),len(audit["scripts"])))
          print("PERF-03 COMPLETE",len(rows),"phase/script coverage samples")
          for row in rows: print("PERF03-CDP", *row)
          PY

      - name: Publish source-byte ownership and route coverage report
        shell: bash
        run: |
          set -euo pipefail
          node validation/perf03-js-report.mjs performance-baseline-current.json perf03-report.json perf03-report.md
          cat perf03-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish baseline context
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import json
          import os

          with open("performance-baseline-current.json") as stream:
              report = json.load(stream)
          metadata = report["metadata"]
          context = metadata["targetContext"]
          rows = [
              ("Source commit", context["sourceCommit"]),
              ("Source ref", context["sourceRef"]),
              ("Dataset generated", context["datasetGeneratedAt"]),
              ("Database artifact", os.environ["database_artifact_id"]),
              ("Database run", os.environ["database_run_id"]),
              ("Access context", context["accessContext"]),
              ("Browser", context["browserVersion"]),
              ("Profiles", ", ".join(metadata["profiles"])),
              ("Repetitions", metadata["repetitions"]),
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("### Performance baseline capture\n\n| Context | Value |\n| --- | --- |\n")
              for name, value in rows:
                  summary.write(f"| {name} | `{value}` |\n")
              summary.write("\nSynthetic client throttling and GitHub-hosted runner timing are evidence for comparison only; they are not production latency.\n")
          PYTHON

      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf03-js-coverage-${{ github.run_id }}
          path: |
            performance-baseline-current.json
            performance-baseline-current.log
            performance-next.log
            perf03-report.json
            perf03-report.md
          if-no-files-found: warn
          retention-days: 90

      - name: Stop production Next server
        if: always()
        shell: bash
        run: |
          if [ -n "${next_pid:-}" ]; then
            kill "$next_pid" >/dev/null 2>&1 || true
            wait "$next_pid" >/dev/null 2>&1 || true
          fi

name: Finalize PR 616 mobile row proportions

on:
  push:
    branches:
      - fix/599-responsive-table-proportions
    paths:
      - .github/workflows/refine-pr-616-mobile-rows-v3.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-pr-616-mobile-rows
  cancel-in-progress: true

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: fix/599-responsive-table-proportions

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Apply source-owned mobile row and Positions refinements
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              source = file.read_text(encoding="utf-8")
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              file.write_text(source.replace(old, new, 1), encoding="utf-8")

          shared = "site/shared-table-ui-runtime.js"
          replace_once(shared,
              '--mfl-table-row-height: max(16.754807692307693px, calc(2.043269230769231vw - 0.49038461538461536px));',
              '--mfl-table-row-height: max(18.09519230769231px, calc(2.2067307692307696vw - 0.5296153846153846px));')
          replace_once(shared,
              '--mfl-table-row-outer-height: max(19.21875px, calc(2.34375vw - 0.5625px));',
              '--mfl-table-row-outer-height: max(20.75625px, calc(2.53125vw - 0.6075px));')
          replace_once(shared, '--mfl-table-row-height: 13.89423076923077px;', '--mfl-table-row-height: 15.005769230769232px;')
          replace_once(shared, '--mfl-table-row-outer-height: 15.9375px;', '--mfl-table-row-outer-height: 17.2125px;')
          replace_once(shared, '--mfl-table-row-height: 12.259615384615385px;', '--mfl-table-row-height: 13.240384615384617px;')
          replace_once(shared, '--mfl-table-row-outer-height: 14.0625px;', '--mfl-table-row-outer-height: 15.1875px;')

          projection = "site/sync-release-projections.mjs"
          replace_once(projection,
              '--mfl-table-row-height: max(16.754807692307693px, calc(2.043269230769231vw - 0.49038461538461536px)); --mfl-table-row-outer-height: max(19.21875px, calc(2.34375vw - 0.5625px));',
              '--mfl-table-row-height: max(18.09519230769231px, calc(2.2067307692307696vw - 0.5296153846153846px)); --mfl-table-row-outer-height: max(20.75625px, calc(2.53125vw - 0.6075px));')
          replace_once(projection,
              '--mfl-table-row-height: 13.89423076923077px; --mfl-table-row-outer-height: 15.9375px;',
              '--mfl-table-row-height: 15.005769230769232px; --mfl-table-row-outer-height: 17.2125px;')
          replace_once(projection,
              '--mfl-table-row-height: 12.259615384615385px; --mfl-table-row-outer-height: 14.0625px;',
              '--mfl-table-row-height: 13.240384615384617px; --mfl-table-row-outer-height: 15.1875px;')
          replace_once(projection,
              '    player_seasons: "SZN",\n  });',
              '    player_seasons: "SZN",\n    positions: "POS",\n  });')

          table = "site/modules/core-sources/table.js"
          replace_once(table,
              '      player_seasons: "SZN",\n',
              '      player_seasons: "SZN",\n      positions: "POS",\n')
          replace_once(table,
              '''        : column === "positions"\n          ? "POSITIONS"\n          : compactTableHeadings\n            ? compactLabel\n            : fullLabel;''',
              '''        : column === "positions"\n          ? (compactTableHeadings ? compactLabel : "POSITIONS")\n          : compactTableHeadings\n            ? compactLabel\n            : fullLabel;''')

          bootstrap = "site/bootstrap.js"
          replace_once(bootstrap,
              '    player_seasons: "SZN",\n',
              '    player_seasons: "SZN",\n    positions: "POS",\n')
          replace_once(bootstrap,
              '    if (column === "positions") return "POSITIONS";',
              '    if (column === "positions") return FIRST_PAINT_PHONE_TABLE_MEDIA.matches ? compactLabel : "POSITIONS";')

          compact = "site/validate-mobile-table-compact-contract.mjs"
          replace_once(compact,
              r'--mfl-table-row-height: max\(16\.754807692307693px, calc\(2\.043269230769231vw - 0\.49038461538461536px\)\);[\s\S]*--mfl-table-row-outer-height: max\(19\.21875px, calc\(2\.34375vw - 0\.5625px\)\);',
              r'--mfl-table-row-height: max\(18\.09519230769231px, calc\(2\.2067307692307696vw - 0\.5296153846153846px\)\);[\s\S]*--mfl-table-row-outer-height: max\(20\.75625px, calc\(2\.53125vw - 0\.6075px\)\);')
          replace_once(compact,
              '"Mobile table headers must match the visible 32px row height while preserving the 28px cell content height."',
              '"Mobile row geometry must stay slightly taller than strict desktop scaling while header geometry remains proportional."')
          replace_once(compact,
              r'--mfl-table-row-height: 13.89423076923077px;[\s\S]*--mfl-table-row-outer-height: 15.9375px;',
              r'--mfl-table-row-height: 15.005769230769232px;[\s\S]*--mfl-table-row-outer-height: 17.2125px;')
          replace_once(compact,
              '"Phone table headers must match the visible 28px row height while preserving the 24px cell content height."',
              '"Phone rows must keep the intentional 8% mobile height boost."')
          replace_once(compact,
              r'--mfl-table-row-height: 12.259615384615385px;[\s\S]*--mfl-table-row-outer-height: 14.0625px;',
              r'--mfl-table-row-height: 13.240384615384617px;[\s\S]*--mfl-table-row-outer-height: 15.1875px;')
          replace_once(compact,
              '"Tiny-screen table headers must match the visible 26px row height while preserving the 22px cell content height."',
              '"Tiny-screen rows must keep the intentional 8% mobile height boost."')
          replace_once(compact,
              r'--mfl-table-row-height: max\(16\.754807692307693px, calc\(2\.043269230769231vw - 0\.49038461538461536px\)\); --mfl-table-row-outer-height: max\(19\.21875px, calc\(2\.34375vw - 0\.5625px\)\);',
              r'--mfl-table-row-height: max\(18\.09519230769231px, calc\(2\.2067307692307696vw - 0\.5296153846153846px\)\); --mfl-table-row-outer-height: max\(20\.75625px, calc\(2\.53125vw - 0\.6075px\)\);')
          replace_once(compact,
              r'--mfl-table-row-height: 13.89423076923077px; --mfl-table-row-outer-height: 15.9375px;',
              r'--mfl-table-row-height: 15.005769230769232px; --mfl-table-row-outer-height: 17.2125px;')
          replace_once(compact,
              r'--mfl-table-row-height: 12.259615384615385px; --mfl-table-row-outer-height: 14.0625px;',
              r'--mfl-table-row-height: 13.240384615384617px; --mfl-table-row-outer-height: 15.1875px;')
          marker = 'assert.match(tableSource, /player_seasons: "SZN"/, "Hydrated small-screen Seasons headings must use SZN.");'
          replace_once(compact, marker, marker + '\nassert.match(tableSource, /positions: "POS"/, "Hydrated compact headings must shorten Positions to POS.");')
          marker = '  "Bootstrap must render SZN as the real first-paint Seasons header text.",\n);'
          replace_once(compact, marker, marker + '\nassert.match(bootstrapSource, /FIRST_PAINT_COMPACT_COLUMN_LABELS[\\s\\S]*positions: "POS"/, "Bootstrap compact headings must shorten Positions to POS.");')

          retry = "site/validate-mobile-table-retry.mjs"
          replace_once(retry,
              '--mfl-table-row-height: max(16.754807692307693px, calc(2.043269230769231vw - 0.49038461538461536px));',
              '--mfl-table-row-height: max(18.09519230769231px, calc(2.2067307692307696vw - 0.5296153846153846px));')
          replace_once(retry, '--mfl-table-row-height: 13.89423076923077px;', '--mfl-table-row-height: 15.005769230769232px;')
          replace_once(retry, '--mfl-table-row-height: 12.259615384615385px;', '--mfl-table-row-height: 13.240384615384617px;')
          replace_once(retry,
              '''excludes(tableSource, 'positions: "POS"', "Positions must not participate in compact width-dependent abbreviation.");\nincludes(tableSource, 'column === "positions"\\n          ? "POSITIONS"', "Mobile tables must call the Positions column POSITIONS.");''',
              '''includes(tableSource, 'positions: "POS"', "Compact phone headings must abbreviate Positions to POS.");\nincludes(tableSource, 'column === "positions"\\n          ? (compactTableHeadings ? compactLabel : "POSITIONS")', "Mobile tables must keep POSITIONS on wider tablets and use POS on compact phones.");''')
          replace_once(retry,
              '''excludes(bootstrap, 'positions: "POS"', "Bootstrap must not abbreviate Positions based on viewport width.");\nincludes(bootstrap, 'if (column === "positions") return "POSITIONS";', "Positions must already read POSITIONS before first paint.");''',
              '''includes(bootstrap, 'positions: "POS"', "Bootstrap must know the compact Positions label before first paint.");\nincludes(bootstrap, 'if (column === "positions") return FIRST_PAINT_PHONE_TABLE_MEDIA.matches ? compactLabel : "POSITIONS";', "First paint must keep POSITIONS on wider tablets and use POS on compact phones.");''')
          PY

          cat > site/validate-responsive-table-proportions.mjs <<'EOF'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import { dirname, resolve } from "node:path";
          import { fileURLToPath } from "node:url";

          const root = dirname(fileURLToPath(import.meta.url));
          const read = (name) => readFileSync(resolve(root, name), "utf8");
          const styles = read("styles.css");
          const shared = read("shared-table-ui-runtime.js");
          const projection = read("sync-release-projections.mjs");
          const index = read("index.html");
          const desktop = Object.freeze({ width: 1664, header: 38, row: 34, outer: 39 });
          const mobileRowBoost = 1.08;
          const close = (actual, expected, tolerance = 1e-12) => Math.abs(actual - expected) <= tolerance;
          const tablet = Object.freeze({ width: 820, inset: 24, header: 18.72596153846154, row: 18.09519230769231, outer: 20.75625 });
          const fixed = Object.freeze([
            Object.freeze({ breakpoint: 520, width: 680, header: 15.528846153846153, row: 15.005769230769232, outer: 17.2125, control: 13 }),
            Object.freeze({ breakpoint: 380, width: 600, header: 13.701923076923077, row: 13.240384615384617, outer: 15.1875, control: 12 }),
          ]);
          const sources = Object.freeze([["hydrated", shared], ["first-paint generator", projection], ["generated first-paint", index]]);
          const tabletDeclarations = Object.freeze([
            "--mfl-table-header-height: max(18.72596153846154px, calc(2.2836538461538463vw - 0.5480769230769231px));",
            "--mfl-table-row-height: max(18.09519230769231px, calc(2.2067307692307696vw - 0.5296153846153846px));",
            "--mfl-table-row-outer-height: max(20.75625px, calc(2.53125vw - 0.6075px));",
          ]);

          assert.ok(mobileRowBoost > 1 && mobileRowBoost < 1.1, "Mobile row boost must remain slight rather than redefining the layout.");
          assert.match(styles, /--mfl-table-header-height: 38px;/);
          assert.match(styles, /--mfl-table-row-height: 34px;/);
          assert.match(styles, /--mfl-table-row-outer-height: 39px;/);
          assert.match(styles, /--mfl-table-col-listing: 6\.3904569176696135%;/);
          assert.match(styles, /--mfl-table-col-positions: 7\.508786878261796%;/);

          const tabletScale = tablet.width / desktop.width;
          assert.ok(close(tablet.header / desktop.header, tabletScale));
          assert.ok(close(tablet.row / desktop.row, tabletScale * mobileRowBoost));
          assert.ok(close(tablet.outer / desktop.outer, tabletScale * mobileRowBoost));
          for (const [name, source] of sources) {
            for (const declaration of tabletDeclarations) assert.ok(source.includes(declaration), `${name} missing width-aware tablet geometry: ${declaration}`);
            assert.ok(source.includes("min-width: 820px;"), `${name} missing tablet minimum table width.`);
          }

          const viewport = 900;
          const renderedWidth = viewport - tablet.inset;
          const renderedScale = renderedWidth / desktop.width;
          assert.ok(close((2.2836538461538463 * viewport / 100) - 0.5480769230769231, desktop.header * renderedScale));
          assert.ok(close((2.2067307692307696 * viewport / 100) - 0.5296153846153846, desktop.row * renderedScale * mobileRowBoost));
          assert.ok(close((2.53125 * viewport / 100) - 0.6075, desktop.outer * renderedScale * mobileRowBoost));

          for (const geometry of fixed) {
            const scale = geometry.width / desktop.width;
            assert.ok(close(geometry.header / desktop.header, scale), `<=${geometry.breakpoint}px header/table scale mismatch.`);
            assert.ok(close(geometry.row / desktop.row, scale * mobileRowBoost), `<=${geometry.breakpoint}px row must retain the mobile height boost.`);
            assert.ok(close(geometry.outer / desktop.outer, scale * mobileRowBoost), `<=${geometry.breakpoint}px outer row must retain the mobile height boost.`);
            assert.ok(geometry.control <= geometry.row, `<=${geometry.breakpoint}px fixed controls must fit within row content.`);
            for (const [name, source] of sources) {
              assert.ok(source.includes(`--mfl-table-header-height: ${geometry.header}px;`), `${name} missing <=${geometry.breakpoint}px header.`);
              assert.ok(source.includes(`--mfl-table-row-height: ${geometry.row}px;`), `${name} missing <=${geometry.breakpoint}px row.`);
              assert.ok(source.includes(`--mfl-table-row-outer-height: ${geometry.outer}px;`), `${name} missing <=${geometry.breakpoint}px outer row.`);
              assert.ok(source.includes(`min-width: ${geometry.width}px;`), `${name} missing <=${geometry.breakpoint}px table width.`);
            }
          }

          assert.doesNotMatch(shared, /--mfl-table-col-(?:listing|positions)\s*:/, "Hydrated mobile CSS must not alter desktop column percentages.");
          assert.doesNotMatch(shared, /style\.setProperty\("--mfl-table-col-(?:listing|positions)"/, "Hydration must not rebalance canonical Listing or Positions percentages.");
          assert.doesNotMatch(projection, /--mfl-table-col-(?:listing|positions)\s*:/, "First-paint projection must not alter desktop column percentages.");
          assert.doesNotMatch(index, /--mfl-table-col-listing:\s*(?:4\.2|3\.8|3\.6)%|--mfl-table-col-positions:\s*(?:9\.699243795931409|10\.099243795931411|10\.29924379593141)%/);
          assert.match(shared, /overflow-x: auto;\n {4}overflow-y: hidden;/);
          assert.match(styles, /#progressionPage \.playerTableScroller col\.col-name \{ width: var\(--mfl-table-col-name\); \}/);
          assert.match(styles, /#progressionPage \.playerTableScroller th \{\n {2}height: var\(--mfl-table-header-height\);/);
          assert.match(styles, /#progressionPage \.playerTableScroller td \{\n {2}height: var\(--mfl-table-row-height\);/);
          assert.doesNotMatch(shared, /!important/);
          console.log("Responsive player-table headers preserve desktop scale while mobile rows remain slightly taller across first paint and hydration.");
          EOF

          node site/build-app-core.mjs
          node site/sync-release-projections.mjs

      - name: Snapshot generated artifacts for validation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site
          git diff --cached --check
          git commit -m "Refine mobile table row proportions"

      - name: Install and validate site
        shell: bash
        run: |
          set -euo pipefail
          cd site
          npm ci
          npm run check

      - name: Remove scaffolding and push validated refinement
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/refine-pr-616-mobile-rows.yml .github/workflows/refine-pr-616-mobile-rows-v3.yml
          git add -A
          git diff --cached --check
          git commit --amend --no-edit
          git push origin HEAD:fix/599-responsive-table-proportions

name: Issue 445 Pager Selection Fix

on:
  push:
    branches:
      - fix/445-pager-text-selection
    paths:
      - site/migrate-445-pager-selection.mjs
      - .github/workflows/issue-445-pager-selection.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install site dependencies
        working-directory: site
        run: npm install --no-audit --no-fund

      - name: Apply pager selection fix
        working-directory: site
        run: node migrate-445-pager-selection.mjs

      - name: Regenerate application core
        working-directory: site
        run: npm run build:core

      - name: Commit source and generated runtimes locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            site/controls.css \
            site/modules/app-core.js \
            site/modules/app-core-runtime.js \
            site/modules/app-core-table-runtime.js \
            site/validate-pager-current-page.mjs
          git diff --cached --quiet && { echo "No pager selection changes generated."; exit 1; }
          git commit -m "Fix pager native text selection"

      - name: Run full site checks
        working-directory: site
        run: npm run check

      - name: Push verified fix
        shell: bash
        run: git push origin HEAD:${{ github.ref_name }}

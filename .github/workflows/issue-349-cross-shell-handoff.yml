name: Issue 349 cross-shell handoff fix

on:
  push:
    branches:
      - fix/loading-navigation-supersession
    paths:
      - .github/workflows/issue-349-cross-shell-handoff.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/loading-navigation-supersession

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply canonical cross-shell navigation ownership fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('site/modules/app-core.js')
          source = path.read_text()

          def replace_once(old, new, label):
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              source = source.replace(old, new, 1)

          def regex_once(pattern, replacement, label, flags=0):
              global source
              source, count = re.subn(pattern, replacement, source, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')

          replace_once(
          '''function navigationTransitionIsCurrent(transition) {
            if (!transition) return true;
            return transition.kind === "view"
              ? stagedViewTransitionIsCurrent(transition)
              : pageTransitionIsCurrent(transition);
          }
          ''',
          '''function navigationTransitionIsCurrent(transition) {
            if (!transition) return true;
            return transition.kind === "view"
              ? stagedViewTransitionIsCurrent(transition)
              : pageTransitionIsCurrent(transition);
          }

          function pageNavigationIsCurrent(options = {}) {
            const transition = options && typeof options === "object"
              ? options.__mflNavigationTransition
              : null;
            return !transition || navigationTransitionIsCurrent(transition);
          }
          ''',
          'page navigation ownership helper')

          replace_once(
          '''async function setPage(pageName, updateHash = true, options = {}) {
            const plainEvaluationEntry = pageName === "evaluation" && (options.plain || isPlainEvaluationUrl());
          ''',
          '''async function setPage(pageName, updateHash = true, options = {}) {
            if (!pageNavigationIsCurrent(options)) return null;
            const plainEvaluationEntry = pageName === "evaluation" && (options.plain || isPlainEvaluationUrl());
          ''',
          'base setPage entry guard')

          regex_once(
              r'(const loaded = await ensureProgressionData\(\);\n)(\s*)(if \(!loaded\) \{)',
              r'\1\2if (!pageNavigationIsCurrent(options)) return null;\n\n\2\3',
              'progression data stale guard')

          regex_once(
              r'(state\.pendingWatchlistRouteId = options\.watchlistId \|\| watchlistIdFromUrl\(\) \|\| "";\n\s*await ensureWatchlistRoute\(options\);)(\n\s*\}\n\n\s*)(state\.currentPage = pageName;)',
              r'\1\n    if (!pageNavigationIsCurrent(options)) return null;\2if (!pageNavigationIsCurrent(options)) return null;\n  \3',
              'watchlist/final commit stale guard')

          regex_once(
              r'(await renderEvaluationPage\(\);\n)(\s*)(if \(!cachedEvaluationReentry\) \{\n\s*await finishEvaluationReadiness\(\);)(\n\s*\})',
              r'\1\2if (!pageNavigationIsCurrent(options)) return null;\n\2\3\n      if (!pageNavigationIsCurrent(options)) return null;\4',
              'evaluation stale guard')

          regex_once(
              r'const stagedTransition = incomingOptions\.skipNavigationTransition === true\s*\? pendingViewTransition\s*: null;',
              'const stagedTransition = incomingOptions.__mflNavigationTransition\n        || (incomingOptions.skipNavigationTransition === true ? pendingViewTransition : null);',
              'route gate inherited transition')

          regex_once(
              r'(const committedOptions = \{\n\s*\.\.\.incomingOptions,\n\s*skipNavigationTransition: true,\n)(\s*)(\.\.\.\(previousTableStateSaved \? \{ __mflPreviousTableStateSaved: true \} : \{\}\),)',
              r'\1\2...(transition ? { __mflNavigationTransition: transition } : {}),\n\2\3',
              'route gate transition forwarding')

          regex_once(
              r'\n  function enforceHomePage\(\) \{.*?\n  \}\n\n  if \(typeof setPage === "function"\) \{\n    const originalSetPage = setPage;\n    setPage = async function setPageWithStableHome\(pageName\) \{.*?\n    \};\n  \}\n',
              '\n',
              'legacy stable Home owner removal',
              re.S)

          watchlist_pattern = re.compile(
              r'(const result = await originalSetPage\.call\(this, pageName, updateHash, nextOptions\);\n)(\s*)(keepSidebarExpanded\(\);\n\s*if \(pageName === "watchlist" && routeView\) enforceWatchlistRouteView\(true\);)'
          )
          source, _ = watchlist_pattern.subn(
              r'\1\2if (result === null || !pageNavigationIsCurrent(nextOptions)) return result;\n\2\3',
              source,
              count=1,
          )

          path.write_text(source)

          validator = Path('site/validate-page-route-gate-transition.mjs')
          check = validator.read_text()
          old_assert = 'assert.match(routeSetPageSection, /const stagedTransition = incomingOptions\\.skipNavigationTransition === true[\\s\\S]*?pendingViewTransition/, "Skip-transition view loads must retain their staged transition identity through lazy runtime loading.");\n'
          new_assert = 'assert.match(routeSetPageSection, /const stagedTransition = incomingOptions\\.__mflNavigationTransition[\\s\\S]*?pendingViewTransition/, "Lazy route loads must retain an inherited page/view transition identity through runtime loading.");\n'
          if check.count(old_assert) != 1:
              raise SystemExit('validator staged-transition assertion missing')
          check = check.replace(old_assert, new_assert, 1)

          marker = 'assert.match(routeSetPageSection, /const loadCommittedRoute = async \\(transition = stagedTransition\\) => \\{/, "The lazy route gate must receive the owning page/view transition.");\n'
          addition = marker + 'assert.match(routeSetPageSection, /__mflNavigationTransition: transition/, "The lazy route gate must forward the owning transition into downstream page renderers.");\n'
          if check.count(marker) != 1:
              raise SystemExit('validator route gate marker missing')
          check = check.replace(marker, addition, 1)

          console_marker = 'console.log("Lazy route gate stale-completion guard and latest-navigation loading supersession validation passed.");\n'
          extra = '''
          const baseSetPageStart = appCoreSource.indexOf("async function setPage(pageName, updateHash = true, options = {}) {");
          const baseSetPageEnd = appCoreSource.indexOf("function updateStatusDate", baseSetPageStart);
          const baseSetPage = appCoreSource.slice(baseSetPageStart, baseSetPageEnd);
          assert.match(baseSetPage, /if \\(!pageNavigationIsCurrent\\(options\\)\\) return null;/, "Every page renderer must reject a stale owning navigation before mutating destination UI.");
          const progressionAwait = baseSetPage.indexOf("const loaded = await ensureProgressionData();");
          const progressionGuard = baseSetPage.indexOf("if (!pageNavigationIsCurrent(options)) return null;", progressionAwait);
          const finalPageCommit = baseSetPage.indexOf("state.currentPage = pageName;", progressionGuard);
          assert.ok(progressionAwait >= 0 && progressionGuard > progressionAwait && finalPageCommit > progressionGuard, "Table data completion must be rejected when a newer non-table navigation has won.");
          const watchlistAwait = baseSetPage.indexOf("await ensureWatchlistRoute(options);");
          const watchlistGuard = baseSetPage.indexOf("if (!pageNavigationIsCurrent(options)) return null;", watchlistAwait);
          assert.ok(watchlistAwait >= 0 && watchlistGuard > watchlistAwait, "Watchlist route completion must be rejected after navigation supersession.");
          const evaluationAwait = baseSetPage.indexOf("await renderEvaluationPage();");
          const evaluationGuard = baseSetPage.indexOf("if (!pageNavigationIsCurrent(options)) return null;", evaluationAwait);
          assert.ok(evaluationAwait >= 0 && evaluationGuard > evaluationAwait, "Non-table Evaluation completion must not reclaim UI after a table navigation wins.");
          assert.doesNotMatch(appCoreSource, /setPageWithStableHome/, "Home must use the canonical page transition owner instead of a post-load wrapper that can reclaim stale UI.");
          assert.doesNotMatch(appCoreSource, /requestAnimationFrame\\(enforceHomePage\\)/, "A completed stale Home load must never schedule a later page-shell reclaim.");

          ''' + console_marker
          if check.count(console_marker) != 1:
              raise SystemExit('validator console marker missing')
          check = check.replace(console_marker, extra, 1)
          validator.write_text(check)
          PY

      - name: Install site dependencies
        working-directory: site
        run: npm install --no-audit --no-fund

      - name: Build canonical application core
        working-directory: site
        run: npm run build:core

      - name: Validate cross-shell supersession
        working-directory: site
        run: |
          node validate-page-route-gate-transition.mjs
          node validate-loading-ownership.mjs
          node validate-static-route-ui.mjs
          node validate-generated-view-transition.mjs
          npm run lint
          npm run typecheck

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/modules/app-core.js site/modules/app-core-runtime.js site/validate-page-route-gate-transition.mjs
          git diff --cached --check
          git commit -m "Keep cross-shell navigation authoritative"
          git push origin HEAD:fix/loading-navigation-supersession

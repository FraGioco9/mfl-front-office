name: Capture core type fingerprints

on:
  push:
    branches:
      - chore/969-core-type-fingerprints

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Record exact current diagnostics
        shell: bash
        run: |
          set +e
          npx tsc -p jsconfig.core.json --noEmit --pretty false > core-types-current.txt 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected the current core baseline to contain diagnostics." >&2
            exit 1
          fi
          node <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const output = fs.readFileSync("core-types-current.txt", "utf8");
          const fingerprints = new Map();
          let total = 0;
          for (const line of output.split(/\r?\n/)) {
            const trimmed = line.trim();
            const match = /^(modules\/core-sources\/[^(:]+\.js)\((\d+),(\d+)\): error TS(\d+): (.*)$/.exec(trimmed);
            if (!match) continue;
            const [, file, lineNumber, , codeNumber, message] = match;
            const lines = fs.readFileSync(file, "utf8").split(/\r?\n/);
            const source = (lines[Number(lineNumber) - 1] || "").trim().replace(/\s+/g, " ");
            const code = `TS${codeNumber}`;
            const fingerprint = crypto
              .createHash("sha256")
              .update([file, code, message, source].join("\n"))
              .digest("hex");
            fingerprints.set(fingerprint, (fingerprints.get(fingerprint) || 0) + 1);
            total += 1;
          }
          const payload = {
            version: 1,
            sourceCommit: "1dffcba91714876a219164c509e6a6aad7d67721",
            total,
            fingerprintCount: fingerprints.size,
            fingerprints: Object.fromEntries([...fingerprints].sort(([a], [b]) => a.localeCompare(b))),
          };
          fs.mkdirSync("validation", { recursive: true });
          fs.writeFileSync(
            "validation/core-type-diagnostic-baseline.json",
            JSON.stringify(payload, null, 2) + "\n",
          );
          console.log(`Recorded ${total} diagnostics across ${fingerprints.size} stable fingerprints.`);
          NODE
      - name: Commit captured baseline
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/core-type-diagnostic-baseline.json
          git commit -m "Record current core type diagnostic fingerprints"
          git push origin HEAD:chore/969-core-type-fingerprints

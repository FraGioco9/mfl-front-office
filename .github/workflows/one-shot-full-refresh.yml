name: One-shot full database refresh dispatch

on:
  push:
    branches:
      - ops/dispatch-full-refresh-20260916
    paths:
      - .github/workflows/one-shot-full-refresh.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch full database refresh on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api             --method POST             -H "Accept: application/vnd.github+json"             "repos/${GITHUB_REPOSITORY}/actions/workflows/full-database-refresh.yml/dispatches"             -f ref=main

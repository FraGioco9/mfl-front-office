name: Issue 866 backfill verification

on:
  push:
    branches:
      - fix/866-development-center-club-reuse

permissions:
  actions: read
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Restore exact previous database from failed run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p previous-database
          gh run download 34454584876 -n mfl_database -D previous-database
      - name: Reproduce historical-only rebuild
        env:
          MFL_API_TOKEN: ${{ secrets.MFL_API_TOKEN }}
          MFL_FETCH_WALLETS: 'false'
          MFL_FETCH_PLAYERS: 'false'
          MFL_FETCH_CLUBS: 'false'
          MFL_FETCH_LIVE_COMPETITIONS: 'false'
          MFL_BACKFILL_HISTORICAL_COMPETITIONS: 'true'
          MFL_FETCH_PLAYER_SEASONS: 'false'
          MFL_FETCH_PROGRESSIONS: 'false'
        run: python -m scripts.database.rebuild_database_runner

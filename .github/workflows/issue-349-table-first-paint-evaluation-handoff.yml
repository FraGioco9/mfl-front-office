name: Issue 349 table first paint and Evaluation handoff

on:
  push:
    branches:
      - fix/loading-navigation-supersession
    paths:
      - .github/workflows/issue-349-table-first-paint-evaluation-handoff.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/loading-navigation-supersession

      - name: Fix table first paint and Evaluation handoff
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one block in {path}, found {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          index = "site/index.html"
          neutral = (
              '      html:not(.mflInitialRouteResolved):not(.mflInitialRouteSuperseded):is(\n'
              '        [data-initial-table-page="database"],\n'
              '        [data-initial-table-page="mfl"],\n'
              '        [data-initial-table-page="progression"],\n'
              '        [data-initial-table-page="watchlist"],\n'
              '        [data-initial-table-page="myplayers"]\n'
              '      ) #sidebar .navButton[data-page]:not(:hover) {\n'
              '        border-color: var(--border-strong);\n'
              '        background: var(--surface);\n'
              '        color: var(--text);\n'
              '      }\n'
          )
          replace_once(index, neutral, '')

          active_anchor = (
              '      html:not(.mflInitialRouteResolved):not(.mflInitialRouteSuperseded)[data-initial-table-page="myplayers"] #sidebar .navButton[data-page="myplayers"],\n'
              '      html:not(.mflInitialRouteResolved):not(.mflInitialRouteSuperseded)[data-initial-page="evaluation"] #sidebar .navButton[data-page="evaluation"],'
          )
          active_replacement = (
              '      html:not(.mflInitialRouteResolved):not(.mflInitialRouteSuperseded)[data-initial-table-page="myplayers"] #sidebar .navButton[data-page="myplayers"],\n'
              '      html:not(.mflInitialRouteResolved):not(.mflInitialRouteSuperseded)[data-initial-table-page="agents"] #sidebar .navButton[data-page="agents"],\n'
              '      html:not(.mflInitialRouteResolved):not(.mflInitialRouteSuperseded)[data-initial-table-page="club"] #sidebar .navButton[data-page="club"],\n'
              '      html:not(.mflInitialRouteResolved):not(.mflInitialRouteSuperseded)[data-initial-page="evaluation"] #sidebar .navButton[data-page="evaluation"],'
          )
          replace_once(index, active_anchor, active_replacement)

          evaluation_shell = (
              '      html[data-initial-page="evaluation"]:not(.mflInitialRouteResolved) #homePage {\n'
              '        display: none;\n'
              '      }\n'
              '      html[data-initial-page="evaluation"]:not(.mflInitialRouteResolved) #evaluationPage {\n'
              '        display: block;\n'
              '      }'
          )
          evaluation_shell_replacement = (
              '      html[data-initial-page="evaluation"]:not(.mflInitialRouteResolved):not(.mflInitialRouteSuperseded) #homePage {\n'
              '        display: none;\n'
              '      }\n'
              '      html[data-initial-page="evaluation"]:not(.mflInitialRouteResolved):not(.mflInitialRouteSuperseded) #evaluationPage {\n'
              '        display: block;\n'
              '      }'
          )
          replace_once(index, evaluation_shell, evaluation_shell_replacement)

          validator = Path("site/validate-static-route-ui.mjs")
          text = validator.read_text()
          anchor = 'includes(indexHtml, "window.__mflTableViewConfig = TABLE_VIEW_CONFIG;", "First-paint table view configuration must be exposed to runtime chrome ownership.");\n'
          addition = (
              'includes(indexHtml, \'data-initial-table-page="agents"] #sidebar .navButton[data-page="agents"]\', "Agents must expose its active sidebar state during table-route first paint.");\n'
              'includes(indexHtml, \'data-initial-table-page="club"] #sidebar .navButton[data-page="club"]\', "Club first paint must support active sidebar state when a matching navigation control exists.");\n'
              'excludes(indexHtml, \') #sidebar .navButton[data-page]:not(:hover) {\', "Table first paint must not neutralize sidebar controls with a selector more specific than the active-route selector.");\n'
              'includes(indexHtml, \'html[data-initial-page="evaluation"]:not(.mflInitialRouteResolved):not(.mflInitialRouteSuperseded) #evaluationPage\', "Evaluation refresh-only visibility must stop as soon as a newer navigation owns the shell.");\n'
              'includes(indexHtml, \'html[data-initial-page="evaluation"]:not(.mflInitialRouteResolved):not(.mflInitialRouteSuperseded) #homePage\', "Evaluation refresh-only Home hiding must stop with the same supersession boundary.");\n'
          )
          if anchor not in text:
              raise SystemExit("Static route validator insertion anchor missing")
          text = text.replace(anchor, anchor + addition, 1)

          old_contract = (
              'invariant(\n'
              '  indexHtml.includes(\'html:not(.mflInitialRouteResolved):not(.mflInitialRouteSuperseded)[data-initial-table-page=\')\n'
              '    && indexHtml.includes(\'html:not(.mflInitialRouteResolved):not(.mflInitialRouteSuperseded):is(\')\n'
              '    && indexHtml.includes(\') #sidebar .navButton[data-page]:not(:hover) {\'),\n'
              '  "Refresh-only first-paint route chrome must permanently relinquish page/view button ownership when a live navigation supersedes startup, while leaving normal hover styling available.",\n'
              ');'
          )
          new_contract = (
              'invariant(\n'
              '  indexHtml.includes(\'html:not(.mflInitialRouteResolved):not(.mflInitialRouteSuperseded)[data-initial-table-page=\')\n'
              '    && !indexHtml.includes(\') #sidebar .navButton[data-page]:not(:hover) {\'),\n'
              '  "Refresh-only table-page chrome must expose the active route directly and relinquish ownership on supersession without a higher-specificity neutral sidebar rule.",\n'
              ');'
          )
          if text.count(old_contract) != 1:
              raise SystemExit(f"Expected one old first-paint contract, found {text.count(old_contract)}")
          validator.write_text(text.replace(old_contract, new_contract, 1))
          PY

      - name: Run focused route UI validation
        working-directory: site
        run: |
          node validate-static-route-ui.mjs
          node validate-bootstrap-ownership.mjs
          node validate-loading-ownership.mjs

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html site/validate-static-route-ui.mjs
          git diff --cached --quiet && exit 1
          git commit -m "Fix table first paint and Evaluation handoff"
          git push origin HEAD:fix/loading-navigation-supersession

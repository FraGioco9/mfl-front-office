name: PR 348 refresh loading ownership patch

on:
  push:
    branches:
      - fix/refresh-navigation-authority
    paths:
      - .github/workflows/pr-348-refresh-loading-owner-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/refresh-navigation-authority
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch refresh-time loading ownership
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceExact(path, before, after, label) {
            let source = fs.readFileSync(path, 'utf8');
            if (!source.includes(before)) {
              throw new Error(`${path}: could not find ${label}`);
            }
            source = source.replace(before, after);
            fs.writeFileSync(path, source, 'utf8');
          }

          replaceExact(
            'site/bootstrap-core.js',
            `    function routeLoadingActive() {\n      return currentSnapshot.reasons.includes(ROUTE_LOADING_REASON);\n    }\n\n    function wrapRoutePageGlobal() {`,
            `    function routeLoadingActive() {\n      return currentSnapshot.reasons.includes(ROUTE_LOADING_REASON);\n    }\n\n    function routeLoadingOwnerReusable() {\n      return document.documentElement.classList.contains("mflInitialRouteResolved")\n        && routeLoadingActive();\n    }\n\n    function wrapRoutePageGlobal() {`,
            'refresh-aware route loading reuse helper',
          );

          replaceExact(
            'site/bootstrap-core.js',
            `        if (routeDestinationReady(pageName, options) || routeLoadingActive()) {\n          return original.apply(window, args);\n        }`,
            `        if (routeDestinationReady(pageName, options) || routeLoadingOwnerReusable()) {\n          return original.apply(window, args);\n        }`,
            'setPage loading-owner reuse guard',
          );

          replaceExact(
            'site/bootstrap-core.js',
            `          if (normalizedReason === ROUTE_LOADING_REASON && routeLoadingActive()) return callback();`,
            `          if (normalizedReason === ROUTE_LOADING_REASON && routeLoadingOwnerReusable()) return callback();`,
            'withInteractionBusy loading-owner reuse guard',
          );

          const oldViewRunner = `async function runViewTransition(pageName, viewName, options = {}, loader = null) {\n  const navigation = Reflect.get(window, "__mflNavigation");\n  const navigationToken = typeof navigation?.begin === "function"\n    ? navigation.begin("view-transition")\n    : "";\n  try {\n    window.__mflCancelIncrementalRouteRequest?.();\n    const transition = stageViewTransition(pageName, viewName, options);\n    if (!transition) return null;\n    await waitForViewTransitionPaint();\n    if (!stagedViewTransitionIsCurrent(transition)) return null;\n    if (typeof loader === "function") {\n      pendingViewTransition = null;\n      return await loader(transition);\n    }\n    return transition;\n  } finally {\n    if (navigationToken) navigation?.end?.(navigationToken);\n  }\n}`;
          const newViewRunner = `async function runViewTransition(pageName, viewName, options = {}, loader = null) {\n  const navigation = Reflect.get(window, "__mflNavigation");\n  const navigationToken = typeof navigation?.begin === "function"\n    ? navigation.begin("view-transition")\n    : "";\n  const loadingController = Reflect.get(window, "__mflInteractionBusy");\n  const refreshLoadingToken = !document.documentElement.classList.contains("mflInitialRouteResolved")\n    && typeof loadingController?.begin === "function"\n    ? loadingController.begin(loadingController.reason)\n    : "";\n  try {\n    window.__mflCancelIncrementalRouteRequest?.();\n    const transition = stageViewTransition(pageName, viewName, options);\n    if (!transition) return null;\n    await waitForViewTransitionPaint();\n    if (!stagedViewTransitionIsCurrent(transition)) return null;\n    if (typeof loader === "function") {\n      try {\n        return await loader(transition);\n      } finally {\n        if (pendingViewTransition === transition) pendingViewTransition = null;\n      }\n    }\n    return transition;\n  } finally {\n    if (refreshLoadingToken) loadingController?.end?.(refreshLoadingToken);\n    if (navigationToken) navigation?.end?.(navigationToken);\n  }\n}`;
          replaceExact(
            'site/modules/app-core.js',
            oldViewRunner,
            newViewRunner,
            'refresh-owned view transition',
          );

          replaceExact(
            'site/modules/app-core.js',
            `  void (async () => {\n    const transition = await runViewTransition(pageName, viewName, {\n      walletAddress: state.currentAgentWalletAddress,\n      watchlistId: state.currentWatchlistId,\n    });\n    if (!transition) return;\n    if (!state.incrementalMode) pendingViewTransition = null;\n    await setView(viewName);\n  })();`,
            `  void runViewTransition(pageName, viewName, {\n    walletAddress: state.currentAgentWalletAddress,\n    watchlistId: state.currentWatchlistId,\n  }, async () => {\n    await setView(viewName);\n  });`,
            'shared view click transition loader ownership',
          );

          replaceExact(
            'site/validate-loading-ownership.mjs',
            `    && bootstrapCore.includes("if (normalizedReason === ROUTE_LOADING_REASON && routeLoadingActive()) return callback();")\n    && bootstrapCore.includes("return run(callback, normalizedReason);"),\n  "Legacy uncached route/data loads must retain non-blocking route/data notification without an explicit global operation-busy helper.",`,
            `    && bootstrapCore.includes("function routeLoadingOwnerReusable() {")\n    && bootstrapCore.includes('document.documentElement.classList.contains("mflInitialRouteResolved")')\n    && bootstrapCore.includes("if (normalizedReason === ROUTE_LOADING_REASON && routeLoadingOwnerReusable()) return callback();")\n    && bootstrapCore.includes("return run(callback, normalizedReason);"),\n  "Legacy uncached route/data loads must reuse route-loading only after initial route ownership has resolved, so refresh-time user navigation gets its own lifetime.",`,
            'loading ownership validator nested reuse contract',
          );

          replaceExact(
            'site/validate-loading-ownership.mjs',
            `  bootstrapCore.includes("if (normalizedReason === ROUTE_LOADING_REASON) await waitForRoutePaint();"),`,
            `  bootstrapCore.includes("if (routeDestinationReady(pageName, options) || routeLoadingOwnerReusable()) {")\n    && bootstrapCore.includes("if (normalizedReason === ROUTE_LOADING_REASON) await waitForRoutePaint();"),`,
            'loading ownership validator page reuse contract',
          );

          replaceExact(
            'site/validate-bootstrap-ownership.mjs',
            `  "if (routeDestinationReady(pageName, options) || routeLoadingActive()) {",\n  "Fully ready page destinations and nested page transitions must bypass duplicate route loading.",`,
            `  "if (routeDestinationReady(pageName, options) || routeLoadingOwnerReusable()) {",\n  "Fully ready page destinations and post-startup nested page transitions may bypass duplicate route loading without borrowing the unresolved refresh owner.",`,
            'bootstrap validator setPage loading guard',
          );

          replaceExact(
            'site/validate-bootstrap-ownership.mjs',
            `  "if (normalizedReason === ROUTE_LOADING_REASON && routeLoadingActive()) return callback();",\n  "Nested canonical route-loading owners must reuse the active page-transition lifecycle instead of stacking tokens.",`,
            `  "if (normalizedReason === ROUTE_LOADING_REASON && routeLoadingOwnerReusable()) return callback();",\n  "Nested canonical route-loading owners may reuse an active lifecycle only after refresh startup ownership has resolved.",`,
            'bootstrap validator nested loading guard',
          );

          replaceExact(
            'site/validate-bootstrap-ownership.mjs',
            `includes(\n  bootstrapCore,\n  "wrapRoutePageGlobal();",\n  "Page transitions must install the readiness-aware setPage loading owner.",\n);`,
            `includes(\n  bootstrapCore,\n  "wrapRoutePageGlobal();",\n  "Page transitions must install the readiness-aware setPage loading owner.",\n);\nincludes(\n  bootstrapCore,\n  "function routeLoadingOwnerReusable() {",\n  "Refresh startup and user-triggered route loading must have distinct ownership until the initial route resolves.",\n);\nincludes(\n  bootstrapCore,\n  'document.documentElement.classList.contains("mflInitialRouteResolved")',\n  "Route-loading reuse must be gated by completed initial-route ownership.",\n);`,
            'bootstrap validator refresh ownership helper',
          );

          replaceExact(
            'site/validate-generated-view-transition.mjs',
            `const viewRunnerNavigation = viewRunner.indexOf('navigation.begin("view-transition")');\nconst viewRunnerCancel = viewRunner.indexOf("window.__mflCancelIncrementalRouteRequest?.();", viewRunnerNavigation);\nconst viewRunnerStage = viewRunner.indexOf("stageViewTransition(pageName, viewName, options)");\nconst viewRunnerPaint = viewRunner.indexOf("await waitForViewTransitionPaint();", viewRunnerStage);\nconst viewRunnerLoad = viewRunner.indexOf('typeof loader === "function"', viewRunnerPaint);\nconst viewRunnerRelease = viewRunner.indexOf("navigation?.end?.(navigationToken)", viewRunnerLoad);\ninvariant(\n  viewRunnerNavigation >= 0\n    && viewRunnerCancel > viewRunnerNavigation\n    && viewRunnerStage > viewRunnerCancel\n    && viewRunnerPaint > viewRunnerStage\n    && viewRunnerLoad > viewRunnerPaint\n    && viewRunnerRelease > viewRunnerLoad,\n  "The global view transition runner must abort obsolete route data before staging the new view, then own navigation state through paint and its loader callback.",\n);`,
            `const viewRunnerNavigation = viewRunner.indexOf('navigation.begin("view-transition")');\nconst viewRunnerLoadingController = viewRunner.indexOf('Reflect.get(window, "__mflInteractionBusy")', viewRunnerNavigation);\nconst viewRunnerRefreshGuard = viewRunner.indexOf('!document.documentElement.classList.contains("mflInitialRouteResolved")', viewRunnerLoadingController);\nconst viewRunnerLoadingBegin = viewRunner.indexOf("loadingController.begin(loadingController.reason)", viewRunnerRefreshGuard);\nconst viewRunnerCancel = viewRunner.indexOf("window.__mflCancelIncrementalRouteRequest?.();", viewRunnerLoadingBegin);\nconst viewRunnerStage = viewRunner.indexOf("stageViewTransition(pageName, viewName, options)");\nconst viewRunnerPaint = viewRunner.indexOf("await waitForViewTransitionPaint();", viewRunnerStage);\nconst viewRunnerLoad = viewRunner.indexOf('typeof loader === "function"', viewRunnerPaint);\nconst viewRunnerLoaderCall = viewRunner.indexOf("return await loader(transition);", viewRunnerLoad);\nconst viewRunnerPendingCleanup = viewRunner.indexOf("if (pendingViewTransition === transition) pendingViewTransition = null;", viewRunnerLoaderCall);\nconst viewRunnerLoadingRelease = viewRunner.indexOf("loadingController?.end?.(refreshLoadingToken)", viewRunnerPendingCleanup);\nconst viewRunnerRelease = viewRunner.indexOf("navigation?.end?.(navigationToken)", viewRunnerLoadingRelease);\ninvariant(\n  viewRunnerNavigation >= 0\n    && viewRunnerLoadingController > viewRunnerNavigation\n    && viewRunnerRefreshGuard > viewRunnerLoadingController\n    && viewRunnerLoadingBegin > viewRunnerRefreshGuard\n    && viewRunnerCancel > viewRunnerLoadingBegin\n    && viewRunnerStage > viewRunnerCancel\n    && viewRunnerPaint > viewRunnerStage\n    && viewRunnerLoad > viewRunnerPaint\n    && viewRunnerLoaderCall > viewRunnerLoad\n    && viewRunnerPendingCleanup > viewRunnerLoaderCall\n    && viewRunnerLoadingRelease > viewRunnerPendingCleanup\n    && viewRunnerRelease > viewRunnerLoadingRelease,\n  "Refresh-time view navigation must acquire its own route-loading owner before staging the destination, retain staged ownership through its loader, then release loading and navigation after the destination settles.",\n);`,
            'generated view transition validator loading lifetime',
          );

          replaceExact(
            'site/validate-generated-view-transition.mjs',
            `  ["await runViewTransition(pageName, viewName", "await setView(viewName);", "shared table view"],`,
            `  ["void runViewTransition(pageName, viewName", "await setView(viewName);", "shared table view"],`,
            'generated shared view activation marker',
          );

          replaceExact(
            'site/validate-generated-view-transition.mjs',
            `invariant(\n  !activation.includes('setPage("mflstats"'),\n  "MFL Stats view activation must stay on the canonical MFL page/view navigation path.",\n);`,
            `invariant(\n  !activation.includes('setPage("mflstats"'),\n  "MFL Stats view activation must stay on the canonical MFL page/view navigation path.",\n);\ninvariant(\n  activation.includes('void runViewTransition(pageName, viewName, {')\n    && activation.includes('}, async () => {\\n    await setView(viewName);\\n  });'),\n  "Shared table view clicks must keep one transition open through destination loading instead of releasing navigation before setView begins.",\n);`,
            'generated shared view loader validation',
          );
          NODE

          node site/build-app-core.mjs
          node --check site/bootstrap-core.js
          node --check site/modules/app-core.js
          node --check site/modules/app-core-runtime.js
          node site/validate-loading-ownership.mjs
          node site/validate-bootstrap-ownership.mjs
          node site/validate-generated-view-transition.mjs
          node site/validate-app-core-startup-handshake.mjs
          git diff --check

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/bootstrap-core.js site/modules/app-core.js site/modules/app-core-runtime.js site/modules/app-core-*-runtime.js site/validate-loading-ownership.mjs site/validate-bootstrap-ownership.mjs site/validate-generated-view-transition.mjs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: keep refresh navigation loading destination-owned"
          git push origin HEAD:fix/refresh-navigation-authority

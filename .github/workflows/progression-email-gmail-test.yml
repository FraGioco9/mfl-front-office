name: Progression email Gmail test

on:
  workflow_dispatch:
    inputs:
      recipient:
        description: Email address that receives the single test message
        required: true
        type: string
      fixture:
        description: Deterministic test layout or database-driven players
        required: true
        default: database
        type: choice
        options:
          - database
          - showcase
      player_ids:
        description: Comma-separated player IDs for database mode (max 10)
        required: false
        type: string
      theme:
        description: Email theme to test
        required: true
        default: dark
        type: choice
        options:
          - dark
          - light

permissions:
  contents: read
  actions: read

jobs:
  send-gmail-test:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TEST_RECIPIENT: ${{ inputs.recipient }}
      CONFIGURED_FIXTURE: ${{ inputs.fixture }}
      CONFIGURED_PLAYER_IDS: ${{ inputs.player_ids }}
      CONFIGURED_THEME: ${{ inputs.theme }}

    steps:
      - name: Check out email renderer
        uses: actions/checkout@v7

      - name: Resolve test configuration
        shell: bash
        run: bash "$GITHUB_WORKSPACE/scripts/workflows/progression-email-gmail-test-resolve-test-configuration.sh"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download latest database artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash "$GITHUB_WORKSPACE/scripts/workflows/progression-email-gmail-test-download-latest-database-artifact.sh"

      - name: Resolve test players
        id: players
        shell: bash
        run: bash "$GITHUB_WORKSPACE/scripts/workflows/progression-email-gmail-test-resolve-test-players.sh"

      - name: Install portrait renderer dependencies
        run: npm ci --no-audit --no-fund

      - name: Render test portraits
        run: >-
          node scripts/email/render-progression-test-portraits.mjs
          progression-email-test-portraits
          "${{ steps.players.outputs.player_ids }}"

      - name: Send one Gmail test email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_REPLY_TO: ${{ secrets.EMAIL_REPLY_TO }}
          EMAIL_BASE_URL: https://mfl-front-office.vercel.app
          TEST_PLAYER_IDS: ${{ steps.players.outputs.player_ids }}
        run: >-
          python -m scripts.email.progression_email_gmail_test
          --current-db mfl_database.db
          --portrait-dir progression-email-test-portraits
          --recipient "$TEST_RECIPIENT"
          --player-ids "$TEST_PLAYER_IDS"
          --theme "$TEST_THEME"
          --fixture "$TEST_FIXTURE"

name: One-time MFL Flow batch fix

on:
  push:
    branches: [main]
    paths:
      - .github/fix-mfl-batch-trigger

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep MFL Flow batches at 1000
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('run_flow_rebuild.py')
          text = path.read_text(encoding='utf-8')
          old = 'flow_module.MFL_FLOW_STATIC_PLAYER_BATCH_SIZE = FLOW_BATCH_SIZE'
          new = 'flow_module.MFL_FLOW_STATIC_PLAYER_BATCH_SIZE = 1000'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one MFL batch override, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile run_flow_rebuild.py rebuild_database.py populate_seasons_from_flow.py
      - name: Commit fix and remove temporary files
        run: |
          rm -f .github/fix-mfl-batch-trigger
          rm -f .github/workflows/one-time-fix-mfl-flow-batch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add run_flow_rebuild.py .github/fix-mfl-batch-trigger .github/workflows/one-time-fix-mfl-flow-batch.yml
          git commit -m "Keep MFL Flow batches at 1000"
          git push

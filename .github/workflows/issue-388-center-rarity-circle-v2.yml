name: Issue 388 center rarity circle v2

on:
  push:
    branches:
      - fix/issue-388-overall-rarity-circle

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-388-overall-rarity-circle

      - name: Apply vertical centering fix
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path("site/modules/app-core.js")
          text = app.read_text(encoding="utf-8")
          old = (
              '  if (statColumn === "overall") {\n'
              '    const rarityCircle = document.createElement("span");\n'
              '    rarityCircle.className = "tableOverallRarityCircle";\n'
              '    rarityCircle.style.setProperty("--mfl-overall-rarity-color", rarityColorForOverall(value));\n'
              '    rarityCircle.setAttribute("aria-hidden", "true");\n'
              '    cell.appendChild(rarityCircle);\n'
              '  }\n\n'
              '  cell.append(String(value));\n'
          )
          new = (
              '  const contentHost = statColumn === "overall" ? document.createElement("span") : cell;\n\n'
              '  if (statColumn === "overall") {\n'
              '    contentHost.className = "tableOverallCellContent";\n'
              '    const rarityCircle = document.createElement("span");\n'
              '    rarityCircle.className = "tableOverallRarityCircle";\n'
              '    rarityCircle.style.setProperty("--mfl-overall-rarity-color", rarityColorForOverall(value));\n'
              '    rarityCircle.setAttribute("aria-hidden", "true");\n'
              '    contentHost.appendChild(rarityCircle);\n'
              '    cell.appendChild(contentHost);\n'
              '  }\n\n'
              '  contentHost.append(String(value));\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f"Overall renderer anchor count: {text.count(old)}")
          text = text.replace(old, new, 1)
          old_progress = '  cell.appendChild(progressionElement);\n}\n\nfunction tableInteractiveKey('
          new_progress = '  contentHost.appendChild(progressionElement);\n}\n\nfunction tableInteractiveKey('
          if text.count(old_progress) != 1:
              raise SystemExit(f"Progression renderer anchor count: {text.count(old_progress)}")
          app.write_text(text.replace(old_progress, new_progress, 1), encoding="utf-8")

          styles = Path("site/styles.css")
          css = styles.read_text(encoding="utf-8")
          old_css = (
              '#progressionPage #tableBody .tableOverallRarityCircle {\n'
              '  display: inline-block;\n'
              '  width: 8px;\n'
              '  min-width: 8px;\n'
              '  height: 8px;\n'
              '  margin-right: 4px;\n'
              '  border-radius: 50%;\n'
              '  background: var(--mfl-overall-rarity-color, var(--text-muted));\n'
              '  vertical-align: middle;\n'
              '}\n'
          )
          new_css = (
              '#progressionPage #tableBody .tableOverallCellContent {\n'
              '  display: inline-flex;\n'
              '  align-items: center;\n'
              '  height: var(--mfl-table-row-height);\n'
              '  min-height: var(--mfl-table-row-height);\n'
              '}\n\n'
              '#progressionPage #tableBody .tableOverallRarityCircle {\n'
              '  flex: 0 0 8px;\n'
              '  width: 8px;\n'
              '  height: 8px;\n'
              '  margin-right: 4px;\n'
              '  border-radius: 50%;\n'
              '  background: var(--mfl-overall-rarity-color, var(--text-muted));\n'
              '}\n'
          )
          if css.count(old_css) != 1:
              raise SystemExit(f"Rarity CSS anchor count: {css.count(old_css)}")
          styles.write_text(css.replace(old_css, new_css, 1), encoding="utf-8")

          validator = Path("site/validate-table-column-layout.mjs")
          checks = validator.read_text(encoding="utf-8")
          checks = checks.replace(
              'appendStatValueSource.includes(\'rarityCircle.className = "tableOverallRarityCircle";\')\n'
              '    && appendStatValueSource.includes(\'rarityColorForOverall(value)\')\n'
              '    && appendStatValueSource.includes(\'cell.appendChild(rarityCircle);\'),\n'
              '  "Every non-Next table Overall must prepend one circle using the canonical rarity colour mapping.",',
              'appendStatValueSource.includes(\'contentHost.className = "tableOverallCellContent";\')\n'
              '    && appendStatValueSource.includes(\'rarityCircle.className = "tableOverallRarityCircle";\')\n'
              '    && appendStatValueSource.includes(\'rarityColorForOverall(value)\')\n'
              '    && appendStatValueSource.includes(\'contentHost.appendChild(rarityCircle);\')\n'
              '    && appendStatValueSource.includes(\'cell.appendChild(contentHost);\')\n'
              '    && appendStatValueSource.includes(\'contentHost.appendChild(progressionElement);\'),\n'
              '  "Every non-Next table Overall must use one vertically centered content host with the canonical rarity circle and progression.",',
              1,
          )
          old_validation = (
              '  styles.includes("#progressionPage #tableBody .tableOverallRarityCircle {")\n'
              '    && styles.includes("width: 8px;")\n'
              '    && styles.includes("min-width: 8px;")\n'
              '    && styles.includes("height: 8px;")\n'
              '    && styles.includes("background: var(--mfl-overall-rarity-color, var(--text-muted));")\n'
              '    && styles.includes("vertical-align: middle;"),\n'
              '  "Overall rarity circles must be exactly 8x8px, vertically centered, and use a neutral CSS fallback.",'
          )
          new_validation = (
              '  styles.includes("#progressionPage #tableBody .tableOverallCellContent {")\n'
              '    && styles.includes("display: inline-flex;")\n'
              '    && styles.includes("align-items: center;")\n'
              '    && styles.includes("height: var(--mfl-table-row-height);")\n'
              '    && styles.includes("#progressionPage #tableBody .tableOverallRarityCircle {")\n'
              '    && styles.includes("flex: 0 0 8px;")\n'
              '    && styles.includes("width: 8px;")\n'
              '    && styles.includes("height: 8px;")\n'
              '    && styles.includes("background: var(--mfl-overall-rarity-color, var(--text-muted));"),\n'
              '  "Overall rarity circles must be exactly 8x8px and centered by a row-height inline-flex content host.",'
          )
          if old_validation not in checks:
              raise SystemExit("Rarity validation CSS anchor missing")
          validator.write_text(checks.replace(old_validation, new_validation, 1), encoding="utf-8")
          PY

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: site
        run: npm install --no-audit --no-fund

      - name: Build and validate
        working-directory: site
        run: |
          npm run build:core
          npm run lint
          npm run typecheck
          npm run validate

      - name: Commit and remove temporary runners
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f site/package-lock.json
          git rm .github/workflows/issue-388-center-rarity-circle.yml .github/workflows/issue-388-center-rarity-circle-v2.yml
          git add site/modules/app-core.js site/modules/app-core-runtime.js site/modules/app-core-table-runtime.js site/styles.css site/validate-table-column-layout.mjs
          git commit -m "Center Overall rarity circles vertically"

      - name: Verify generated parity
        working-directory: site
        run: npm run verify:generated

      - name: Push changes
        run: git push origin HEAD:fix/issue-388-overall-rarity-circle

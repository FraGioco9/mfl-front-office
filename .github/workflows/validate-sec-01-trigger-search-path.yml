name: SEC-01 trigger search_path regression

on:
  pull_request:
    paths:
      - supabase-schema.sql
      - supabase/migrations/20261001131500_pin_updated_at_trigger_search_path.sql
      - .github/workflows/validate-sec-01-trigger-search-path.yml

permissions:
  contents: read

jobs:
  postgres-trigger-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Test canonical function and migration on an isolated Postgres database
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          sed -n '/^create or replace function public.set_updated_at()/,/^\$\$;/p' supabase-schema.sql > /tmp/sec-01-trigger-function.sql
          grep -F "set search_path = ''" /tmp/sec-01-trigger-function.sql
          psql -X -v ON_ERROR_STOP=1 -f /tmp/sec-01-trigger-function.sql
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          do $verify$
          begin
            if not exists (
              select 1 from pg_proc
              where oid = 'public.set_updated_at()'::regprocedure
                and coalesce(array_to_string(proconfig, ','), '') like 'search_path=%'
            ) then
              raise exception 'Canonical trigger function has no pinned search_path';
            end if;
          end;
          $verify$;

          -- Simulate an existing production function, then apply the versioned migration.
          alter function public.set_updated_at() reset search_path;
          \i supabase/migrations/20261001131500_pin_updated_at_trigger_search_path.sql
          do $verify$
          begin
            if not exists (
              select 1 from pg_proc
              where oid = 'public.set_updated_at()'::regprocedure
                and coalesce(array_to_string(proconfig, ','), '') like 'search_path=%'
            ) then
              raise exception 'Migration did not pin the trigger search_path';
            end if;
          end;
          $verify$;

          create temporary table sec_01_timestamp_test (id integer primary key, updated_at timestamptz);
          create trigger sec_01_updated_at before update on sec_01_timestamp_test
            for each row execute function public.set_updated_at();
          insert into sec_01_timestamp_test (id, updated_at) values (1, '2000-01-01T00:00:00Z');
          update sec_01_timestamp_test set updated_at = '2001-01-01T00:00:00Z' where id = 1;
          do $verify$
          begin
            if (select updated_at from sec_01_timestamp_test where id = 1)
                is distinct from transaction_timestamp() then
              raise exception 'Trigger did not assign the current timestamp';
            end if;
          end;
          $verify$;
          SQL

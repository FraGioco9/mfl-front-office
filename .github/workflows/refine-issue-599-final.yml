name: Finalize PR 616 responsive table proportions

on:
  push:
    branches:
      - fix/599-responsive-table-proportions
    paths:
      - .github/workflows/refine-issue-599-final.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-pr-616
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: fix/599-responsive-table-proportions

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Apply final responsive table fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              file = Path(path)
              source = file.read_text(encoding="utf-8")
              if source.count(old) != 1:
                  raise SystemExit(f"{path}: expected exactly one match for replacement")
              file.write_text(source.replace(old, new), encoding="utf-8")

          shared = Path("site/shared-table-ui-runtime.js")
          source = shared.read_text(encoding="utf-8")
          source = source.replace(
              """  #progressionPage {
              --mfl-table-header-height: 18.72596153846154px;
              --mfl-table-row-height: 16.754807692307693px;
              --mfl-table-row-outer-height: 19.21875px;
            }""",
              """  #progressionPage {
              --mfl-table-header-height: max(18.72596153846154px, calc(2.2836538461538463vw - 0.5480769230769231px));
              --mfl-table-row-height: max(16.754807692307693px, calc(2.043269230769231vw - 0.49038461538461536px));
              --mfl-table-row-outer-height: max(19.21875px, calc(2.34375vw - 0.5625px));
            }""",
              1,
          )
          function_pattern = re.compile(r"  function syncMobileColumnWidths\(\) \{.*?^  \}\n", re.MULTILINE | re.DOTALL)
          replacement = """  function syncMobileColumnWidths() {
            const page = document.getElementById(\"progressionPage\");
            if (!(page instanceof HTMLElement)) return;
            page.style.removeProperty(\"--mfl-table-col-listing\");
            page.style.removeProperty(\"--mfl-table-col-name\");
            page.style.removeProperty(\"--mfl-table-col-contract-render-name\");
            page.style.removeProperty(\"--mfl-table-col-positions\");
          }
          """
          source, count = function_pattern.subn(replacement, source, count=1)
          if count != 1:
              raise SystemExit("shared-table-ui-runtime.js: syncMobileColumnWidths replacement failed")
          shared.write_text(source, encoding="utf-8")

          replace_once(
              "site/sync-release-projections.mjs",
              '    "  #progressionPage { --mfl-table-header-height: 18.72596153846154px; --mfl-table-row-height: 16.754807692307693px; --mfl-table-row-outer-height: 19.21875px; }",',
              '    "  #progressionPage { --mfl-table-header-height: max(18.72596153846154px, calc(2.2836538461538463vw - 0.5480769230769231px)); --mfl-table-row-height: max(16.754807692307693px, calc(2.043269230769231vw - 0.49038461538461536px)); --mfl-table-row-outer-height: max(19.21875px, calc(2.34375vw - 0.5625px)); }",',
          )

          compact = Path("site/validate-mobile-table-compact-contract.mjs")
          compact_source = compact.read_text(encoding="utf-8")
          compact_source, count = re.subn(
              r'/@media \\(max-width: 900px\\) \\\{\[\\s\\S\]\*--mfl-table-header-height: 18\.72596153846154px;\[\\s\\S\]\*--mfl-table-row-height: 16\.754807692307693px;\[\\s\\S\]\*--mfl-table-row-outer-height: 19\.21875px;/',
              r'/@media \\(max-width: 900px\\) \\{[\\s\\S]*--mfl-table-header-height: max\\(18\\.72596153846154px, calc\\(2\\.2836538461538463vw - 0\\.5480769230769231px\\)\\);[\\s\\S]*--mfl-table-row-height: max\\(16\\.754807692307693px, calc\\(2\\.043269230769231vw - 0\\.49038461538461536px\\)\\);[\\s\\S]*--mfl-table-row-outer-height: max\\(19\\.21875px, calc\\(2\\.34375vw - 0\\.5625px\\)\\);/',
              compact_source,
              count=1,
          )
          if count != 1:
              old = '/@media \\(max-width: 900px\\) \\{[\\s\\S]*--mfl-table-header-height: 18.72596153846154px;[\\s\\S]*--mfl-table-row-height: 16.754807692307693px;[\\s\\S]*--mfl-table-row-outer-height: 19.21875px;/'
              new = '/@media \\(max-width: 900px\\) \\{[\\s\\S]*--mfl-table-header-height: max\\(18\\.72596153846154px, calc\\(2\\.2836538461538463vw - 0\\.5480769230769231px\\)\\);[\\s\\S]*--mfl-table-row-height: max\\(16\\.754807692307693px, calc\\(2\\.043269230769231vw - 0\\.49038461538461536px\\)\\);[\\s\\S]*--mfl-table-row-outer-height: max\\(19\\.21875px, calc\\(2\\.34375vw - 0\\.5625px\\)\\);/'
              if old not in compact_source:
                  raise SystemExit("validate-mobile-table-compact-contract.mjs: tablet regex not found")
              compact_source = compact_source.replace(old, new, 1)
          old_projection = '/@media \\(max-width: 900px\\)[\\s\\S]*--mfl-table-header-height: 18.72596153846154px; --mfl-table-row-height: 16.754807692307693px; --mfl-table-row-outer-height: 19.21875px;/'
          new_projection = '/@media \\(max-width: 900px\\)[\\s\\S]*--mfl-table-header-height: max\\(18\\.72596153846154px, calc\\(2\\.2836538461538463vw - 0\\.5480769230769231px\\)\\); --mfl-table-row-height: max\\(16\\.754807692307693px, calc\\(2\\.043269230769231vw - 0\\.49038461538461536px\\)\\); --mfl-table-row-outer-height: max\\(19\\.21875px, calc\\(2\\.34375vw - 0\\.5625px\\)\\);/'
          if old_projection not in compact_source:
              raise SystemExit("validate-mobile-table-compact-contract.mjs: first-paint tablet assertion not found")
          compact_source = compact_source.replace(old_projection, new_projection, 1)
          compact.write_text(compact_source, encoding="utf-8")

          retry = Path("site/validate-mobile-table-retry.mjs")
          retry_source = retry.read_text(encoding="utf-8")
          retry_source = retry_source.replace(
              'includes(sharedUi, "--mfl-table-header-height: 18.72596153846154px;", "Mobile header height must stay canonical.");',
              'includes(sharedUi, "--mfl-table-header-height: max(18.72596153846154px, calc(2.2836538461538463vw - 0.5480769230769231px));", "Tablet header height must track rendered table width.");',
              1,
          ).replace(
              'includes(sharedUi, "--mfl-table-row-height: 16.754807692307693px;", "Mobile row content height must stay canonical.");',
              'includes(sharedUi, "--mfl-table-row-height: max(16.754807692307693px, calc(2.043269230769231vw - 0.49038461538461536px));", "Tablet row content height must track rendered table width.");',
              1,
          )
          marker = 'excludes(sharedUi, "MutationObserver", "Mobile table presentation must remain render/resize driven.");'
          if marker not in retry_source:
              raise SystemExit("validate-mobile-table-retry.mjs: insertion marker not found")
          retry_source = retry_source.replace(
              marker,
              marker + '\nexcludes(sharedUi, \'style.setProperty("--mfl-table-col-listing"\', "Hydration must not rebalance the canonical Listing column.");\nexcludes(sharedUi, \'style.setProperty("--mfl-table-col-positions"\', "Hydration must not rebalance the canonical Positions column.");',
              1,
          )
          retry.write_text(retry_source, encoding="utf-8")
          PY

          cat > site/validate-responsive-table-proportions.mjs <<'EOF'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import { dirname, resolve } from "node:path";
          import { fileURLToPath } from "node:url";

          const root = dirname(fileURLToPath(import.meta.url));
          const read = (name) => readFileSync(resolve(root, name), "utf8");
          const styles = read("styles.css");
          const shared = read("shared-table-ui-runtime.js");
          const projection = read("sync-release-projections.mjs");
          const index = read("index.html");
          const desktop = Object.freeze({ width: 1664, header: 38, row: 34, outer: 39 });
          const close = (actual, expected, tolerance = 1e-12) => Math.abs(actual - expected) <= tolerance;
          const tablet = Object.freeze({ width: 820, inset: 24, header: 18.72596153846154, row: 16.754807692307693, outer: 19.21875 });
          const fixed = Object.freeze([
            Object.freeze({ breakpoint: 520, width: 680, header: 15.528846153846153, row: 13.89423076923077, outer: 15.9375, control: 13 }),
            Object.freeze({ breakpoint: 380, width: 600, header: 13.701923076923077, row: 12.259615384615385, outer: 14.0625, control: 12 }),
          ]);
          const sources = Object.freeze([["hydrated", shared], ["first-paint generator", projection], ["generated first-paint", index]]);
          const tabletDeclarations = Object.freeze([
            "--mfl-table-header-height: max(18.72596153846154px, calc(2.2836538461538463vw - 0.5480769230769231px));",
            "--mfl-table-row-height: max(16.754807692307693px, calc(2.043269230769231vw - 0.49038461538461536px));",
            "--mfl-table-row-outer-height: max(19.21875px, calc(2.34375vw - 0.5625px));",
          ]);

          assert.match(styles, /--mfl-table-header-height: 38px;/);
          assert.match(styles, /--mfl-table-row-height: 34px;/);
          assert.match(styles, /--mfl-table-row-outer-height: 39px;/);
          assert.match(styles, /--mfl-table-col-listing: 6\.3904569176696135%;/);
          assert.match(styles, /--mfl-table-col-positions: 7\.508786878261796%;/);

          const tabletScale = tablet.width / desktop.width;
          assert.ok(close(tablet.header / desktop.header, tabletScale));
          assert.ok(close(tablet.row / desktop.row, tabletScale));
          assert.ok(close(tablet.outer / desktop.outer, tabletScale));
          for (const [name, source] of sources) {
            for (const declaration of tabletDeclarations) assert.ok(source.includes(declaration), `${name} missing width-aware tablet geometry: ${declaration}`);
            assert.ok(source.includes("min-width: 820px;"), `${name} missing tablet minimum table width.`);
          }

          const viewport = 900;
          const renderedWidth = viewport - tablet.inset;
          const renderedScale = renderedWidth / desktop.width;
          assert.ok(close((2.2836538461538463 * viewport / 100) - 0.5480769230769231, desktop.header * renderedScale));
          assert.ok(close((2.043269230769231 * viewport / 100) - 0.49038461538461536, desktop.row * renderedScale));
          assert.ok(close((2.34375 * viewport / 100) - 0.5625, desktop.outer * renderedScale));

          for (const geometry of fixed) {
            const scale = geometry.width / desktop.width;
            assert.ok(close(geometry.header / desktop.header, scale), `<=${geometry.breakpoint}px header/table scale mismatch.`);
            assert.ok(close(geometry.row / desktop.row, scale), `<=${geometry.breakpoint}px cell/table scale mismatch.`);
            assert.ok(close(geometry.outer / desktop.outer, scale), `<=${geometry.breakpoint}px outer-row/table scale mismatch.`);
            assert.ok(geometry.control <= geometry.row, `<=${geometry.breakpoint}px fixed controls must fit within row content.`);
            for (const [name, source] of sources) {
              assert.ok(source.includes(`--mfl-table-header-height: ${geometry.header}px;`), `${name} missing <=${geometry.breakpoint}px header.`);
              assert.ok(source.includes(`--mfl-table-row-height: ${geometry.row}px;`), `${name} missing <=${geometry.breakpoint}px row.`);
              assert.ok(source.includes(`--mfl-table-row-outer-height: ${geometry.outer}px;`), `${name} missing <=${geometry.breakpoint}px outer row.`);
              assert.ok(source.includes(`min-width: ${geometry.width}px;`), `${name} missing <=${geometry.breakpoint}px table width.`);
            }
          }

          assert.doesNotMatch(shared, /--mfl-table-col-(?:listing|positions)\s*:/, "Hydrated mobile CSS must not alter desktop column percentages.");
          assert.doesNotMatch(shared, /style\.setProperty\("--mfl-table-col-(?:listing|positions)"/, "Hydration must not rebalance canonical Listing or Positions percentages.");
          assert.doesNotMatch(projection, /--mfl-table-col-(?:listing|positions)\s*:/, "First-paint projection must not alter desktop column percentages.");
          assert.doesNotMatch(index, /--mfl-table-col-listing:\s*(?:4\.2|3\.8|3\.6)%|--mfl-table-col-positions:\s*(?:9\.699243795931409|10\.099243795931411|10\.29924379593141)%/);
          assert.match(shared, /overflow-x: auto;\n {4}overflow-y: hidden;/);
          assert.match(styles, /#progressionPage \.playerTableScroller col\.col-name \{ width: var\(--mfl-table-col-name\); \}/);
          assert.match(styles, /#progressionPage \.playerTableScroller th \{\n {2}height: var\(--mfl-table-header-height\);/);
          assert.match(styles, /#progressionPage \.playerTableScroller td \{\n {2}height: var\(--mfl-table-row-height\);/);
          assert.doesNotMatch(shared, /!important/);
          console.log("Responsive player-table dimensions preserve desktop proportions across first paint and hydration.");
          EOF

          node site/sync-release-projections.mjs

      - name: Install and validate site
        working-directory: site
        run: |
          npm install --no-audit --no-fund
          npm run check

      - name: Commit final implementation and remove scaffolding
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/refine-issue-599-v11.yml .github/workflows/refine-issue-599-final.yml
          git diff --check
          git add -A -- .github/workflows/refine-issue-599-v11.yml .github/workflows/refine-issue-599-final.yml site/shared-table-ui-runtime.js site/sync-release-projections.mjs site/index.html site/validate-responsive-table-proportions.mjs site/validate-mobile-table-compact-contract.mjs site/validate-mobile-table-retry.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Finalize responsive table proportions"
          git push origin HEAD:fix/599-responsive-table-proportions

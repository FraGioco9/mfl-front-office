name: PERF-05C pinned SQL deep-page A/B (temporary)

# One-off profiling only; remove before merging. No DB refresh, no deploy.
on:
  pull_request:
    paths:
      - ".github/workflows/perf05c-deep-page-ab.yml"
      - "scripts/performance/perf05c-*.cjs"

permissions:
  contents: read
  actions: read

jobs:
  deep-page-ab:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Read pinned full snapshot from validated refresh (no writes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 37113407333 --repo "$GITHUB_REPOSITORY" --name mfl_database --dir .
          test -s mfl_database.db
          sha256sum mfl_database.db
          node <<'NODE'
          const {DatabaseSync}=require('node:sqlite');
          const db=new DatabaseSync('mfl_database.db',{readOnly:true});
          const players=db.prepare('SELECT count(*) AS n FROM players').get().n;
          const meta=Object.fromEntries(db.prepare("SELECT key,value FROM runtime_metadata WHERE key IN ('row_count','wallet_count','generated_at')").all().map(x=>[x.key,x.value]));
          console.log(JSON.stringify({players,metadata:meta}));
          if(players!==387258||Number(meta.wallet_count)!==7866)process.exitCode=1;
          db.close();
          NODE
      - name: Test trusted ORDER BY inversion and pagination on small fixture
        run: |
          set -euo pipefail
          node scripts/ci/create-next-sqlite-smoke-fixture.cjs /tmp/perf05c-smoke.db
          MFL_DATABASE_PATH=/tmp/perf05c-smoke.db PERF05C_REPETITIONS=1 node scripts/performance/perf05c-deep-page-ab.cjs > /tmp/perf05c-smoke-report.json
          node -e 'const r=require("/tmp/perf05c-smoke-report.json");if(r.cases.length<12||!r.cases.every(x=>x.identicalResults))process.exit(1);console.log("Offline tiny fixture validated " + r.cases.length + " sorted/filter cases")'
      - name: Same-runner paired deep-page A-B-B-A timings and EXPLAIN
        env:
          MFL_DATABASE_PATH: mfl_database.db
          PERF05C_REPETITIONS: "3"
        run: |
          set -euo pipefail
          export PERF05C_SOURCE_SHA="$GITHUB_SHA"
          node scripts/performance/perf05c-deep-page-ab.cjs > perf05c-deep-page-ab.json
          node <<'NODE'
          const r=require('./perf05c-deep-page-ab.json');
          if(r.rowCount!==387258||r.cases.length<13||!r.cases.every(x=>x.identicalResults))process.exit(1);
          for(const x of r.cases)console.log(JSON.stringify({name:x.scenario,page:x.page,pages:x.totalPages,total:x.totalRows,offset:x.originalOffset,reverse:x.reverseOffset,A:x.latencyMs.A,B:x.latencyMs.B,ratio:x.latencyMs.ratio,plans:x.plan}));
          NODE
      - name: Archive sanitized plans/timings only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf05c-same-runner-reverse-tail-${{ github.run_id }}
          path: perf05c-deep-page-ab.json
          if-no-files-found: warn
          retention-days: 90

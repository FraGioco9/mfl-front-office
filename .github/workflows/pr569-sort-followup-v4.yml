name: PR 569 sorting follow-up v4

on:
  push:
    branches:
      - fix/page-scoped-default-sorting
    paths:
      - .github/workflows/pr569-sort-followup-v4.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/page-scoped-default-sorting
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Patch sorting semantics and loading header
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Install site dependencies
        working-directory: site
        run: npm ci
      - name: Rebuild generated runtime chunks
        working-directory: site
        run: npm run build:core
      - name: Run dedicated sorting regression
        working-directory: site
        run: node validate-table-sort-session.mjs
      - name: Stage generated contract
        run: git add site/modules/app-core.js site/modules/app-core-runtime.js site/modules/app-core-table-runtime.js site/api/_data-page.js site/validate-table-sort-session.mjs
      - name: Run full site checks
        working-directory: site
        run: npm run check
      - name: Commit fix and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/pr569-sort-followup-v3.yml .github/workflows/pr569-sort-followup-v4.yml
          git add -A
          git commit -m "Fix sorting semantics and loading arrows"
          git push origin HEAD:fix/page-scoped-default-sorting

name: PR 569 sorting follow-up v4

on:
  push:
    branches:
      - fix/page-scoped-default-sorting
    paths:
      - .github/workflows/pr569-sort-followup-v4.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/page-scoped-default-sorting
          fetch-depth: 0
      - name: Inspect sorting paths
        run: |
          grep -n -A 18 -B 4 'tableNextOverallPreciseValue(a)' site/modules/app-core.js || true
          grep -n -A 12 -B 4 'state.view === "next" && statColumns.includes(column)' site/modules/app-core.js || true
          grep -n -A 14 -B 3 'function tableSortStateForView' site/modules/app-core.js || true
          grep -n -A 12 -B 4 'const staticRoutePending = staticHeader' site/modules/app-core.js || true
          grep -n -A 10 -B 4 '__mflCancelIncrementalRouteRequest' site/modules/app-core.js | tail -n 40 || true
          grep -n -A 8 -B 3 '\["current", "all"\].*STAT_COLUMNS' site/api/_data-page.js || true

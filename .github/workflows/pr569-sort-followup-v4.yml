name: PR 569 sorting follow-up v4

on:
  push:
    branches:
      - fix/page-scoped-default-sorting
    paths:
      - .github/workflows/pr569-sort-followup-v4.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/page-scoped-default-sorting
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Patch sorting semantics and loading header
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Missing target: {label}")
              return text.replace(old, new, 1)

          core_path = Path("site/modules/app-core.js")
          core = core_path.read_text()

          old = '  return normalizedViewSortState(\n    state.tableSortSessionSortState || fallbackSortState,\n    normalizedView,\n    normalizedPageName,\n  );'
          new = '  const sourceSortState = state.tableSortSessionSortState || fallbackSortState;\n  const sourceSortSupported = sortKeySupportedByView(sourceSortState?.sortKey, normalizedView, normalizedPageName);\n  const resolvedSortState = normalizedViewSortState(\n    sourceSortState,\n    normalizedView,\n    normalizedPageName,\n  );\n  if (!sourceSortSupported && state.tableSortSessionKey) {\n    state.tableSortSessionSortState = resolvedSortState;\n  }\n  return resolvedSortState;'
          core = replace_once(core, old, new, "unsupported destination sort reset")

          old = '    return column === "overall"\n      ? tableNextOverallPreciseValue(row)\n      : tableNextOverallSortValue(row, column);'
          new = '    return tableNextOverallSortValue(row, column);'
          core = replace_once(core, old, new, "Next Overall sortable gap")

          old = '    if (state.sortKey === "overall") {\n      return comparePrimitiveValues(\n        tableNextOverallPreciseValue(a),\n        tableNextOverallPreciseValue(b),\n        direction,\n        true,\n      );\n    }\n    return compareNextOverallRows(a, b, state.sortKey, direction);'
          new = '    return compareNextOverallRows(a, b, state.sortKey, direction);'
          core = replace_once(core, old, new, "Next Overall comparator")

          old = '    const staticRoutePending = staticHeader\n      && staticPage\n      && staticView\n      && (currentPage !== staticPage || currentView !== staticView);\n    if (staticRoutePending) return true;\n    if (staticHeader && staticSignature && staticSignature !== signature) return true;'
          new = '    const initialRouteSuperseded = document.documentElement.classList.contains("mflInitialRouteSuperseded");\n    const staticRoutePending = staticHeader\n      && !initialRouteSuperseded\n      && staticPage\n      && staticView\n      && (currentPage !== staticPage || currentView !== staticView);\n    if (staticRoutePending) return true;\n    if (staticHeader && !initialRouteSuperseded && staticSignature && staticSignature !== signature) return true;'
          core = replace_once(core, old, new, "canonical loading header guard")

          old = '        const staticRoutePending = staticHeader\n          && staticPage\n          && staticView\n          && (currentPage !== staticPage || currentView !== staticView);\n        if (staticRoutePending) return undefined;\n        if (staticHeader && staticSignature && staticSignature !== signature) return undefined;'
          new = '        const initialRouteSuperseded = document.documentElement.classList.contains("mflInitialRouteSuperseded");\n        const staticRoutePending = staticHeader\n          && !initialRouteSuperseded\n          && staticPage\n          && staticView\n          && (currentPage !== staticPage || currentView !== staticView);\n        if (staticRoutePending) return undefined;\n        if (staticHeader && !initialRouteSuperseded && staticSignature && staticSignature !== signature) return undefined;'
          core = replace_once(core, old, new, "stable loading header guard")

          old = '    window.__mflCancelIncrementalRouteRequest?.();\n    const transition = stageViewTransition(pageName, viewName, options);\n    if (!transition) return null;\n    document.documentElement.classList.add("mflInitialRouteSuperseded");'
          new = '    window.__mflCancelIncrementalRouteRequest?.();\n    document.documentElement.classList.add("mflInitialRouteSuperseded");\n    const transition = stageViewTransition(pageName, viewName, options);\n    if (!transition) return null;'
          core = replace_once(core, old, new, "view transition header handoff")

          core_path.write_text(core)

          api_path = Path("site/api/_data-page.js")
          api = api_path.read_text()
          old = '    return `${quoteIdentifier(derived)} IS NULL, ${quoteIdentifier(derived)} ${direction}, overall ${direction}, player_id DESC`;'
          new = '    return `${quoteIdentifier(derived)} IS NULL, ${quoteIdentifier(derived)} ${direction}, overall DESC, player_id DESC`;'
          api = replace_once(api, old, new, "Progression API tie-break")
          api_path.write_text(api)
          PY
      - name: Install site dependencies
        working-directory: site
        run: npm ci
      - name: Rebuild generated runtime chunks
        working-directory: site
        run: npm run build:core
      - name: Run dedicated sorting regression
        working-directory: site
        run: node validate-table-sort-session.mjs
      - name: Stage generated contract
        run: git add site/modules/app-core.js site/modules/app-core-runtime.js site/modules/app-core-table-runtime.js site/api/_data-page.js site/validate-table-sort-session.mjs
      - name: Run full site checks
        working-directory: site
        run: npm run check
      - name: Commit fix and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/pr569-sort-followup-v3.yml .github/workflows/pr569-sort-followup-v4.yml
          git add -A
          git commit -m "Fix sorting semantics and loading arrows"
          git push origin HEAD:fix/page-scoped-default-sorting

# Retry after updating the regression marker.

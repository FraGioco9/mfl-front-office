name: PR 569 sort follow-up v4

on:
  push:
    branches:
      - fix/page-scoped-default-sorting
    paths:
      - .github/workflows/pr569-sort-followup-v4.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/page-scoped-default-sorting
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Apply the validated follow-up patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/pr569-sort-followup-v2.yml').read_text().splitlines()
          start = workflow.index('      - name: Patch canonical sort lifecycle')
          run_index = next(i for i in range(start, len(workflow)) if workflow[i] == '        run: |')
          end = next(i for i in range(run_index + 1, len(workflow)) if workflow[i].startswith('      - name:'))
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in workflow[run_index + 1:end]) + '\n'
          Path('/tmp/pr569-patch.sh').write_text(textwrap.dedent(script))
          PY
          bash /tmp/pr569-patch.sh

      - name: Keep sorting inside canonical filter lifecycle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          core_path = Path('site/modules/app-core.js')
          core = core_path.read_text()
          old_click = '        state.page = 1;\n        rememberTableSortStateForView();\n        buildHeader();\n        applyFilters();'
          new_click = '        state.page = 1;\n        buildHeader();\n        applyFilters();'
          if core.count(old_click) != 1:
              raise SystemExit(f'Expected one sort-click persistence block, found {core.count(old_click)}')
          core = core.replace(old_click, new_click, 1)
          apply_anchor = 'function applyFilters(options = {}) {\n'
          if core.count(apply_anchor) != 1:
              raise SystemExit(f'Expected one applyFilters owner, found {core.count(apply_anchor)}')
          core = core.replace(apply_anchor, apply_anchor + '  rememberTableSortStateForView();\n', 1)
          core_path.write_text(core)

          validation_path = Path('site/validate-table-sort-session.mjs')
          validation = validation_path.read_text()
          old_assert = 'assert.match(core, /rememberTableSortStateForView\\(\\);\\s*buildHeader\\(\\);\\s*applyFilters\\(\\);/u, "Header sort clicks must update the transient view sort before repainting.");'
          new_assert = 'assert.match(core, /function applyFilters\\(options = \\{\\}\\) \\{\\s*rememberTableSortStateForView\\(\\);/u, "Canonical filter application must retain the active view sort for the page session.");'
          if validation.count(old_assert) != 1:
              raise SystemExit(f'Expected one obsolete click assertion, found {validation.count(old_assert)}')
          validation_path.write_text(validation.replace(old_assert, new_assert, 1))
          PY

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Rebuild generated runtime chunks
        working-directory: site
        run: npm run build:core

      - name: Validate sort behavior
        working-directory: site
        run: node validate-table-sort-session.mjs

      - name: Stage generated contract
        run: git add site/modules/app-core.js site/modules/app-core-runtime.js site/modules/app-core-table-runtime.js site/validate-table-sort-session.mjs

      - name: Run site checks
        working-directory: site
        run: npm run check

      - name: Commit fix and remove temporary workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr569-sort-followup.yml .github/workflows/pr569-sort-followup-v2.yml .github/workflows/pr569-sort-followup-v3.yml .github/workflows/pr569-sort-followup-v4.yml
          git add site/modules/app-core.js site/modules/app-core-runtime.js site/modules/app-core-table-runtime.js site/validate-table-sort-session.mjs
          git commit -m "Preserve table sorting across view switches"
          git push origin HEAD:fix/page-scoped-default-sorting

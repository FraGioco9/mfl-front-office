name: PR 569 sorting follow-up v4

on:
  push:
    branches:
      - fix/page-scoped-default-sorting
    paths:
      - .github/workflows/pr569-sort-followup-v4.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/page-scoped-default-sorting
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Patch sorting semantics and loading header
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Missing target: {label}")
              return text.replace(old, new, 1)

          core_path = Path("site/modules/app-core.js")
          core = core_path.read_text()

          old = """function tableSortStateForView(
            viewName = state.view,
            pageName = tablePageKey() || state.currentPage || \"progression\",
            fallbackSortState = null,
          ) {
            const normalizedPageName = pageName === \"mflstats\" ? \"mfl\" : String(pageName || \"\");
            const normalizedView = normalizeViewForPage(viewName, normalizedPageName || \"progression\");
            return normalizedViewSortState(
              state.tableSortSessionSortState || fallbackSortState,
              normalizedView,
              normalizedPageName,
            );
          }"""
          old = "\n".join(line[10:] if line.startswith("          ") else line for line in old.splitlines())
          new = """function tableSortStateForView(
            viewName = state.view,
            pageName = tablePageKey() || state.currentPage || \"progression\",
            fallbackSortState = null,
          ) {
            const normalizedPageName = pageName === \"mflstats\" ? \"mfl\" : String(pageName || \"\");
            const normalizedView = normalizeViewForPage(viewName, normalizedPageName || \"progression\");
            const sourceSortState = state.tableSortSessionSortState || fallbackSortState;
            const sourceSortSupported = sortKeySupportedByView(sourceSortState?.sortKey, normalizedView, normalizedPageName);
            const resolvedSortState = normalizedViewSortState(
              sourceSortState,
              normalizedView,
              normalizedPageName,
            );
            if (!sourceSortSupported && state.tableSortSessionKey) {
              state.tableSortSessionSortState = resolvedSortState;
            }
            return resolvedSortState;
          }"""
          new = "\n".join(line[10:] if line.startswith("          ") else line for line in new.splitlines())
          core = replace_once(core, old, new, "unsupported destination sort reset")

          old = """  if (state.view === \"next\" && statColumns.includes(column)) {
            return column === \"overall\"
              ? tableNextOverallPreciseValue(row)
              : tableNextOverallSortValue(row, column);
          }"""
          old = "\n".join(line[10:] if line.startswith("          ") else line for line in old.splitlines())
          new = """  if (state.view === \"next\" && statColumns.includes(column)) {
            return tableNextOverallSortValue(row, column);
          }"""
          new = "\n".join(line[10:] if line.startswith("          ") else line for line in new.splitlines())
          core = replace_once(core, old, new, "Next Overall sortable gap")

          old = """  if (state.view === \"next\" && statColumns.includes(state.sortKey)) {
            if (state.sortKey === \"overall\") {
              return comparePrimitiveValues(
                tableNextOverallPreciseValue(a),
                tableNextOverallPreciseValue(b),
                direction,
                true,
              );
            }
            return compareNextOverallRows(a, b, state.sortKey, direction);
          }"""
          old = "\n".join(line[10:] if line.startswith("          ") else line for line in old.splitlines())
          new = """  if (state.view === \"next\" && statColumns.includes(state.sortKey)) {
            return compareNextOverallRows(a, b, state.sortKey, direction);
          }"""
          new = "\n".join(line[10:] if line.startswith("          ") else line for line in new.splitlines())
          core = replace_once(core, old, new, "Next Overall comparator")

          old = """    const staticRoutePending = staticHeader
              && staticPage
              && staticView
              && (currentPage !== staticPage || currentView !== staticView);
            if (staticRoutePending) return true;
            if (staticHeader && staticSignature && staticSignature !== signature) return true;"""
          old = "\n".join(line[10:] if line.startswith("          ") else line for line in old.splitlines())
          new = """    const initialRouteSuperseded = document.documentElement.classList.contains(\"mflInitialRouteSuperseded\");
            const staticRoutePending = staticHeader
              && !initialRouteSuperseded
              && staticPage
              && staticView
              && (currentPage !== staticPage || currentView !== staticView);
            if (staticRoutePending) return true;
            if (staticHeader && !initialRouteSuperseded && staticSignature && staticSignature !== signature) return true;"""
          new = "\n".join(line[10:] if line.startswith("          ") else line for line in new.splitlines())
          core = replace_once(core, old, new, "canonical loading header guard")

          old = """        const staticRoutePending = staticHeader
                  && staticPage
                  && staticView
                  && (currentPage !== staticPage || currentView !== staticView);
                if (staticRoutePending) return undefined;
                if (staticHeader && staticSignature && staticSignature !== signature) return undefined;"""
          old = "\n".join(line[10:] if line.startswith("          ") else line for line in old.splitlines())
          new = """        const initialRouteSuperseded = document.documentElement.classList.contains(\"mflInitialRouteSuperseded\");
                const staticRoutePending = staticHeader
                  && !initialRouteSuperseded
                  && staticPage
                  && staticView
                  && (currentPage !== staticPage || currentView !== staticView);
                if (staticRoutePending) return undefined;
                if (staticHeader && !initialRouteSuperseded && staticSignature && staticSignature !== signature) return undefined;"""
          new = "\n".join(line[10:] if line.startswith("          ") else line for line in new.splitlines())
          core = replace_once(core, old, new, "stable loading header guard")

          old = """    window.__mflCancelIncrementalRouteRequest?.();
            const transition = stageViewTransition(pageName, viewName, options);
            if (!transition) return null;
            document.documentElement.classList.add(\"mflInitialRouteSuperseded\");"""
          old = "\n".join(line[10:] if line.startswith("          ") else line for line in old.splitlines())
          new = """    window.__mflCancelIncrementalRouteRequest?.();
            document.documentElement.classList.add(\"mflInitialRouteSuperseded\");
            const transition = stageViewTransition(pageName, viewName, options);
            if (!transition) return null;"""
          new = "\n".join(line[10:] if line.startswith("          ") else line for line in new.splitlines())
          core = replace_once(core, old, new, "view transition header handoff")

          core_path.write_text(core)

          api_path = Path("site/api/_data-page.js")
          api = api_path.read_text()
          old = '    return `${quoteIdentifier(derived)} IS NULL, ${quoteIdentifier(derived)} ${direction}, overall ${direction}, player_id DESC`;'
          new = '    return `${quoteIdentifier(derived)} IS NULL, ${quoteIdentifier(derived)} ${direction}, overall DESC, player_id DESC`;'
          api = replace_once(api, old, new, "Progression API tie-break")
          api_path.write_text(api)
          PY
      - name: Install site dependencies
        working-directory: site
        run: npm ci
      - name: Rebuild generated runtime chunks
        working-directory: site
        run: npm run build:core
      - name: Run dedicated sorting regression
        working-directory: site
        run: node validate-table-sort-session.mjs
      - name: Stage generated contract
        run: git add site/modules/app-core.js site/modules/app-core-runtime.js site/modules/app-core-table-runtime.js site/api/_data-page.js site/validate-table-sort-session.mjs
      - name: Run full site checks
        working-directory: site
        run: npm run check
      - name: Commit fix and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/pr569-sort-followup-v3.yml .github/workflows/pr569-sort-followup-v4.yml
          git add -A
          git commit -m "Fix sorting semantics and loading arrows"
          git push origin HEAD:fix/page-scoped-default-sorting

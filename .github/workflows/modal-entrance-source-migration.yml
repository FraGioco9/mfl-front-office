name: Modal entrance source migration

on:
  push:
    branches:
      - refactor/source-owned-modal-entrance
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/source-owned-modal-entrance
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source-owned modal entrance migration
        run: node site/migrate-source-owned-modal-entrance.mjs
      - name: Persist migrated source
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "Modal entrance lifecycle is already source-owned."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Move modal entrance lifecycle into source"
          git push origin HEAD:refactor/source-owned-modal-entrance

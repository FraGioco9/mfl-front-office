name: PERF-04B prebuilt headers (build-only, temporary)

# Measurement only: calls "vercel pull" and "vercel build", NEVER "vercel deploy".
# Remove workflow from the PR before squash merging. No production resources mutated.
on:
  pull_request:
    paths:
      - ".github/workflows/perf04b-prebuilt-build-only.yml"
      - "scripts/workflows/inspect-prebuilt-cache.mjs"
      - "validate-perf04b-prebuilt-model.mjs"

permissions:
  contents: read

jobs:
  inspect-prebuilt:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install locked app dependencies
        run: npm ci --no-audit --no-fund
      - name: Create local minimal SQLite fixture
        run: |
          mkdir -p api/data-files
          node scripts/ci/create-next-sqlite-smoke-fixture.cjs api/data-files/mfl_database.db
          node build-html.mjs
      - name: Install Vercel CLI (build-only)
        run: npm install --global vercel@latest
      - name: Connect existing project without deploying
        shell: bash
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
      - name: Pull existing production settings (local only)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
      - name: Normalize root and preserve generated CSP policy
        run: |
          node scripts/workflows/normalize-vercel-project-root.mjs
          node scripts/workflows/write-deployment-commit.mjs "$GITHUB_SHA"
          node scripts/workflows/sync-vercel-security-headers.mjs
      - name: Build local prebuilt artifact only — NO deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ALLOW_VERCEL_ACTION_DEPLOY: "1"
        run: vercel build --prod --yes --token "$VERCEL_TOKEN"
      - name: Read Build Output API v3 header rules
        shell: bash
        run: |
          set -euo pipefail
          test -s .vercel/output/config.json
          node scripts/workflows/verify-prebuilt-security-headers.mjs
          node scripts/workflows/inspect-prebuilt-cache.mjs .vercel/output/config.json > perf04b-prebuilt-report.json
          node validation/perf04b-prebuilt-asset-inventory.mjs .vercel/output > perf04b-prebuilt-assets.json
          node -e 'const r=require("./perf04b-prebuilt-assets.json"); console.log("PERF04B_ACTUAL_STATIC " + JSON.stringify(r));'
          node -e 'const r=require("./perf04b-prebuilt-report.json"); console.log("Vercel Build Output API v"+r.schemaVersion+" route count="+r.routeCount); for(const p of r.inspections)console.log(p.label+": "+p.matchedHeaderRules.map(x=>x.cacheControl||"(no explicit cache control)").join(" | "));'
      - name: Preserve header-only report, not functions or secrets
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf04b-prebuilt-header-audit-${{ github.run_id }}
          path: |
            perf04b-prebuilt-report.json
            perf04b-prebuilt-assets.json
          if-no-files-found: warn
          retention-days: 90

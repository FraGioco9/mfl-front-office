name: Issue 866 Development Center reuse fix

on:
  push:
    branches:
      - fix/866-development-center-club-reuse

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/866-development-center-club-reuse
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply permanent fix
        run: python .github/issue-866-development-center-migration.py
      - name: Check syntax
        run: python -m py_compile scripts/database/clubs.py tests/test_database_refresh_controls.py
      - name: Run refresh-control regressions
        run: python -m unittest tests.test_database_refresh_controls
      - name: Commit permanent changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/database/clubs.py tests/test_database_refresh_controls.py
          git rm .github/issue-866-development-center-migration.py .github/workflows/issue-866-development-center-migration.yml
          git commit -m 'Ignore Development Center pseudo-club during club reuse'
          git push

name: Capture wallet core type diagnostics

on:
  push:
    branches:
      - types/969-wallet-identity

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Capture wallet diagnostics
        shell: bash
        run: |
          set +e
          npx tsc -p jsconfig.core.json --noEmit --pretty false > core-types.txt 2>&1
          status=$?
          set -e
          grep '^modules/core-sources/wallet.js' core-types.txt || true
          echo "tsc_status=$status"

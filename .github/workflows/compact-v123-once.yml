name: Compact v1.123 release sequence

on:
  push:
    paths:
      - ".github/workflows/compact-v123-once.yml"

jobs:
  rewrite:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite release sequence
        run: node scripts/compact-v123-release-history.mjs
      - name: Commit rewritten versions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site
          git commit -m "Renumber compact v1.123 releases from zero"
          git push origin HEAD:main

name: Issue 349 anchor cleanup

on:
  push:
    branches:
      - fix/loading-navigation-supersession
    paths:
      - .github/workflows/issue-349-delete-anchor.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/loading-navigation-supersession
      - name: Delete temporary anchor branch
        run: git push origin --delete tmp/issue349-validated

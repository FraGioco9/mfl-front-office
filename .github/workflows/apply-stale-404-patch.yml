name: Apply stale 404 patch

on:
  push:
    branches: [fix/stale-historical-competition-404]
    paths: [.github/workflows/apply-stale-404-patch.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/stale-historical-competition-404
      - name: Apply targeted request retry change
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/database/run_flow_rebuild.py")
          source = path.read_text(encoding="utf-8")
          needle = '            last_error = RuntimeError(f"HTTP {error.code}: {body[:500]}")\n'
          replacement = needle + '            if error.code == 404:\n                raise RuntimeError(f"{request_name} failed: {last_error}") from error\n'
          if needle not in source:
              raise SystemExit("Expected request_json HTTPError assignment was not found")
          if "if error.code == 404:" in source:
              raise SystemExit("HTTP 404 retry guard already exists")
          path.write_text(source.replace(needle, replacement, 1), encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/database/run_flow_rebuild.py
          git commit -m "Do not retry permanent HTTP 404s"
          git push origin HEAD:fix/stale-historical-competition-404

name: Apply CSS optimization

on:
  push:
    branches:
      - chore/css-ownership-optimization

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Stage CSS optimization patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/css-ownership-optimization
      - name: Apply verified CSS ownership patch
        shell: bash
        env:
          PATCH_B64: >-
            
        run: |
          python - <<'PY'
          import base64, gzip, os
          from pathlib import Path
          Path('/tmp/css-optimization.patch').write_bytes(gzip.decompress(base64.b64decode(os.environ['PATCH_B64'])))
          PY
          git apply --check /tmp/css-optimization.patch
          git apply /tmp/css-optimization.patch
          git rm .github/workflows/css-optimization-snapshot.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- site/styles-base.css site/responsive.css site/index.html site/validate-css-priority.mjs
          git commit -m 'Optimize CSS ownership and cascade'
          git push origin HEAD:chore/css-ownership-optimization

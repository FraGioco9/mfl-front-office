name: Fix current Contracts flicker
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-all-view-width-flicker-once.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch current app.js
        shell: python
        run: |
          from pathlib import Path

          path = Path("site/app.js")
          text = path.read_text(encoding="utf-8")

          old = '''  function finishClubSwitch() {
  let attempts = 0;
  let stableFrames = 0;
  let previousSignature = "";

  const checkStableColumns = () => {
    attempts += 1;
    if (typeof buildTableColGroup === "function") buildTableColGroup();
    if (typeof applyExactColumnWidths === "function") applyExactColumnWidths();

    const columns = Array.from(document.querySelectorAll("#tableColGroup > col"));
    const signature = columns
      .map((column) => `${column.className}:${column.style.width}:${column.getAttribute("style") || ""}`)
      .join("|");

    if (columns.length && signature && signature === previousSignature) stableFrames += 1;
    else stableFrames = 0;
    previousSignature = signature;

    if (stableFrames >= 2 || attempts >= 60) {
      requestAnimationFrame(() => setClubSwitching(false));
      return;
    }

    requestAnimationFrame(checkStableColumns);
  };

  requestAnimationFrame(checkStableColumns);
}'''

          new = '''  function finishClubSwitch() {
    let attempts = 0;
    let stableFrames = 0;
    let previousSignature = "";

    if (typeof buildTableColGroup === "function") buildTableColGroup();
    if (typeof applyExactColumnWidths === "function") applyExactColumnWidths();

    const checkStableColumns = () => {
      attempts += 1;
      if (typeof applyExactColumnWidths === "function") applyExactColumnWidths();

      const columns = Array.from(document.querySelectorAll("#tableColGroup > col"));
      const signature = columns
        .map((column) => `${column.className}:${column.style.width}`)
        .join("|");

      if (columns.length && signature && signature === previousSignature) stableFrames += 1;
      else stableFrames = 0;
      previousSignature = signature;

      if (stableFrames >= 3 || attempts >= 60) {
        requestAnimationFrame(() => setClubSwitching(false));
        return;
      }

      requestAnimationFrame(checkStableColumns);
    };

    requestAnimationFrame(checkStableColumns);
  }'''

          count = text.count(old)
          if count != 1:
              raise RuntimeError(f"finishClubSwitch match count: {count}")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
      - name: Validate and commit
        run: |
          node --check site/app.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/app.js
          git commit -m "Stop rebuilding columns during Contracts switch"
          git push

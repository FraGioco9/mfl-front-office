name: Temporary document title wiring

on:
  push:
    branches:
      - feat/browser-page-titles
    paths:
      - .github/workflows/tmp-wire-document-title.yml
      - site/document-title-runtime.js
      - site/validate-document-title-runtime.mjs

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/browser-page-titles
          fetch-depth: 0
      - name: Wire universal runtime and validator
        run: |
          python - <<'PY'
          from pathlib import Path

          app_entry = Path("site/modules/app-entry.js")
          source = app_entry.read_text()
          before = '  "/static-ui-runtime.js",\n  "/control-interactions-runtime.js",'
          after = '  "/static-ui-runtime.js",\n  "/document-title-runtime.js",\n  "/control-interactions-runtime.js",'
          if before not in source and after not in source:
              raise SystemExit("Could not locate universal runtime insertion point")
          if after not in source:
              app_entry.write_text(source.replace(before, after, 1))

          validate_all = Path("site/validate-all.mjs")
          source = validate_all.read_text()
          before = '  "validate-release-runtime-ownership.mjs",\n'
          after = before + '  "validate-document-title-runtime.mjs",\n'
          if before not in source and '  "validate-document-title-runtime.mjs",\n' not in source:
              raise SystemExit("Could not locate validator insertion point")
          if '  "validate-document-title-runtime.mjs",\n' not in source:
              validate_all.write_text(source.replace(before, after, 1))
          PY
      - name: Commit wiring
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/modules/app-entry.js site/validate-all.mjs
          git commit -m "Load route-aware document titles"
          git push origin HEAD:feat/browser-page-titles

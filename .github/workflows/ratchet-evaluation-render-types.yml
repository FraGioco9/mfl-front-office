name: Safely ratchet Evaluation render type baseline

on:
  push:
    branches:
      - types/969-evaluation-model

permissions:
  contents: write

jobs:
  ratchet:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Verify current diagnostics remain within protected baseline
        shell: bash
        run: npm run typecheck
      - name: Record exact current diagnostic fingerprints
        shell: bash
        run: |
          set +e
          npx tsc -p jsconfig.core.json --noEmit --pretty false > core-types.txt 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected remaining canonical-core diagnostics." >&2
            exit 1
          fi
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import {
            collectCoreTypeDiagnostics,
            countCoreTypeFingerprints,
          } from "./validation/core-type-diagnostics.mjs";

          const output = fs.readFileSync("core-types.txt", "utf8");
          const { diagnostics, unexpectedDiagnostics } = collectCoreTypeDiagnostics(output);
          if (unexpectedDiagnostics.length) {
            throw new Error("Unexpected diagnostics:\n" + unexpectedDiagnostics.join("\n"));
          }
          const counts = countCoreTypeFingerprints(diagnostics);
          const payload = {
            version: 1,
            sourceCommit: process.env.GITHUB_SHA || "",
            total: diagnostics.length,
            fingerprintCount: counts.size,
            fingerprints: Object.fromEntries([...counts].sort(([a], [b]) => a.localeCompare(b))),
          };
          fs.writeFileSync(
            "validation/core-type-diagnostic-baseline.json",
            JSON.stringify(payload, null, 2) + "\n",
          );
          console.log(`Safe ratchet: ${payload.total} diagnostics across ${payload.fingerprintCount} fingerprints.`);
          NODE
      - name: Commit exact ratcheted baseline
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/core-type-diagnostic-baseline.json
          git commit -m "Ratchet Evaluation render type baseline"
          git push origin HEAD:types/969-evaluation-model

name: Patch loading selector ownership

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/table-loading-selection-row-height'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Move loading selector neutrality to canonical owners
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "site/table-loading-runtime.js",
              "    input.disabled = true;\n",
              "    input.disabled = false;\n",
          )

          replace_once(
              "site/bootstrap.js",
              "  function primeInitialTableStructure(page, view) {\n",
              """  function neutralizeFirstPaintSelectionHeader(head) {
            const input = head.querySelector(\"#selectVisiblePlayersInput\");
            if (!(input instanceof HTMLInputElement)) return false;
            input.checked = false;
            input.indeterminate = false;
            input.disabled = false;
            if (document.activeElement === input) input.blur();
            return true;
          }

          function primeInitialTableStructure(page, view) {
          """,
          )
          replace_once(
              "site/bootstrap.js",
              """    if (head.rows[0] && head.dataset.mflStaticHeader === \"true\" && head.dataset.mflHeaderSignature === signature) {
                return head.rows[0].cells.length;
              }
          """,
              """    if (head.rows[0] && head.dataset.mflStaticHeader === \"true\" && head.dataset.mflHeaderSignature === signature) {
                neutralizeFirstPaintSelectionHeader(head);
                return head.rows[0].cells.length;
              }
          """,
          )
          replace_once(
              "site/bootstrap.js",
              """    selectionInput.id = \"selectVisiblePlayersInput\";
              selectionInput.type = \"checkbox\";
              selectionInput.setAttribute(\"aria-label\", \"Select visible players\");
          """,
              """    selectionInput.id = \"selectVisiblePlayersInput\";
              selectionInput.type = \"checkbox\";
              selectionInput.checked = false;
              selectionInput.indeterminate = false;
              selectionInput.disabled = false;
              selectionInput.setAttribute(\"aria-label\", \"Select visible players\");
          """,
          )

          app_core = Path("site/modules/app-core.js")
          app_core_text = app_core.read_text(encoding="utf-8")
          function_start = app_core_text.find("function updateSelectionHeader(pageRows = currentPageRows()) {")
          if function_start < 0:
              raise SystemExit("site/modules/app-core.js: updateSelectionHeader owner not found")
          visible_ids_index = app_core_text.find("  const visibleIds =", function_start)
          if visible_ids_index < 0:
              raise SystemExit("site/modules/app-core.js: visibleIds boundary not found")
          function_slice = app_core_text[function_start:visible_ids_index]
          guard_marker = 'document.documentElement.classList.contains("mflDataLoading")'
          if guard_marker in function_slice:
              raise SystemExit("site/modules/app-core.js: loading guard already exists unexpectedly")
          app_core_guard = """  if (document.documentElement.classList.contains(\"mflDataLoading\")) {
            selectVisibleInput.checked = false;
            selectVisibleInput.indeterminate = false;
            selectVisibleInput.disabled = false;
            if (document.activeElement === selectVisibleInput) {
              selectVisibleInput.blur();
            }
            return;
          }

          """
          app_core.write_text(
              app_core_text[:visible_ids_index] + app_core_guard + app_core_text[visible_ids_index:],
              encoding="utf-8",
          )

          validator = Path("site/validate-table-loading-state.mjs")
          text = validator.read_text(encoding="utf-8")
          old_sources = 'const [runtime, bootstrap, stylesBase] = await Promise.all([\n  read("./table-loading-runtime.js"),\n  read("./bootstrap.js"),\n  read("./styles-base.css"),\n]);'
          new_sources = 'const [runtime, bootstrap, stylesBase, appCoreSource] = await Promise.all([\n  read("./table-loading-runtime.js"),\n  read("./bootstrap.js"),\n  read("./styles-base.css"),\n  read("./modules/app-core.js"),\n]);'
          if old_sources not in text:
              raise SystemExit("validate-table-loading-state.mjs: source list not found")
          text = text.replace(old_sources, new_sources, 1)
          if "  'input.disabled = true;'," not in text:
              raise SystemExit("validate-table-loading-state.mjs: disabled assertion not found")
          text = text.replace("  'input.disabled = true;',", "  'input.disabled = false;',", 1)
          marker = '''invariant(
            bootstrap.includes('const renderedColumns = Array.from(colGroup?.children || []);')'''
          insertion = '''invariant(
            bootstrap.includes('function neutralizeFirstPaintSelectionHeader(head) {')
              && bootstrap.includes('neutralizeFirstPaintSelectionHeader(head);')
              && bootstrap.includes('selectionInput.checked = false;')
              && bootstrap.includes('selectionInput.indeterminate = false;')
              && bootstrap.includes('selectionInput.disabled = false;'),
            "The first-paint header selector must be neutral before the table is revealed, including when static header DOM is reused.",
          );

          invariant(
            appCoreSource.includes('if (document.documentElement.classList.contains("mflDataLoading")) {')
              && appCoreSource.includes('selectVisibleInput.checked = false;')
              && appCoreSource.includes('selectVisibleInput.indeterminate = false;')
              && appCoreSource.includes('selectVisibleInput.disabled = false;'),
            "The canonical selection-header owner must refuse checked, indeterminate, or disabled visual states while table data is loading.",
          );

          invariant(
            bootstrap.includes('const renderedColumns = Array.from(colGroup?.children || []);')'''
          if marker not in text:
              raise SystemExit("validate-table-loading-state.mjs: insertion marker not found")
          text = text.replace(marker, insertion, 1)
          validator.write_text(text, encoding="utf-8")

      - name: Commit canonical loading selector fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-loading-selector.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- site/bootstrap.js site/table-loading-runtime.js site/modules/app-core.js site/validate-table-loading-state.mjs
          git add -u -- .github/workflows/patch-loading-selector.yml
          git commit -m "Keep loading table selector neutral"
          git push origin "HEAD:${{ github.head_ref }}"

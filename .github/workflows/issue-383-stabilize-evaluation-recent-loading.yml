name: Issue 383 stabilize Evaluation recent loading

on:
  push:
    branches:
      - fix/evaluation-discount-rate-fallback
    paths:
      - .github/workflows/issue-383-stabilize-evaluation-recent-loading.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/evaluation-discount-rate-fallback

      - uses: actions/setup-node@v4
        with:
          node-version-file: site/package.json
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Patch Evaluation loading ownership
        run: python .github/scripts/issue-383-stabilize-evaluation-recent-loading.py

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Build canonical application core
        working-directory: site
        run: npm run build:core

      - name: Validate Evaluation search lifecycle
        working-directory: site
        run: node validate-evaluation-search-lifecycle.mjs

      - name: Typecheck
        working-directory: site
        run: npm run typecheck

      - name: Commit loading ownership fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/evaluation-search-state-runtime.js site/modules/app-core.js site/modules/app-core-evaluation-runtime.js site/modules/app-core-evaluation-chunk.js site/validate-evaluation-search-lifecycle.mjs
          git diff --cached --quiet && exit 1
          git commit -m "Keep Evaluation recent loading continuously visible"
          git push origin HEAD:fix/evaluation-discount-rate-fallback

name: Secret scope check

on:
  workflow_dispatch:
    inputs:
      scope:
        description: GitHub Actions secret surface to verify without printing values
        required: true
        default: all-github
        type: choice
        options:
          - all-github
          - production-core
          - progression-email

permissions:
  contents: read

jobs:
  presence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MFL_API_TOKEN: \${{ secrets.MFL_API_TOKEN }}
      SUPABASE_URL: \${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: \${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VERCEL_ORG_ID: \${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: \${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: \${{ secrets.VERCEL_TOKEN }}
      SMTP_HOST: \${{ secrets.SMTP_HOST }}
      SMTP_PORT: \${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: \${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: \${{ secrets.SMTP_PASSWORD }}
      EMAIL_FROM: \${{ secrets.EMAIL_FROM }}
      EMAIL_REPLY_TO: \${{ secrets.EMAIL_REPLY_TO }}
      PROGRESSION_EMAIL_TEST_RECIPIENT: \${{ secrets.PROGRESSION_EMAIL_TEST_RECIPIENT }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Verify presence only
        shell: bash
        run: >-
          node scripts/operations/check-secret-presence.mjs
          --scope "\${{ inputs.scope }}"
          --summary "$GITHUB_STEP_SUMMARY"

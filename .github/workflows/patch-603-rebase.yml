name: Patch issue 603 rebased footer

on:
  push:
    branches:
      - tmp/603-single-footer-rebase
    paths:
      - site/patch-603-rebase.mjs
      - .github/workflows/patch-603-rebase.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Apply rebased footer patch
        run: node site/patch-603-rebase.mjs
      - name: Commit rebased footer sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html site/responsive.css site/static-ui-runtime.js site/bootstrap.js site/modules/core-sources/shared.js site/selection-stack-runtime.js site/validate-control-style-ownership.mjs site/validate-domain-shared-ui.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Rebase single footer onto latest main"
            git push
          fi

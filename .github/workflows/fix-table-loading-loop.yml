name: Fix table loading loop

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove table loading re-entry loops
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("site/table-loading-runtime.js")
          source = path.read_text(encoding="utf-8")

          pattern = r'  function installLegacyBridge\(\) \{.*?\n  window\.addEventListener\("mfl:ready", installLegacyBridge\);'
          replacement = (
              '  function installLegacyBridge() {\n'
              '    // legacy-core delegates to this runtime directly. Rewriting the\n'
              '    // same global function again can create competing wrapper chains.\n'
              '    sync();\n'
              '  }\n\n'
              '  // Observe only state changes that can start/end table loading.\n'
              '  // Never observe the table DOM itself: show() mutates that DOM, so a\n'
              '  // subtree observer can repeatedly trigger sync() -> show() forever.\n'
              '  observer = new MutationObserver(schedule);\n'
              '  observer.observe(document.documentElement, {\n'
              '    attributes: true,\n'
              '    attributeFilter: ["class"],\n'
              '  });\n'
              '  if (document.body) {\n'
              '    observer.observe(document.body, {\n'
              '      attributes: true,\n'
              '      attributeFilter: ["data-page"],\n'
              '    });\n'
              '  }\n'
              '  window.addEventListener("mfl:ready", installLegacyBridge);'
          )
          source, count = re.subn(pattern, replacement, source, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("Could not replace the table loading bridge/observer block.")

          bridge_start = source.index("  function installLegacyBridge() {")
          ready_listener = source.index('  window.addEventListener("mfl:ready", installLegacyBridge);', bridge_start)
          guarded = source[bridge_start:ready_listener]
          if "childList: true" in guarded or "subtree: true" in guarded or "characterData: true" in guarded:
              raise SystemExit("Broad table DOM observation is still present.")
          if "window.eval" in guarded:
              raise SystemExit("Legacy table loading function rewriting is still present.")

          path.write_text(source, encoding="utf-8")
          PY

      - name: Validate site
        working-directory: site
        run: |
          npm install
          npm run lint
          npm run typecheck
          npm run validate

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-table-loading-loop.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/table-loading-runtime.js .github/workflows/fix-table-loading-loop.yml
          git commit -m "Remove table loading mutation loop"
          git push origin HEAD:main

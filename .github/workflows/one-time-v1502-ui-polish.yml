name: One-time v1.150.2 UI polish

on:
  push:
    branches:
      - main
    paths:
      - .github/v1502-ui-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Prevent observer feedback loops
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/patch_v1502_ui_polish.py')
          source = path.read_text(encoding='utf-8')
          source = source.replace(
              'observer.observe(document.body, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["class", "hidden", "style"] });',
              'observer.observe(document.body, { childList: true, subtree: true, characterData: true });',
          )
          source = source.replace(
              'window.addEventListener("resize", () => {\n    sharedTableWidth = 0;',
              'window.addEventListener("resize", () => {\n    if (!TABLE_ROUTE.test(window.location.pathname) && state?.currentPage !== "club") return;\n    sharedTableWidth = 0;',
          )
          path.write_text(source, encoding='utf-8')
          PY
      - name: Patch current app.js only
        run: python .github/scripts/patch_v1502_ui_polish.py
      - name: Validate JavaScript
        run: node --check site/app.js
      - name: Commit UI polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish Watchlist and club table rendering"
          git push origin main

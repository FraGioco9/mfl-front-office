name: Issue 561 opted-out first paint

on:
  push:
    branches:
      - fix/561-opted-out-first-paint
    paths:
      - .github/workflows/issue-561-opted-out-first-paint.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: fix/561-opted-out-first-paint
      - name: Configure Git and rebase
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rebase origin/main
      - name: Fix opted-out first-paint shell
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path("site/index.html")
          text = index.read_text(encoding="utf-8")
          old = '''      ) #myPlayersLockedPage {\n        display: block;\n      }'''
          new = '''      ) #myPlayersLockedPage {\n        display: grid;\n        place-items: center;\n      }'''
          if old not in text:
              raise SystemExit("opted-out first-paint rule not found")
          index.write_text(text.replace(old, new, 1), encoding="utf-8")

          validator = Path("site/validate-static-route-ui.mjs")
          text = validator.read_text(encoding="utf-8")
          anchor = 'includes(indexHtml, \'html[data-initial-page="mfl/stats"]:not(.mflInitialRouteResolved):not(.mflInitialRouteSuperseded) #mflStatsPage\', "MFL Stats first-paint visibility must use the same supersession boundary as Database Stats.");\n'
          addition = '''includes(indexHtml, ') #myPlayersLockedPage {\\n        display: grid;\\n        place-items: center;\\n      }', "Opted-out protected routes must use the final centered locked-page grid at first paint.");\nexcludes(indexHtml, ') #myPlayersLockedPage {\\n        display: block;', "Opted-out protected routes must never start in normal block flow before the locked-page grid takes ownership.");\n'''
          if anchor not in text:
              raise SystemExit("static-route validator anchor not found")
          validator.write_text(text.replace(anchor, anchor + addition, 1), encoding="utf-8")
          PY
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install site dependencies
        working-directory: site
        run: npm install --no-audit --no-fund
      - name: Lint
        working-directory: site
        run: npm run lint
      - name: Typecheck
        working-directory: site
        run: npm run typecheck
      - name: Repository validation
        working-directory: site
        run: npm run validate
      - name: Commit clean implementation
        run: |
          git rm .github/workflows/issue-561-opted-out-first-paint.yml
          git add site/index.html site/validate-static-route-ui.mjs
          git commit -m "Fix opted-out first-paint layout"
          git push --force-with-lease origin HEAD:fix/561-opted-out-first-paint

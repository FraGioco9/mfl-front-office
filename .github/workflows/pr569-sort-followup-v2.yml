name: PR 569 sort follow-up v2

on:
  push:
    branches:
      - fix/page-scoped-default-sorting
    paths:
      - .github/workflows/pr569-sort-followup-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/page-scoped-default-sorting
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Patch canonical sort lifecycle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          core_path = Path('site/modules/app-core.js')
          core = core_path.read_text()

          def replace_once(old, new, label):
              global core
              count = core.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              core = core.replace(old, new, 1)

          replace_once(
              '  tableSortSessionKey: "",\n',
              '  tableSortSessionKey: "",\n  tableSortSessionViewStates: {},\n',
              'session view-state field',
          )

          reset_pattern = re.compile(
              r'function resetTableSortSession\(pageName, options = \{\}\) \{.*?\n\}\n\nfunction defaultTablePageState',
              re.S,
          )
          reset_replacement = '''function tableSortStateForView(
            viewName = state.view,
            pageName = tablePageKey() || state.currentPage || "progression",
            fallbackSortState = null,
          ) {
            const normalizedPageName = pageName === "mflstats" ? "mfl" : String(pageName || "");
            const normalizedView = normalizeViewForPage(viewName, normalizedPageName || "progression");
            const rememberedSortState = state.tableSortSessionViewStates?.[normalizedView];
            return normalizedViewSortState(
              rememberedSortState || fallbackSortState,
              normalizedView,
              normalizedPageName,
            );
          }

          function rememberTableSortStateForView(
            viewName = state.view,
            pageName = tablePageKey() || state.currentPage || "progression",
            sortState = { sortKey: state.sortKey, sortDirection: state.sortDirection },
          ) {
            if (!state.tableSortSessionKey) return false;
            const normalizedPageName = pageName === "mflstats" ? "mfl" : String(pageName || "");
            const normalizedView = normalizeViewForPage(viewName, normalizedPageName || "progression");
            if (!sortKeySupportedByView(sortState?.sortKey, normalizedView, normalizedPageName)) return false;
            const normalizedSortState = normalizedViewSortState(sortState, normalizedView, normalizedPageName);
            state.tableSortSessionViewStates[normalizedView] = normalizedSortState;
            return true;
          }

          function resetTableSortSession(pageName, options = {}) {
            const nextSessionKey = tableSortSessionKey(pageName, options);
            if (nextSessionKey === state.tableSortSessionKey) return false;
            state.tableSortSessionKey = nextSessionKey;
            state.tableSortSessionViewStates = {};
            if (!nextSessionKey) return false;

            const normalizedPageName = pageName === "mflstats" ? "mfl" : String(pageName || "");
            const nextView = normalizeViewForPage(options.view, normalizedPageName || "progression");
            const defaultSortState = defaultSortStateForView(nextView, normalizedPageName);
            state.sortKey = defaultSortState.sortKey;
            state.sortDirection = defaultSortState.sortDirection;
            rememberTableSortStateForView(nextView, normalizedPageName, defaultSortState);
            return true;
          }

          function defaultTablePageState'''
          core, count = reset_pattern.subn(reset_replacement, core, count=1)
          if count != 1:
              raise SystemExit(f'reset/session helpers: expected one match, found {count}')

          replace_once(
              '  updateViewButtons();\n  window.__mflStaticUiRuntime?.sync?.();\n  return nextView;\n',
              '  updateViewButtons();\n  if (tablePages.has(statePageName) || statePageName === "club") buildHeader();\n  window.__mflStaticUiRuntime?.sync?.();\n  return nextView;\n',
              'view-transition first-paint header',
          )

          replace_once(
              '  document.body.dataset.page = routePageName;\n\n  const targetPath = String(options.path || options.replaceUrl || pagePath(routePageName, {',
              '  document.body.dataset.page = routePageName;\n  if (tablePages.has(statePageName) || statePageName === "club") buildHeader();\n\n  const targetPath = String(options.path || options.replaceUrl || pagePath(routePageName, {',
              'page-transition first-paint header',
          )

          replace_once(
              '  updateViewButtons();\n  if (pageName === "agents") {\n',
              '  updateViewButtons();\n  buildHeader();\n  if (pageName === "agents") {\n',
              'loading-shell header refresh',
          )

          restore_pattern = re.compile(
              r'const viewSortState = normalizedViewSortState\(\n  \{ sortKey: state\.sortKey, sortDirection: state\.sortDirection \},\n  state\.view,\n  pageName,\n\);\nstate\.sortKey = viewSortState\.sortKey;\nstate\.sortDirection = viewSortState\.sortDirection;',
          )
          restore_replacement = '''  const viewSortState = tableSortStateForView(
            state.view,
            pageName,
            { sortKey: state.sortKey, sortDirection: state.sortDirection },
          );
          state.sortKey = viewSortState.sortKey;
          state.sortDirection = viewSortState.sortDirection;
          rememberTableSortStateForView(state.view, pageName, viewSortState);'''
          core, count = restore_pattern.subn(restore_replacement, core, count=1)
          if count != 1:
              raise SystemExit(f'restore sort state: expected one match, found {count}')

          replace_once(
              '        state.page = 1;\n        buildHeader();\n        applyFilters();\n',
              '        state.page = 1;\n        rememberTableSortStateForView();\n        buildHeader();\n        applyFilters();\n',
              'header-click session persistence',
          )

          replace_once(
              '      const comparison = comparePrimitiveValues(aValue[index], bValue[index], direction, true);\n',
              '      const comparisonDirection = state.currentPage === "progression" && index > 0 ? -1 : direction;\n      const comparison = comparePrimitiveValues(aValue[index], bValue[index], comparisonDirection, true);\n',
              'progression Overall tie-break',
          )

          replace_once(
              '  state.view = viewName;\n  state.page = 1;\n',
              '  rememberTableSortStateForView(state.view, pageKey || state.currentPage);\n\n  state.view = viewName;\n  state.page = 1;\n',
              'standard view remember previous sort',
          )

          standard_target = re.compile(
              r'const targetSortState = normalizedViewSortState\(\n  \{ sortKey: state\.sortKey, sortDirection: state\.sortDirection \},\n  viewName,\n  pageKey \|\| state\.currentPage,\n\);\n  state\.sortKey = targetSortState\.sortKey;\n  state\.sortDirection = targetSortState\.sortDirection;',
          )
          standard_replacement = '''  const targetSortState = tableSortStateForView(
            viewName,
            pageKey || state.currentPage,
            { sortKey: state.sortKey, sortDirection: state.sortDirection },
          );
          state.sortKey = targetSortState.sortKey;
          state.sortDirection = targetSortState.sortDirection;
          rememberTableSortStateForView(viewName, pageKey || state.currentPage, targetSortState);'''
          core, count = standard_target.subn(standard_replacement, core, count=1)
          if count != 1:
              raise SystemExit(f'standard target sort: expected one match, found {count}')

          incremental_anchor = '''    const previousSortDirection = stagedTransition?.previousSortDirection || state.sortDirection;
              const previousPath = stagedTransition?.previousPath || currentNavigationPath();

              if (pageKey) {'''
          incremental_replacement = '''    const previousSortDirection = stagedTransition?.previousSortDirection || state.sortDirection;
              const previousPath = stagedTransition?.previousPath || currentNavigationPath();

              rememberTableSortStateForView(
                previousView,
                pageKey || pageName,
                { sortKey: previousSortKey, sortDirection: previousSortDirection },
              );

              if (pageKey) {'''
          replace_once(incremental_anchor, incremental_replacement, 'incremental view remember previous sort')

          incremental_target = re.compile(
              r'const targetSortState = normalizedViewSortState\(\n  \{ sortKey: previousSortKey, sortDirection: previousSortDirection \},\n  nextView,\n  pageKey \|\| pageName,\n\);',
          )
          incremental_replacement = '''    const targetSortState = tableSortStateForView(
                nextView,
                pageKey || pageName,
                { sortKey: previousSortKey, sortDirection: previousSortDirection },
              );
              rememberTableSortStateForView(nextView, pageKey || pageName, targetSortState);'''
          core, count = incremental_target.subn(incremental_replacement, core, count=1)
          if count != 1:
              raise SystemExit(f'incremental target sort: expected one match, found {count}')

          replace_once(
              '  setPage = async function setIncrementalPage(pageName, updateHash = true, options = {}) {\n    const progressionLoadingRequestToken =',
              '  setPage = async function setIncrementalPage(pageName, updateHash = true, options = {}) {\n    resetTableSortSession(pageName, options);\n    const progressionLoadingRequestToken =',
              'pre-transition page sort reset',
          )

          core_path.write_text(core)

          validation = Path('site/validate-table-sort-session.mjs')
          validation.write_text('''import fs from "node:fs";
          import assert from "node:assert/strict";

          const core = fs.readFileSync(new URL("./modules/app-core.js", import.meta.url), "utf8");
          const entry = fs.readFileSync(new URL("./modules/app-entry.js", import.meta.url), "utf8");

          function sourceBetween(start, end) {
            const startIndex = core.indexOf(start);
            const endIndex = core.indexOf(end, startIndex + start.length);
            assert.notEqual(startIndex, -1, `Missing source marker: ${start}`);
            assert.notEqual(endIndex, -1, `Missing source marker: ${end}`);
            return core.slice(startIndex, endIndex);
          }

          assert.match(core, /tableSortSessionKey:\\s*""/u, "Table state must own one transient sort-session key.");
          assert.match(core, /tableSortSessionViewStates:\\s*\\{\\}/u, "Table state must remember per-view sorting only inside the active page session.");
          assert.match(core, /pageName === "club"[\\s\\S]{0,180}sortKey:\\s*"positions"[\\s\\S]{0,100}sortDirection:\\s*"asc"/u, "Club pages must retain Positions ascending as their canonical default.");
          assert.match(core, /sortKey:\\s*"overall",\\s*\\n\\s*sortDirection:\\s*"desc"/u, "Non-Club table views must default to Overall descending.");
          assert.doesNotMatch(core, /sortDirection:\\s*viewName === "next" \\? "asc" : "desc"/u, "Next Overall must no longer default ascending.");

          const resetSessionSource = sourceBetween("function resetTableSortSession", "function defaultTablePageState");
          assert.match(resetSessionSource, /state\\.tableSortSessionViewStates = \\{\\};/u, "Changing page/entity must clear transient per-view sorting.");
          assert.ok(resetSessionSource.indexOf("state.tableSortSessionViewStates = {};") < resetSessionSource.indexOf("defaultSortStateForView"), "Transient view sorts must clear before canonical defaults are applied.");

          assert.match(core, /function tableSortStateForView\\(/u, "Same-page view switches must resolve sorting from the transient page session.");
          assert.match(core, /function rememberTableSortStateForView\\(/u, "Sort changes must be remembered per view until the page session ends.");

          const standardViewSource = sourceBetween("async function setView(viewName)", "function mflChunkFromPublicData");
          assert.ok(standardViewSource.indexOf("rememberTableSortStateForView(state.view") < standardViewSource.indexOf("state.view = viewName"), "Standard view switches must save the current view sort before changing views.");
          assert.match(standardViewSource, /tableSortStateForView\\([\\s\\S]*viewName/u, "Standard view switches must restore the destination view's session sort.");

          const incrementalViewSource = sourceBetween("setView = async function setIncrementalView", "setPage = async function setIncrementalPage");
          assert.ok(incrementalViewSource.indexOf("rememberTableSortStateForView") < incrementalViewSource.indexOf("const targetSortState = tableSortStateForView"), "Incremental view switches must save the previous sort before resolving the next one.");
          assert.match(incrementalViewSource, /tableSortStateForView\\([\\s\\S]*nextView/u, "Incremental view switches must restore the destination view's session sort.");

          const incrementalPageSource = sourceBetween("setPage = async function setIncrementalPage", "function divisionInfo");
          assert.ok(incrementalPageSource.indexOf("resetTableSortSession(pageName, options);") < incrementalPageSource.indexOf("runPageTransition"), "Page sorting must reset before the destination transition can paint.");

          const commitViewSource = sourceBetween("function commitViewTransition", "function commitPageTransition");
          assert.match(commitViewSource, /buildHeader\\(\\);/u, "View transitions must rebuild the sorted header before their first paint.");
          const loadingShellSource = sourceBetween("function renderTableLoadingShell", "async function setPage");
          assert.ok(loadingShellSource.indexOf("updateViewButtons();") < loadingShellSource.indexOf("buildHeader();"), "Loading shells must rebuild the header immediately after syncing the destination view.");

          assert.match(core, /state\\.view === "next"[\\s\\S]{0,180}column === "overall"[\\s\\S]{0,120}tableNextOverallPreciseValue\\(row\\)/u, "Next Overall sortable values must use the displayed precise Overall value.");
          assert.match(core, /state\\.sortKey === "overall"[\\s\\S]{0,220}tableNextOverallPreciseValue\\(a\\)[\\s\\S]{0,120}tableNextOverallPreciseValue\\(b\\)/u, "Next Overall comparisons must sort the displayed Overall value instead of the needed gain.");
          assert.match(core, /state\\.currentPage === "progression" && \\(state\\.view === "current" \\|\\| state\\.view === "all"\\) && statColumns\\.includes\\(column\\)[\\s\\S]{0,180}getProgressionColumn\\(column\\)[\\s\\S]{0,100}getValue\\(row, "overall"\\)/u, "Progression stat sorting must compare progression first and Overall second.");
          assert.match(core, /comparisonDirection = state\\.currentPage === "progression" && index > 0 \\? -1 : direction/u, "Progression tie-breaks must keep higher Overall first after equal progression.");
          assert.match(core, /rememberTableSortStateForView\\(\\);\\s*buildHeader\\(\\);\\s*applyFilters\\(\\);/u, "Header sort clicks must update the transient view sort before repainting.");
          assert.match(core, /compareRowsWithClubPositionOrder|clubPositionSort/u, "Existing Club position-order ownership must remain intact.");
          assert.match(entry, /sortKey:\\s*"positions"[\\s\\S]{0,80}sortDirection:\\s*"asc"/u, "Club route bootstrap must keep Positions ascending.");

          console.log("Table sort session validation passed.");
          '''.replace('          ', ''))
          PY

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Rebuild generated runtime chunks
        working-directory: site
        run: npm run build:core

      - name: Validate sort behavior
        working-directory: site
        run: node validate-table-sort-session.mjs

      - name: Run site checks
        working-directory: site
        run: npm run check

      - name: Commit fix and remove temporary workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr569-sort-followup.yml .github/workflows/pr569-sort-followup-v2.yml
          git add site/modules/app-core.js site/modules/app-core-runtime.js site/modules/app-core-table-runtime.js site/validate-table-sort-session.mjs
          git commit -m "Preserve table sorting across view switches"
          git push origin HEAD:fix/page-scoped-default-sorting

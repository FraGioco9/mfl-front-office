name: Issue 392 post-rebase validation

on:
  push:
    branches:
      - fix/issue-392-mint-age-history-fallback

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-392-mint-age-history-fallback
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate rebased implementation
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q *.py
          python -c "import rebuild_database; import rebuild_database_runner"
          python -m unittest discover -v -p "test_*.py"
          pushd site
          npm install --no-audit --no-fund
          npm run build:core
          npm run validate
          npm run verify:generated
          popd
      - name: Remove validation helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/issue-392-post-rebase-validate.yml
          git commit -m "Remove temporary post-rebase validation workflow"
          git push origin HEAD:fix/issue-392-mint-age-history-fallback

name: Issue 203 first-paint header fix

on:
  push:
    branches:
      - fix/issue-203-player-listing-column
    paths:
      - ".github/workflows/issue-203-first-paint-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-203-player-listing-column

      - name: Apply first-paint Listing header fix
        shell: python
        run: |
          from pathlib import Path

          bootstrap_path = Path("site/bootstrap.js")
          bootstrap = bootstrap_path.read_text(encoding="utf-8")
          old = 'label.textContent = FIRST_PAINT_COLUMN_LABELS[column] || "";'
          new = 'label.textContent = column === "listing_price" ? "" : FIRST_PAINT_COLUMN_LABELS[column] || "";'
          if bootstrap.count(old) != 1:
              raise SystemExit(f"Expected one first-paint header label assignment, found {bootstrap.count(old)}")
          bootstrap_path.write_text(bootstrap.replace(old, new, 1), encoding="utf-8")

          validator_path = Path("site/validate-listing-column.mjs")
          validator = validator_path.read_text(encoding="utf-8")
          anchor = 'assert.match(core, /icon\\.src = "\\/listing-shopping-bag\\.svg"/);\n'
          addition = (
              anchor
              + '\nconst bootstrap = read("site/bootstrap.js");\n'
              + 'assert.match(bootstrap, /label\\.textContent = column === "listing_price" \\? "" : FIRST_PAINT_COLUMN_LABELS\\[column\\] \\|\\| "";/);\n'
          )
          if anchor not in validator:
              raise SystemExit("Listing validator insertion point was not found.")
          if 'const bootstrap = read("site/bootstrap.js");' not in validator:
              validator = validator.replace(anchor, addition, 1)
              validator_path.write_text(validator, encoding="utf-8")

      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/bootstrap.js site/validate-listing-column.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Keep Listing header blank at first paint"
          git push origin HEAD:fix/issue-203-player-listing-column

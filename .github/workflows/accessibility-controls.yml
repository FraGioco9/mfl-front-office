name: Accessibility A11Y-02

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accessibility-a11y02-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  control-semantics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build canonical assets and Next runtime
        run: npm run build

      - name: Audit rendered control names and states
        run: npm run test:a11y:controls

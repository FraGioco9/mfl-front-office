name: PERF-05D2 pinned selective SQL study (temporary)

# Ephemeral CI for existing immutable snapshot; delete before merging.
on:
  pull_request:
    paths:
      - ".github/workflows/perf05d2-selective-ab.yml"
      - "scripts/performance/perf05d2-selective-ab.cjs"

permissions:
  contents: read
  actions: read

jobs:
  selective-sql:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Download verified pinned artifact (NO refresh)
        env:
          GH_${{ github.token }}: TOKEN
        run: |
          set -euo pipefail
          gh run download 37113407333 --repo "$GITHUB_REPOSITORY" --name mfl_database --dir .
          test -s mfl_database.db
          sha256sum mfl_database.db
          node <<'NODE'
          const {DatabaseSync}=require("node:sqlite"),db=new DatabaseSync("mfl_database.db",{readOnly:true});
          const count=db.prepare("SELECT count(*) AS n FROM players").get().n;
          const metadata=Object.fromEntries(db.prepare(
            "SELECT key,value FROM runtime_metadata WHERE key IN ('row_count','wallet_count','generated_at')"
          ).all().map(x=>[x.key,x.value]));
          if(count!==387258||Number(metadata.wallet_count)!==7866)throw Error("Pinned snapshot changed");
          console.log(JSON.stringify({count,metadata}));
          db.close();
          NODE
      - name: Validate probe syntax and isolated SQLite fixture
        run: |
          set -euo pipefail
          node --check scripts/performance/perf05d2-selective-ab.cjs
          node scripts/ci/create-next-sqlite-smoke-fixture.cjs /tmp/perf05d2-smoke.db
          node <<'NODE'
          const {DatabaseSync}=require("node:sqlite");
          const {normalizeSearchText}=require("./api/_database.js");
          const db=new DatabaseSync("/tmp/perf05d2-smoke.db");
          db.exec("CREATE TABLE runtime_player_search(player_id TEXT PRIMARY KEY,normalized_name TEXT NOT NULL)");
          const ins=db.prepare("INSERT INTO runtime_player_search VALUES (?,?)");
          for(const p of db.prepare("SELECT player_id,name FROM players").all())ins.run(p.player_id,normalizeSearchText(p.name));
          db.close();
          NODE
          MFL_DATABASE_PATH=/tmp/perf05d2-smoke.db PERF05D2_REPEAT=1 node scripts/performance/perf05d2-selective-ab.cjs >/tmp/perf05d2-smoke-result.json
          node <<'NODE'
          const r=require("/tmp/perf05d2-smoke-result.json");
          if(r.allMatched!==68||r.normalizedLookupMismatchRows!==0)throw Error("Incomplete fixture parity");
          console.log(JSON.stringify({cases:r.allMatched,paired:r.paired}));
          NODE
      - name: Full-response parity and same-runner SQL A-B-B-A
        env:
          MFL_DATABASE_PATH: mfl_database.db
          PERF05D2_REPEAT: "2"
        run: |
          set -euo pipefail
          node scripts/performance/perf05d2-selective-ab.cjs > perf05d2-evidence.json
          node <<'NODE'
          const r=require("./perf05d2-evidence.json");
          if(r.provenance.players!==387258||r.provenance.wallets!==7866
            ||r.allMatched!==68||r.normalizedLookupMismatchRows!==0)throw Error("Invalid evidence");
          for(const q of [...r.names,...r.samples.flatMap(s=>s.scenarios)]){
            for(const p of q.pairedSql){
              console.log(JSON.stringify({scenario:q.case,kind:p.kind,strategy:p.strategy,
                A:p.aMs,B:p.bMs,delta:p.deltaMs,planA:p.queryPlanA,planB:p.queryPlanB}));
            }
          }
          for(const s of r.samples)console.log(JSON.stringify({density:s.density,listings:s.listings,jsonBytes:s.jsonBytes,heapDeltaBytes:s.heapDeltaBytes}));
          console.log(JSON.stringify({allMatched:r.allMatched,paired:r.paired,normalizationMismatches:r.normalizedLookupMismatchRows}));
          NODE
      - name: Upload sanitized benchmark (no identifiers)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf05d2-selective-${{ github.run_id }}
          path: perf05d2-evidence.json
          if-no-files-found: warn
          retention-days: 90

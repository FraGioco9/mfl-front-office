name: PR 348 unify refresh loading v2

on:
  push:
    branches:
      - fix/refresh-navigation-authority
    paths:
      - .github/workflows/pr-348-unify-refresh-loading-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/refresh-navigation-authority
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply unified refresh loading patch
        shell: bash
        run: |
          node --input-type=module -e 'globalThis.location = { pathname: "${location.pathname}", search: "${location.search}" }; await import("./.github/scripts/pr348-unify-refresh-loading.mjs");'
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'site/validate-app-core-startup-handshake.mjs';
          let source = fs.readFileSync(path, 'utf8');
          const before = '  excludes(source, "skipNavigationTransition: true,", `${label} refresh must not bypass the normal navigation transition lifecycle.`);';
          const after = '  const startAppStartIndex = source.indexOf("async function startApp() {");\n  const startAppEndIndex = source.indexOf("\\n}\\n\\n(() => {", startAppStartIndex);\n  const startAppSection = startAppStartIndex >= 0 && startAppEndIndex > startAppStartIndex\n    ? source.slice(startAppStartIndex, startAppEndIndex + 2)\n    : "";\n  excludes(startAppSection, "skipNavigationTransition: true,", `${label} refresh must not bypass the normal navigation transition lifecycle.`);';
          if (!source.includes(before)) throw new Error('Could not scope startup transition bypass validation.');
          source = source.replace(before, after);
          fs.writeFileSync(path, source, 'utf8');
          NODE

          node site/build-app-core.mjs
          node --check site/bootstrap-core.js
          node --check site/modules/app-entry.js
          node --check site/modules/app-core.js
          node --check site/modules/app-core-runtime.js
          node site/validate-domain-routing-loading.mjs
          git diff --check

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            site/bootstrap-core.js \
            site/modules/app-entry.js \
            site/modules/app-core.js \
            site/modules/app-core-runtime.js \
            site/modules/app-core-*-runtime.js \
            site/validate-loading-ownership.mjs \
            site/validate-bootstrap-ownership.mjs \
            site/validate-generated-view-transition.mjs \
            site/validate-app-core-startup-handshake.mjs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix: unify refresh with canonical navigation loading"
          git push origin HEAD:fix/refresh-navigation-authority

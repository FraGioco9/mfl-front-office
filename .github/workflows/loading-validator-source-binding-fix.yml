name: Loading validator source binding fix

on:
  push:
    branches:
      - refactor/cache-aware-view-loading
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/cache-aware-view-loading
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fix loading validator source binding
        run: node site/fix-loading-validator-source-binding.mjs
      - name: Remove temporary fix scaffolding
        shell: bash
        run: |
          rm -f site/fix-loading-validator-source-binding.mjs
          rm -f .github/workflows/loading-validator-source-binding-fix.yml
      - name: Persist validator fix
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix loading ownership validator source binding"
          git push origin HEAD:refactor/cache-aware-view-loading

name: Evaluation Load source migration

on:
  push:
    branches:
      - refactor/source-owned-evaluation-load
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/source-owned-evaluation-load
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source-owned Evaluation Load migration
        run: node site/migrate-source-owned-evaluation-load.mjs
      - name: Persist migrated source
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "Evaluation Load lifecycle is already source-owned."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Move Evaluation Load lifecycle into source"
          git push origin HEAD:refactor/source-owned-evaluation-load

name: Temporary issue 429 Player action transition refinement
on:
  push:
    branches: [feat/issue-429-player-table-actions]
    paths: [.github/workflows/tmp-issue-429-player-actions-transition.yml]
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/issue-429-player-table-actions
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply transition and hover refinement
        working-directory: site
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          core_path = Path('modules/app-core.js')
          core = core_path.read_text()
          core = replace_once(
              core,
              '''  menu.replaceChildren(...items);\n  menu.dataset.open = "true";\n  positionPlayerTableActionMenu();\n  requestAnimationFrame(() => {\n    if (playerTableActionTrigger === trigger && trigger.isConnected) positionPlayerTableActionMenu();\n  });\n  return true;''',
              '''  menu.replaceChildren(...items);\n  menu.dataset.open = "false";\n  positionPlayerTableActionMenu();\n  void menu.offsetWidth;\n  requestAnimationFrame(() => {\n    if (playerTableActionTrigger !== trigger || !trigger.isConnected) return;\n    menu.dataset.open = "true";\n    positionPlayerTableActionMenu();\n  });\n  return true;''',
              'first-open transition lifecycle',
          )
          core_path.write_text(core)

          dropdowns_path = Path('dropdowns.css')
          dropdowns = dropdowns_path.read_text()
          dropdowns = replace_once(
              dropdowns,
              '  width: 210px;\n  min-width: 210px;',
              '  width: 200px;\n  min-width: 200px;',
              'slightly narrower Player action menu',
          )
          dropdowns_path.write_text(dropdowns)

          styles_path = Path('styles-base.css')
          styles = styles_path.read_text()
          styles = replace_once(
              styles,
              '''#tableBody tr:hover .playerNameLink:hover,\n#tableBody tr:hover a:hover,\n#tableBody tr:hover button:hover,\n#tableBody tr.tableRowHovered .playerNameLink:hover,\n#tableBody tr.tableRowHovered a:hover,\n#tableBody tr.tableRowHovered button:hover {''',
              '''#tableBody tr:hover .playerNameLink:hover,\n#tableBody tr:hover a:hover,\n#tableBody tr:hover button:not(.playerTableActionsButton):hover,\n#tableBody tr.tableRowHovered .playerNameLink:hover,\n#tableBody tr.tableRowHovered a:hover,\n#tableBody tr.tableRowHovered button:not(.playerTableActionsButton):hover {''',
              'row hover button exclusion',
          )
          styles_path.write_text(styles)

          validator_path = Path('validate-player-table-actions.mjs')
          validator = validator_path.read_text()
          validator = replace_once(
              validator,
              'dropdowns.includes("width: 210px;")\n    && dropdowns.includes("min-width: 210px;")',
              'dropdowns.includes("width: 200px;")\n    && dropdowns.includes("min-width: 200px;")',
              'menu width validation',
          )
          lifecycle_anchor = 'code.includes(\'menu.dataset.open = "true"\')'
          if lifecycle_anchor not in validator:
              raise SystemExit('first-open lifecycle validation anchor missing')
          validator = validator.replace(
              lifecycle_anchor,
              'code.includes(\'menu.dataset.open = "false"\')\n      && code.includes("void menu.offsetWidth")\n      && code.includes("requestAnimationFrame(() => {")\n      && code.includes(\'menu.dataset.open = "true"\')',
              1,
          )
          message_old = 'use compact menu typography and account-button hover'
          if message_old in validator:
              validator = validator.replace(message_old, 'use compact menu typography, first-open motion, and account-button hover', 1)
          validator_path.write_text(validator)
          PY
      - run: npm install --no-audit --no-fund
        working-directory: site
      - run: npm run build:core
        working-directory: site
      - run: npm run lint
        working-directory: site
      - run: npm run typecheck
        working-directory: site
      - run: npm run validate
        working-directory: site
      - name: Verify hover source ownership
        working-directory: site
        run: |
          grep -F '#tableBody tr:hover button:not(.playerTableActionsButton):hover' styles-base.css
          grep -F '#tableBody tr.tableRowHovered button:not(.playerTableActionsButton):hover' styles-base.css
          grep -F 'width: 200px;' dropdowns.css
          grep -F 'void menu.offsetWidth' modules/app-core.js
      - name: Commit refinement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/modules/app-core.js site/modules/app-core*-runtime.js site/dropdowns.css site/styles-base.css site/validate-player-table-actions.mjs
          git commit -m 'refine Player action dropdown transition and hover'
          git push origin HEAD:feat/issue-429-player-table-actions

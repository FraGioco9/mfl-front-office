name: Club startup validator ownership migration

on:
  push:
    branches:
      - refactor/source-owned-club-startup

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/source-owned-club-startup
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update Club startup validators
        run: node site/migrate-club-startup-validator-ownership.mjs
      - name: Remove temporary migration files
        shell: bash
        run: |
          rm -f site/migrate-club-startup-validator-ownership.mjs
          rm -f .github/workflows/club-startup-validator-ownership-migration.yml
      - name: Persist validator migration
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Club startup ownership validators"
          git push origin HEAD:refactor/source-owned-club-startup

name: Table header 1374 regression

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build canonical assets
        run: npm run build

      - name: Reproduce first-column ellipsis at 1374px
        run: node validation/browser-table-header-1374-regression.mjs

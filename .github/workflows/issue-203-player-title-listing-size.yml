name: Issue 203 player title listing size

on:
  push:
    branches:
      - fix/issue-203-player-listing-column

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-203-player-listing-column

      - name: Resize and center player title listing badge
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "site/styles.css",
              ".playerTitle > .listingCellContent {\n  margin-left: 6px;\n  font-size: 14px;\n  font-weight: 400;\n}",
              ".playerTitle > :is(.playerTitleName, .listingCellContent, .playerTitleNoteIcon) {\n  vertical-align: middle;\n}\n\n.playerTitle > .listingCellContent {\n  height: 22px;\n  margin-left: 6px;\n  font-size: 16px;\n  font-weight: 400;\n}\n\n.playerTitle > .listingCellContent .listingCellIcon {\n  flex-basis: 14px;\n  width: 14px;\n  height: 14px;\n}",
          )

          validator = Path("site/validate-listing-column.mjs")
          text = validator.read_text(encoding="utf-8")
          old = 'assert.match(styles, /\\.playerTitle > \\.listingCellContent \\{[\\s\\S]*margin-left: 6px;[\\s\\S]*font-size: 14px;/);'
          new = 'assert.match(styles, /\\.playerTitle > :is\\(\\.playerTitleName, \\.listingCellContent, \\.playerTitleNoteIcon\\) \\{[\\s\\S]*vertical-align: middle;/);\nassert.match(styles, /\\.playerTitle > \\.listingCellContent \\{[\\s\\S]*height: 22px;[\\s\\S]*font-size: 16px;/);\nassert.match(styles, /\\.playerTitle > \\.listingCellContent \\.listingCellIcon \\{[\\s\\S]*width: 14px;[\\s\\S]*height: 14px;/);'
          if text.count(old) != 1:
              raise SystemExit("validate-listing-column.mjs: old title badge assertion missing")
          validator.write_text(text.replace(old, new, 1), encoding="utf-8")

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: site
        run: npm install --no-audit --no-fund

      - name: Validate
        working-directory: site
        run: |
          npm run lint
          npm run typecheck
          npm run validate
          npm run verify:generated

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/styles.css site/validate-listing-column.mjs
          git commit -m "Resize player title listing badge"
          git push origin HEAD:fix/issue-203-player-listing-column

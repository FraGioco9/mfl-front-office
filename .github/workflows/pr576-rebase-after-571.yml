name: PR 576 rebase after 571

on:
  push:
    branches:
      - fix/573-watchlist-selector-route-exit

permissions:
  contents: write

jobs:
  rebase:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: fix/573-watchlist-selector-route-exit
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Rebase onto latest main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
      - name: Install dependencies
        working-directory: site
        run: npm ci --no-audit --no-fund
      - name: Verify rebased branch
        working-directory: site
        run: npm run check
      - name: Remove helper and push rebased branch
        run: |
          set -euo pipefail
          git rm .github/workflows/pr576-rebase-after-571.yml
          git commit -m "Remove PR 576 rebase helper"
          git push --force-with-lease origin HEAD:fix/573-watchlist-selector-route-exit

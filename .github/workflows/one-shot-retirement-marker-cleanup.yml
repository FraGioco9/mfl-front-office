# Temporary one-shot workflow; removed after the cleanup commit lands.
name: One-shot retirement marker source cleanup

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.issue.title == 'Trigger retirement marker cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rewrite retirement marker source directly
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          core_path = Path("site/modules/app-core.js")
          core = core_path.read_text(encoding="utf-8").replace("\r\n", "\n")

          def replace_section(text, start_marker, end_marker, replacement, label):
              start = text.find(start_marker)
              end = text.find(end_marker, start + len(start_marker)) if start >= 0 else -1
              if start < 0 or end < 0 or end <= start:
                  raise SystemExit(f"Could not locate {label}")
              return text[:start] + replacement + text[end:]

          core = replace_section(
              core,
              "function retirementMarker(row) {",
              "function newMintMarker(row) {",
              '''function retirementMarker(row) {
            const retirementYears = getValue(row, "retirement_years");

            if (retirementYears === 0) {
              return {
                icon: "calendar-x-2",
                label: "Retired",
              };
            }

            if ([1, 2, 3].includes(retirementYears)) {
              return {
                icon: "calendar-clock",
                label: `${retirementYears} year${retirementYears === 1 ? "" : "s"} left`,
              };
            }

            return null;
          }

          ''',
              "retirementMarker",
          )

          core = replace_section(
              core,
              "function appendNameMarker(cell, marker, className) {",
              "function playerRoute(playerId) {",
              '''function appendNameMarker(cell, marker, className) {
            if (!marker) {
              return;
            }

            const markerElement = document.createElement("span");
            markerElement.className = className;
            if (marker.icon) {
              const markerIcon = document.createElement("img");
              markerIcon.src = `/retirement-${marker.icon}.svg`;
              markerIcon.width = 16;
              markerIcon.height = 16;
              markerIcon.alt = "";
              markerIcon.setAttribute("aria-hidden", "true");
              markerElement.appendChild(markerIcon);
            } else {
              markerElement.textContent = marker.emoji;
            }
            markerElement.dataset.tooltip = marker.label;
            markerElement.setAttribute("aria-label", marker.label);
            cell.appendChild(markerElement);
          }

          ''',
              "appendNameMarker",
          )

          core = replace_section(
              core,
              "  const ageMarkerHtml = ageMarker\n",
              '  const agentWalletAddress = getValue(row, "wallet_address");',
              '''  const ageMarkerHtml = ageMarker
            ? ` <span class="retirementMarker playerAgeMarker" data-tooltip="${escapeHtml(ageMarker.label)}" aria-label="${escapeHtml(ageMarker.label)}"><img src="/retirement-${escapeHtml(ageMarker.icon)}.svg" width="16" height="16" alt="" aria-hidden="true"></span>`
            : "";
          ''',
              "player age retirement marker",
          )

          core_path.write_text(core, encoding="utf-8", newline="\n")

          build_path = Path("site/build-app-core.mjs")
          build = build_path.read_text(encoding="utf-8").replace("\r\n", "\n")
          helper_start = build.find("function replaceSourceSection(")
          tooltip_start = build.find("function normalizeTooltipHeightOwnership(", helper_start)
          if helper_start < 0 or tooltip_start < 0:
              raise SystemExit("Could not locate retirement compatibility build helpers")
          build = build[:helper_start] + build[tooltip_start:]

          old_invocation = '''const source = normalizeRetirementMarkerContract(
            removeResidualLegacyWidthCall(await readFile(sourcePath, "utf8")),
          );'''
          new_invocation = 'const source = removeResidualLegacyWidthCall(await readFile(sourcePath, "utf8"));'
          if old_invocation not in build:
              raise SystemExit("Could not locate retirement compatibility build invocation")
          build = build.replace(old_invocation, new_invocation, 1)
          build_path.write_text(build, encoding="utf-8", newline="\n")
          PY

      - name: Verify no old retirement symbols remain
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          roots = [Path("site"), Path(".github")]
          forbidden = [
              "1" + "F3C1",
              "1" + "f3c1",
              "23" + "F3",
              "23" + "f3",
              chr(0x1F3C1),
              chr(0x23F3),
          ]
          offenders = []
          for root in roots:
              for path in root.rglob("*"):
                  if not path.is_file() or path == Path(".github/workflows/one-shot-retirement-marker-cleanup.yml"):
                      continue
                  try:
                      text = path.read_text(encoding="utf-8")
                  except UnicodeDecodeError:
                      continue
                  for token in forbidden:
                      if token in text:
                          offenders.append(f"{path}: {token.encode('unicode_escape').decode()}")
          if offenders:
              raise SystemExit("Old retirement symbol references remain:\n" + "\n".join(offenders))
          PY

      - name: Build canonical core
        run: npm --prefix site run build:core

      - name: Commit direct source cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/modules/app-core.js site/build-app-core.mjs
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Remove old retirement marker references"
          git push origin HEAD:main

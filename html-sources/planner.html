
        <section id="plannerPage" class="pageView plannerPage" hidden>
          <header class="plannerPageHeader">
            <h2 class="tablePageTitle">Planner</h2>
            <div class="plannerPlanActions" aria-label="Plan actions">
              <button id="plannerNewPlanButton" class="compactButton" type="button">New Plan</button>
              <button id="plannerSavePlanButton" class="compactButton primary" type="button" disabled>Save Plan</button>
              <button id="plannerDuplicatePlanButton" class="compactButton" type="button" disabled>Duplicate Plan</button>
              <button id="plannerSharePlanButton" class="compactButton" type="button" disabled>Share Plan</button>
            </div>
          </header>

          <section class="plannerSetup" aria-label="Planner setup">
            <label class="plannerField plannerPlanNameField" for="plannerPlanNameInput">
              <span class="plannerFieldLabel">Plan name</span>
              <input id="plannerPlanNameInput" type="text" maxlength="80" placeholder="My plan" autocomplete="off">
            </label>

            <label class="plannerField plannerSavedPlanField" for="plannerSavedPlanSelect">
              <span class="plannerFieldLabel">Saved plans</span>
              <select id="plannerSavedPlanSelect">
                <option value="">Current plan</option>
              </select>
            </label>

            <div class="plannerField plannerClubPicker">
              <label class="plannerFieldLabel" for="plannerClubSearchInput">Club</label>
              <div class="plannerClubSearchWrap">
                <div class="plannerSearchControl">
                  <input id="plannerClubSearchInput" type="text" autocomplete="off" spellcheck="false" placeholder="Search by Club ID or name" aria-autocomplete="list" aria-controls="plannerClubSearchResults">
                  <button id="plannerClubSearchClearButton" class="iconButton popupCloseButton plannerSearchClearButton" type="button" aria-label="Clear Club search" hidden></button>
                </div>
                <div id="plannerClubSearchResults" class="plannerClubSearchResults" role="listbox" hidden></div>
              </div>
            </div>
          </section>

          <div id="plannerSharedNotice" class="plannerSharedNotice" hidden>
            You are viewing a shared read-only plan. Duplicate it to create your own editable copy.
          </div>

          <section id="plannerWorkspace" class="plannerWorkspace" hidden>
            <section class="plannerPitchPanel" aria-labelledby="plannerPitchSectionTitle">
              <div class="plannerWorkspaceHeader">
                <div class="plannerPitchHeaderMain">
                  <div class="plannerSectionHeading">
                    <span class="plannerSectionEyebrow">Formation</span>
                    <h3 id="plannerPitchSectionTitle">Pitch</h3>
                  </div>
                  <div id="plannerClubIdentity" class="plannerClubIdentity">
                    <div class="plannerClubLogoFrame">
                      <img id="plannerClubLogo" class="plannerClubLogo" alt="" hidden>
                    </div>
                    <div class="plannerClubIdentityText">
                      <span class="plannerClubEyebrow">Club</span>
                      <strong id="plannerClubName" class="plannerClubName">Select a Club</strong>
                    </div>
                  </div>
                </div>
                <label class="plannerFormationField" for="plannerFormationSelect">
                  <span>Formation</span>
                  <select id="plannerFormationSelect"></select>
                </label>
              </div>
              <div id="plannerPitch" class="pitch plannerPitch" aria-label="Formation squad depths">
                <span class="pitchLine pitchBoxTop"></span><span class="pitchLine pitchGoalTop"></span><span class="pitchLine pitchArcTop"></span><span class="pitchLine pitchBoxBottom"></span><span class="pitchLine pitchGoalBottom"></span><span class="pitchLine pitchArcBottom"></span>
              </div>
            </section>

            <aside class="plannerRosterPanel" aria-labelledby="plannerSquadSectionTitle">
              <div class="plannerRosterHeader">
                <div>
                  <span class="plannerRosterEyebrow">Squad</span>
                  <h3 id="plannerSquadSectionTitle">Squad list</h3>
                </div>
                <span id="plannerRosterCount" class="plannerRosterCount">0</span>
              </div>
              <div class="plannerPlayerPicker">
                <label class="plannerFieldLabel" for="plannerPlayerSearchInput">Add player</label>
                <div class="plannerPlayerSearchWrap">
                  <div class="plannerSearchControl plannerPlayerSearchControl">
                    <input id="plannerPlayerSearchInput" type="text" autocomplete="off" spellcheck="false" placeholder="Search database by player ID or name" aria-autocomplete="list" aria-controls="plannerPlayerSearchResults">
                    <button id="plannerPlayerSearchClearButton" class="iconButton popupCloseButton plannerSearchClearButton" type="button" aria-label="Clear player search" hidden></button>
                  </div>
                  <div id="plannerPlayerSearchResults" class="plannerPlayerSearchResults" role="listbox" hidden></div>
                </div>
              </div>
              <div id="plannerRoster" class="plannerRoster"></div>
            </aside>
          </section>

          <p id="plannerStatus" class="plannerStatus" role="status" aria-live="polite">Choose a Club to start planning.</p>
        </section>

            renderFormation(selectedFormationForClub(clubId));
            if (!clubId) return;

            const selector = document.getElementById("plannerTeamSelector");
            const selectedTeam = document.getElementById("plannerSelectedTeam");
            const workspace = document.getElementById("plannerWorkspace");
            const teamLogo = document.getElementById("plannerTeamLogo");
            const teamId = document.getElementById("plannerTeamId");

            const rosterBody = document.getElementById("plannerRosterBody");
            const rosterStatus = document.getElementById("plannerRosterStatus");

            if (selector instanceof HTMLElement) selector.hidden = true;
            if (selectedTeam instanceof HTMLElement) selectedTeam.hidden = false;
            if (workspace instanceof HTMLElement) workspace.hidden = false;
            if (teamLogo instanceof HTMLImageElement) {
              teamLogo.hidden = false;
              teamLogo.src = "https://d13e14gtps4iwl.cloudfront.net/u/clubs/" + encodeURIComponent(clubId) + "/logo.webp";
            }
            if (teamId instanceof HTMLElement) teamId.textContent = "Club #" + clubId;

            // Reuse the Club page's persisted identity before the first visible paint.
            // A new or uncached Club remains empty rather than displaying guessed details.
            try {
              const stored = JSON.parse(localStorage.getItem("mfl-club-display-data-v1") || "{}");
              const cached = stored && typeof stored === "object" && !Array.isArray(stored) ? stored[clubId] : null;
              if (cached && String(cached.clubId || clubId).trim() === clubId) {
                const name = String(cached.name || "").trim();
                const divisionName = String(cached.divisionName || "").trim();
                const divisionColor = String(cached.divisionColor || "").trim();
                const validColor = value => /^#[0-9a-f]{6}$/iu.test(String(value || "").trim())
                  ? String(value).trim().toLowerCase() : "";
                const teamName = document.getElementById("plannerTeamName");
                const teamDivision = document.getElementById("plannerTeamDivision");
                const teamCard = document.getElementById("plannerTeamCard");
                if (name && teamName instanceof HTMLElement) teamName.textContent = name;
                if (divisionName && teamDivision instanceof HTMLElement) {
                  teamDivision.textContent = divisionName;
                  teamDivision.hidden = false;
                  teamDivision.style.color = validColor(divisionColor);
                }
                if (teamCard instanceof HTMLElement) {
                  const primary = validColor(cached.primaryColor);
                  const secondary = validColor(cached.secondaryColor);
                  if (primary || secondary) {
                    teamCard.style.setProperty("--my-club-primary", primary || secondary);
                    teamCard.style.setProperty("--my-club-secondary", secondary || primary);
                  }
                }
                const city = String(cached.city || "").trim();
                const nation = String(cached.nation || "").trim();
                const country = nation.toLowerCase().replaceAll("_", " ").split(" ")
                  .filter(Boolean).map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(" ");
                const location = [city, country].filter(Boolean).join(", ");
                const teamLocation = document.getElementById("plannerTeamLocation");
                if (location && teamLocation instanceof HTMLElement) {
                  teamLocation.replaceChildren();
                  if (nation) {
                    // Match the shared Club flag renderer before the Planner route core loads.
                    const flagCountryCodes = {
                    ALBANIA: "AL", ALGERIA: "DZ", ARGENTINA: "AR", AUSTRALIA: "AU", AUSTRIA: "AT",
                    BELGIUM: "BE", BOSNIA_AND_HERZEGOVINA: "BA", BRAZIL: "BR", CAMEROON: "CM",
                    CANADA: "CA", CAPE_VERDE_ISLANDS: "CV", CHILE: "CL", COLOMBIA: "CO", CONGO_DR: "CD",
                    COSTA_RICA: "CR", COTE_D_IVOIRE: "CI", CROATIA: "HR", CURACAO: "CW", CZECH_REPUBLIC: "CZ",
                    CZECHIA: "CZ", DENMARK: "DK", ECUADOR: "EC", EGYPT: "EG",
                    ENGLAND: "1f3f4-e0067-e0062-e0065-e006e-e0067-e007f", FINLAND: "FI", FRANCE: "FR",
                    GEORGIA: "GE", GERMANY: "DE", GHANA: "GH", HAITI: "HT", HUNGARY: "HU", IRAN: "IR",
                    IRAQ: "IQ", ITALY: "IT", IVORY_COAST: "CI", JAPAN: "JP", JORDAN: "JO",
                    KOREA_REPUBLIC: "KR", MEXICO: "MX", MOROCCO: "MA", NETHERLANDS: "NL", NEW_ZEALAND: "NZ",
                    NIGERIA: "NG", NORWAY: "NO", PANAMA: "PA", PARAGUAY: "PY", PERU: "PE", POLAND: "PL",
                    PORTUGAL: "PT", QATAR: "QA", REPUBLIC_OF_IRELAND: "IE", ROMANIA: "RO", RUSSIA: "RU",
                    SAUDI_ARABIA: "SA", SCOTLAND: "1f3f4-e0067-e0062-e0073-e0063-e0074-e007f", SENEGAL: "SN",
                    SERBIA: "RS", SLOVAKIA: "SK", SLOVENIA: "SI", SOUTH_AFRICA: "ZA", SOUTH_KOREA: "KR",
                    SPAIN: "ES", SWEDEN: "SE", SWITZERLAND: "CH", TUNISIA: "TN", TURKEY: "TR", UKRAINE: "UA",
                    UNITED_KINGDOM: "GB", UNITED_STATES: "US", UNITED_STATES_OF_AMERICA: "US", URUGUAY: "UY",
                    USA: "US", UZBEKISTAN: "UZ", WALES: "1f3f4-e0067-e0062-e0077-e006c-e0073-e007f"
                    };
                    const nationKey = nation.toUpperCase().replaceAll("&", "AND")
                      .replace(/[^A-Z0-9]+/g, "_").replace(/^_+|_+$/g, "");
                    const code = flagCountryCodes[nationKey];
                    if (code) {
                      const codepoints = code.includes("-") ? code : code.toUpperCase().split("")
                        .map(character => (127397 + character.charCodeAt(0)).toString(16)).join("-");
                      const flag = document.createElement("img");
                      flag.className = "flagImage clubLocationFlag";
                      flag.src = "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/" + codepoints + ".svg";
                      flag.alt = "";
                      flag.dataset.tooltip = country;
                      flag.setAttribute("aria-label", country);
                      flag.loading = "eager";
                      teamLocation.appendChild(flag);
                    }
                  }
                  const locationText = document.createElement("span");
                  locationText.className = "clubLocationText";
                  locationText.textContent = location;
                  teamLocation.appendChild(locationText);
                  teamLocation.hidden = false;
                }
              }
            } catch {
              // Storage can be unavailable, corrupt or empty without blocking Planner.
            }
            if (rosterBody instanceof HTMLElement && !rosterBody.childElementCount) {
              rosterBody.setAttribute("aria-busy", "true");
              for (let index = 0; index < 8; index += 1) {
                const row = document.createElement("tr");
                row.setAttribute("aria-hidden", "true");
                for (let column = 0; column < 7; column += 1) {
                  const cell = document.createElement("td");
                  const skeleton = document.createElement("span");
                  skeleton.className = "plannerRosterSkeleton";
                  cell.appendChild(skeleton);
                  row.appendChild(cell);
                }
                rosterBody.appendChild(row);
              }
            }
            if (rosterStatus instanceof HTMLElement) {
              rosterStatus.textContent = "Loading squad…";
              rosterStatus.hidden = false;
            }
          })();
        </script>

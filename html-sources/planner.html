        <section id="plannerPage" class="pageView plannerPage" hidden>
          <h2 class="tablePageTitle">Planner</h2>
          <section id="plannerTeamSelector" class="plannerTeamSelector" aria-label="Team selection">
            <label class="plannerTeamSearchLabel" for="plannerTeamSearchInput">Team</label>
            <div class="plannerTeamSearch">
              <div class="plannerTeamSearchControl">

                <button id="plannerTeamSearchClearButton" class="iconButton popupCloseButton plannerTeamSearchClearButton" type="button" aria-label="Clear team search" hidden></button>
              </div>
              <div id="plannerTeamSearchResults" class="plannerTeamSearchResults" role="listbox" hidden></div>
            </div>
          </section>
          <div id="plannerSelectedTeam" class="plannerSelectedTeam" hidden>
            <div id="plannerTeamCard" class="myClubCard plannerTeamCard" aria-label="Selected club">
              <div id="plannerTeamLogoFrame" class="myClubLogoFrame clubIdentityLogoFrame plannerTeamLogoFrame">
                <img id="plannerTeamLogo" class="myClubLogo clubIdentityLogo plannerTeamLogo" alt="" width="132" height="144">
              </div>
              <div class="clubIdentityMain plannerTeamCardBody">
                <div class="clubIdentityPrimary plannerTeamCardInfo">
                  <span id="plannerTeamId" class="clubIdentityId"></span>
                  <h3 id="plannerTeamName" class="clubIdentityName"></h3>
                  <div class="clubIdentityMeta">
                    <span id="plannerTeamDivision" class="clubIdentityDivision"></span>
                    <span id="plannerTeamLocation" class="clubIdentityLocation" hidden></span>
                  </div>
                </div>
              </div>
            </div>
            <button id="plannerTeamClearButton" class="compactButton" type="button">Clear</button>
          </div>
          <div id="plannerWorkspace" class="plannerWorkspace" hidden>
            <section class="plannerRosterPanel" aria-labelledby="plannerRosterHeading">
              <div class="plannerRosterHeader">
                <h3 id="plannerRosterHeading">Squad <span id="plannerRosterCount"></span></h3>
                <button id="plannerAddPlayerButton" class="compactButton" type="button" aria-haspopup="dialog" aria-controls="plannerPlayerModal">Add player(s)</button>
              </div>
              <section class="tableShell" aria-label="Planned squad table">
                <div class="playerTableScroller">
                  <table class="plannerRosterTable" aria-label="Planned squad">
                    <colgroup><col class="plannerNationalityColumn"><col class="plannerPlayerColumn"><col class="plannerPositionColumn"><col class="plannerAgeColumn"><col class="plannerOverallColumn"><col class="plannerContractColumn"><col class="plannerRemoveColumn"></colgroup>
                    <thead><tr><th scope="col" aria-label="Nationality"></th><th scope="col">Player</th><th scope="col">Position</th><th scope="col">Age</th><th scope="col">Overall</th><th scope="col">Contract</th><th scope="col" aria-label="Remove player"></th></tr></thead>
                    <tbody id="plannerRosterBody"></tbody>
                    <tfoot>
                      <tr class="plannerRosterTotalsRow">
                        <th scope="row" colspan="2">Squad totals</th>
                        <td></td>
                        <td id="plannerAverageAge">—</td>
                        <td id="plannerAverageOverall">—</td>
                        <td id="plannerTotalContracts">—</td>
                        <td></td>
                      </tr>
                    </tfoot>
                  </table>
                </div>
              </section>
              <p id="plannerRosterStatus" class="plannerStatus" role="status" aria-live="polite" hidden></p>
              <button id="plannerRosterRetryButton" class="compactButton" type="button" hidden>Retry</button>
            </section>
            <section class="plannerPitchPanel" aria-labelledby="plannerPitchHeading">
              <h3 id="plannerPitchHeading">Depth</h3>
              <div class="pitch plannerPitch" role="img" aria-label="Squad depth pitch">
                <span class="pitchLine pitchBoxTop"></span><span class="pitchLine pitchGoalTop"></span><span class="pitchLine pitchArcTop"></span>
                <span class="pitchLine pitchBoxBottom"></span><span class="pitchLine pitchGoalBottom"></span><span class="pitchLine pitchArcBottom"></span>
              </div>
            </section>
          </div>
          <div id="plannerPlayerModal" class="modalBackdrop plannerPlayerModalBackdrop" hidden>
            <section class="mflDialog plannerPlayerDialog" role="dialog" aria-modal="true" aria-labelledby="plannerPlayerModalTitle">
              <header class="mflDialogHeader">
                <h2 id="plannerPlayerModalTitle">Add players</h2>
                <button id="plannerPlayerModalCloseButton" class="iconButton popupCloseButton" type="button" aria-label="Close Add players"></button>
              </header>
              <section class="plannerPlayerModalBody">
                <div class="plannerPlayerSearchControl">
                  <input id="plannerPlayerSearchInput" type="text" autocomplete="off" spellcheck="false" placeholder="Search by player ID or name" aria-autocomplete="list" aria-controls="plannerPlayerSearchResults">
                  <button id="plannerPlayerSearchClearButton" class="iconButton popupCloseButton plannerPlayerSearchClearButton" type="button" aria-label="Clear player search" hidden></button>
                </div>
                <p id="plannerPlayerSelectionStatus" class="plannerPlayerSelectionStatus" role="status" aria-live="polite"></p>
                <div id="plannerPlayerSearchResults" class="plannerPlayerSearchResults" hidden>
                  <table class="plannerPlayerSearchTable" aria-label="Player search results">
                    <colgroup>
                      <col class="plannerPlayerSearchFlagColumn">
                      <col class="plannerPlayerSearchNameColumn">
                      <col class="plannerPlayerSearchPositionsColumn">
                      <col class="plannerPlayerSearchAgeColumn">
                      <col class="plannerPlayerSearchOverallColumn">
                      <col class="plannerPlayerSearchSelectColumn">
                    </colgroup>
                    <thead>
                      <tr>
                        <th scope="col" aria-label="Nationality"></th>
                        <th scope="col">Name</th>
                        <th scope="col">Position</th>
                        <th scope="col">Age</th>
                        <th scope="col">Overall</th>
                        <th scope="col">Select</th>
                      </tr>
                    </thead>
                    <tbody id="plannerPlayerSearchBody"></tbody>
                  </table>
                  <div id="plannerPlayerSearchEmpty" class="searchHint" hidden>No players found.</div>
                  <button id="plannerPlayerSearchMore" class="plannerPlayerSearchMore" type="button" hidden>Load more players</button>
                </div>
                <section id="plannerPlayerSelection" class="plannerPlayerSelection" aria-label="Selected players" hidden>
                  <h3>Selected <span id="plannerPlayerSelectionCount">0</span></h3>
                  <div class="plannerPlayerSelectionTableShell">
                    <table class="plannerPlayerSearchTable plannerPlayerSelectionTable" aria-label="Selected players">
                      <colgroup>
                        <col class="plannerPlayerSearchFlagColumn">
                        <col class="plannerPlayerSearchNameColumn">
                        <col class="plannerPlayerSearchPositionsColumn">
                        <col class="plannerPlayerSearchAgeColumn">
                        <col class="plannerPlayerSearchOverallColumn">
                        <col class="plannerPlayerSearchSelectColumn">
                      </colgroup>
                      <thead>
                        <tr>
                          <th scope="col" aria-label="Nationality"></th>
                          <th scope="col">Name</th>
                          <th scope="col">Position</th>
                          <th scope="col">Age</th>
                          <th scope="col">Overall</th>
                          <th scope="col" aria-label="Remove selected player"></th>
                        </tr>
                      </thead>
                      <tbody id="plannerPlayerSelectionBody"></tbody>
                    </table>
                  </div>
                </section>
              </section>
              <footer class="mflDialogFooter plannerPlayerModalFooter">
                <button id="plannerPlayerDiscardButton" type="button">Discard</button>
                <button id="plannerPlayerConfirmButton" type="button" disabled>Add</button>
              </footer>
            </section>
          </div>
          <p id="plannerStatus" class="plannerStatus" role="status" aria-live="polite" hidden></p>
        </section>
        <script>
          (() => {
            const root = document.documentElement;
            const initialPage = String(root.dataset.initialPage || "").replace(/\/+$/, "");
            if (initialPage !== "planner") return;

            const page = document.getElementById("plannerPage");
            if (!(page instanceof HTMLElement)) return;

            document.body.dataset.page = "planner";
            if (root.dataset.storedWalletOptIn !== "true") {
              const locked = document.getElementById("myPlayersLockedPage");
              const title = document.getElementById("optInLockedTitle");
              const message = document.getElementById("optInLockedMessage");
              if (title instanceof HTMLElement) title.textContent = "Planner";
              if (message instanceof HTMLElement) message.textContent = "In order to use Planner, you need to opt in.";
              if (locked instanceof HTMLElement) locked.hidden = false;
              return;
            }
            page.hidden = false;

            const clubId = String(new URLSearchParams(location.search).get("club") || "").trim();
            if (!clubId) return;

            const selector = document.getElementById("plannerTeamSelector");
            const selectedTeam = document.getElementById("plannerSelectedTeam");
            const workspace = document.getElementById("plannerWorkspace");
            const teamLogo = document.getElementById("plannerTeamLogo");
            const teamId = document.getElementById("plannerTeamId");

            const rosterBody = document.getElementById("plannerRosterBody");
            const rosterStatus = document.getElementById("plannerRosterStatus");

            if (selector instanceof HTMLElement) selector.hidden = true;
            if (selectedTeam instanceof HTMLElement) selectedTeam.hidden = false;
            if (workspace instanceof HTMLElement) workspace.hidden = false;
            if (teamLogo instanceof HTMLImageElement) {
              teamLogo.hidden = false;
              teamLogo.src = "https://d13e14gtps4iwl.cloudfront.net/u/clubs/" + encodeURIComponent(clubId) + "/logo.webp";
            }
            if (teamId instanceof HTMLElement) teamId.textContent = "Club #" + clubId;

            // Reuse the Club page's persisted identity before the first visible paint.
            // A new or uncached Club remains empty rather than displaying guessed details.
            try {
              const stored = JSON.parse(localStorage.getItem("mfl-club-display-data-v1") || "{}");
              const cached = stored && typeof stored === "object" && !Array.isArray(stored) ? stored[clubId] : null;
              if (cached && String(cached.clubId || clubId).trim() === clubId) {
                const name = String(cached.name || "").trim();
                const divisionName = String(cached.divisionName || "").trim();
                const divisionColor = String(cached.divisionColor || "").trim();
                const validColor = value => /^#[0-9a-f]{6}$/iu.test(String(value || "").trim())
                  ? String(value).trim().toLowerCase() : "";
                const teamName = document.getElementById("plannerTeamName");
                const teamDivision = document.getElementById("plannerTeamDivision");
                const teamCard = document.getElementById("plannerTeamCard");
                if (name && teamName instanceof HTMLElement) teamName.textContent = name;
                if (divisionName && teamDivision instanceof HTMLElement) {
                  teamDivision.textContent = divisionName;
                  teamDivision.hidden = false;
                  teamDivision.style.color = validColor(divisionColor);
                }
                if (teamCard instanceof HTMLElement) {
                  const primary = validColor(cached.primaryColor);
                  const secondary = validColor(cached.secondaryColor);
                  if (primary || secondary) {
                    teamCard.style.setProperty("--my-club-primary", primary || secondary);
                    teamCard.style.setProperty("--my-club-secondary", secondary || primary);
                  }
                }
                const city = String(cached.city || "").trim();
                const nation = String(cached.nation || "").trim();
                const country = nation.toLowerCase().replaceAll("_", " ").split(" ")
                  .filter(Boolean).map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(" ");
                const location = [city, country].filter(Boolean).join(", ");
                const teamLocation = document.getElementById("plannerTeamLocation");
                if (location && teamLocation instanceof HTMLElement) {
                  teamLocation.replaceChildren();
                  if (nation) {
                    const flagSlot = document.createElement("span");
                    flagSlot.className = "clubLocationFlag";
                    flagSlot.setAttribute("aria-hidden", "true");
                    flagSlot.style.cssText = "display:inline-block;flex:0 0 18px;width:18px;height:18px";
                    teamLocation.appendChild(flagSlot);
                  }
                  const locationText = document.createElement("span");
                  locationText.className = "clubLocationText";
                  locationText.textContent = location;
                  teamLocation.appendChild(locationText);
                  teamLocation.hidden = false;
                }
              }
            } catch {
              // Storage can be unavailable, corrupt or empty without blocking Planner.
            }
            if (rosterBody instanceof HTMLElement && !rosterBody.childElementCount) {
              rosterBody.setAttribute("aria-busy", "true");
              for (let index = 0; index < 8; index += 1) {
                const row = document.createElement("tr");
                row.setAttribute("aria-hidden", "true");
                for (let column = 0; column < 7; column += 1) {
                  const cell = document.createElement("td");
                  const skeleton = document.createElement("span");
                  skeleton.className = "plannerRosterSkeleton";
                  cell.appendChild(skeleton);
                  row.appendChild(cell);
                }
                rosterBody.appendChild(row);
              }
            }
            if (rosterStatus instanceof HTMLElement) {
              rosterStatus.textContent = "Loading squad…";
              rosterStatus.hidden = false;
            }
          })();
        </script>

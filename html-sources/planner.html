
        <section id="plannerPage" class="pageView plannerPage" hidden>
          <header class="plannerPageHeader">
            <h2 class="tablePageTitle">Planner</h2>
          </header>

          <section class="plannerTeamSearch" aria-label="Team search">
            <label class="plannerFieldLabel" for="plannerClubSearchInput">Team</label>
            <div class="plannerClubSearchWrap">
              <div class="plannerSearchControl">
                <input id="plannerClubSearchInput" type="text" autocomplete="off" spellcheck="false" placeholder="Search by team ID or name" aria-autocomplete="list" aria-controls="plannerClubSearchResults">
                <button id="plannerClubSearchClearButton" class="iconButton popupCloseButton plannerSearchClearButton" type="button" aria-label="Clear team search" hidden></button>
              </div>
              <div id="plannerClubSearchResults" class="plannerClubSearchResults" role="listbox" hidden></div>
            </div>
          </section>

          <section id="plannerWorkspace" class="plannerSelection" aria-label="Selected team" hidden>
            <div id="plannerClubIdentity" class="plannerClubIdentity">
              <div class="plannerClubLogoFrame">
                <img id="plannerClubLogo" class="plannerClubLogo" alt="" hidden>
              </div>
              <strong id="plannerClubName" class="plannerClubName"></strong>
            </div>
          </section>

          <p id="plannerStatus" class="plannerStatus" role="status" aria-live="polite" hidden></p>
        </section>

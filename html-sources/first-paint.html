      (() => {
        const root = document.documentElement;
        root.dataset.initialPage = window.location.pathname.replace(/^\//, "") || "home";

        // BEGIN GENERATED FIRST-PAINT ROUTE CONFIG
        const FIRST_PAINT_APP_NAME = "MFL Front Office";
        const cleanFirstPaintTitleText = (value) => String(value || "").replace(/\s+/g, " ").trim();
        const firstPaintTitleWithAppName = (label) => {
          const text = cleanFirstPaintTitleText(label);
          return text ? `${text} - ${FIRST_PAINT_APP_NAME}` : FIRST_PAINT_APP_NAME;
        };
        const decodeFirstPaintRoutePart = (value) => {
          try {
            return decodeURIComponent(String(value || ""));
          } catch {
            return String(value || "");
          }
        };
        const firstPaintRouteParts = String(window.location.pathname || "/").split("/").filter(Boolean);
        const firstPaintRouteRoot = String(firstPaintRouteParts[0] || "").toLowerCase();
        const firstPaintPlayerTitle = () => {
          const playerId = cleanFirstPaintTitleText(firstPaintRouteParts[1]);
          if (!playerId) return firstPaintTitleWithAppName("Player");
          try {
            const cached = JSON.parse(sessionStorage.getItem(`mfl-player-first-paint-v1:${playerId}`) || "null");
            const name = cleanFirstPaintTitleText(cached?.name || cached?.knownValues?.name?.display || cached?.knownValues?.name?.raw);
            return firstPaintTitleWithAppName(name || "Player");
          } catch {
            return firstPaintTitleWithAppName("Player");
          }
        };
        const firstPaintClubTitle = () => {
          const clubId = cleanFirstPaintTitleText(decodeFirstPaintRoutePart(firstPaintRouteParts[1]));
          if (!clubId) return firstPaintTitleWithAppName("Club");
          try {
            const stored = JSON.parse(localStorage.getItem("mfl-club-display-data-v1") || "{}");
            const identity = stored && typeof stored === "object" && !Array.isArray(stored) ? stored[clubId] : null;
            const name = cleanFirstPaintTitleText(identity?.name);
            const division = cleanFirstPaintTitleText(identity?.divisionName);
            return firstPaintTitleWithAppName(name ? (division ? `${name} - ${division}` : name) : "Club");
          } catch {
            return firstPaintTitleWithAppName("Club");
          }
        };
        const firstPaintAgentTitle = () => {
          const address = cleanFirstPaintTitleText(decodeFirstPaintRoutePart(firstPaintRouteParts[1])).toLowerCase();
          if (!address) return firstPaintTitleWithAppName("Agent");
          try {
            const normalized = address.startsWith("0x") ? address : `0x${address}`;
            const linkedWalletRaw = cleanFirstPaintTitleText(localStorage.getItem("mfl-linked-wallet-v1")).toLowerCase();
            const linkedWallet = linkedWalletRaw ? (linkedWalletRaw.startsWith("0x") ? linkedWalletRaw : `0x${linkedWalletRaw}`) : "";
            const linkedDisplay = JSON.parse(localStorage.getItem("mfl-linked-wallet-display-name-v1") || "null");
            const linkedDisplayAddressRaw = cleanFirstPaintTitleText(linkedDisplay?.address).toLowerCase();
            const linkedDisplayAddress = linkedDisplayAddressRaw
              ? (linkedDisplayAddressRaw.startsWith("0x") ? linkedDisplayAddressRaw : `0x${linkedDisplayAddressRaw}`)
              : "";
            const names = JSON.parse(localStorage.getItem("mfl-agent-display-names-v1") || "{}");
            const name = linkedWallet === normalized && linkedDisplayAddress === normalized
              ? cleanFirstPaintTitleText(linkedDisplay?.name)
              : cleanFirstPaintTitleText(names && typeof names === "object" ? names[normalized] : "");
            if (!name) return firstPaintTitleWithAppName("Agent");
            return firstPaintTitleWithAppName(name.toLowerCase() === normalized ? normalized : `${name} - ${normalized}`);
          } catch {
            return firstPaintTitleWithAppName("Agent");
          }
        };
        const firstPaintWatchlistTitle = () => {
          try {
            const candidateId = cleanFirstPaintTitleText(decodeFirstPaintRoutePart(firstPaintRouteParts[1]));
            const viewSlugs = new Set(["attributes", "next-overall", "contracts", "current-season", "all-time"]);
            const watchlistId = candidateId && !viewSlugs.has(candidateId.toLowerCase()) ? candidateId : "";
            const linkedWalletRaw = cleanFirstPaintTitleText(localStorage.getItem("mfl-linked-wallet-v1")).toLowerCase();
            const linkedWallet = linkedWalletRaw ? (linkedWalletRaw.startsWith("0x") ? linkedWalletRaw : `0x${linkedWalletRaw}`) : "";
            const stored = linkedWallet
              ? JSON.parse(localStorage.getItem(`mfl-wallet-watchlist-v1:${linkedWallet}`) || "[]")
              : [];
            const watchlists = Array.isArray(stored) ? stored : [];
            const selected = (watchlistId
              ? watchlists.find((watchlist) => cleanFirstPaintTitleText(watchlist?.id) === watchlistId)
              : null) || watchlists[0] || null;
            const name = cleanFirstPaintTitleText(selected?.name);
            return firstPaintTitleWithAppName(name ? `Watchlist - ${name}` : "Watchlist");
          } catch {
            return firstPaintTitleWithAppName("Watchlist");
          }
        };
        const firstPaintEvaluationTitle = () => {
          const params = new URLSearchParams(window.location.search);
          const identities = [
            ["saved", cleanFirstPaintTitleText(params.get("saved"))],
            ["share", cleanFirstPaintTitleText(params.get("share"))],
            ["player", cleanFirstPaintTitleText(params.get("player"))],
          ];
          let playerName = "";
          try {
            for (const [kind, id] of identities) {
              if (!id) continue;
              playerName = cleanFirstPaintTitleText(sessionStorage.getItem(`mfl-evaluation-first-paint-name-v2:${kind}:${id}`));
              if (playerName) break;
            }
          } catch {}
          if (!playerName) {
            const currentTitle = cleanFirstPaintTitleText(document.title);
            const prefix = "Evaluation - ";
            const suffix = ` - ${FIRST_PAINT_APP_NAME}`;
            if (currentTitle.startsWith(prefix) && currentTitle.endsWith(suffix) && currentTitle !== firstPaintTitleWithAppName("Evaluation")) {

          settings: "Settings",
          changelog: "Changelog",

          "hideRetired", "hideRetiring", "hideMfl", "packableOnly", "newMintsOnly",
        ]);
        const INITIAL_TABLE_URL_SORT_KEYS = new Set(["sort", "direction"]);
        const INITIAL_TABLE_URL_OPERATORS_BY_TOKEN = Object.freeze({
          primary: "primary_is",
          canplay: "can_play",
          after: "after",
          before: "before",
          during: "during",
          is: "=",
          contains: "contains",
          gte: ">=",
          lte: "<=",
          between: "between",
        });
        const INITIAL_TABLE_FILTER_POSITION_VALUES = new Set(["GK", "RB", "LB", "CB", "RWB", "LWB", "CDM", "RM", "LM", "CM", "CAM", "RW", "LW", "CF", "ST"]);
        const INITIAL_TABLE_FILTER_CONTRACT_STATUS_VALUES = new Set(["under_contract", "free_agent", "development_center"]);
        const INITIAL_TABLE_FILTER_LISTING_VALUES = new Set(["for_sale", "not_for_sale"]);
        const INITIAL_TABLE_FILTER_NUMBER_COLUMNS = new Set([
          "player_id", "listing_price", "age", "owned_since", "player_seasons", ...INITIAL_TABLE_FILTER_STAT_COLUMNS,
        ]);

        function initialTableFilterOperators(column) {
          if (column === "positions") return new Set(["primary_is", "can_play"]);
          if (column === "owned_since") return new Set(["after", "before", "during"]);
          if (column === "contract_status" || column === "listing_price" || column === "nationality") return new Set(["="]);
          if (column === "name" || column === "wallet_name") return new Set(["contains"]);
          if (
            INITIAL_TABLE_FILTER_NUMBER_COLUMNS.has(column)
            || column.endsWith("_prog_current_season")
            || column.endsWith("_prog_all")
          ) {
            return new Set([">=", "<=", "between", "="]);
          }
          return new Set(["contains"]);
        }

        function initialTableUrlRuleIsValid(column, operator, value, valueTo = "") {
          if (!initialTableFilterOperators(column).has(operator) || !String(value || "").trim()) return false;
          if ((operator === "between" || operator === "during") && !String(valueTo || "").trim()) return false;
          if (column === "positions") return INITIAL_TABLE_FILTER_POSITION_VALUES.has(String(value));
          if (column === "contract_status") return INITIAL_TABLE_FILTER_CONTRACT_STATUS_VALUES.has(String(value));
          if (column === "listing_price") return INITIAL_TABLE_FILTER_LISTING_VALUES.has(String(value));
          if (column === "owned_since") {
            const isoDate = /^\d{4}-\d{2}-\d{2}$/;
            return isoDate.test(String(value)) && (operator !== "during" || isoDate.test(String(valueTo)));
          }
          if (
            INITIAL_TABLE_FILTER_NUMBER_COLUMNS.has(column)
            || column.endsWith("_prog_current_season")
            || column.endsWith("_prog_all")
          ) {
            return Number.isFinite(Number(value))
              && (operator !== "between" || Number.isFinite(Number(valueTo)));
          }
          return true;
        }

        function initialTableUrlRules(pageName, viewName, params) {
          const entries = [];
          for (const [key, rawValue] of params.entries()) {
            if (INITIAL_TABLE_URL_QUICK_FILTER_KEYS.has(key) || INITIAL_TABLE_URL_SORT_KEYS.has(key)) continue;
            const match = String(key || "").match(/^(or\.)?([^.]+)\.([a-z]+)(?:\.(from|to))?$/);
            if (!match) continue;
            const operator = INITIAL_TABLE_URL_OPERATORS_BY_TOKEN[match[3]] || "";
            const column = match[2];
            const connector = match[1] ? "or" : "and";
            const rangeSide = match[4] || "";
            if (!operator || !initialTableFilterColumnAllowed(pageName, viewName, column)) continue;

            const rangeOperator = operator === "between" || operator === "during";
            if (rangeOperator !== Boolean(rangeSide)) continue;
            const value = String(rawValue || "");

            if (rangeOperator) {
              if (rangeSide === "from") {
                entries.push({ column, connector, operator, value, valueTo: "" });
                continue;
              }
              const openRange = [...entries].reverse().find((entry) => (
                entry.column === column
                && entry.connector === connector
                && entry.operator === operator
                && !entry.valueTo
              ));
              if (openRange) openRange.valueTo = value;
              continue;
            }

            entries.push({ column, connector, operator, value, valueTo: "" });
          }

          return entries.filter((entry) => initialTableUrlRuleIsValid(
            entry.column,
            entry.operator,
            entry.value,
            entry.valueTo,
          ));
        }

        function initialTableStateFromLocation(pageName, viewName, savedState = {}) {
          const params = new URLSearchParams(window.location.search);
          if (!Array.from(params.keys()).length) return savedState;

          const state = {
            ...savedState,
            hideRetired: pageName !== "club",
            hideRetiring: false,
            hideMflPlayers: pageName === "database",
            mflPackable: pageName === "mfl",
            newMints: false,
            rules: initialTableUrlRules(pageName, viewName, params),
          };

          for (const [key, value] of params.entries()) {
            if (!INITIAL_TABLE_URL_QUICK_FILTER_KEYS.has(key)) continue;
            const booleanValue = String(value || "").toLowerCase();
            if (booleanValue !== "true" && booleanValue !== "false") continue;
            const enabled = booleanValue === "true";
            if (key === "hideRetired") state.hideRetired = enabled;
            else if (key === "hideRetiring") state.hideRetiring = enabled;
            else if (key === "hideMfl" && pageName === "database") state.hideMflPlayers = enabled;
            else if (key === "packableOnly" && pageName === "mfl") state.mflPackable = enabled;
            else if (key === "newMintsOnly") state.newMints = enabled;
          }

          if (pageName === "mfl" && state.newMints) state.mflPackable = false;
          return state;
        }

        function storedInitialTablePageState(pageName) {
          try {
            const saved = JSON.parse(localStorage.getItem(INITIAL_TABLE_FILTER_STORAGE_KEY) || "null");
            const pages = saved?.pages && typeof saved.pages === "object" && !Array.isArray(saved.pages)
              ? saved.pages
              : null;
            const pageState = pages?.[pageName];
            return pageState && typeof pageState === "object" && !Array.isArray(pageState) ? pageState : null;
          } catch {
            return null;
          }
        }

        function initialTableFilterColumnAllowed(pageName, viewName, column) {
          const normalizedColumn = String(column || "");
          if (!normalizedColumn) return false;
          if (normalizedColumn.endsWith("_prog_current_season")) {
            return viewName === "current" && INITIAL_TABLE_FILTER_STAT_COLUMNS.has(normalizedColumn.replace("_prog_current_season", ""));
          }
          if (normalizedColumn.endsWith("_prog_all")) {
            return viewName === "all" && INITIAL_TABLE_FILTER_STAT_COLUMNS.has(normalizedColumn.replace("_prog_all", ""));
          }
          if (!INITIAL_TABLE_FILTER_BASE_COLUMNS.has(normalizedColumn)) return false;
          if ((pageName === "mfl" || pageName === "agents") && normalizedColumn === "wallet_name") return false;
          if (pageName === "mfl" && normalizedColumn === "contract_status") return false;
          return true;
        }

        function initialTableActiveRuleCount(pageName, viewName, rules = []) {
          if (pageName === "club" || !Array.isArray(rules)) return 0;
          return rules.filter((rule) => {
            if (!initialTableFilterColumnAllowed(pageName, viewName, rule?.column)) return false;
            const operator = String(rule?.operator || "");
            const value = String(rule?.value || "").trim();
            const valueTo = String(rule?.valueTo || "").trim();
            return operator === "between" || operator === "during"
              ? Boolean(value && valueTo)
              : Boolean(value);
          }).length;
        }

        function normalizeInitialTableControlState(pageName, viewName, savedState = {}) {
          const clubPage = pageName === "club";
          const newMints = clubPage ? false : Boolean(savedState.newMints);
          const mflPackable = pageName === "mfl"
            ? (newMints ? false : (savedState.mflPackable !== undefined ? Boolean(savedState.mflPackable) : true))
            : false;
          const rules = Array.isArray(savedState.rules) ? savedState.rules : [];
          return Object.freeze({
            pageName,
            viewName,
            hideRetired: clubPage ? false : savedState.hideRetired !== false,
            hideRetiring: clubPage ? false : Boolean(savedState.hideRetiring),
            hideMflPlayers: pageName === "database"
              ? (savedState.hideMflPlayers !== undefined ? Boolean(savedState.hideMflPlayers) : true)
              : false,
            mflPackable,
            newMints,
            activeRuleCount: initialTableActiveRuleCount(pageName, viewName, rules),
          });
        }

        window.__mflNormalizeInitialTableControlState = normalizeInitialTableControlState;

        const pathParts = String(window.location.pathname || "/").split("/").filter(Boolean);
        const firstPart = String(pathParts[0] || "").toLowerCase();
        const tablePage = firstPart === "my-players"
          ? "myplayers"
          : firstPart === "clubs" || firstPart === "club"
            ? "club"
            : ["database", "mfl", "progression", "watchlist", "agents"].includes(firstPart)
              ? firstPart
              : "";
        const initialEntityRoute = tablePage === "club"
          ? "club"
          : firstPart === "players"
            ? "player"
            : "";
        if (initialEntityRoute) root.dataset.initialEntityRoute = initialEntityRoute;
        const initialLockedPage = tablePage === "myplayers" || tablePage === "watchlist"
          ? tablePage
          : firstPart === "my-clubs" || firstPart === "myclubs"
            ? "my-clubs"
            : firstPart === "settings"
              ? "settings"
              : "";
        if (initialLockedPage) root.dataset.initialLockedPage = initialLockedPage;
        const tableConfig = TABLE_VIEW_CONFIG[tablePage];
        if (tableConfig) {
          const lastPart = String(pathParts.at(-1) || "").toLowerCase();
          const requestedView = VIEW_BY_SLUG[lastPart] || "";
          const activeView = tableConfig.order.includes(requestedView) ? requestedView : tableConfig.fallback;
          root.dataset.initialTablePage = tablePage;
          root.dataset.initialTableView = activeView;
          const storedInitialState = storedInitialTablePageState(tablePage) || {};
          window.__mflInitialTableControlState = normalizeInitialTableControlState(
            tablePage,
            activeView,
            initialTableStateFromLocation(tablePage, activeView, storedInitialState),
          );

          const routeSelector = `html:not(.mflInitialRouteResolved):not(.mflInitialRouteSuperseded)[data-initial-table-page="${tablePage}"]`;
          const buttonSelector = (viewName) => `${routeSelector} #progressionPage .views > .viewButton[data-view="${viewName}"]`;
          const firstPaintStyle = document.createElement("style");
          const rules = [
            `${routeSelector} #progressionPage .views > .viewButton { display: none; }`,
            `${routeSelector} #progressionPage .views > .viewButton:not(:hover) { border-color: var(--mfl-control-border-color); background: var(--mfl-control-background); color: var(--mfl-control-text-color); }`,
            `${tableConfig.order.map(buttonSelector).join(",\n")} { display: inline-flex; }`,
            ...tableConfig.order.map((viewName, index) => `${buttonSelector(viewName)} { order: ${index + 1}; }`),
            `${buttonSelector(activeView)} { border-color: var(--primary); background: var(--primary); color: #ffffff; }`,
          ];
          if (tablePage === "club") {
            rules.push(
              `${buttonSelector("attributes")} { font-size: 0; }`,
              `${buttonSelector("attributes")}::after { content: "Squad"; font-size: 14px; }`,
            );
          }
          firstPaintStyle.id = "mflInitialTableViewFirstPaint";
          firstPaintStyle.textContent = rules.join("\n");
          document.head.appendChild(firstPaintStyle);
        }

        const evaluationParams = new URLSearchParams(window.location.search);
        root.dataset.initialEvaluationSelection = evaluationParams.get("player") || evaluationParams.get("saved") || evaluationParams.get("share") ? "true" : "false";
        try {
          root.dataset.theme = localStorage.getItem("mfl-theme") || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          const normalize = (value) => {
            const address = String(value || "").trim().toLowerCase();
            return address ? (address.startsWith("0x") ? address : `0x${address}`) : "";
          };
          const linkedWallet = normalize(localStorage.getItem("mfl-linked-wallet-v1"));
          const proof = JSON.parse(localStorage.getItem("mfl-linked-wallet-proof-v1") || "null");
          const proofWallet = normalize(proof?.address);
          const optedIn = Boolean(
            linkedWallet
            && proof?.type === "session"
            && proofWallet === linkedWallet
            && proof?.message === "MFL Front Office Dapper Opt-In"
          );
          const permission = linkedWallet
            ? JSON.parse(localStorage.getItem(`mfl-wallet-permission-cache-v1:${linkedWallet}`) || "null")
            : null;
          root.dataset.storedWalletOptIn = optedIn ? "true" : "false";
          root.dataset.storedProgressionAccess = optedIn && permission?.allowed === true ? "true" : "false";
        } catch {
          root.dataset.theme = "light";
          root.dataset.storedWalletOptIn = "false";
          root.dataset.storedProgressionAccess = "false";
        }
      })();
    </script>

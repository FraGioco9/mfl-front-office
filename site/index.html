<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MFL Front Office</title>
    <script src="/watchlist-route-ui-runtime.js?v=1.120.16"></script>
    <script src="/database-stats-navigation-release-runtime.js?v=1.120.16"></script>
    <script src="/database-stats-view-button-runtime.js?v=1.120.16"></script>
    <script src="/v1-120-10-runtime.js?v=1.120.16"></script>
    <script>
      (() => {
        const VERSION = "1.120.16";
        const SOURCE_COMMIT = "4cac1ca5b5f48034cdab2b0e2b5e0c1756d37b75";
        const SOURCE_URL = `https://cdn.jsdelivr.net/gh/FraGioco9/mfl-front-office@${SOURCE_COMMIT}/site/index.html`;
        const RELEASES_URL = `/releases.json?v=${VERSION}`;
        const CURRENT_RELEASES = [
          ["v1.120.16", "Place toasts above the selection bar and dismiss selection actions before loading"],
          ["v1.120.15", "Keep the Database Stats button persistent and limit route protection to reload"],
          ["v1.120.14", "Release all Database Stats route guards before switching view or page"],
          ["v1.120.13", "Release the Database Stats reload guard before explicit navigation"],
          ["v1.120.12", "Preserve the Stats route and view button throughout Database Stats reload"],
          ["v1.120.11", "Restore the Stats view button after reloading Database Stats"],
          ["v1.120.10", "Finish Changelog loading cleanly and make Stats reload, selection dismissal, and toast spacing deterministic"],
          ["v1.120.9", "Show Changelog loading state, refresh Database Stats, and preserve selection dismissal text"],
          ["v1.120.8", "Load Changelog summary data and stabilize loaded rows, Stats reload, and selection spacing"],
          ["v1.120.7", "Reveal loaded rows and persist the latest footer, Stats route, and toast position"],
          ["v1.120.6", "Commit Custom filters only on Apply and restore Stats reload, toast, and footer state"],
          ["v1.120.5", "Apply Custom filters once and align selection, toasts, loading headers, and footer version"],
          ["v1.120.4", "Defer Custom filters until Apply and keep toasts and footer above current UI"],
          ["v1.120.3", "Restore complete Changelog history, latest footer version, and the custom Overall tooltip"],
          ["v1.120.2", "Use a custom Overall tooltip and exclude MFL wallets from Database Stats"],
          ["v1.120.1", "Keep Database Stats isolated from table rendering and refine view controls"],
          ["v1.120.0", "Add Database Stats with retirement counts and active-player distributions"],
        ];

        function fail(message) {
          console.error(message);
          document.documentElement.classList.remove("bootPending");
          const renderFailure = () => {
            if (document.body) {
              document.body.innerHTML = '<main><p class="emptyState">Could not load MFL Front Office.</p></main>';
            }
          };
          if (document.body) renderFailure();
          else window.addEventListener("DOMContentLoaded", renderFailure, { once: true });
        }

        function loadRewrittenReleases() {
          const request = new XMLHttpRequest();
          request.open("GET", RELEASES_URL, false);
          request.send(null);
          if (!(request.status >= 200 && request.status < 300) || !request.responseText) {
            throw new Error(`Could not load release history (${request.status}).`);
          }
          const releases = JSON.parse(request.responseText);
          if (!Array.isArray(releases) || !releases.length
              || releases.some((entry) => !Array.isArray(entry) || entry.length !== 2)) {
            throw new Error("Release history is invalid.");
          }
          const currentLabels = new Set(CURRENT_RELEASES.map(([label]) => label));
          return [...CURRENT_RELEASES, ...releases.filter(([label]) => !currentLabels.has(label))];
        }

        try {
          const rewrittenReleases = loadRewrittenReleases();
          const request = new XMLHttpRequest();
          request.open("GET", SOURCE_URL, false);
          request.send(null);
          if (!(request.status >= 200 && request.status < 300) || !request.responseText) {
            fail(`Could not load the release shell (${request.status}).`);
            return;
          }

          let source = request.responseText;
          const versionMarker = 'const VERSION = "1.119.33";';
          const currentReleasesPattern = /const CURRENT_RELEASES = \[[\s\S]*?\n        \];/;
          const releaseEntryMarker = '            if (/^v\\d+\\.\\d+\\.\\d+$/.test(label)) entries.set(label, description);';
          const releaseEntryReplacement = '            if (/^v\\d+\\.\\d+\\.\\d+$/.test(label) && !/^v1\\./.test(label)) entries.set(label, description);';
          const runtimeMarker = '/mfl-season-ratios-runtime.js?v=1.119.33';
          const statsSeedMarker = '          // The consolidated application runtime permanently keeps the sidebar';
          const nestedPatchEndMarker = '\n`;\n          if (!source.includes(patchMarker)) {';
          if (!source.includes(versionMarker)
              || !currentReleasesPattern.test(source)
              || !source.includes(releaseEntryMarker)
              || !source.includes(runtimeMarker)
              || !source.includes(statsSeedMarker)
              || !source.includes(nestedPatchEndMarker)) {
            fail("Could not locate the release shell markers.");
            return;
          }

          source = source.replace(versionMarker, `const VERSION = "${VERSION}";`);
          source = source.replace(
            currentReleasesPattern,
            `const CURRENT_RELEASES = ${JSON.stringify(rewrittenReleases)};`,
          );
          source = source.replace(releaseEntryMarker, releaseEntryReplacement);
          source = source.replace(runtimeMarker, `/mfl-season-ratios-runtime.js?v=${VERSION}`);
          source = source.replace(
            statsSeedMarker,
            `          if (/^\\/database\\/stats\\/?$/i.test(window.location.pathname)) {
            root.querySelectorAll("#progressionPage .viewButton[data-view]").forEach((button) => {
              const active = button.dataset.view === "stats";
              button.hidden = !["attributes", "contracts", "stats"].includes(button.dataset.view);
              button.classList.toggle("active", active);
              button.setAttribute("aria-pressed", String(active));
            });
          }

${statsSeedMarker}`,
          );

          const finalRuntimeExpression = String.raw`'<script src="/database-stats-navigation-release-runtime.js?v=${VERSION}"></scr' + 'ipt>\\n<script src="/selection-bar-layout-runtime.js?v=${VERSION}"></scr' + 'ipt>\\n<script src="/table-loading-visibility-runtime.js?v=${VERSION}"></scr' + 'ipt>\\n<script src="/database-stats-runtime.js?v=${VERSION}"></scr' + 'ipt>\\n<script src="/database-stats-refinement-runtime.js?v=${VERSION}"></scr' + 'ipt>\\n<script src="/database-stats-tooltip-portal-runtime.js?v=${VERSION}"></scr' + 'ipt>\\n<script src="/release-ui-runtime.js?v=${VERSION}"></scr' + 'ipt>\\n<script src="/v1-120-10-runtime.js?v=${VERSION}"></scr' + 'ipt>\\n<script src="/database-stats-view-button-runtime.js?v=${VERSION}"></scr' + 'ipt>\\n<script src="/selection-feedback-runtime.js?v=${VERSION}"></scr' + 'ipt>\\n</body>'`;
          const nestedFinalInjection = `
        source = source.replace(
          '</body>',
          ${finalRuntimeExpression},
        );
`;
          source = source.replace(
            nestedPatchEndMarker,
            `${nestedFinalInjection}${nestedPatchEndMarker}`,
          );

          document.open();
          document.write(source);
          document.close();
        } catch (error) {
          fail(error?.message || "Could not initialize MFL Front Office.");
        }
      })();
    </script>
  </head>
  <body></body>
</html>

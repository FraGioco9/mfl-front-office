<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MFL Front Office</title>
    <script>
      (() => {
        const SOURCE_URL = "https://cdn.jsdelivr.net/gh/FraGioco9/mfl-front-office@6d0d3e7a9835b63ae6934254d182ac9a159bac7a/site/index.html";

        function fail(message) {
          console.error(message);
          const render = () => {
            if (document.body) {
              document.body.innerHTML = '<main><p class="emptyState">Could not load MFL Front Office.</p></main>';
            }
          };
          if (document.body) render();
          else window.addEventListener("DOMContentLoaded", render, { once: true });
        }

        try {
          const request = new XMLHttpRequest();
          request.open("GET", SOURCE_URL, false);
          request.send(null);
          if (!(request.status >= 200 && request.status < 300) || !request.responseText) {
            throw new Error(`Could not load the stable application shell (${request.status}).`);
          }

          const authorityTag = '<script src="/discount-rate-authority-v1-120-31.js?v=1.120.31"></scr' + 'ipt>';
          const closingBodyIndex = request.responseText.lastIndexOf("</body>");
          if (closingBodyIndex < 0) {
            throw new Error("Could not locate the final body tag in the stable application shell.");
          }

          const source = request.responseText.slice(0, closingBodyIndex)
            + authorityTag
            + "\n"
            + request.responseText.slice(closingBodyIndex);

          document.open();
          document.write(source);
          document.close();
        } catch (error) {
          fail(error?.message || "Could not initialize MFL Front Office.");
        }
      })();
    </script>
  </head>
  <body></body>
</html>

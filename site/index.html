<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MFL Front Office</title>
    <script>
      (() => {
        const VERSION = "1.119.42";
        const SOURCE_COMMIT = "4cac1ca5b5f48034cdab2b0e2b5e0c1756d37b75";
        const SOURCE_URL = `https://cdn.jsdelivr.net/gh/FraGioco9/mfl-front-office@${SOURCE_COMMIT}/site/index.html`;

        function fail(message) {
          console.error(message);
          document.documentElement.classList.remove("bootPending");
          document.body.innerHTML = '<main><p class="emptyState">Could not load MFL Front Office.</p></main>';
        }

        try {
          const request = new XMLHttpRequest();
          request.open("GET", SOURCE_URL, false);
          request.send(null);
          if (!(request.status >= 200 && request.status < 300) || !request.responseText) {
            fail(`Could not load the release shell (${request.status}).`);
            return;
          }

          let source = request.responseText;
          const versionMarker = 'const VERSION = "1.119.33";';
          const releaseMarker = '["v1.119.33", "Keep completed club views cached and reset club sorting to Position"],';
          const runtimeMarker = '/mfl-season-ratios-runtime.js?v=1.119.33';
          if (!source.includes(versionMarker) || !source.includes(releaseMarker) || !source.includes(runtimeMarker)) {
            fail("Could not locate the release shell markers.");
            return;
          }

          source = source.replace(versionMarker, `const VERSION = "${VERSION}";`);
          source = source.replace(
            releaseMarker,
            `["v${VERSION}", "Use the initial club route loader when switching views"],\n          ["v1.119.41", "Restore completed club views before repeated loading starts"],\n          ["v1.119.40", "Use one club-view cache and prevent repeated view loading"],\n          ["v1.119.37", "Match player-page MFL navigation and restore cached club views instantly"],\n          ["v1.119.36", "Reuse completed club views and show wait cursor while sharing evaluations"],\n          ["v1.119.34", "Use the native club cache for reliable view returns"],\n          ${releaseMarker}`,
          );
          source = source.replace(runtimeMarker, `/mfl-season-ratios-runtime.js?v=${VERSION}`);

          document.open();
          document.write(source);
          document.close();
        } catch (error) {
          fail(error?.message || "Could not initialize MFL Front Office.");
        }
      })();
    </script>
  </head>
  <body></body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MFL Front Office</title>
    <script>
      (() => {
        const VERSION = "1.120.35";
        const SOURCE_URL = "/index-source.html";
        const RUNTIME_FILES = [
          "/watchlist-route-ui-runtime.js",
          "/database-stats-navigation-release-runtime.js",
          "/table-loading-visibility-runtime.js",
          "/database-stats-runtime.js",
          "/database-stats-refinement-runtime.js",
          "/database-stats-tooltip-portal-runtime.js",
          "/release-ui-runtime.js",
          "/v1-120-10-runtime.js",
          "/database-stats-view-button-runtime.js",
          "/selection-refresh-reset-runtime.js",
          "/my-players-refresh-view-runtime.js",
          "/selection-stack-runtime.js",
          "/mfl-season-ratios-runtime-v2.js",
          "/changelog-history-runtime.js",
        ];

        window.__mflReleaseVersion = VERSION;

        function fail(message) {
          console.error(message);
          const render = () => {
            if (document.body) {
              document.body.innerHTML = '<main><p class="emptyState">Could not load MFL Front Office.</p></main>';
            }
          };
          if (document.body) render();
          else window.addEventListener("DOMContentLoaded", render, { once: true });
        }

        try {
          const releaseToken = `${VERSION}-${Date.now()}-${Math.random().toString(36).slice(2)}`;
          const request = new XMLHttpRequest();
          request.open(
            "GET",
            `${SOURCE_URL}?release=${encodeURIComponent(releaseToken)}`,
            false,
          );
          request.setRequestHeader("Cache-Control", "no-cache, no-store, max-age=0");
          request.setRequestHeader("Pragma", "no-cache");
          request.send(null);
          if (!(request.status >= 200 && request.status < 300) || !request.responseText) {
            throw new Error(`Could not load the application source (${request.status}).`);
          }

          const versionPattern = /const VERSION = "\d+\.\d+\.\d+";/;
          const stylePattern = /\/styles\.css\?v=\d+\.\d+\.\d+/;
          const shellMarker = 'const response = await fetch(`/index-shell.html?v=${VERSION}`, { cache: "default" });';
          const shellReplacement = 'const response = await fetch(`/index-shell.html?v=${VERSION}&release=${Date.now()}`, { cache: "no-store" });';
          if (!versionPattern.test(request.responseText)
              || !stylePattern.test(request.responseText)
              || !request.responseText.includes(shellMarker)
              || !request.responseText.includes("</body>")) {
            throw new Error("Could not locate the application source release markers.");
          }

          let source = request.responseText.replace(
            versionPattern,
            `const VERSION = "${VERSION}";\n        window.__mflReleaseVersion = VERSION;`,
          );
          source = source.replace(
            stylePattern,
            `/styles.css?v=${VERSION}&release=${encodeURIComponent(releaseToken)}`,
          );
          source = source.replace(shellMarker, shellReplacement);

          const runtimeMarkup = RUNTIME_FILES.map((path) => (
            `<script src="${path}?v=${encodeURIComponent(VERSION)}&release=${encodeURIComponent(releaseToken)}"></scr` + "ipt>"
          )).join("\n");
          source = source.replace("</body>", `${runtimeMarkup}\n</body>`);

          document.open();
          document.write(source);
          document.close();
        } catch (error) {
          fail(error?.message || "Could not initialize MFL Front Office.");
        }
      })();
    </script>
  </head>
  <body></body>
</html>

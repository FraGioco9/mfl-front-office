<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MFL Front Office</title>
    <script>
      (() => {
        const VERSION = "1.118.3";

        function routeGuardFunction() {
          const PAGE_IDS = [
            "homePage",
            "progressionPage",
            "mflStatsPage",
            "myPlayersLockedPage",
            "evaluationPage",
            "playerPage",
            "settingsPage",
            "changelogPage",
          ];
          const CLUB_VIEWS = new Set(["attributes", "contracts", "current", "all"]);
          const BASE_COLUMNS = ["player_id", "nationality_flag", "name", "nationality", "age", "positions", "player_seasons"];
          const STAT_COLUMNS = ["overall", "pace", "shooting", "passing", "dribbling", "defense", "physical"];
          const CONTRACT_COLUMNS = ["overall", "active_contract_revenue_share", "active_contract_club_name", "active_contract_club_division"];
          const COLUMN_LABELS = {
            player_id: "ID",
            nationality_flag: "",
            name: "Name",
            nationality: "Nationality",
            age: "Age",
            positions: "Positions",
            player_seasons: "Seasons",
            overall: "Overall",
            pace: "Pace",
            shooting: "Shooting",
            passing: "Passing",
            dribbling: "Dribbling",
            defense: "Defense",
            physical: "Physical",
            active_contract_revenue_share: "Rev. Share",
            active_contract_club_name: "Club Name",
            active_contract_club_division: "Division",
            wallet_name: "Agent",
            player_link: "",
          };
          const COLUMN_CLASSES = {
            player_id: "col-id",
            nationality_flag: "col-flag",
            name: "col-name",
            nationality: "col-nationality",
            age: "col-age",
            positions: "col-positions",
            player_seasons: "col-seasons",
            overall: "col-stat col-overall",
            pace: "col-stat",
            shooting: "col-stat",
            passing: "col-stat",
            dribbling: "col-stat",
            defense: "col-stat",
            physical: "col-stat",
            active_contract_revenue_share: "col-contract-revenue",
            active_contract_club_name: "col-contract-club",
            active_contract_club_division: "col-contract-division",
            wallet_name: "col-agent",
            player_link: "col-link",
          };

          let displayedClubId = "";
          const stableClubTitles = new Map();
          const preparedClubViews = new Set();
          let pendingStats = false;
          let statsReady = false;
          let scheduled = false;
          let evaluationAutoFocusDone = false;
          let evaluationFocusFrame = 0;

          function routeInfo(pathname = window.location.pathname) {
            const path = String(pathname || "/").replace(/\/+$/, "") || "/";
            if (/^\/mfl\/stats$/i.test(path)) {
              return { page: "mflstats" };
            }
            if (/^\/watchlist(?:\/[^/]+)?(?:\/[^/]+)?$/i.test(path)) {
              return { page: "watchlist" };
            }
            const clubMatch = path.match(/^\/clubs?\/([^/]+)(?:\/([^/]+))?$/i);
            if (!clubMatch) {
              return { page: "" };
            }
            const view = {
              attributes: "attributes",
              contracts: "contracts",
              "current-season": "current",
              "all-time": "all",
            }[String(clubMatch[2] || "attributes").toLowerCase()] || "attributes";
            return {
              page: "club",
              clubId: decodeURIComponent(clubMatch[1]),
              view,
            };
          }

          function setOnlyPage(pageName) {
            const targetId = pageName === "mflstats" ? "mflStatsPage" : "progressionPage";
            PAGE_IDS.forEach((id) => {
              const page = document.getElementById(id);
              const hidden = id !== targetId;
              if (page && page.hidden !== hidden) page.hidden = hidden;
            });
          }

          function clubColumns(view) {
            const middleColumns = view === "contracts" ? CONTRACT_COLUMNS : STAT_COLUMNS;
            return [...BASE_COLUMNS, ...middleColumns, "wallet_name", "player_link"];
          }

          function addColumnClasses(element, column) {
            const classes = String(COLUMN_CLASSES[column] || "").split(" ").filter(Boolean);
            if (classes.length) element.classList.add(...classes);
          }

          function stabilizeClubTableWidths() {
            const applyWidths = window.applyExactPlayerTableWidths;
            if (typeof applyWidths !== "function") return;
            applyWidths();
            requestAnimationFrame(() => applyWidths());
          }

          function buildClubTableShell(route) {
            const tableHead = document.getElementById("tableHead");
            const tableBody = document.getElementById("tableBody");
            const tableColGroup = document.getElementById("tableColGroup");
            const emptyState = document.getElementById("emptyState");
            if (!tableHead || !tableBody || !tableColGroup) return;

            const view = CLUB_VIEWS.has(route.view) ? route.view : "attributes";
            preparedClubViews.add(`${String(route.clubId || "")}:${view}`);
            if (tableHead.dataset.clubShellView === view && tableHead.rows.length) {
              stabilizeClubTableWidths();
              return;
            }

            const columns = clubColumns(view);
            const colFragment = document.createDocumentFragment();
            const selectionCol = document.createElement("col");
            selectionCol.className = "col-select";
            colFragment.appendChild(selectionCol);
            columns.forEach((column) => {
              const col = document.createElement("col");
              addColumnClasses(col, column);
              colFragment.appendChild(col);
            });
            tableColGroup.replaceChildren(colFragment);

            const row = document.createElement("tr");
            const selection = document.createElement("th");
            const checkbox = document.createElement("input");
            selection.className = "selectionCell";
            checkbox.type = "checkbox";
            checkbox.disabled = true;
            checkbox.setAttribute("aria-label", "Select visible players");
            selection.appendChild(checkbox);
            row.appendChild(selection);
            columns.forEach((column) => {
              const cell = document.createElement("th");
              const label = document.createElement("span");
              addColumnClasses(cell, column);
              label.textContent = COLUMN_LABELS[column] || "";
              cell.appendChild(label);
              row.appendChild(cell);
            });
            tableHead.replaceChildren(row);
            tableHead.dataset.clubShellView = view;
            tableBody.replaceChildren();
            if (emptyState) {
              emptyState.hidden = false;
              emptyState.textContent = "Loading players...";
            }
            document.body.classList.add("tableRowsLoading");
            stabilizeClubTableWidths();
          }

          function prepareClubPage(route) {
            setOnlyPage("club");
            if (document.body.dataset.page !== "club") document.body.dataset.page = "club";
            document.body.classList.remove("clubViewLoading");
            document.querySelectorAll(".navButton.active").forEach((button) => button.classList.remove("active"));

            const page = document.getElementById("progressionPage");
            page?.querySelectorAll(".viewButton[data-view]").forEach((button) => {
              const allowed = CLUB_VIEWS.has(button.dataset.view);
              button.hidden = !allowed;
              button.classList.toggle("active", allowed && button.dataset.view === route.view);
            });
            const quickFilters = page?.querySelector(".quickFilters");
            const controls = page?.querySelector(".controlsBar");
            const switcher = document.getElementById("watchlistSwitcher");
            if (quickFilters && !quickFilters.hidden) quickFilters.hidden = true;
            if (controls && !controls.hidden) controls.hidden = true;
            if (switcher && !switcher.hidden) switcher.hidden = true;
            page?.querySelectorAll(".pager, nav.pager").forEach((pager) => {
              if (!pager.hidden) pager.hidden = true;
            });

            buildClubTableShell(route);
            preserveClubTitle(route.clubId);
          }

          function numericStatsReady() {
            return /^\d[\d,.]*$/.test(String(document.getElementById("mflStatsTotalPlayers")?.textContent || "").trim());
          }

          function blankStatsPage() {
            [
              "mflStatsTotalPlayers",
              "mflStatsPackablePlayers",
              "mflStatsAgedPlayers",
              "mflStatsOtherPlayers",
            ].forEach((id) => {
              const value = document.getElementById(id);
              if (value && value.textContent !== "\u00a0") value.textContent = "\u00a0";
            });
            const distribution = document.getElementById("mflStatsAgeDistribution");
            if (distribution?.childNodes.length) distribution.replaceChildren();
          }

          function prepareStatsPage() {
            setOnlyPage("mflstats");
            if (document.body.dataset.page !== "mflstats") document.body.dataset.page = "mflstats";
            document.querySelectorAll(".navButton[data-page]").forEach((button) => {
              button.classList.toggle("active", button.dataset.page === "mfl");
            });
            document.querySelectorAll("#mflStatsPage .viewButton[data-view]").forEach((button) => {
              button.classList.toggle("active", button.dataset.view === "stats");
            });
            if (typeof renderMflStatsFilterButtons === "function") {
              renderMflStatsFilterButtons();
            }

            if (numericStatsReady()) {
              statsReady = true;
              pendingStats = false;
              return;
            }
            if (!statsReady) blankStatsPage();
          }

          function titleIsGeneric(text, clubId) {
            const value = String(text || "").trim();
            return !value || value === "Club" || value === `Club #${clubId}` || value === `Club ${clubId}`;
          }

          function titleHasDivisionColor(title) {
            return Boolean(title?.querySelector("span[style*='color'], .clubDivision, .clubSearchDivision"))
              || /color\s*:/i.test(title?.innerHTML || "");
          }

          function lockDivisionColor(title) {
            title?.querySelectorAll(".clubPageTitleDivision, .clubDivision, .clubSearchDivision, span[style*='color']").forEach((label) => {
              const color = String(label.style.color || "").trim();
              const priority = label.style.getPropertyPriority("color");
              if (color
                  && priority !== "important"
                  && !/^(?:white|#fff(?:fff)?|rgb\(255,\s*255,\s*255\))$/i.test(color)) {
                label.style.setProperty("color", color, "important");
              }
            });
          }

          function indexedClubTitle(clubId) {
            try {
              const clubs = typeof state === "object" && Array.isArray(state.clubSearchIndex)
                ? state.clubSearchIndex
                : [];
              const club = clubs.find((entry) => String(entry.clubId || "") === String(clubId));
              const name = String(club?.name || "").trim();
              if (!name) return null;

              const holder = document.createElement("span");
              const division = typeof contractDivisionInfo === "function"
                ? contractDivisionInfo(club.division)
                : null;
              holder.appendChild(document.createTextNode(division ? `${name} - ` : name));
              if (division?.name && division?.color) {
                const label = document.createElement("span");
                label.className = "clubPageTitleDivision";
                label.textContent = division.name;
                label.style.setProperty("color", division.color, "important");
                holder.appendChild(label);
              }
              return {
                html: holder.innerHTML,
                text: String(holder.textContent || "").trim(),
                rich: Boolean(division?.name && division?.color),
              };
            } catch {
              return null;
            }
          }

          function preserveClubTitle(clubId) {
            const title = document.getElementById("tablePageTitle");
            if (!title) return;

            const key = String(clubId);
            const clubChanged = displayedClubId !== key;
            if (clubChanged) displayedClubId = key;

            const indexed = indexedClubTitle(key);
            if (indexed) {
              const saved = stableClubTitles.get(key);
              if (!saved || indexed.rich || !saved.rich) stableClubTitles.set(key, indexed);
            }

            if (clubChanged) {
              const stable = stableClubTitles.get(key);
              if (stable) {
                if (title.innerHTML !== stable.html) title.innerHTML = stable.html;
                lockDivisionColor(title);
              } else {
                title.textContent = "Club";
              }
              return;
            }

            const text = String(title.textContent || "").trim();
            const currentRich = titleHasDivisionColor(title);
            if (!titleIsGeneric(text, key) && currentRich) {
              lockDivisionColor(title);
              stableClubTitles.set(key, {
                html: title.innerHTML,
                text,
                rich: true,
              });
              return;
            }

            const stable = stableClubTitles.get(key);
            if (stable) {
              if (title.innerHTML !== stable.html) title.innerHTML = stable.html;
              lockDivisionColor(title);
              return;
            }

            title.textContent = "Club";
          }

          function prepareClubViewShell(view) {
            const route = routeInfo();
            if (route.page !== "club" || !CLUB_VIEWS.has(view)) return;
            const key = `${String(route.clubId || "")}:${view}`;
            if (preparedClubViews.has(key)) return;
            buildClubTableShell({ ...route, view });
            preserveClubTitle(route.clubId);
          }

          function prepareSidebarTableDestination(destination) {
            if (!["database", "mfl"].includes(destination)) return null;
            const view = typeof preferredViewForPage === "function"
              ? preferredViewForPage(destination)
              : "attributes";
            const options = { view };
            const targetPath = typeof pagePath === "function"
              ? pagePath(destination, options)
              : destination === "mfl" ? "/mfl/attributes" : "/database/attributes";
            const currentPath = `${window.location.pathname}${window.location.search}`;
            if (currentPath === targetPath) return null;

            window.history.pushState({}, "", targetPath);
            if (/^\/mfl\/stats\/?$/i.test(targetPath)) {
              prepareStatsPage();
            } else {
              setOnlyPage("club");
              document.body.dataset.page = destination;
              const title = document.getElementById("tablePageTitle");
              if (title) title.textContent = destination === "mfl" ? "MFL Wallet" : "Database";
              document.querySelectorAll("#progressionPage .viewButton[data-view]").forEach((button) => {
                button.classList.toggle("active", button.dataset.view === view);
              });
            }
            return { options, targetPath };
          }

          function showWatchlistSwitcher() {
            const switcher = document.getElementById("watchlistSwitcher");
            if (!switcher) return;
            switcher.hidden = false;
            switcher.removeAttribute("aria-hidden");
            switcher.style.removeProperty("display");
            switcher.style.removeProperty("visibility");
          }

          function syncEvaluationSearchFocus() {
            const page = document.getElementById("evaluationPage");
            const input = document.getElementById("evaluationSearchInput");
            const evaluationActive = document.body.dataset.page === "evaluation" && page && !page.hidden;
            const playerSelected = typeof state === "object" && Boolean(state.evaluationPlayerId);

            if (!evaluationActive || playerSelected) {
              evaluationAutoFocusDone = false;
              if (evaluationFocusFrame) {
                cancelAnimationFrame(evaluationFocusFrame);
                evaluationFocusFrame = 0;
              }
              return;
            }

            if (!input
                || evaluationAutoFocusDone
                || document.body.classList.contains("loading")
                || document.body.classList.contains("booting")
                || document.body.classList.contains("appBusy")
                || document.documentElement.classList.contains("loading")) {
              return;
            }

            evaluationAutoFocusDone = true;
            evaluationFocusFrame = requestAnimationFrame(() => {
              evaluationFocusFrame = 0;
              const stillActive = document.body.dataset.page === "evaluation" && !page.hidden;
              const stillSelected = typeof state === "object" && Boolean(state.evaluationPlayerId);
              if (!stillActive || stillSelected) {
                evaluationAutoFocusDone = false;
                return;
              }
              input.focus({ preventScroll: true });
            });
          }

          function enforce() {
            const route = pendingStats ? { page: "mflstats" } : routeInfo();
            if (route.page === "mflstats") prepareStatsPage();
            else if (route.page === "club") prepareClubPage(route);
            else if (route.page === "watchlist") showWatchlistSwitcher();
            syncEvaluationSearchFocus();
          }

          function schedule() {
            if (scheduled) return;
            scheduled = true;
            requestAnimationFrame(() => {
              scheduled = false;
              enforce();
            });
          }

          const previousFetch = window.fetch.bind(window);
          window.fetch = (input, init) => {
            try {
              const value = input instanceof Request ? input.url : String(input || "");
              const url = new URL(value, window.location.href);
              if (url.pathname.toLowerCase() === "/api/data"
                  && url.searchParams.get("mode") === "page"
                  && String(url.searchParams.get("scope") || "").toLowerCase() === "mflstats") {
                return previousFetch("/api/mfl-stats", { ...init, cache: "no-store" });
              }
            } catch {
              // Preserve requests that cannot be parsed.
            }
            return previousFetch(input, init);
          };

          document.addEventListener("pointerdown", (event) => {
            const target = event.target instanceof Element ? event.target : null;
            const viewButton = target?.closest("#progressionPage .viewButton[data-view]");
            if (viewButton) prepareClubViewShell(String(viewButton.dataset.view || ""));
          }, true);

          document.addEventListener("keydown", (event) => {
            if (event.key !== "Enter" && event.key !== " ") return;
            const target = event.target instanceof Element ? event.target : null;
            const viewButton = target?.closest("#progressionPage .viewButton[data-view]");
            if (viewButton) prepareClubViewShell(String(viewButton.dataset.view || ""));
          }, true);

          document.addEventListener("click", (event) => {
            const target = event.target instanceof Element ? event.target : null;
            const viewButton = target?.closest(".viewButton[data-view='stats']");
            if (viewButton
                && (document.body.dataset.page === "mfl" || /^\/mfl(?:\/|$)/i.test(window.location.pathname))) {
              statsReady = numericStatsReady();
              pendingStats = !statsReady;
              if (window.location.pathname !== "/mfl/stats") {
                window.history.pushState({}, "", "/mfl/stats");
              }
              prepareStatsPage();
            }

            const clubLink = target?.closest("a[href*='/clubs/'], a[href*='/club/']");
            if (!clubLink || event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) {
              return;
            }
            try {
              const url = new URL(clubLink.href, window.location.href);
              const route = routeInfo(url.pathname);
              if (route.page !== "club") return;
              if (`${window.location.pathname}${window.location.search}` !== `${url.pathname}${url.search}`) {
                window.history.pushState({}, "", `${url.pathname}${url.search}`);
              }
              prepareClubPage(route);
            } catch {
              // Leave navigation unchanged when the link is not a valid URL.
            }
          }, true);

          document.addEventListener("click", (event) => {
            const nav = event.target instanceof Element ? event.target.closest(".navButton[data-page]") : null;
            if (!nav || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;

            const destination = nav.dataset.page;
            const preparedNavigation = prepareSidebarTableDestination(destination);
            document.querySelectorAll(".navButton[data-page]").forEach((button) => {
              button.classList.toggle("active", button.dataset.page === destination);
            });

            if (destination !== "mfl") {
              pendingStats = false;
              statsReady = false;
            }

            if (preparedNavigation && typeof setPage === "function") {
              event.preventDefault();
              event.stopImmediatePropagation();
              void setPage(destination, false, preparedNavigation.options);
            }
          }, true);

          window.addEventListener("popstate", () => {
            pendingStats = false;
            statsReady = false;
            schedule();
          });
          new MutationObserver(schedule).observe(document.documentElement, {
            attributes: true,
            attributeFilter: ["data-page", "hidden", "style", "class"],
            childList: true,
            characterData: true,
            subtree: true,
          });
          enforce();
        }

        const request = new XMLHttpRequest();
        request.open("GET", `/index-source.html?v=${VERSION}`, false);

        try {
          request.send(null);
        } catch {
          document.body.innerHTML = '<main><p>Could not load MFL Front Office.</p></main>';
          return;
        }

        if (request.status < 200 || request.status >= 300) {
          document.body.innerHTML = '<main><p>Could not load MFL Front Office.</p></main>';
          return;
        }

        let source = request.responseText;
        source = source.replace('/styles.css?v=1.117.1', `/styles.css?v=${VERSION}`);
        source = source.replace('const VERSION = "1.117.1";', `const VERSION = "${VERSION}";`);
        source = source.replace(
          'const entries = new Map();',
          'const entries = new Map([["v1.118.3", "Layer Evaluation search results and restore full empty-page height"], ["v1.118.2", "Fix Evaluation tooltip and empty height; cap MFL API at 50/min"], ["v1.118.1", "Keep Evaluation header sticky and focus empty player search"], ["v1.118.0", "Use Supabase season ratios for discount rates"]]);',
        );

        source = source.replace(
          '      if (mflStatsAgeDistribution) {\n        mflStatsAgeDistribution.innerHTML = \'<p class="mflStatsEmpty">Loading players...</p>\';\n      }',
          '      if (mflStatsAgeDistribution) {\n        mflStatsAgeDistribution.replaceChildren();\n      }',
        );

        const routeStyles = `
          <style id="route-shell-stability">
            body[data-page="watchlist"] #watchlistSwitcher {
              display: flex !important;
              visibility: visible !important;
            }

            #searchModal > .searchDialog {
              transform: none !important;
              transition: opacity 180ms ease !important;
            }

            #playerSearchResults.filledSearchResults {
              overflow: hidden;
            }

            #playerSearchResults.filledSearchResults > .searchResult {
              min-height: 0;
              box-sizing: border-box;
            }

            html:has(body[data-page="evaluation"]),
            body[data-page="evaluation"] {
              overflow-x: clip !important;
              scrollbar-width: none;
            }

            body[data-page="evaluation"] > .topbar {
              position: sticky !important;
              top: 0;
            }

            html:has(body[data-page="evaluation"])::-webkit-scrollbar,
            body[data-page="evaluation"]::-webkit-scrollbar {
              display: none;
              width: 0;
              height: 0;
            }

            body[data-page="evaluation"] #evaluationPage,
            body[data-page="evaluation"] #evaluationPage .tableShell,
            body[data-page="evaluation"] #evaluationPage .tableScroller {
              max-width: 100%;
              overflow-x: hidden !important;
            }

            body[data-page="evaluation"] #evaluationPage .evaluationTable {
              width: 100% !important;
              min-width: 0 !important;
              table-layout: fixed;
            }

            body[data-page="evaluation"] #evaluationPage .evaluationTable th,
            body[data-page="evaluation"] #evaluationPage .evaluationTable td {
              white-space: normal;
              overflow-wrap: anywhere;
            }
          </style>
        `;
        const routeGuard = `(${routeGuardFunction.toString()})();`;
        const ratioScript = `<script src="/api/mfl-season-ratios?format=script&v=${VERSION}"><\/script>`;

        source = source.replace("</head>", `${routeStyles}</head>`);
        source = source.replace("</body>", `${ratioScript}<script>${routeGuard}<\/script></body>`);

        document.open();
        document.write(source);
        document.close();
      })();
    </script>
  </head>
  <body></body>
</html>

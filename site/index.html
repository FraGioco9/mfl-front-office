<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MFL Front Office</title>
    <script>
      (() => {
        const VERSION = "1.120.38";
        const SOURCE_URL = "/index-source.html";
        const RUNTIME_FILES = [
          "/watchlist-route-ui-runtime.js",
          "/database-stats-navigation-release-runtime.js",
          "/table-loading-visibility-runtime.js",
          "/database-stats-runtime.js",
          "/database-stats-refinement-runtime.js",
          "/database-stats-tooltip-portal-runtime.js",
          "/release-ui-runtime.js",
          "/v1-120-10-runtime.js",
          "/database-stats-view-button-runtime.js",
          "/selection-refresh-reset-runtime.js",
          "/my-players-refresh-view-runtime.js",
          "/selection-stack-runtime.js",
          "/changelog-history-runtime.js",
        ];
        const CURRENT_CHANGELOG_MARKUP = `
          <li class="changelogMinorSection is-expanded" data-initial-release-version="${VERSION}">
            <button class="changelogMinorToggle" type="button" aria-expanded="true">
              <span class="changelogMinorVersion">v1.120</span>
              <span class="changelogMinorMeta">9 patches</span>
              <span class="changelogMinorChevron" aria-hidden="true">&gt;</span>
            </button>
            <div class="changelogMinorPanel">
              <div class="changelogMinorPanelInner">
                <ol class="changelogPatchList">
                  <li><span>v1.120.38</span><p>Stabilize Evaluation loading, first-paint MFL views, and Database Stats animations</p></li>
                  <li><span>v1.120.37</span><p>Restore static startup content, full MFL Stats, and the live Discount Rate</p></li>
                  <li><span>v1.120.36</span><p>Remove remaining first-paint version conflicts and restore Evaluation loading</p></li>
                  <li><span>v1.120.35</span><p>Remove legacy version conflicts and restore the Evaluation Discount Rate tooltip</p></li>
                  <li><span>v1.120.34</span><p>Centralize release versioning and prevent legacy footer overrides</p></li>
                  <li><span>v1.120.33</span><p>Clarify the Evaluation Discount Rate tooltip</p></li>
                  <li><span>v1.120.32</span><p>Recalculate the Evaluation Discount Rate from a fresh request on every load</p></li>
                  <li><span>v1.120.31</span><p>Refresh the Evaluation Discount Rate from live season ratios</p></li>
                  <li><span>v1.120.30</span><p>Restore stable site loading after Discount Rate changes</p></li>
                </ol>
              </div>
            </div>
          </li>`;

        window.__mflReleaseVersion = VERSION;

        let supplementalRuntimePromise = null;
        window.__mflLoadSupplementalRuntimes = () => {
          if (supplementalRuntimePromise) return supplementalRuntimePromise;
          const releaseToken = `${VERSION}-${Date.now()}-${Math.random().toString(36).slice(2)}`;
          supplementalRuntimePromise = RUNTIME_FILES.reduce((chain, path) => (
            chain.then(() => new Promise((resolve) => {
              const script = document.createElement("script");
              script.src = `${path}?v=${encodeURIComponent(VERSION)}&release=${encodeURIComponent(releaseToken)}`;
              script.async = false;
              script.addEventListener("load", resolve, { once: true });
              script.addEventListener("error", () => {
                console.error(`Could not load supplemental runtime: ${path}`);
                resolve();
              }, { once: true });
              document.head.appendChild(script);
            }))
          ), Promise.resolve());
          return supplementalRuntimePromise;
        };

        function fail(message) {
          console.error(message);
          const render = () => {
            if (document.body) {
              document.body.innerHTML = '<main><p class="emptyState">Could not load MFL Front Office.</p></main>';
            }
          };
          if (document.body) render();
          else window.addEventListener("DOMContentLoaded", render, { once: true });
        }

        try {
          const releaseToken = `${VERSION}-${Date.now()}-${Math.random().toString(36).slice(2)}`;
          const request = new XMLHttpRequest();
          request.open(
            "GET",
            `${SOURCE_URL}?release=${encodeURIComponent(releaseToken)}`,
            false,
          );
          request.setRequestHeader("Cache-Control", "no-cache, no-store, max-age=0");
          request.setRequestHeader("Pragma", "no-cache");
          request.send(null);
          if (!(request.status >= 200 && request.status < 300) || !request.responseText) {
            throw new Error(`Could not load the application source (${request.status}).`);
          }

          const versionPattern = /const VERSION = "\d+\.\d+\.\d+";/;
          const stylePattern = /\/styles\.css\?v=\d+\.\d+\.\d+/;
          const shellMarker = 'const response = await fetch(`/index-shell.html?v=${VERSION}`, { cache: "default" });';
          const shellReplacement = 'const response = await fetch(`/index-shell.html?v=${VERSION}&release=${Date.now()}`, { cache: "no-store" });';
          const initialShellMarker = `        function prepareInitialShell(doc) {
          const route = routeInfo();`;
          const initialShellReplacement = `        function prepareInitialShell(doc) {
          const route = routeInfo();
          const releaseLabel = "MFL Front Office v${VERSION}";
          const footerLink = doc.querySelector('.siteFooter a[href="/changelog"], .siteFooter a[data-page="changelog"]');
          if (footerLink) {
            footerLink.textContent = releaseLabel;
            footerLink.setAttribute("aria-label", releaseLabel + ", open Changelog");
            footerLink.dataset.releaseLabel = releaseLabel;
            footerLink.closest(".siteFooter")?.setAttribute("data-release-version", "${VERSION}");
          }
          const changelogList = doc.querySelector(".changelogList");
          if (changelogList) {
            changelogList.innerHTML = ${JSON.stringify(CURRENT_CHANGELOG_MARKUP)};
            changelogList.dataset.initialReleaseVersion = "${VERSION}";
          }
          if (route.page === "mfl") {
            const views = doc.querySelector("#progressionPage .views");
            const attributesButton = views?.querySelector('.viewButton[data-view="attributes"]');
            const statsButton = views?.querySelector('.viewButton[data-view="stats"]');
            if (attributesButton && statsButton && attributesButton.nextElementSibling !== statsButton) {
              attributesButton.after(statsButton);
            }
            views?.querySelectorAll(".viewButton[data-view]").forEach((button) => {
              const allowed = button.dataset.view === "attributes" || button.dataset.view === "stats";
              button.hidden = !allowed;
              button.classList.toggle("active", allowed && button.dataset.view === "attributes");
            });
          }`;
          const applicationSrcMarker = '          applicationScript.src = `/app.js?v=${VERSION}`;';
          const applicationSrcReplacement = '          applicationScript.src = `/app.js?v=${VERSION}&release=${Date.now()}`;';
          const applicationLoadMarker = `          applicationScript.addEventListener("load", () => {
            installRuntimeFixes();
            if (window.location.pathname !== "/changelog") finalizeRouteChrome();
          });`;
          const applicationLoadReplacement = `          applicationScript.addEventListener("load", () => {
            installRuntimeFixes();
            if (window.location.pathname !== "/changelog") finalizeRouteChrome();
            window.__mflLoadSupplementalRuntimes?.();
          });`;
          const headMarker = "</head>";
          if (!versionPattern.test(request.responseText)
              || !stylePattern.test(request.responseText)
              || !request.responseText.includes(shellMarker)
              || !request.responseText.includes(initialShellMarker)
              || !request.responseText.includes(applicationSrcMarker)
              || !request.responseText.includes(applicationLoadMarker)
              || !request.responseText.includes(headMarker)) {
            throw new Error("Could not locate the application source release markers.");
          }

          let source = request.responseText.replace(
            versionPattern,
            `const VERSION = "${VERSION}";\n        window.__mflReleaseVersion = VERSION;`,
          );
          source = source.replace(
            stylePattern,
            `/styles.css?v=${VERSION}&release=${encodeURIComponent(releaseToken)}`,
          );
          const stabilityStyleTag = `<style id="mflReleaseStabilityStyles">
            html.bootPending body[data-page="evaluation"] #evaluationPage .evaluationSearchGroup,
            html.mflInitialChromePreparing body[data-page="evaluation"] #evaluationPage .evaluationSearchGroup,
            body[data-page="evaluation"].appBusy #evaluationPage .evaluationSearchGroup,
            body[data-page="evaluation"].evaluationRouteLoading #evaluationPage .evaluationSearchGroup {
              visibility: hidden !important;
              opacity: 0 !important;
              pointer-events: none !important;
            }
          <\/style>`;
          const integrityRuntimeTag = `<script src="/startup-integrity-runtime.js?v=${encodeURIComponent(VERSION)}&release=${encodeURIComponent(releaseToken)}"><\/script>`;
          source = source
            .replace(headMarker, `${stabilityStyleTag}${integrityRuntimeTag}${headMarker}`)
            .replace(shellMarker, shellReplacement)
            .replace(initialShellMarker, initialShellReplacement)
            .replace(applicationSrcMarker, applicationSrcReplacement)
            .replace(applicationLoadMarker, applicationLoadReplacement);

          document.open();
          document.write(source);
          document.close();
        } catch (error) {
          fail(error?.message || "Could not initialize MFL Front Office.");
        }
      })();
    </script>
  </head>
  <body></body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MFL Front Office</title>
    <script>
      (() => {
        const VERSION = "1.119.6";
        const SOURCE_COMMIT = "4cac1ca5b5f48034cdab2b0e2b5e0c1756d37b75";
        const SOURCE_URL = `https://cdn.jsdelivr.net/gh/FraGioco9/mfl-front-office@${SOURCE_COMMIT}/site/index.html`;
        const REWRITTEN_RELEASES = [["v1.119.6","Load shared evaluations before validating their player"],["v1.119.5","Calculate the Discount Ratio from the current MFL/USD value"],["v1.119.4","Lock global search loading while keeping table data visible"],["v1.119.3","Stabilize club controls, sorting, selection, and My Players view state"],["v1.119.2","Cache completed club views and restore them without rebuilding"],["v1.119.1","Rebuild first-paint release UI, footer versioning, and complete Changelog history"],["v1.119.0","Optimize paged data loading, cache responses, and link player contract clubs"],["v1.118.3","Link player contract teams and restore MFL Stats filters"],["v1.118.2","Finalize Evaluation sharing, saved routes, and Discount Rate synchronization"],["v1.118.1","Enforce API limits and stabilize loading, scrolling, and page overlays"],["v1.118.0","Use Supabase season ratios for Evaluation discount rates"],["v1.117.1","Prioritize search results and finalize Evaluation overlays"],["v1.117.0","Build player data batches from PlayMFL instead of Flow"]];

        function fail(message) {
          console.error(message);
          document.documentElement.classList.remove("bootPending");
          document.body.innerHTML = '<main><p class="emptyState">Could not load MFL Front Office.</p></main>';
        }

        try {
          const request = new XMLHttpRequest();
          request.open("GET", SOURCE_URL, false);
          request.send(null);
          if (!(request.status >= 200 && request.status < 300) || !request.responseText) {
            fail(`Could not load the release shell (${request.status}).`);
            return;
          }

          let source = request.responseText;
          const versionMarker = 'const VERSION = "1.119.33";';
          const currentReleasesPattern = /const CURRENT_RELEASES = \[[\s\S]*?\n        \];/;
          const releaseEntryMarker = '            if (/^v\\d+\\.\\d+\\.\\d+$/.test(label)) entries.set(label, description);';
          const releaseEntryReplacement = '            if (/^v\\d+\\.\\d+\\.\\d+$/.test(label) && !/^v1\\.(?:117|118|119)\\./.test(label)) entries.set(label, description);';
          const runtimeMarker = '/mfl-season-ratios-runtime.js?v=1.119.33';
          const bodyMarker = '</body>';
          if (!source.includes(versionMarker)
              || !currentReleasesPattern.test(source)
              || !source.includes(releaseEntryMarker)
              || !source.includes(runtimeMarker)
              || !source.includes(bodyMarker)) {
            fail("Could not locate the release shell markers.");
            return;
          }

          source = source.replace(versionMarker, `const VERSION = "${VERSION}";`);
          source = source.replace(
            currentReleasesPattern,
            `const CURRENT_RELEASES = ${JSON.stringify(REWRITTEN_RELEASES)};`,
          );
          source = source.replace(releaseEntryMarker, releaseEntryReplacement);
          source = source.replace(runtimeMarker, `/mfl-season-ratios-runtime.js?v=${VERSION}`);

          const stabilityRuntimeTag = `<script src="/club-view-stability-runtime.js?v=${VERSION}"></scr${"ipt"}>`;
          const selectionLayoutRuntimeTag = `<script src="/selection-bar-layout-runtime.js?v=${VERSION}"></scr${"ipt"}>`;
          const tableLoadingRuntimeTag = `<script src="/table-loading-visibility-runtime.js?v=${VERSION}"></scr${"ipt"}>`;
          const evaluationDiscountRuntimeTag = `<script src="/evaluation-discount-runtime.js?v=${VERSION}"></scr${"ipt"}>`;
          const evaluationShareRuntimeTag = `<script src="/evaluation-share-runtime.js?v=${VERSION}"></scr${"ipt"}>`;
          const changelogHistoryRuntimeTag = `<script src="/changelog-history-runtime.js?v=${VERSION}"></scr${"ipt"}>`;
          source = source.replace(
            bodyMarker,
            `${stabilityRuntimeTag}\n${selectionLayoutRuntimeTag}\n${tableLoadingRuntimeTag}\n${evaluationDiscountRuntimeTag}\n${evaluationShareRuntimeTag}\n${changelogHistoryRuntimeTag}\n${bodyMarker}`,
          );

          document.open();
          document.write(source);
          document.close();
        } catch (error) {
          fail(error?.message || "Could not initialize MFL Front Office.");
        }
      })();
    </script>
  </head>
  <body></body>
</html>

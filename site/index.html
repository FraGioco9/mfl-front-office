<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MFL Front Office</title>
    <script>
      (() => {
        const VERSION = "1.119.20";
        const BASE_COMMIT = "1d890d674695429d14297bc173452cb9b962cd36";
        const BASE_URL = `https://cdn.jsdelivr.net/gh/FraGioco9/mfl-front-office@${BASE_COMMIT}/site/index.html`;
        const RELEASES_URL = `/releases.json?v=${encodeURIComponent(VERSION)}`;
        const CURRENT_RELEASES = [
          ["v1.119.20", "Fade tooltips and stabilize Changelog and saved Evaluation refresh"],
          ["v1.119.19", "Restore native tooltips, footer navigation, saved Evaluation refresh, and stable Changelog first paint"],
        ];

        function loadReleases() {
          const request = new XMLHttpRequest();
          request.open("GET", RELEASES_URL, false);
          request.send(null);
          if (!(request.status >= 200 && request.status < 300) || !request.responseText) {
            throw new Error(`Could not load release history (${request.status}).`);
          }
          const releases = JSON.parse(request.responseText);
          if (!Array.isArray(releases)) throw new Error("Release history is invalid.");
          const currentLabels = new Set(CURRENT_RELEASES.map(([label]) => label));
          return [...CURRENT_RELEASES, ...releases.filter(([label]) => !currentLabels.has(label))];
        }

        function versionParts(value) {
          const match = String(value || "").trim().match(/^v?(\d+)\.(\d+)\.(\d+)$/);
          return match ? match.slice(1).map(Number) : null;
        }

        function seedReleaseShell(root, version, releases) {
          const footer = root.querySelector('.siteFooter a[href="/changelog"], .siteFooter a[data-page="changelog"]');
          if (footer) {
            const label = `MFL Front Office v${version}`;
            footer.textContent = label;
            footer.setAttribute("href", "/changelog");
            footer.dataset.releaseLabel = label;
            footer.setAttribute("aria-label", `${label}, open Changelog`);
            footer.style.cursor = "pointer";
          }

          const list = root.querySelector(".changelogList");
          if (!list) return;

          const entries = new Map();
          list.querySelectorAll(".changelogPatchList > li, :scope > li:not(.changelogMinorSection)").forEach((item) => {
            const label = String(item.querySelector(":scope > span")?.textContent || "").trim();
            const description = String(item.querySelector(":scope > p")?.textContent || "").trim();
            if (versionParts(label)) entries.set(label, description);
          });
          releases.forEach(([label, description]) => entries.set(label, description));

          const fragment = root.createDocumentFragment();
          [...entries.entries()]
            .sort(([left], [right]) => {
              const a = versionParts(left) || [0, 0, 0];
              const b = versionParts(right) || [0, 0, 0];
              return b[0] - a[0] || b[1] - a[1] || b[2] - a[2];
            })
            .forEach(([label, description]) => {
              const item = root.createElement("li");
              const versionLabel = root.createElement("span");
              const descriptionLabel = root.createElement("p");
              versionLabel.textContent = label;
              descriptionLabel.textContent = description;
              item.append(versionLabel, descriptionLabel);
              fragment.appendChild(item);
            });
          list.replaceChildren(fragment);
          delete list.dataset.sectioned;
          list.dataset.completeReleaseVersion = version;
        }

        function ratioLoaderMarkup(version, releases) {
          const payload = JSON.stringify({ version, releases, rows: [], warning: "" });
          const code = `(() => {
            const request = new XMLHttpRequest();
            request.open("GET", "/api/mfl-season-ratios?format=script&v=${encodeURIComponent(version)}", false);
            try {
              request.send(null);
            } catch {
              return;
            }
            if (!(request.status >= 200 && request.status < 300) || !request.responseText) return;
            let runtimeSource = request.responseText.replaceAll("1.118.33", ${JSON.stringify(version)});
            runtimeSource = runtimeSource.replace(
              /window\\.__mflSeasonRatioPayload\\s*=\\s*[^;]+;/,
              ${JSON.stringify(`window.__mflSeasonRatioPayload = ${payload};`)},
            );
            const script = document.createElement("script");
            script.textContent = runtimeSource + "\\n//# sourceURL=mfl-season-ratio-loader-v${version}.js";
            document.head.appendChild(script);
            script.remove();
          })();`;
          return `<script>${code}<\/script>`;
        }

        function fail(message) {
          console.error(message);
          document.documentElement.classList.remove("bootPending");
          document.body.innerHTML = '<main><p class="emptyState">Could not load MFL Front Office.</p></main>';
        }

        try {
          const RELEASES = loadReleases();
          const request = new XMLHttpRequest();
          request.open("GET", BASE_URL, false);
          request.send(null);
          if (!(request.status >= 200 && request.status < 300) || !request.responseText) {
            fail(`Could not load the application loader (${request.status}).`);
            return;
          }

          let source = request.responseText;
          source = source.replace('const VERSION = "1.118.3";', `const VERSION = "${VERSION}";`);

          const originalRatioDeclaration = '        const ratioScript = `<script src="/api/mfl-season-ratios?format=script&v=${VERSION}"><\\/script>`;';
          const ratioDeclaration = `        const ratioScript = window.location.pathname === "/changelog" ? "" : ${JSON.stringify(ratioLoaderMarkup(VERSION, RELEASES))};`;
          source = source.replace(originalRatioDeclaration, ratioDeclaration);

          const criticalStyle = `<style id="mflReleaseCriticalStyles">
            html body .siteFooter.siteFooter a[href="/changelog"],
            html body .siteFooter.siteFooter a[data-page="changelog"] {
              display: inline-block !important;
              font-size: 0 !important;
              cursor: pointer !important;
              pointer-events: auto !important;
            }
            html body .siteFooter.siteFooter a[href="/changelog"]::before,
            html body .siteFooter.siteFooter a[data-page="changelog"]::before {
              content: "MFL Front Office v${VERSION}" !important;
              display: inline !important;
              visibility: visible !important;
              opacity: 1 !important;
              font-size: 14px !important;
              pointer-events: none !important;
            }
          </style>`;
          const patchMarker = '        const routeStyles = `';
          const releaseShellCall = `(${seedReleaseShell.toString()})(shell, ${JSON.stringify(VERSION)}, ${JSON.stringify(RELEASES)});`;
          const extraSourcePatches = `
        source = source.replace(
          '/styles.css?v=1.117.1',
          '/styles.css?v=${VERSION}',
        );
        source = source.replace(
          '</head>',
          ${JSON.stringify(`${criticalStyle}</head>`)},
        );
        source = source.replace(
          '          prepareInitialShell(shell);',
          ${JSON.stringify(`          prepareInitialShell(shell);\n          ${releaseShellCall}`)},
        );
        source = source.replace(
          '            installRuntimeFixes();\\n            rebuildChangelog();\\n            window.setTimeout(rebuildChangelog, 0);\\n            finalizeRouteChrome();',
          '            installRuntimeFixes();\\n            finalizeRouteChrome();',
        );
        source = source.replace(
          '          requestAnimationFrame(() => requestAnimationFrame(() => {\\n            document.documentElement.classList.remove("bootPending");\\n          }));',
          '          // startApp reveals the shell after route-specific chrome is ready.',
        );
`;
          if (!source.includes(patchMarker)) {
            fail("Could not locate the route shell loader.");
            return;
          }
          source = source.replace(patchMarker, `${extraSourcePatches}${patchMarker}`);

          document.open();
          document.write(source);
          document.close();
        } catch (error) {
          fail(error?.message || "Could not initialize MFL Front Office.");
        }
      })();
    </script>
  </head>
  <body></body>
</html>

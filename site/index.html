<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MFL Front Office</title>
    <script>
      (() => {
        const localSitePrefix = /^\/site(?:\/|$)/.test(window.location.pathname) ? "/site/" : "/";
        const script = document.createElement("script");
        script.src = `${localSitePrefix}bootstrap.js`;
        script.async = false;
        script.addEventListener("error", () => {
          document.body.innerHTML = '<main><p class="emptyState">Could not load MFL Front Office.</p><p class="emptyState" style="font-size:12px;opacity:.7">Could not load bootstrap.js.</p></main>';
        }, { once: true });
        document.head.appendChild(script);
      })();
    </script>
  </head>
  <body></body>
</html>

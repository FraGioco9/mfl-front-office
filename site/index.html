<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MFL Front Office</title>
    <script>
      (() => {
        const VERSION = "1.151.23";

        function routeGuardFunction() {
          let stableClubId = "";
          let stableClubTitleHtml = "";
          let stableClubTitleText = "";
          let scheduled = false;

          function routeInfo() {
            const path = String(window.location.pathname || "/").replace(/\/+$/, "") || "/";
            if (/^\/watchlist(?:\/[^/]+)?(?:\/[^/]+)?$/i.test(path)) {
              return { page: "watchlist" };
            }
            const clubMatch = path.match(/^\/clubs?\/([^/]+)(?:\/[^/]+)?$/i);
            return clubMatch
              ? { page: "club", clubId: decodeURIComponent(clubMatch[1]) }
              : { page: "" };
          }

          function titleIsGeneric(text, clubId) {
            const value = String(text || "").trim();
            return !value || value === "Club" || value === `Club #${clubId}` || value === `Club ${clubId}`;
          }

          function titleHasDivisionColor(title) {
            return Boolean(title?.querySelector("span[style*='color'], .clubDivision, .clubSearchDivision"))
              || /color\s*:/i.test(title?.innerHTML || "");
          }

          function preserveClubTitle(clubId) {
            const title = document.getElementById("tablePageTitle");
            if (!title) return;

            const text = String(title.textContent || "").trim();
            const sameClub = stableClubId === String(clubId) && stableClubTitleHtml;
            const currentRich = titleHasDivisionColor(title);
            const savedRich = /color\s*:/i.test(stableClubTitleHtml);

            if (!titleIsGeneric(text, clubId)
                && (!sameClub || currentRich || !savedRich)
                && !(sameClub && stableClubTitleText.includes(" - ") && !text.includes(" - "))) {
              stableClubId = String(clubId);
              stableClubTitleHtml = title.innerHTML;
              stableClubTitleText = text;
              return;
            }

            if (sameClub && (titleIsGeneric(text, clubId)
                || (!text.includes(" - ") && stableClubTitleText.includes(" - "))
                || (savedRich && !currentRich && text === stableClubTitleText))) {
              if (title.innerHTML !== stableClubTitleHtml) title.innerHTML = stableClubTitleHtml;
            }
          }

          function showWatchlistSwitcher() {
            const switcher = document.getElementById("watchlistSwitcher");
            if (!switcher) return;
            switcher.hidden = false;
            switcher.removeAttribute("aria-hidden");
            switcher.style.removeProperty("display");
            switcher.style.removeProperty("visibility");
          }

          function enforce() {
            const route = routeInfo();
            if (route.page === "club") preserveClubTitle(route.clubId);
            else if (route.page === "watchlist") showWatchlistSwitcher();
          }

          function schedule() {
            if (scheduled) return;
            scheduled = true;
            requestAnimationFrame(() => {
              scheduled = false;
              enforce();
            });
          }

          window.addEventListener("popstate", schedule);
          new MutationObserver(schedule).observe(document.documentElement, {
            attributes: true,
            attributeFilter: ["data-page", "hidden", "style", "class"],
            childList: true,
            characterData: true,
            subtree: true,
          });
          enforce();
        }

        const request = new XMLHttpRequest();
        request.open("GET", `/index-source.html?v=${VERSION}`, false);

        try {
          request.send(null);
        } catch {
          document.body.innerHTML = '<main><p>Could not load MFL Front Office.</p></main>';
          return;
        }

        if (request.status < 200 || request.status >= 300) {
          document.body.innerHTML = '<main><p>Could not load MFL Front Office.</p></main>';
          return;
        }

        let source = request.responseText;
        source = source.replace('/styles.css?v=1.151.9', `/styles.css?v=${VERSION}`);
        source = source.replace('const VERSION = "1.151.9";', `const VERSION = "${VERSION}";`);
        source = source.replace(
          'const CHANGELOG_DESCRIPTION = "Keep players with blank retirement data, stabilize refreshed club tables, and hide pagination while rows load";',
          'const CHANGELOG_DESCRIPTION = "Keep club views stable, open MFL Stats on the first click, and render club tables immediately";',
        );

        source = source.replace(
          '      const response = await fetch(`/api/data?${requestKey}`, {\n        cache: "no-store",\n        headers: walletProofHeaders(true),\n      });',
          '      const endpoint = route.scope === "mflstats" ? "/api/mfl-stats" : `/api/data?${requestKey}`;\n      const response = await fetch(endpoint, {\n        cache: "no-store",\n        headers: walletProofHeaders(true),\n      });',
        );

        source = source.replace(
          '      if (route.scope === "club") {\n        const club = state.clubSearchIndex.find((entry) => entry.clubId === String(route.clubId || ""));\n        tablePageTitle.textContent = club?.name || "Club";\n      } else {\n        tablePageTitle.textContent = tableTitleForPage(pageName);\n      }\n      updateViewButtons();\n      showTableBusyState();',
          '      if (route.scope === "club") {\n        const club = state.clubSearchIndex.find((entry) => entry.clubId === String(route.clubId || ""));\n        const division = club && typeof contractDivisionInfo === "function" ? contractDivisionInfo(club.division) : null;\n        if (club) {\n          tablePageTitle.innerHTML = division\n            ? `${escapeHtml(club.name)} - <span style="color:${escapeHtml(division.color)}">${escapeHtml(division.name)}</span>`\n            : escapeHtml(club.name);\n          try {\n            sessionStorage.setItem(`mfl-club-shell:${club.clubId}`, JSON.stringify({\n              clubId: club.clubId,\n              name: club.name,\n              division: club.division,\n              divisionName: division?.name || "",\n              divisionColor: division?.color || "",\n            }));\n          } catch {\n            // Session storage is optional.\n          }\n        } else {\n          tablePageTitle.textContent = "Club";\n        }\n      } else {\n        tablePageTitle.textContent = tableTitleForPage(pageName);\n      }\n      updateViewButtons();\n      buildHeader();\n      showTableBusyState();',
        );

        source = source.replace(
          '      if (mflStatsAgeDistribution) {\n        mflStatsAgeDistribution.innerHTML = \'<p class="mflStatsEmpty">Loading players...</p>\';\n      }',
          '      if (mflStatsAgeDistribution) {\n        mflStatsAgeDistribution.replaceChildren();\n      }',
        );

        const routeStyles = `
          <style id="route-shell-stability">
            body[data-page="watchlist"] #watchlistSwitcher {
              display: flex !important;
              visibility: visible !important;
            }
          </style>
        `;
        const routeGuard = `(${routeGuardFunction.toString()})();`;

        source = source.replace("</head>", `${routeStyles}</head>`);
        source = source.replace("</body>", `<script>${routeGuard}<\/script></body>`);

        document.open();
        document.write(source);
        document.close();
      })();
    </script>
  </head>
  <body></body>
</html>

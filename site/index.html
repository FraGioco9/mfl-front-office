<!doctype html>
<html lang="en" class="bootPending">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MFL Front Office</title>
    <script>
      (() => {
        try {
          const theme = localStorage.getItem("mfl-theme") || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.dataset.theme = theme;
          document.documentElement.dataset.initialPage = window.location.pathname.replace(/^\//, "") || "home";
        } catch {
          document.documentElement.dataset.theme = "light";
        }

        const originalFetch = window.fetch.bind(window);
        const validPageSizes = new Set([25, 50, 100, 250]);
        let searchDataAllowed = false;
        let searchBootstrapPromise = null;
        let evaluationSearchLoadPromise = null;

        function requestUrl(input) {
          try {
            const value = input instanceof Request ? input.url : String(input || "");
            return new URL(value, window.location.href);
          } catch {
            return null;
          }
        }

        function jsonResponse(payload, status = 200) {
          const body = typeof payload === "string" ? { error: payload } : payload;
          return new Response(JSON.stringify(body), {
            status,
            headers: { "content-type": "application/json; charset=utf-8" },
          });
        }

        function isSearchDataRequest(url) {
          if (!url) return false;
          const path = url.pathname.toLowerCase();
          const file = String(url.searchParams.get("file") || "").toLowerCase();
          return (path === "/api/data" && url.searchParams.get("mode") === "bootstrap")
            || path === "/data/wallets.json"
            || file === "wallets.json"
            || /(^|\/)(players_search|agents_search)\.json$/.test(path)
            || file === "players_search.json"
            || file === "agents_search.json";
        }

        function isPagedTableLocation() {
          return /^\/(?:database|progression|watchlist|my-players)(?:\/|$)/i.test(window.location.pathname)
            || (/^\/mfl(?:\/|$)/i.test(window.location.pathname) && !/^\/mfl\/stats\/?$/i.test(window.location.pathname));
        }

        function isFullPlayerDataRequest(url) {
          if (!url) return false;
          const path = url.pathname.toLowerCase();
          const file = String(url.searchParams.get("file") || "").toLowerCase();
          return /(^|\/)(players_public|players_progression|players_mfl_public|players_\d{4})\.json$/.test(path)
            || /^(players_public|players_progression|players_mfl_public|players_\d{4})\.json$/.test(file);
        }

        function normalizePagedRequest(url) {
          if (!url || url.pathname.toLowerCase() !== "/api/data" || url.searchParams.get("mode") !== "page") return url;
          const scope = String(url.searchParams.get("scope") || "").toLowerCase();
          if (!["database", "progression", "mfl", "watchlist", "myplayers"].includes(scope)) return url;
          const requestedPageSize = Number(url.searchParams.get("pageSize"));
          const requestedPage = Number(url.searchParams.get("page"));
          url.searchParams.set("pageSize", String(validPageSizes.has(requestedPageSize) ? requestedPageSize : 100));
          url.searchParams.set("page", String(Number.isInteger(requestedPage) && requestedPage > 0 ? requestedPage : 1));
          return url;
        }

        function loadSearchBootstrap() {
          searchDataAllowed = true;
          if (!searchBootstrapPromise) {
            searchBootstrapPromise = originalFetch("/api/data?mode=bootstrap", { cache: "no-store" })
              .then(async (response) => {
                const data = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(data.error || "Could not load search data.");
                return data;
              })
              .catch((error) => {
                searchBootstrapPromise = null;
                throw error;
              });
          }
          return searchBootstrapPromise;
        }

        window.fetch = (input, init) => {
          let url = requestUrl(input);
          if (url?.pathname.toLowerCase() === "/summary.json") {
            return Promise.resolve(jsonResponse("Use the live manifest summary.", 404));
          }

          url = normalizePagedRequest(url);
          if (isPagedTableLocation() && isFullPlayerDataRequest(url)) {
            return Promise.resolve(jsonResponse("Use the paged data endpoint for this table.", 409));
          }

          if (url?.pathname.toLowerCase() === "/api/data" && url.searchParams.get("mode") === "bootstrap") {
            if (!searchDataAllowed) return Promise.resolve(jsonResponse("Search data is loaded after search activation.", 503));
            return loadSearchBootstrap().then((data) => jsonResponse(data));
          }

          if (!searchDataAllowed && isSearchDataRequest(url)) {
            return Promise.resolve(jsonResponse("Search data is loaded after search activation.", 503));
          }

          const normalizedInput = url && !(input instanceof Request) ? url.toString() : input;
          return originalFetch(normalizedInput, init);
        };

        function activateSearchData() {
          void loadSearchBootstrap().catch(() => false);
        }

        document.addEventListener("click", (event) => {
          if (event.target instanceof Element && event.target.closest("#openSearchButton")) activateSearchData();
        }, true);

        document.addEventListener("keydown", (event) => {
          if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "k") activateSearchData();
        }, true);

        document.addEventListener("focusin", (event) => {
          if (!(event.target instanceof Element) || !event.target.matches("#evaluationSearchInput")) return;
          activateSearchData();
          if (evaluationSearchLoadPromise || typeof ensureSearchIndexes !== "function") return;
          if (typeof state !== "undefined" && state.searchIndexesLoaded) {
            if (typeof renderEvaluationSearchResults === "function") renderEvaluationSearchResults();
            return;
          }
          if (typeof beginInteractionBusy === "function") beginInteractionBusy();
          evaluationSearchLoadPromise = Promise.resolve(ensureSearchIndexes())
            .then(() => {
              if (typeof renderEvaluationSearchResults === "function") renderEvaluationSearchResults();
            })
            .catch(() => false)
            .finally(() => {
              evaluationSearchLoadPromise = null;
              if (typeof endInteractionBusy === "function") endInteractionBusy();
            });
        }, true);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css?v=1.151.6">
    <style>html.bootPending body{visibility:hidden}</style>
  </head>
  <body data-page="home">
    <script>
      (() => {
        const VERSION = "1.151.6";
        const CHANGELOG_DESCRIPTION = "Show the loaded Database page over the complete player total and keep refreshed page chrome visible and stable while table rows load";

        function versionParts(value) {
          const match = String(value || "").trim().match(/^v?(\d+)\.(\d+)\.(\d+)$/);
          return match ? match.slice(1).map(Number) : null;
        }

        function compareVersionsDescending(a, b) {
          const aParts = versionParts(a) || [0, 0, 0];
          const bParts = versionParts(b) || [0, 0, 0];
          return bParts[0] - aParts[0] || bParts[1] - aParts[1] || bParts[2] - aParts[2];
        }

        function hasStoredWalletOptIn() {
          try {
            const address = String(localStorage.getItem("mfl-linked-wallet-v1") || "").trim();
            const proof = JSON.parse(localStorage.getItem("mfl-linked-wallet-proof-v1") || "null");
            return Boolean(address && proof?.address && proof?.message && Array.isArray(proof?.signatures) && proof.signatures.length);
          } catch {
            return false;
          }
        }

        function routeInfo() {
          const path = window.location.pathname.replace(/\/+$/, "") || "/";
          if (/^\/mfl\/stats$/i.test(path)) return { page: "mflstats", title: "MFL Stats", table: false };
          const routes = [
            [/^\/database(?:\/|$)/i, "database", "Database"],
            [/^\/mfl(?:\/|$)/i, "mfl", "MFL Wallet"],
            [/^\/progression(?:\/|$)/i, "progression", "Progression"],
            [/^\/watchlist(?:\/|$)/i, "watchlist", "Watchlist"],
            [/^\/my-players(?:\/|$)/i, "myplayers", "My Players"],
            [/^\/agents?\/[^/]+(?:\/|$)/i, "agents", "Agent"],
            [/^\/clubs?\/[^/]+(?:\/|$)/i, "club", "Club"],
          ];
          const tableRoute = routes.find(([pattern]) => pattern.test(path));
          if (tableRoute) return { page: tableRoute[1], title: tableRoute[2], table: true };
          if (/^\/players\/[^/]+$/i.test(path)) return { page: "player", table: false };
          if (/^\/evaluation$/i.test(path)) return { page: "evaluation", table: false };
          if (/^\/settings$/i.test(path)) return { page: "settings", table: false };
          if (/^\/changelog$/i.test(path)) return { page: "changelog", table: false };
          return { page: "home", table: false };
        }

        function prepareInitialShell(doc) {
          const route = routeInfo();
          ["homePage", "progressionPage", "mflStatsPage", "myPlayersLockedPage", "evaluationPage", "playerPage", "settingsPage", "changelogPage"]
            .forEach((id) => {
              const element = doc.getElementById(id);
              if (element) element.hidden = true;
            });

          doc.body.dataset.page = route.page;
          const menuRail = doc.getElementById("menuRail");
          const sidebar = doc.getElementById("sidebar");
          if (menuRail) menuRail.hidden = false;
          if (sidebar) sidebar.hidden = false;
          doc.getElementById("appShell")?.classList.remove("menuClosed");
          doc.querySelectorAll(".navButton").forEach((button) => button.classList.toggle("active", button.dataset.page === route.page));

          if (route.table) {
            const page = doc.getElementById("progressionPage");
            if (page) page.hidden = false;
            const title = doc.getElementById("tablePageTitle");
            if (title) title.textContent = route.title;
            doc.getElementById("tableBody")?.replaceChildren();
            const emptyState = doc.getElementById("emptyState");
            if (emptyState) {
              emptyState.hidden = false;
              emptyState.textContent = "Loading players...";
            }
          } else if (route.page === "mflstats") {
            doc.getElementById("mflStatsPage").hidden = false;
            const distribution = doc.getElementById("mflStatsAgeDistribution");
            if (distribution) distribution.innerHTML = '<p class="mflStatsEmpty">Loading players...</p>';
          } else if (route.page === "player") {
            doc.getElementById("playerPage").hidden = false;
            const detail = doc.getElementById("playerDetail");
            if (detail) detail.innerHTML = '<div class="emptyState">Loading player...</div>';
          } else {
            const pageId = {
              home: "homePage",
              evaluation: "evaluationPage",
              settings: "settingsPage",
              changelog: "changelogPage",
            }[route.page];
            if (pageId) doc.getElementById(pageId).hidden = false;
          }

          const homeOptInButton = doc.getElementById("homeOptInButton");
          if (homeOptInButton && hasStoredWalletOptIn()) homeOptInButton.hidden = true;
          return route;
        }

        function rebuildChangelog() {
          const footerLink = document.querySelector('.siteFooter a[data-page="changelog"]');
          if (footerLink) footerLink.textContent = `MFL Front Office v${VERSION}`;
          const list = document.querySelector(".changelogList");
          if (!list) return;

          const entries = new Map();
          Array.from(list.querySelectorAll("li")).forEach((item) => {
            if (item.classList.contains("changelogMinorSection")) return;
            const version = item.querySelector(":scope > span")?.textContent?.trim() || "";
            if (!versionParts(version)) return;
            const description = item.querySelector(":scope > p")?.textContent?.trim() || "";
            if (!entries.has(version)) entries.set(version, description);
          });
          entries.set(`v${VERSION}`, CHANGELOG_DESCRIPTION);

          const groups = new Map();
          Array.from(entries.entries()).forEach(([version, description]) => {
            const parts = versionParts(version);
            const key = `${parts[0]}.${parts[1]}`;
            if (!groups.has(key)) groups.set(key, []);
            groups.get(key).push({ version, description });
          });

          const groupEntries = Array.from(groups.entries()).sort(([a], [b]) => {
            const [aMajor, aMinor] = a.split(".").map(Number);
            const [bMajor, bMinor] = b.split(".").map(Number);
            return bMajor - aMajor || bMinor - aMinor;
          });

          list.replaceChildren();
          groupEntries.forEach(([minor, patches], index) => {
            patches.sort((a, b) => compareVersionsDescending(a.version, b.version));
            const section = document.createElement("li");
            section.className = "changelogMinorSection";
            if (index === 0) section.classList.add("is-expanded");
            const toggle = document.createElement("button");
            toggle.className = "changelogMinorToggle";
            toggle.type = "button";
            toggle.setAttribute("aria-expanded", index === 0 ? "true" : "false");
            const title = document.createElement("span");
            title.className = "changelogMinorVersion";
            title.textContent = `v${minor}`;
            const meta = document.createElement("span");
            meta.className = "changelogMinorMeta";
            meta.textContent = `${patches.length} ${patches.length === 1 ? "patch" : "patches"}`;
            const chevron = document.createElement("span");
            chevron.className = "changelogMinorChevron";
            chevron.setAttribute("aria-hidden", "true");
            chevron.textContent = ">";
            toggle.append(title, meta, chevron);
            const panel = document.createElement("div");
            panel.className = "changelogMinorPanel";
            const inner = document.createElement("div");
            inner.className = "changelogMinorPanelInner";
            const patchList = document.createElement("ol");
            patchList.className = "changelogPatchList";
            patches.forEach(({ version, description }) => {
              const item = document.createElement("li");
              const versionLabel = document.createElement("span");
              versionLabel.textContent = version;
              const descriptionLabel = document.createElement("p");
              descriptionLabel.textContent = description;
              item.append(versionLabel, descriptionLabel);
              patchList.appendChild(item);
            });
            inner.appendChild(patchList);
            panel.appendChild(inner);
            section.append(toggle, panel);
            toggle.addEventListener("click", () => {
              const expanded = section.classList.toggle("is-expanded");
              toggle.setAttribute("aria-expanded", expanded ? "true" : "false");
            });
            list.appendChild(section);
          });
        }

        function createClubSearchButton(club) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "searchResult clubSearchResult";
          button.dataset.clubId = club.clubId;
          const division = typeof contractDivisionInfo === "function" ? contractDivisionInfo(club.division) : null;
          const divisionHtml = division
            ? ` &middot; <span class="clubSearchDivision" style="color:${escapeHtml(division.color)}">${escapeHtml(division.name)}</span>`
            : "";
          button.innerHTML = `<strong>${escapeHtml(club.name)}</strong><span>Club &middot; #${escapeHtml(club.clubId)}${divisionHtml}</span>`;
          button.addEventListener("click", () => {
            if (typeof closeSearch === "function") closeSearch();
            window.location.assign(`/clubs/${encodeURIComponent(club.clubId)}/attributes`);
          });
          return button;
        }

        function numericText(value) {
          const number = Number(String(value || "").replace(/[^0-9]/g, ""));
          return Number.isFinite(number) && number > 0 ? number : 0;
        }

        function databaseTotalPlayers() {
          if (typeof state !== "undefined") {
            const candidates = [
              state.bootstrapData?.summary?.playerCount,
              state.manifest?.row_count,
              state.manifest?.rowCount,
            ];
            const total = candidates.map(Number).find((value) => Number.isFinite(value) && value > 0);
            if (total) return total;
          }
          return numericText(document.querySelector("#totalPlayers")?.textContent);
        }

        function syncDatabaseShowingCount() {
          if (typeof state === "undefined" || state.currentPage !== "database") return;
          const counter = document.querySelector("#watchlistPlayerCount");
          if (!counter) return;
          const shown = typeof currentPageRows === "function"
            ? currentPageRows().length
            : Array.isArray(state.filteredRows) ? state.filteredRows.length : 0;
          const total = databaseTotalPlayers();
          counter.hidden = false;
          counter.textContent = total > 0
            ? `Showing ${typeof formatCount === "function" ? formatCount(shown) : shown}/${typeof formatCount === "function" ? formatCount(total) : total}`
            : `Showing ${typeof formatCount === "function" ? formatCount(shown) : shown}/-`;
        }

        function installRuntimeFixes() {
          if (typeof renderSearchResultsNow === "function") {
            const originalRenderSearchResultsNow = renderSearchResultsNow;
            renderSearchResultsNow = function renderSearchResultsIncludingClubs() {
              const result = originalRenderSearchResultsNow.apply(this, arguments);
              const resultsElement = document.querySelector("#playerSearchResults");
              const input = document.querySelector("#playerSearchInput");
              const query = typeof normalizeSearchText === "function" ? normalizeSearchText(input?.value?.trim() || "") : String(input?.value || "").trim().toLowerCase();
              if (!resultsElement || !query || typeof state === "undefined") return result;

              if (!state.clubSearchIndex.length && Array.isArray(state.bootstrapData?.clubs)) {
                state.clubSearchIndex = state.bootstrapData.clubs.map((club) => ({
                  clubId: String(club.clubId || ""),
                  name: String(club.name || ""),
                  division: Number.isFinite(Number(club.division)) ? Number(club.division) : null,
                  searchText: normalizeSearchText(`${club.name || ""} ${club.clubId || ""}`),
                })).filter((club) => club.clubId && club.name);
              }

              const clubs = state.clubSearchIndex
                .map((club) => {
                  const name = normalizeSearchText(club.name);
                  const id = normalizeSearchText(club.clubId);
                  const score = name === query || id === query ? 100 : name.startsWith(query) || id.startsWith(query) ? 80 : club.searchText.includes(query) ? 50 : 0;
                  return { club, score };
                })
                .filter((entry) => entry.score > 0)
                .sort((a, b) => b.score - a.score || (a.club.division ?? Infinity) - (b.club.division ?? Infinity) || a.club.name.localeCompare(b.club.name));

              if (!clubs.length) {
                const hint = resultsElement.querySelector(".searchHint");
                if (hint?.textContent === "No players or agents found.") hint.textContent = "No players, clubs, or agents found.";
                return result;
              }

              const existing = Array.from(resultsElement.querySelectorAll(":scope > .searchResult"))
                .filter((element) => !element.classList.contains("clubSearchResult"));
              resultsElement.replaceChildren(...[...clubs.slice(0, 5).map(({ club }) => createClubSearchButton(club)), ...existing].slice(0, 5));
              resultsElement.classList.add("filledSearchResults");
              return result;
            };
          }

          if (typeof updateTablePlayerCount === "function") {
            const originalUpdateTablePlayerCount = updateTablePlayerCount;
            updateTablePlayerCount = function updateTablePlayerCountWithDatabaseTotal() {
              const result = originalUpdateTablePlayerCount.apply(this, arguments);
              syncDatabaseShowingCount();
              return result;
            };
          }

          const totalPlayersElement = document.querySelector("#totalPlayers");
          if (totalPlayersElement) {
            new MutationObserver(syncDatabaseShowingCount).observe(totalPlayersElement, { childList: true, characterData: true, subtree: true });
          }
        }

        function finalizeRouteChrome() {
          const route = routeInfo();
          if (typeof state !== "undefined") {
            state.currentPage = route.page;
            if (route.table && typeof pageTargetFromPath === "function") {
              const target = pageTargetFromPath(`${window.location.pathname}${window.location.search}`);
              if (typeof restoreSavedTableState === "function") {
                restoreSavedTableState(route.page, { view: target?.options?.view });
              } else if (target?.options?.view) {
                state.view = target.options.view;
              }
            }
          }

          document.body.dataset.page = route.page;
          document.querySelectorAll(".navButton").forEach((button) => button.classList.toggle("active", button.dataset.page === route.page));
          if (route.table) {
            const title = document.querySelector("#tablePageTitle");
            if (title) title.textContent = typeof tableTitleForPage === "function" ? tableTitleForPage(route.page) : route.title;
            if (typeof updateViewButtons === "function") updateViewButtons();
            if (typeof syncQuickFilterLabels === "function") syncQuickFilterLabels();
            if (typeof showTableBusyState === "function") showTableBusyState();
          }
          syncDatabaseShowingCount();
          if (typeof window.applyExactPlayerTableWidths === "function") window.applyExactPlayerTableWidths();
          requestAnimationFrame(() => document.documentElement.classList.remove("bootPending"));
        }

        async function loadApplicationShell() {
          const response = await fetch(`/index-shell.html?v=${VERSION}`, { cache: "default" });
          if (!response.ok) throw new Error("Could not load the application shell.");
          const html = await response.text();
          const shell = new DOMParser().parseFromString(html, "text/html");
          shell.querySelectorAll("script").forEach((script) => script.remove());
          prepareInitialShell(shell);
          Array.from(document.body.attributes).forEach((attribute) => document.body.removeAttribute(attribute.name));
          Array.from(shell.body.attributes).forEach((attribute) => document.body.setAttribute(attribute.name, attribute.value));
          document.body.innerHTML = shell.body.innerHTML;

          const applicationScript = document.createElement("script");
          applicationScript.src = `/app.js?v=${VERSION}`;
          applicationScript.async = false;
          applicationScript.addEventListener("load", () => {
            installRuntimeFixes();
            rebuildChangelog();
            window.setTimeout(rebuildChangelog, 0);
            finalizeRouteChrome();
          });
          applicationScript.addEventListener("error", () => {
            document.documentElement.classList.remove("bootPending");
            document.body.innerHTML = '<main><p class="emptyState">Could not load MFL Front Office.</p></main>';
          });
          document.body.appendChild(applicationScript);
        }

        loadApplicationShell().catch(() => {
          document.documentElement.classList.remove("bootPending");
          document.body.innerHTML = '<main><p class="emptyState">Could not load MFL Front Office.</p></main>';
        });
      })();
    </script>
  </body>
</html>

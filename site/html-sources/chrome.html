          (() => {
            const settingsNavButton = document.querySelector("#sidebar .settingsNavButton");
            const settingsNavParking = document.querySelector("#settingsNavParking");
            const sidebar = document.querySelector("#sidebar");
            if (!(settingsNavButton instanceof HTMLElement)
              || !(settingsNavParking instanceof HTMLElement)
              || !(sidebar instanceof HTMLElement)) return;
            const mobileNavigationMedia = window.matchMedia("(max-width: 900px)");
            const syncSettingsNavPlacement = () => {
              (mobileNavigationMedia.matches ? settingsNavParking : sidebar).appendChild(settingsNavButton);
            };
            syncSettingsNavPlacement();
            mobileNavigationMedia.addEventListener("change", syncSettingsNavPlacement);

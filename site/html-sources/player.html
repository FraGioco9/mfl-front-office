            const knownValues = firstPaintContext?.knownValues && typeof firstPaintContext.knownValues === "object" ? firstPaintContext.knownValues : null;
            const knownEntry = (column) => {

            const knownRaw = (column) => {
              const entry = knownEntry(column);

            const knownDisplay = (column) => {
              const entry = knownEntry(column);
              const text = String(entry?.display ?? entry?.raw ?? "").trim();
              return text && text.toUpperCase() !== "NULL" ? text : "";

            const cachedName = String(firstPaintContext?.name || knownDisplay("name") || "").trim();

                name: String(source.name || "").trim(),

            const cachedClubBrand = (() => {

              const red = Number.parseInt(normalized.slice(0, 2), 16);
              const green = Number.parseInt(normalized.slice(2, 4), 16);

            };

              const retirementRaw = knownRaw("retirement_years");
              if (retirementRaw !== "" && Number(retirementRaw) === 0) return null;
              const clubName = String(knownDisplay("active_contract_club_name") || "").trim();
              const clubId = String(knownRaw("active_contract_club_id") || "").trim();

              }
            };
            const cachedAttributeValue = (column) => {
              if (column === "overall") {
                const overall = knownDisplay("overall") || String(firstPaintContext?.overall || "").trim();
                return overall.replace(/\s*\([+-]?\d+(?:\.\d+)?\)\s*$/, "").trim();
              }
              return knownDisplay(column);
            };
            const cachedNationalityFlagCodepoints = () => {
              const rawNationality = String(knownRaw("nationality") || knownDisplay("nationality") || "").trim();
              if (!rawNationality) return "";
              const key = rawNationality
                .toUpperCase()
                .replace(/[^A-Z0-9]+/g, "_")
                .replace(/^_+|_+$/g, "");
              const code = nationalityFlagCodes[key] || "";
              if (!code) return "";
              if (code.includes("-")) return code;
              return code
                .toUpperCase()
                .split("")
                .map((character) => (127397 + character.charCodeAt(0)).toString(16))
                .join("-");
            };
            const profileStrong = (label) => Array.from(document.querySelectorAll("#playerPage .playerInfoPanel .detailGrid > div"))
              .find((card) => String(card.querySelector(":scope > span")?.textContent || "").trim() === label)
              ?.querySelector(":scope > strong") || null;
            const setProfileText = (label, text) => {
              const strong = profileStrong(label);
              if (!(strong instanceof HTMLElement) || !text) return;
              if (strong.textContent !== text) strong.textContent = text;
            };
            const formatCachedHeight = () => {
              const value = knownDisplay("height");
              if (!value) return "";
              return /\bcm\b/i.test(value) ? value : value + " cm";
            };
            const formatCachedFoot = () => {
              const value = knownDisplay("preferred_foot");
              if (!value) return "";
              return value.charAt(0).toUpperCase() + value.slice(1).toLowerCase();
            };
            const formatCachedRevenueShare = () => {
              const raw = knownRaw("active_contract_revenue_share");
              if (raw === null || raw === undefined || raw === "" || String(raw).toUpperCase() === "NULL") return knownDisplay("active_contract_revenue_share");
              const percentage = Number(raw) / 100;
              return Number.isFinite(percentage)
                ? new Intl.NumberFormat("en-US", { maximumFractionDigits: 2 }).format(percentage) + "%"
                : knownDisplay("active_contract_revenue_share");
            };
            const formatCachedDivision = () => {
              const raw = knownRaw("active_contract_club_division");
              const division = Number(raw);
              return Number.isFinite(division) && contractDivisionNames[division]
                ? contractDivisionNames[division]
                : knownDisplay("active_contract_club_division");
            };
            const cachedDivisionColor = () => {
              const raw = knownRaw("active_contract_club_division");
              const numericDivision = Number(raw);
              if (Number.isFinite(numericDivision) && contractDivisionColors[numericDivision]) return contractDivisionColors[numericDivision];
              const display = knownDisplay("active_contract_club_division").toLowerCase();
              const divisionKey = Object.keys(contractDivisionNames).find((key) => contractDivisionNames[key].toLowerCase() === display);
              return divisionKey ? contractDivisionColors[divisionKey] || "" : "";
            };
            const cachedContractTeamName = () => {
              const clubName = knownDisplay("active_contract_club_name");
              if (clubName) return clubName;
              const rawStatus = String(knownRaw("contract_status") || knownDisplay("contract_status") || "").trim().toLowerCase().replace(/[\s-]+/g, "_");
              if (rawStatus === "free_agent") return "Free Agent";
              if (rawStatus === "development_center") return "Development Center";
              return "";
            };
            const syncCachedProfileValues = () => {
              const nationality = knownDisplay("nationality");
              if (nationality) {
                const strong = profileStrong("Nationality");
                if (strong instanceof HTMLElement) {
                  const text = document.createElement("span");
                  text.className = "playerNationalityText";
                  text.textContent = nationality;
                  const codepoints = cachedNationalityFlagCodepoints();
                  if (codepoints) {
                    const flag = document.createElement("img");
                    flag.className = "flagImage";
                    flag.src = "https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/" + codepoints + ".svg";
                    flag.alt = "";
                    flag.setAttribute("aria-label", nationality);
                    strong.replaceChildren(flag, text);
                  } else if (strong.textContent !== nationality || strong.querySelector(".flagImage")) {
                    strong.replaceChildren(text);
                  }
                }
              }
              setProfileText("Height", formatCachedHeight());
              setProfileText("Foot", formatCachedFoot());
              setProfileText("Seasons", knownDisplay("player_seasons"));

              const agentName = knownDisplay("wallet_name");
              if (agentName) {
                const strong = profileStrong("Agent");
                if (strong instanceof HTMLElement && strong.textContent !== agentName) {
                  const walletAddress = String(knownRaw("wallet_address") || "").trim();
                  if (walletAddress) {
                    const link = document.createElement("a");
                    link.className = "agentTableLink playerAgentLink";
                    link.href = "/agents/" + encodeURIComponent(walletAddress) + "/attributes";
                    link.textContent = agentName;
                    strong.replaceChildren(link);
                  } else {
                    strong.textContent = agentName;
                  }
                }
              }

              const teamName = cachedContractTeamName();
              if (teamName) {
                const strong = profileStrong("Contract");
                if (strong instanceof HTMLElement && !strong.querySelector(".playerContractLine")) {
                  const line = document.createElement("span");
                  line.className = "playerContractLine";
                  const clubId = String(knownRaw("active_contract_club_id") || "").trim();
                  let team;
                  if (clubId && !/^(free agent|development center)$/i.test(teamName)) {
                    team = document.createElement("a");
                    team.className = "playerContractTeam playerContractTeamLink clubPageLink";
                    team.href = "/clubs/" + encodeURIComponent(clubId) + "/info";
                    team.dataset.clubId = clubId;
                  } else {
                    team = document.createElement("span");
                    team.className = "playerContractTeam";
                  }
                  team.textContent = teamName;
                  line.appendChild(team);
                  const divisionName = formatCachedDivision();
                  if (divisionName && !/^(free agent|development center)$/i.test(teamName)) {
                    const division = document.createElement("span");
                    division.className = "playerContractDivision";
                    division.textContent = divisionName;
                    const divisionColor = cachedDivisionColor();
                    if (divisionColor) division.style.color = divisionColor;
                    line.appendChild(division);
                  }
                  strong.replaceChildren(line);
                }
              }
              setProfileText("Rev Share", formatCachedRevenueShare());
            };
            const playerFirstPaintRarityColor = (overallValue) => {
              const value = Number(overallValue || 0);
              if (value >= 95) return "#00ffe9";
              if (value >= 85) return "#fa53ff";
              if (value >= 75) return "#0077ff";
              if (value >= 65) return "#71ff30";
              if (value >= 55) return "#ecd17f";
              return "#bebebe";
            };
            const playerFirstPaintOverallBackground = "linear-gradient(180deg, color-mix(in srgb, var(--rarity-color) 67%, transparent) 0%, var(--color-bg-default-secondary) 100%), linear-gradient(0deg, rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.2))";
            const applyCachedOverallAppearance = (box, overallValue) => {
              if (!(box instanceof HTMLElement) || !overallValue) return;
              box.classList.remove("isPending");
              box.style.setProperty("--rarity-color", playerFirstPaintRarityColor(overallValue));
              box.style.background = playerFirstPaintOverallBackground;
              box.style.backgroundColor = "var(--surface)";
              box.style.backgroundPosition = "center bottom, center";
              box.style.backgroundRepeat = "no-repeat";
              box.style.backgroundSize = "100% 100%, 100% 100%";
            };
            const syncCachedHeroValues = () => {
              const overallValue = cachedAttributeValue("overall");
              const overall = hero?.querySelector(".playerHeroOverall > strong");
              if (overall instanceof HTMLElement && overallValue && overall.textContent !== overallValue) overall.textContent = overallValue;
              applyCachedOverallAppearance(overall?.closest(".playerHeroOverall"), overallValue);

              const listingRaw = knownRaw("listing_price");
              const listingValue = listingRaw === null || listingRaw === undefined || listingRaw === "" ? Number.NaN : Number(listingRaw);
              const title = hero?.querySelector(".playerTitle");
              if (title instanceof HTMLElement && Number.isFinite(listingValue) && !title.querySelector(".listingCellContent")) {
                const priceText = "$" + new Intl.NumberFormat("en-US", { maximumFractionDigits: 0 }).format(listingValue);
                const listing = document.createElement("span");
                listing.className = "listingCellContent playerListingBadge";
                listing.setAttribute("aria-label", "For Sale at " + priceText);
                const icon = document.createElement("img");
                icon.className = "listingCellIcon";
                icon.src = "/listing-shopping-bag.svg";
                icon.width = 12;
                icon.height = 12;
                icon.alt = "";
                icon.setAttribute("aria-hidden", "true");
                const price = document.createElement("span");
                price.className = "listingCellPrice";
                price.textContent = priceText;
                listing.append(icon, price);
                const noteIcon = title.querySelector(".playerTitleNoteIcon");
                title.insertBefore(listing, noteIcon instanceof Node ? noteIcon : null);
              }
            };
            const syncPendingName = () => {
              if (root.dataset.playerFirstPaintContentReady === "true") return;
              const currentHero = playerDetail?.querySelector(":scope > .playerHero");
              const titleName = currentHero?.querySelector(".playerTitleName");
              if (!(titleName instanceof HTMLElement)) return;
              const skeletonActive = Boolean(titleName.querySelector(":scope > .mflSkeletonText"));
              const rendered = skeletonActive ? "" : String(titleName.textContent || "").replace(/\u00a0/g, " ").trim().replace(/\s+/g, " ");
              let fullName = String(titleName.dataset.playerFullName || "").trim() || cachedName;
              if (rendered && rendered !== compactPlayerPageName(fullName)) fullName = rendered;
              if (!fullName) return;
              const displayName = window.matchMedia("(max-width: 900px)").matches ? compactPlayerPageName(fullName) : fullName;
              titleName.dataset.playerFullName = fullName;
              if (titleName.textContent !== displayName) titleName.textContent = displayName;
              titleName.setAttribute("aria-label", fullName);
            };
            const syncPendingAttributeLabels = () => {
              if (root.dataset.playerFirstPaintContentReady === "true" || !(staticAttributes instanceof HTMLElement)) return;
              const currentHero = playerDetail?.querySelector(":scope > .playerHero");
              const livePositions = normalizePositions(currentHero?.querySelector(".playerHeroIdentity > p")?.textContent || "");
              const positions = livePositions.length ? livePositions : cachedPositions;
              if (!positions.length) {
                const overallCard = staticAttributes.querySelector(":scope > .playerAttributeCard");
                const overallStrong = overallCard?.querySelector(":scope > strong");
                const overallValue = cachedAttributeValue("overall");
                if (overallStrong instanceof HTMLElement && overallValue) {
                  let value = overallStrong.querySelector(":scope > .attributeValueText");
                  if (!(value instanceof HTMLElement)) {
                    value = document.createElement("span");
                    value.className = "attributeValueText";
                    overallStrong.replaceChildren(value);
                  }
                  if (value.textContent !== overallValue) value.textContent = overallValue;
                  applyCachedOverallAppearance(overallCard, overallValue);
                }
                return;
              }
              const labels = attributeLabels(positions);
              const columns = attributeColumns(positions);
              const goalkeeper = labels.length === 2;
              const cards = Array.from(staticAttributes.children).filter((card) => card instanceof HTMLElement);
              if (cards.length !== labels.length) {
                staticAttributes.replaceChildren(...labels.map((label, index) => {
                  const card = document.createElement("div");
                  card.className = "playerAttributeCard"
                    + (index === 0 ? " featured" : "")
                    + (index === 0 || goalkeeper ? " fullWidth" : "");
                  const name = document.createElement("span");
                  name.textContent = label;
                  const strong = document.createElement("strong");
                  const value = document.createElement("span");
                  value.className = "attributeValueText";
                  const cachedValue = cachedAttributeValue(columns[index]);
                  value.textContent = cachedValue || "\u00a0";
                  strong.appendChild(value);
                  card.append(name, strong);
                  if (index === 0) applyCachedOverallAppearance(card, cachedValue);
                  return card;
                }));
                return;
              }
              cards.forEach((card, index) => {
                card.className = "playerAttributeCard"
                  + (index === 0 ? " featured" : "")
                  + (index === 0 || goalkeeper ? " fullWidth" : "");
                const name = card.querySelector(":scope > span");
                if (name instanceof HTMLElement && name.textContent !== labels[index]) name.textContent = labels[index];
                const strong = card.querySelector(":scope > strong");
                if (!(strong instanceof HTMLElement)) return;
                let value = strong.querySelector(":scope > .attributeValueText");
                if (!(value instanceof HTMLElement)) {
                  value = document.createElement("span");
                  value.className = "attributeValueText";
                  strong.replaceChildren(value);
                }
                const cachedValue = cachedAttributeValue(columns[index]);
                const nextValue = cachedValue || "\u00a0";
                if (value.textContent !== nextValue) value.textContent = nextValue;
                if (index === 0) applyCachedOverallAppearance(card, cachedValue);
              });
            };
            const syncPendingPlayerShell = () => {
              syncPendingName();
              syncPendingAttributeLabels();
            };
            if (playerPage instanceof HTMLElement) playerPage.hidden = false;
            applyFirstPaintHeroActionLayout(hero);
            if (hero instanceof HTMLElement && playerId) {
              hero.dataset.playerShellId = playerId;
              const idButton = hero.querySelector(".playerIdText");
              if (idButton instanceof HTMLElement) idButton.textContent = "ID #" + playerId;
              if (cachedName) {
                const titleName = hero.querySelector(".playerTitleName");
                if (titleName instanceof HTMLElement) {
                  titleName.dataset.playerFullName = cachedName;
                  titleName.textContent = window.matchMedia("(max-width: 900px)").matches ? compactPlayerPageName(cachedName) : cachedName;
                  titleName.setAttribute("aria-label", cachedName);
                }
              }
              const positionsText = hero.querySelector(".playerHeroIdentity > p");
              if (positionsText instanceof HTMLElement && cachedPositions.length) positionsText.textContent = cachedPositions.join(", ");
              const external = hero.querySelector(".playerHeroPrimaryAction");
              if (external instanceof HTMLAnchorElement) external.href = "https://app.playmfl.com/players/" + playerId;
            }
            if (notesPanel instanceof HTMLElement) notesPanel.hidden = root.dataset.storedWalletOptIn !== "true";

            const staticAge = document.querySelector("#playerPage [data-mfl-static-player-age]");
            if (staticAge instanceof HTMLElement && playerId) {
              const ageEntry = knownEntry("age");
              const retirementEntry = knownEntry("retirement_years");
              const ageText = String(ageEntry?.display ?? ageEntry?.raw ?? "").trim();
              const retirementYears = retirementEntry?.raw === null || retirementEntry?.raw === undefined || retirementEntry?.raw === ""
                ? Number.NaN
                : Number(retirementEntry.raw);
              const hasRetirementMarker = Number.isFinite(retirementYears) && [0, 1, 2, 3].includes(retirementYears);
              if (ageText || hasRetirementMarker) {
                const line = document.createElement("span");
                line.className = "playerDetailAgeLine";
                if (ageText) {
                  line.appendChild(document.createTextNode(ageText));
                } else {
                  const skeleton = staticAge.querySelector(".mflSkeletonText");
                  if (skeleton instanceof HTMLElement) line.appendChild(skeleton);
                }
                if (hasRetirementMarker) {
                  const marker = document.createElement("i");
                  marker.classList.add("retirementMarker", "playerAgeMarker");
                  if (retirementYears === 0) {
                    marker.classList.add("retirementMarker--retired");
                    marker.dataset.tooltip = "Retired";
                    marker.setAttribute("aria-label", "Retired");
                    const image = document.createElement("img");
                    image.src = "/retirement-calendar-x-2.svg";
                    image.width = 16;
                    image.height = 16;
                    image.alt = "";
                    image.setAttribute("aria-hidden", "true");
                    marker.appendChild(image);
                  } else {
                    const label = retirementYears + " year" + (retirementYears === 1 ? "" : "s") + " left";
                    marker.classList.add("retirementMarker--retiring-" + retirementYears);
                    marker.dataset.tooltip = label;
                    marker.setAttribute("aria-label", label);
                  }
                  line.appendChild(marker);
                }
                staticAge.replaceChildren(line);
              }
            }

            syncCachedHeroBranding();
            syncCachedHeroValues();
            syncCachedProfileValues();
            syncPendingPlayerShell();
            if (playerDetail instanceof HTMLElement && typeof MutationObserver === "function") {
              const pendingObserver = new MutationObserver(() => {
                if (root.dataset.playerFirstPaintContentReady === "true") {
                  pendingObserver.disconnect();
                  return;
                }
                syncPendingPlayerShell();
              });
              pendingObserver.observe(playerDetail, { childList: true, subtree: true, characterData: true });
              pendingObserver.observe(root, { attributes: true, attributeFilter: ["data-player-first-paint-content-ready"] });
            }

            if (views instanceof HTMLElement) {
              const progressionAccess = root.dataset.storedProgressionAccess === "true";
              views.querySelectorAll(":scope > .playerAttributeViewButton[data-view]").forEach((button) => {
                if (!(button instanceof HTMLButtonElement)) return;
                const view = String(button.dataset.view || "");
                if (view === "current" || view === "all") button.hidden = !progressionAccess;
              });

              let shell = views.parentElement instanceof HTMLElement && views.parentElement.classList.contains("viewsScrollerShell")
                ? views.parentElement
                : null;
              if (!(shell instanceof HTMLElement)) {
                shell = document.createElement("div");
                shell.className = "viewsScrollerShell";
                views.insertAdjacentElement("beforebegin", shell);
                shell.appendChild(views);
              }

              const renderedItems = Array.from(views.children).filter((child) => {
                if (!(child instanceof HTMLElement) || child.hidden) return false;
                const style = getComputedStyle(child);
                return style.display !== "none" && style.position !== "absolute" && child.getClientRects().length > 0;
              });
              const viewStyle = getComputedStyle(views);
              const gap = Number.parseFloat(viewStyle.columnGap || viewStyle.gap) || 0;
              const contentWidth = renderedItems.reduce((total, item) => {
                const style = getComputedStyle(item);
                return total + item.getBoundingClientRect().width
                  + (Number.parseFloat(style.marginLeft) || 0)
                  + (Number.parseFloat(style.marginRight) || 0);
              }, 0) + gap * Math.max(0, renderedItems.length - 1);
              const overflowing = window.matchMedia("(max-width: 900px)").matches
                && views.getClientRects().length > 0
                && contentWidth - views.clientWidth > 2;
              views.classList.toggle("mflViewsOverflowing", overflowing);
              let arrow = shell.querySelector(":scope > .viewsScrollButton.viewsScrollButtonRight");
              if (overflowing && !(arrow instanceof HTMLButtonElement)) {
                arrow = document.createElement("button");
                arrow.type = "button";
                arrow.className = "viewsScrollButton viewsScrollButtonRight";
                arrow.dataset.mflFirstPaintScrollButton = "true";
                arrow.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>';
                arrow.addEventListener("click", () => {
                  const maxScroll = Math.max(0, views.scrollWidth - views.clientWidth);
                  const distance = Math.max(96, Math.floor(views.clientWidth * 0.72));
                  views.scrollTo({ left: Math.min(maxScroll, views.scrollLeft + distance), behavior: "smooth" });
                });
                shell.appendChild(arrow);
              }
              if (arrow instanceof HTMLButtonElement) {
                arrow.setAttribute("aria-label", "Scroll attribute views right");
                arrow.setAttribute("aria-hidden", overflowing ? "false" : "true");
                arrow.tabIndex = overflowing ? 0 : -1;
                arrow.classList.toggle("mflViewsScrollButtonVisible", overflowing);
                if (!overflowing && arrow.dataset.mflFirstPaintScrollButton === "true") arrow.remove();
              }
            }
            root.dataset.playerFirstPaintCuesReady = "false";
          })();
        </script>
